<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미매칭 보강 검수</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6676; --line: #dde1e7;
  --accent: #2f5bd3; --accent-text: #ffffff;
  --red-bg: #fdecec; --red-line: #d64545;
  --yellow-bg: #fff6d6; --yellow-line: #c99a06;
  --blue-bg: #e9f1fd; --blue-line: #3b74d4;
  --white-bg: #ffffff; --white-line: #c9ced6;
  --chip: #f1f3f6; --chip-warn: #fde3d6; --chip-warn-text: #8a3510;
  --o: #1f8a4c; --x: #c23b3b; --hold: #b07d00;
  --changed: #7a3fd1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ee; --muted: #9aa3b2; --line: #2e343e;
    --accent: #6d93ff; --accent-text: #0e1220;
    --red-bg: #3a1f22; --red-line: #ff6b6b;
    --yellow-bg: #3a3218; --yellow-line: #e2b93b;
    --blue-bg: #1b2a44; --blue-line: #6d9bff;
    --white-bg: #1c2027; --white-line: #3a404b;
    --chip: #262b34; --chip-warn: #4a2a1d; --chip-warn-text: #ffb995;
    --o: #4cc985; --x: #ff7a7a; --hold: #e8c04d;
    --changed: #b48cff;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --text: #e6e9ee; --muted: #9aa3b2; --line: #2e343e;
  --accent: #6d93ff; --accent-text: #0e1220;
  --red-bg: #3a1f22; --red-line: #ff6b6b;
  --yellow-bg: #3a3218; --yellow-line: #e2b93b;
  --blue-bg: #1b2a44; --blue-line: #6d9bff;
  --white-bg: #1c2027; --white-line: #3a404b;
  --chip: #262b34; --chip-warn: #4a2a1d; --chip-warn-text: #ffb995;
  --o: #4cc985; --x: #ff7a7a; --hold: #e8c04d;
  --changed: #b48cff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 12px; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; margin: 10px 0 4px; }
.legend button { text-align: left; border: 1px solid var(--line); border-left-width: 6px; border-radius: 8px;
  padding: 8px 10px; background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
.legend button[aria-pressed="true"] { outline: 2px solid var(--accent); }
.legend b { display: block; }
.legend small { color: var(--muted); }
.lg-red { border-left-color: var(--red-line) !important; background: var(--red-bg) !important; }
.lg-yellow { border-left-color: var(--yellow-line) !important; background: var(--yellow-bg) !important; }
.lg-blue { border-left-color: var(--blue-line) !important; background: var(--blue-bg) !important; }
.lg-white { border-left-color: var(--white-line) !important; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar input[type=search], .bar select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--text); }
.bar input[type=search] { flex: 1 1 180px; min-width: 0; }
.bar label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); white-space: nowrap; }
.btn { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.progress { width: 100%; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.progress b { color: var(--text); }
main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 80px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.card { border: 1px solid var(--line); border-left: 6px solid var(--white-line); border-radius: 10px;
  background: var(--white-bg); padding: 12px 14px; margin: 0 0 10px; }
.card.c-red { background: var(--red-bg); border-left-color: var(--red-line); }
.card.c-yellow { background: var(--yellow-bg); border-left-color: var(--yellow-line); }
.card.c-blue { background: var(--blue-bg); border-left-color: var(--blue-line); }
.top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.num { color: var(--muted); font-variant-numeric: tabular-nums; }
.kind { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--chip); }
.term { font-size: 17px; font-weight: 700; }
.others { color: var(--muted); font-size: 13px; }
.stats { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.stats b { color: var(--text); }
.prop { margin: 6px 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.chip { font-size: 12.5px; padding: 1px 8px; border-radius: 10px; background: var(--chip); }
.chip.warn { background: var(--chip-warn); color: var(--chip-warn-text); }
.chip.none { color: var(--muted); }
.lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
.decide { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin-top: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-weight: 700; border: 0; padding: 7px 14px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="O"] { background: var(--o); color: #fff; }
.seg button[aria-pressed="true"][data-v="X"] { background: var(--x); color: #fff; }
.seg button[aria-pressed="true"][data-v="보류"] { background: var(--hold); color: #fff; }
textarea { width: 100%; min-height: 38px; resize: vertical; font: inherit; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
.foot label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.changed { color: var(--changed); font-weight: 700; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 6px; }
.op { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.op b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
.meta div { margin: 2px 0; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
@media (max-width: 640px) {
  .decide { grid-template-columns: 1fr; }
  .stats { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>미매칭 보강 검수</h1>
  <p class="lead">두 외부 검토와 Claude 의견을 종합해 미리 골라 두었습니다. 다르게 판단하는 줄만 바꾸세요.
    다 끝나면 <b>결과 내보내기</b>로 받은 파일 경로를 Claude에게 알려 주면 검수표(md)에 반영합니다. 입력 내용은 이 브라우저에 자동 저장됩니다.</p>
  <p class="lead"><b>O</b> 제안대로(메모가 있으면 그 내용대로) 반영 · <b>X</b> 반영 안 함(미매칭 유지) · <b>보류</b> 지금 결정하지 않음(추가 확인 필요).
    C(보류) 분류에서 O는 '미매칭 유지에 동의'입니다.</p>
  <div class="legend" id="legend"></div>
</header>
<div class="bar"><div class="bar-in">
  <input type="search" id="q" placeholder="표기·재료 검색" aria-label="검색">
  <select id="kind" aria-label="분류">
    <option value="">모든 분류</option>
    <option value="A">A 별칭</option><option value="B">B 새 재료</option><option value="C">C 보류</option>
    <option value="D">D 이름 다듬기</option><option value="E">E 시판 제품</option>
  </select>
  <label><input type="checkbox" id="engOnly"> 추천 영향 있는 것만</label>
  <label><input type="checkbox" id="todo"> 확인 안 한 것만</label>
  <label><input type="checkbox" id="mine"> 내가 바꾼 것만</label>
  <button class="btn primary" id="export">결과 내보내기</button>
  <button class="btn" id="importBtn">불러오기</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button class="btn" id="reset">처음 상태로</button>
  <div class="progress" id="progress"></div>
</div></div>
<main id="list"></main>
<div class="toast" id="toast" role="status"></div>
<script>
const DATA = /*__DATA__*/null;
const COLORS = {
  red: ["꼭 봐야 함", "알레르기 판정에 영향이 있는데 의견이 갈린 줄"],
  yellow: ["확인 후 결정", "포장 표시·원문 확인이 필요해 보류로 둔 줄"],
  blue: ["수정 내용 확인", "수정 지시·근거를 한번 읽어 보면 좋은 줄"],
  white: ["넘어가도 됨", "세 의견이 같고 위험이 낮은 줄"],
};
const KEY = "unmapped-review/" + DATA.rows.length + "/" + DATA.rows.map(r => r.key).join("|").length;
let state = {};
let colorFilter = "";

function load() {
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경: 화면 상태만 유지 */ }
}
function cur(r) {
  const s = state[r.n] || {};
  return {
    decision: s.decision ?? r.prefill.decision,
    memo: s.memo ?? r.prefill.memo,
    checked: !!s.checked,
  };
}
function changed(r) {
  const c = cur(r);
  return c.decision !== r.prefill.decision || c.memo.trim() !== r.prefill.memo.trim();
}
function setField(r, field, value) {
  state[r.n] = Object.assign({}, state[r.n], { [field]: value });
  save();
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200);
}

function renderLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(COLORS).map(([c, [title, desc]]) => {
    const n = DATA.rows.filter(r => r.prefill.color === c).length;
    return `<button class="lg-${c}" data-color="${c}" aria-pressed="${colorFilter === c}"><b>${title} · ${n}줄</b><small>${desc}</small></button>`;
  }).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    colorFilter = colorFilter === b.dataset.color ? "" : b.dataset.color;
    renderLegend(); renderList();
  });
}

function visible(r) {
  const q = document.getElementById("q").value.trim();
  const kind = document.getElementById("kind").value;
  if (colorFilter && r.prefill.color !== colorFilter) return false;
  if (kind && r.kind !== kind) return false;
  if (document.getElementById("engOnly").checked && r.eng === 0) return false;
  if (document.getElementById("todo").checked && cur(r).checked) return false;
  if (document.getElementById("mine").checked && !changed(r)) return false;
  if (q) {
    const hay = [r.terms.join(" "), r.proposal, r.note, r.example].join(" ");
    if (!hay.includes(q)) return false;
  }
  return true;
}

function cardHtml(r) {
  const c = cur(r);
  const others = r.terms.slice(1);
  const allergens = r.kind === "C" ? `<span class="chip none">미매칭 유지(알레르기 사용자에게 제외)</span>`
    : r.noAllergen ? `<span class="chip none">알레르기 없음</span>`
    : r.allergens.length ? r.allergens.map(a => `<span class="chip ${a.includes("(가능)") ? "warn" : ""}">${esc(a)}</span>`).join("")
    : `<span class="chip none">재료에서 뺌</span>`;
  return `
  <article class="card c-${r.prefill.color}" id="r${r.n}">
    <div class="top">
      <span class="num">#${r.n}</span>
      <span class="kind">${r.kind} ${esc(r.kindName)}</span>
      <span class="term">${esc(r.terms[0])}</span>
      ${others.length ? `<span class="others">${esc(others.join(" · "))}</span>` : ""}
      <span class="stats">엔진 레시피 <b>${r.eng}</b> · 단독 해결 <b>${r.unlock}</b> · 식품안전나라 줄 <b>${r.fsLines}</b></span>
    </div>
    <div class="prop">${esc(r.proposal)}${r.conf ? ` <span class="chip">conf ${esc(r.conf)}</span>` : ""}</div>
    <div class="chips"><span class="lbl">연결 시 알레르기</span>${allergens}</div>
    <div class="decide">
      <div class="seg" role="group" aria-label="승인">
        ${["O", "X", "보류"].map(v => `<button data-v="${v}" aria-pressed="${c.decision === v}">${v}</button>`).join("")}
      </div>
      <textarea placeholder="고칠 내용(선택)" aria-label="메모">${esc(c.memo)}</textarea>
    </div>
    <div class="foot">
      <label><input type="checkbox" class="chk" ${c.checked ? "checked" : ""}> 확인함</label>
      <span class="chg">${changed(r) ? `<span class="changed">내가 바꿈</span> <button class="linkbtn undo">미리 채운 값으로 되돌리기</button>` : ""}</span>
    </div>
    <details>
      <summary>의견·근거 보기</summary>
      <div class="ops">
        <div class="op"><b>Claude</b>${esc(r.claude) || "—"}</div>
        <div class="op"><b>Gemini 검토</b>${esc(r.gemini) || "—"}</div>
        <div class="op"><b>reviewed 검토</b>${esc(r.reviewed) || "—"}</div>
      </div>
      <div class="meta">
        ${r.example ? `<div>예시 원문: ${esc(r.example)}</div>` : ""}
        ${r.note ? `<div>제안 메모: ${esc(r.note)}</div>` : ""}
        <div>미리 채운 값: ${esc(r.prefill.decision)}${r.prefill.memo ? " · " + esc(r.prefill.memo) : ""}</div>
      </div>
    </details>
  </article>`;
}

function bind(card, r) {
  card.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    setField(r, "decision", b.dataset.v);
    card.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    refreshCard(card, r); renderProgress();
  });
  const ta = card.querySelector("textarea");
  ta.oninput = () => { setField(r, "memo", ta.value); refreshCard(card, r); renderProgress(); };
  card.querySelector(".chk").onchange = e => { setField(r, "checked", e.target.checked); renderProgress(); };
}
function refreshCard(card, r) {
  const chg = card.querySelector(".chg");
  chg.innerHTML = changed(r) ? `<span class="changed">내가 바꿈</span> <button class="linkbtn undo">미리 채운 값으로 되돌리기</button>` : "";
  const undo = chg.querySelector(".undo");
  if (undo) undo.onclick = () => {
    const keep = (state[r.n] || {}).checked;
    state[r.n] = keep ? { checked: true } : {};
    save();
    const fresh = document.createElement("div"); fresh.innerHTML = cardHtml(r);
    const nc = fresh.firstElementChild; card.replaceWith(nc); bind(nc, r); refreshCard(nc, r); renderProgress();
  };
}

function renderList() {
  const list = document.getElementById("list");
  const rows = DATA.rows.filter(visible);
  list.innerHTML = rows.length ? rows.map(cardHtml).join("") : `<p class="empty">조건에 맞는 줄이 없습니다.</p>`;
  rows.forEach(r => { const card = document.getElementById("r" + r.n); bind(card, r); refreshCard(card, r); });
  renderProgress(rows.length);
}
function renderProgress(shown) {
  if (shown === undefined) shown = document.querySelectorAll("#list .card").length;
  const rows = DATA.rows;
  const flagged = rows.filter(r => r.prefill.color !== "white");
  const doneFlagged = flagged.filter(r => cur(r).checked).length;
  const count = v => rows.filter(r => cur(r).decision === v).length;
  document.getElementById("progress").innerHTML =
    `<span>표시 <b>${shown}</b> / ${rows.length}줄</span>` +
    `<span>색 있는 줄 확인 <b>${doneFlagged}</b> / ${flagged.length}</span>` +
    `<span>O <b>${count("O")}</b> · X <b>${count("X")}</b> · 보류 <b>${count("보류")}</b></span>` +
    `<span>내가 바꾼 줄 <b>${rows.filter(changed).length}</b></span>`;
}

function exportResult() {
  const out = {
    format: "unmapped-decisions/1",
    source: DATA.source,
    exported_at: new Date().toISOString(),
    rows: DATA.rows.map(r => {
      const c = cur(r);
      return { n: r.n, key: r.key, kind: r.kind, decision: c.decision, memo: c.memo.trim(), checked: c.checked,
        changed: changed(r), prefill_decision: r.prefill.decision, prefill_memo: r.prefill.memo };
    }),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "unmapped_decisions.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("unmapped_decisions.json을 내려받았습니다. 파일 경로를 Claude에게 알려 주세요.");
}
function importResult(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.format !== "unmapped-decisions/1") throw new Error("형식이 다릅니다");
      const byKey = Object.fromEntries(DATA.rows.map(r => [r.key, r]));
      let n = 0;
      state = {};
      data.rows.forEach(x => {
        const r = byKey[x.key]; if (!r) return;
        state[r.n] = { decision: x.decision, memo: x.memo, checked: !!x.checked }; n++;
      });
      save(); renderList(); toast(`${n}줄을 불러왔습니다.`);
    } catch (e) { toast("불러오지 못했습니다: " + e.message); }
  };
  reader.readAsText(file, "utf-8");
}

load();
renderLegend();
renderList();
["q", "kind", "engOnly", "todo", "mine"].forEach(id => document.getElementById(id).addEventListener("input", renderList));
document.getElementById("export").onclick = exportResult;
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => { if (e.target.files[0]) importResult(e.target.files[0]); e.target.value = ""; };
document.getElementById("reset").onclick = () => {
  if (!confirm("모든 선택·메모·확인 표시를 미리 채운 값으로 되돌릴까요?")) return;
  state = {}; save(); renderList(); toast("처음 상태로 되돌렸습니다.");
};
</script>
</body>
</html>
