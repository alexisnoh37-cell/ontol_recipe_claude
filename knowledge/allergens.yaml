  # --- 자체 추가(비공식) ---
  - id: other_fish
    display_name: 기타 생선(고등어 외)
    official: false
    source: custom
    status: reviewed
  - id: sesame
    display_name: 참깨
    official: false
    source: custom
    status: reviewed
  - id: other_cephalopods
    display_name: 기타 연체류(문어·낙지·주꾸미)
    official: false
    source: custom
    status: reviewed
    note: 오징어(법정)와 별도. 0-4 검수에서 추가
  - id: other_tree_nuts
    display_name: 기타 견과류(아몬드·밤 등)
    official: false
    source: custom
    status: reviewed
    note: 땅콩·호두·잣(법정) 외 견과. 0-4 검수에서 추가

bundles:
  - id: crustacean_bundle
    display_name: 갑각류
    includes: [shrimp, crab]
    official: false
    source: custom
    status: reviewed
  - id: nuts_bundle
    display_name: 견과류
    includes: [peanut, walnut, pine_nut, other_tree_nuts]
    official: false
    source: custom
    status: reviewed
    note: 땅콩은 식물학적으로 콩과지만 사용자 인식상 함께 피하는 경우가 많아 포함. 아몬드·밤 등은 기타 견과류로 포함
  - id: fish_bundle
    display_name: 생선 전체
    includes: [mackerel, other_fish]
    official: false
    source: custom
    status: reviewed
  - id: seafood_bundle
    display_name: 해산물 전체
    # 갑각류(shrimp, crab) + 오징어 + 기타 연체류 + 조개류 + 생선 전체(mackerel, other_fish)
    includes: [shrimp, crab, squid, other_cephalopods, shellfish, mackerel, other_fish]
    official: false
    source: custom
    status: reviewed
