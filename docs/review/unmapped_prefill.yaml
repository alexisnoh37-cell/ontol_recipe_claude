# 검수용 HTML(docs/review/unmapped_review.html)에 미리 채울 판단 (um-1, 2026-10-17)
# 생성: uv run python scripts/make_unmapped_review_html.py
#
# 두 외부 검토(docs/review/external/의 Gemini본·reviewed본)와 Claude 의견을 종합한 초안이다. 사람이 화면에서 바꾼다.
# 자동 규칙(생성 스크립트):
#   - C(보류) 항목: O(= 미매칭 유지에 동의), 흰색. 두 검토의 O/X는 둘 다 '미매칭 유지'라 결과가 같다.
#   - 두 검토 모두 O: O, 흰색.
#   - 두 검토 모두 수정 지시: O + 수정 내용, 파랑. (아래에 적은 항목은 아래가 우선)
#   - 그 밖(의견이 갈림): 아래에 반드시 적는다(빠지면 생성 오류).
#
# decision: O | X | 보류
# color: red(꼭 봐야 함: 알레르기에 영향 + 의견 갈림) | yellow(포장 확인 등 추가 확인이 필요해 보류) |
#        blue(수정 내용·근거를 한번 읽어 보면 좋음) | white(넘어가도 됨)
# memo: 반영할 내용(수정 지시). claude: Claude 의견(근거).
# 키는 검수표 '표기' 열의 첫 표기.

overrides:

