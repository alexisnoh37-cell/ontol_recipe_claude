# 미매칭 보강 2차 제안·결정 데이터 (um-3, 2026-10-17)
#
# 1차(docs/review/unmapped_proposal.yaml) 결정 뒤 남은 식품안전나라 미매칭 표기 1,193개를 분류했다.
# 형식과 kind 뜻은 1차 파일 머리말과 같다(A 별칭 · B 새 재료 · C 보류 · D 이름 다듬기 · E 꼭 확인).
#
# 사람 결정(2026-10-17): "일괄 승인은 그대로 진행하고 꼭 확인해야 할 것만 검수"
#   decision O    = 일괄 승인분. knowledge/와 식품안전나라 이름 보정표(data/foodsafety_name_overrides.yaml)에 반영했다.
#   decision null = 꼭 확인(E, 그리고 E 재료를 쓰는 D). 아직 반영하지 않았다(미매칭 유지 = 알레르기 사용자에게 제외, 안전).
#                   검수 화면: docs/review/unmapped_round2_review.html
# C(보류)의 O는 "미매칭으로 둔다"에 동의한 것이다.
#
# 분류 기준(1차 검수 결정을 따름)
#   - 같은 재료의 다른 표기·품종·손질 상태(다진·채 썬·통조림 등)는 기존 재료 별칭(A). 알레르기 성분이 같을 때만.
#   - 성분이 뚜렷한 원재료(채소·과일·생선·견과)는 새 재료(B). 시판 가공품은 빠질 수 있는 성분을 possible로 넓게.
#   - 병 음료·과일 식초는 아황산류 possible, 복족류는 조개류, 생선은 기타 생선(1차와 같음).
#   - 어느 재료인지 모르는 표기(파·고추·소스 소제목·요리 이름·육수류)는 보류(C).
#   - 오기·소제목이 붙은 이름은 변환 단계에서 고친다(D). 두 재료가 한 줄에 붙은 것은 나눈다(split).

