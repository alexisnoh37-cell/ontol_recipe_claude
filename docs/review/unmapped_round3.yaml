# 미매칭 3차 정리 결정 데이터 (um-4, 2026-10-18)
#
# 2차(docs/review/unmapped_round2.yaml) 뒤 남은 미매칭 447줄(식품안전나라 415 · 엔진 32)을 원문과 함께 다시 분류했다.
# 형식과 kind 뜻은 1차 파일 머리말과 같다(A 별칭 · B 새 재료 · C 보류 · D 이름 다듬기 · E 시판 제품).
# 사람 결정(2026-10-18): Claude 추천안 1~6 "진행해"로 모두 승인.
#   1. 변환 규칙: 재료로 연결되지 않는 소제목 줄(쌍점·대괄호 소제목과 그 소제목을 가리키는 줄)은 뺀다(kb/foodsafety.py, plan 5-3-1).
#      소제목 이름이 재료로 연결되면("[팥소]", "리코타치즈:") 그대로 둔다. 206줄이 빠졌고 연결된 재료 손실 0.
#   2. 후보의 알레르기가 같은 모호한 표기는 '종류 불명' 재료로: 파, 고추, 홍피망(→ 파프리카), 그린 샐러드(→ 어린잎채소).
#      지난 결정(파·고추·홍피망 보류)을 바꾼 것이다.
#   3. 후보의 알레르기가 다르면 모두 포함 가능으로: 깨(참깨), 안심·등심(쇠고기·돼지고기), 과일(복숭아·토마토).
#   4. 육수(종류 불명)는 시판 육수와 같은 기준(해산물 전체·육류·대두·밀 가능), 채소 육수는 대두·밀·우유 가능.
#   5. 시판 소스 중 칠리소스·그린커리 페이스트·머스터드소스는 넓게 가능 + 시판 제품 안내. 나머지 10개는 미매칭 유지.
#   6. 오타 3개: ghen → 호두, 현미휴 → 현미유, 고추자 → 고추장.
# 반영: knowledge(새 재료 10개, 별칭), data/foodsafety_name_overrides.yaml(um-4 구역), config/display.yaml(시판 제품 안내 3개).

