# 미매칭 보강 제안 데이터 (um-1, 2026-10-17). 검수표: docs/review/unmapped_review.md
# 생성: uv run python scripts/make_unmapped_review.py
#
# 세 출처(자취요리신·살림팝 = 엔진 레시피, 식품안전나라 = 그래프 표시 전용)의 미매칭 표기를 분류한 **제안**이다.
# knowledge/와 변환 결과는 아직 바꾸지 않았다. 사람이 검수표 승인 열에 O/X를 적은 뒤 승인분만 반영한다.
# 식품안전나라 항목은 fs-3 보강안(docs/review/foodsafety_alias_proposal.md)을 그대로 옮겨 왔다.
#
# kind
#   A  별칭: 기존 재료(target)에 표기(terms)를 별칭으로 추가. form은 별칭의 형태(minced 등).
#   B  새 재료: new에 적은 재료를 draft로 추가. terms 중 name과 다른 것은 별칭.
#   C  보류: 모호하거나 재료가 불명. 미매칭 유지(알레르기 사용자에게 계속 제외, 안전).
#   D  이름 다듬기: 원본 재료 이름에 자막 문구·크기·오타가 붙은 것. knowledge는 그대로 두고 변환 단계에서
#      이름을 고친다(target 재료로 매핑). target이 null이면 재료에서 뺀다(물 등). target이 B·E의 새 재료면
#      그 항목도 승인되어야 한다.
#   E  시판 제품: 제품마다 성분이 달라 알레르기를 넓게 possible로 잡은 새 재료(B와 같은 형식) 또는 기존 재료 별칭.
#      빠진 알레르기가 있으면 위험하다. 포장 표시를 확인할 수 없으면 X(미매칭 유지)가 더 안전하다.
#
# 알레르기: 원천 재료는 allergens, 가공품은 derived_from(기존 재료의 알레르기를 상속, certainty possible = 포함 가능).
# derived_from에 분류 노드(fish, seafood)를 쓰면 그 아래 모든 그룹이 possible이 된다(어묵과 같은 방식).

