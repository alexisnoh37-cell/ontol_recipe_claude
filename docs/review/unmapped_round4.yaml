- {kind: D, decision: O, terms: [적절], target: pork_belly, note: "반영 때 바꿈: 주재료 줄이라 이미 있는 삼겹살로 연결. 삼겹살 된장구이. '적절한 단(짠)…' 자막 조각. 재료 아님"}
- {kind: D, decision: O, terms: [양파오이지 채수], target: null, split: [{id: cucumber}, {id: onion}], note: "비빔국수. 원문 줄 '양파오이지 채수 4스푼 / 오이1개 / 오이 한개 / 양파 반개 / 채수 4스푼'에 오이·양파가 묻혀 있음. 조리 단계상 채수는 오이·양파에 소금·설탕(둘 다 재료 줄 있음)을 뿌려 낸 물"}
- {kind: D, decision: O, terms: [분말가루], target: instant_stock, note: "참치애호박찌개·참치두부조림·돼지곰탕·등갈비·잔치국수. 조리 단계 '분말가루 한 포' → 분말 육수 한 포. 1차 메모대로 '시판 육수'(승인된 재료)로 연결"}

