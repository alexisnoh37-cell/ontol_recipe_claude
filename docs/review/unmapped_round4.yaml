# 미매칭 4차 정리 제안·결정 데이터 (um-5, 2026-10-18)
#
# um-4 뒤 남은 미매칭 53줄(식품안전나라 24 · 엔진 29)을 레시피의 다른 재료·조리 단계·원문과 함께 다시 봤다.
# 사람 요청(2026-10-18): "그동안의 검수 결과를 활용해 Claude가 검수하고, 사람이 확인해야 할 것만 지난번처럼".
# 형식과 kind 뜻은 1차 파일 머리말과 같다(A 별칭 · B 새 재료 · C 보류 · D 이름 다듬기 · E 시판·추정 성분 새 재료).
#
#   처음 두 항목 = Claude가 바로 반영(지난 결정을 바꾸지 않는 변환 규칙 수정·유지).
#   나머지 25개 = 꼭 확인. 검수 화면(docs/review/unmapped_round4_review.html)에서 사람이 모두 O(2026-10-18),
#                 내보낸 결과 docs/review/unmapped_round4_decisions.json. 메모 반영:
#                 - '.'(fs_799): "+ 기준으로 개별 식재료로 정리" → 16줄을 재료 이름 그대로 한 줄씩(split의 text).
#                 - '시판 제품으로 성분표 확인 후 사용 권장' → 새 재료 6개를 시판 제품 안내(config/display.yaml)에 추가.
#                   '조미유'(시판 라면 제품)·'분말가루'(시판 육수)는 이미 안내 대상. '000원에'(→ 애호박)의 같은 메모는
#                   애호박이 시판 제품이 아니어서 반영하지 않고 사람에게 확인을 요청했다.
#   D의 대상이 엔진 레시피 이름이면 data/recipe_name_overrides.yaml, 식품안전나라면 data/foodsafety_name_overrides.yaml에 반영한다.
#
# 검수 화면 색: 파랑 = 원문·조리 단계에 근거가 있는 연결, 노랑 = 시판·가정식 제품 성분을 넓게 추정, 빨강 = 지난 결정을 뒤집는 판단

