  technique: 볶음
- text: 국간장 1스푼, 코인육수 2알 넣어줄게요. 물이 끓기 시작하면 참치, 감자, 애호박 넣은 후.
  technique: 끓이기
- text: 뚜껑닫고 10분간 푹 끓여줄게요. 마무리로 청양고추 2개 두부 한모 넣은 후 3분.
  technique: 끓이기
- text: 더 끓여주면 완성이에요.
  technique: 끓이기
