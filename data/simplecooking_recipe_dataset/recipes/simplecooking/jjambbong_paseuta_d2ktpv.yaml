steps:
- text: 팬에 식용유 2스푼을 두르고 대파, 다진 마늘 1스푼, 양파를 먼저 볶는다.
  technique: 볶음
- text: 향이 올라오면 냉동 새우 한 줌을 더한 뒤 볶는다.
  technique: 볶음
- text: 새우 겉면이 익으면 알배추를 더한 뒤 숨이 살짝 죽을 때까지 볶는다.
  technique: 볶음
- text: 고춧가루 1스푼을 더한 뒤 약불에서 10초만 볶아 고추기름을 낸다.
  technique: 볶음
- text: 토마토소스 5스푼, 굴소스 1스푼, 치킨스톡 1/2스푼을 더한 뒤 같이 볶는다.
  technique: 볶음
- text: 물 180ml를 붓고 냉동 스파게티면을 더한다.
  technique: null
- text: 면이 풀리면서 소스가 자작하게 졸아들 때까지 2~3분 끓인다.
  technique: 조림
- text: 마지막에 후추 넉넉히 뿌리면 마친다.
  technique: null
