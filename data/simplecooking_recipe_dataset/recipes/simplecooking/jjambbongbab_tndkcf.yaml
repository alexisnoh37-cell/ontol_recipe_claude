steps:
- text: 대파, 양파를 한입 크기로 썰고 알배추도 적당한 크기로 썰어 손질한다.
  technique: null
- text: 팬에 식용유를 넉넉하게 두르고 대파, 양파, 다진 마늘 1스푼을 더해 센 불에서 빠르게 볶는다.
  technique: 볶음
- text: 채소가 살짝 타듯이 갈색빛이 나기 시작하면 알배추를 더한 뒤 30초 정도 볶는다.
  technique: 볶음
- text: 불을 중불로 낮춘 뒤 고춧가루 2스푼을 더한 뒤 타지 않게 30초 정도 더 볶는다.
  technique: 볶음
- text: 진간장을 팬 가장자리에 둘러 향을 낸 뒤 물 500ml를 붓는다.
  technique: null
- text: 멸치액젓 1스푼, 치킨스톡1/3스푼을 더한 뒤 끓인다.
  technique: 끓이기
- text: 끓기 시작하면 냉동 새우를 더한 뒤 2~3분 정도 익힌다.
  technique: 끓이기
- text: 불린 당면과 풀어둔 계란을 더한 뒤 후추를 뿌린 뒤 당면과 계란이 완전히 익도록 끓입니다.
  technique: 끓이기
- text: 완성된 짬뽕을 밥 에 부어주면 마친다.
  technique: null
