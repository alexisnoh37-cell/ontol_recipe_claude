steps:
- text: 삼겹살에 소금, 후춧가루, 생강즙, 정종을 넣고 약 30분 정도 숙성을 시킨다.
- text: 조와 쌀은 물에 약 30분 정도 불려 밥을 짓고, 밥이 다 익으면, 뚜껑을 열어 주걱 으로 골고루 섞어 한 김을 빼 놓는다.
- text: 파는 길게 채를 썰어 물에 담그어 파채가 둥글게 말리도록 한다.
- text: 설탕과 식초, 레몬, 소금, 고춧가루, 매실액을 골고루 섞어 소스를 만들어 놓는다.
- text: 파프리카는 속을 제거하고 양파, 당근, 파프리카를 양파와 같은 길이로 채를 썰고, 새송이와 표고버섯은 살짝 데쳐 채를 썰고, 깻잎도 채를 썰어 놓는다.
