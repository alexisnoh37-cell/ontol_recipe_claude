steps:
- text: 밀가루를 세등분하여 각각 백년초, 뽕잎, 치자 가루를 넣고 물을 넣고 반죽을 한 뒤 비닐봉투에 넣어 숙성을 시킨다.
- text: 두부는 소창에 물기를 짜고, 양파, 파, 마늘은 다지고, 부추는 송송 썰어 준비 하고, 숙주는 뜨거운 물에 데쳐 곱게 다진다.
- text: 오징어는 껍질을 벗겨 입자있게 다져 놓는다.
- text: 다진고기에 준비한 두부와 양파, 파, 마늘, 부추, 숙주(②)와 오징어(③)를 넣어 섞은 후 참기름과 후춧가루, 통깨를 넣어 딤섬 속을 만든다.
- text: 숙성된 밀가루 반죽을 꺼내 밀대를 이용하여 넓게 밀어 준다.
- text: 밀어 놓은 반죽을 사각으로 자른 후 그 안에 딤섬 속을 넣어 미나리를 데쳐 끈을 만들어 딤섬 위쪽을 묶은 후 찜통에서 김이 오르면 약 10분 정도 쪄서 완성한다.
