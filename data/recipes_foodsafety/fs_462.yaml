steps:
- text: 콩나물은 꼬리를 떼어 준비한다.
- text: 표고버섯을 길이로 썰고 떡은 입자있게 다져 놓고 배는 갈아놓는다.
- text: 김치 물에 충분히 씻어 물기를 제거하고 송송 썰어 준비한다.
- text: 냄비에 불린 쌀과 콩나물, 표고버섯을 넣고 밥을 짓는다.
- text: 다진 소고기에 간장과 갈아놓은 배, 맛술, 파, 마늘, 참기름, 통깨로 양념을 하여 30분 이상 재워둔 뒤 썰어 놓은 김치, 다진 떡을 넣고 골고루 치대어 섞는다.
- text: 팬에 기름을 넣고 따끈해지면 떡갈비 (⑤)를 넣어 익힌 후, 콩나물밥(④) 위에 올리고, 브로컬리는 살짝 데쳐 장식으로 올려 완성한다.
