steps:
- text: 가지는 꼭지를 떼어 편으로 썬다.
- text: 새송이버섯은 길게 편으로 썰고, 표고버섯은 기둥을 떼고 납작하게 썬다.
- text: 가지와 버섯은 끓는 물에 각각 데친 후 찬물에 식힌다.
