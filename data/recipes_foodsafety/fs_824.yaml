steps:
- text: 오이는 길이로 4등분하여 삼각썰기 한 후 0.8cm 두께의 막대모양으로 썬다.
- text: 소금에 살짝 절여 꼭 짜서 준비한다.
- text: 통마늘은 길이로 3등분하고 생강은 편으로 썬다.
- text: 마른 홍고추는 가위를 사용하여 어슷하게 자른다.
- text: 손질한 모든 재료를 볼에 담고 푹 잠길 정도로 오이초절임소스를 붓는다.
- text: 냉장 보관해 마무리한다.
