steps:
- text: 닭봉은 손질한 뒤 후춧가루를 섞은 우유에 담가두었다가 구워 준비한다.
- text: 단호박, 새송이버섯은 구워서 준비한다.
- text: 소스를 만든다.
- text: 가지, 주키니호박, 당근, 양파, 시래기는 잘게 다진 뒤 볶는다.
- text: 볶은 채소와 치즈를 참기름, 간장과 함께 밥에 넣고 섞는다.
- text: 구운 닭봉을 밥으로 감싼 뒤 구운 단호박, 새송이버섯, 새싹채소와 함께 담아 소스를 곁들여 마무리한다.
