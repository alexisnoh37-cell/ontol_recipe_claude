steps:
- text: 소를 고루 치대 반죽한다.
- text: 표고버섯은 밑동을 제거한 뒤 안쪽에 밀가루→달걀물 순서로 바른 뒤 반죽을 넣고 달걀물을 한 번 더 발라준 뒤 김 오른 찜기에 15분간 찐다.
- text: 잣과 대추를 올리고 달걀물을 한 번 더 바르고 3분간 더 찐다.
- text: 오렌지소스 재료를 팬에 넣고 조린다.
- text: 단호박은 얇게 썰어 노릇하게 굽는다.
- text: 쇠고기표고찜에 오렌지소스를 뿌리고 피클과 구운 단호박을 곁들여 마무리한다.
