steps:
- text: 냄비에 우유를 넣고 중불로 끓이다 약한 불에서 식초를 넣어 젓는다. 면보로 유청을 거른 덩어리를 믹서에 넣고 알룰로스①, 소금을 넣고 곱게 갈아 크림치즈를 만든다.
- text: 볼에 아몬드가루, 무가당 코코아가루①을 체 쳐서 넣고 알룰로스②, 두유①을 섞어 초코크림을 만든다.
- text: 믹서에 바나나, 달걀, 두유②, 무가당 코코아가루②, 땅콩버터를 넣고 갈아 반죽을 만들어 종이컵 높이의 50% 정도 채운다.
- text: 전자레인지에서 4~5분 동안 구워 시트를 만든다. 구운 시트는 가로로 3등분한다.
- text: 크림치즈와 초코크림을 섞어 시트 위에 올린다.
- text: 시트를 겹쳐 케이크를 만들고 무가당 코코아가루를 뿌려 마무리한다
