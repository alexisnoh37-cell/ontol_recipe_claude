steps:
- text: 참외는 껍질을 벗기고 반 갈라 속을 파내고, 파낸 속은 면포에 감싸 즙을 짠다.
- text: 과육은 필러로 얇게 저민 뒤 손으로 즙을 꼭 짠다.
- text: 참외즙에 끓는 물(50㎖)과 양념을 넣어 고루 섞는다.
- text: 양념을 섞은 참외즙에 얇게 저민 참외 과육을 넣어 냉장실에서 20분간 절인다.
- text: 소스를 만든다.
- text: 절인 참외 과육을 찬물에 헹궈 물기를 꼭 짠 뒤 그릇에 담고 소스와 아몬드를 곁들인다.
