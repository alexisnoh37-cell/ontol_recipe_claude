steps:
- text: 냄비에 물(3컵)과 양념을 넣어 5분간 끓이고, 삼겹살을 넣어 중간 불로 15분간 끓인다.
- text: 참외(½개)는 껍질과 씨를 제거한 뒤 곱게 다진다.
- text: 다진 참외에 견과류와 저염쌈장 재료를 넣어 고루 섞는다.
- text: 영양부추는 한입 크기로 자르고, 참외(½개)는 씨를 제거한다.
- text: 그릇에 영양부추를 깔고, 삼겹살을 가지런히 올린다.
- text: 씨를 제거한 참외에 참외 저염쌈장을 담아 마무리한다.
