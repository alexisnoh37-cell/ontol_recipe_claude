steps:
- text: 관자 50g은 편으로 썰어준다.
- text: 편으로 썰어준 관자를 다진마늘, 흰후추, 버터에 볶아준다.
- text: 남은 관자 50g은 국물을 만들어준다.
- text: 브로콜리와 시금치는 뜨거운 물에 데쳐낸 후 국물 낸 볶은관자와 브로콜리, 시금치는 믹서 에 간다.
- text: 팬에 넣고 끓이고 우유를 넣고 한 번 더 끓여 준다.
- text: 생크림과 파마산치즈로 농도를 맞춘 후 그릇에 담고 마늘칩을 올려서 완성한다.
