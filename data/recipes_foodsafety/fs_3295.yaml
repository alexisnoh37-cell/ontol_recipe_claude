steps:
- text: 미역 줄기는 흐르는 물에 여러 번 헹구고, 찬물에 1시간 정도 담가둔다.
- text: 미역 줄기는 한입 크기로 썰고, 양파는 얇게 채 썰고, 맛살은 낱낱이 가른다.
- text: 끓는 물에 맛살을 살짝 데쳐 건진 뒤 물기를 제거한다.
- text: 반죽 재료를 고루 섞은 뒤 손질한 재료를 넣어 대충 섞는다.
- text: 중간 불로 달군 팬에 아보카도유를 두른 뒤 반죽을 적당한 크기로 떼어 올리고, 건새우를 얹는다.
- text: 반죽이 불투명해지면 뒤집고, 앞뒤로 노릇하게 구워 마무리한다.
