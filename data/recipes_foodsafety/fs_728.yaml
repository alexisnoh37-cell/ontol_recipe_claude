steps:
- text: 사과와 배는 사방 2cm 네모로 썰고, 밤도 얇게 썰어준다.
- text: 1을 설탕물(물 1컵 + 설탕 2.5g)에 담근다.
- text: 대추, 곶감은 굵게 채 썰고 호두, 땅콩은 굵게 다진다.
- text: 분량의 재료를 섞어 겨자소스 만든다.
- text: 과일을 체에 받쳐 물기를 빼고 소스에 버무린다.
- text: 한입 크기로 자른 양상추에 샐러드를 올려낸다.
