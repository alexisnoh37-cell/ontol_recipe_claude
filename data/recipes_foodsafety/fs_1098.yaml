steps:
- text: 단호박은 찜통에 찐 뒤 껍질을 제거하고 으깨 생크림을 넣고 섞는다.
- text: 새우살, 파프리카, 양파는 잘게 다진 뒤 팬에 식용유를 두르고 볶는다.
- text: 볼에 1번과 2번, 옥수수, 소금을 넣고 잘 섞는다.
- text: 춘권피에 3번을 넓게 펴준 뒤 모짜렐라 치즈를 올린다.
- text: 춘권피를 잘 말아 모양을 만든다.
- text: 180℃ 기름에 튀긴다.
