steps:
- text: 가지는 길이로 포를 떠 준다. 이때 필러를 이용하면 간편하게 할 수가 있다.
- text: 감자는 채 썰어 냉수에 담가 전분기를 완전히 빼준다.
- text: 파프리카, 양파, 청고추는 감자와 같은 길이로 채 썰어준다.
- text: 소스를 만들어준다.
- text: 가지를 기름 없이 구워준다.
- text: 구운 가지를 펴 놓고 준비된 채소를 말아서 가지말이를 만들고, 마늘튀김을 올려 소스랑 완성한 뒤 파마산치즈를 다져서 먹기 직전에 뿌려준다.
