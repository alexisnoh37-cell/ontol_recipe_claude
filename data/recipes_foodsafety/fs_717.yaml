steps:
- text: 돌나물은 먹기 좋은 크기로 자른다.
- text: 오이와 파프리카는 4~5cm 가량의 크기로 채 썬다.
- text: 주꾸미는 끓는 물에 데친다.
- text: 데친 주꾸미 4~5cm 가량의 크기로 썬다.
- text: 고추장, 식초, 매실액, 파, 마늘, 통깨, 고춧가루를 넣고 고추장양념을 만든다.
- text: 접시에 1,2,4를 담고 5의 고추장양념을 곁들인다.
