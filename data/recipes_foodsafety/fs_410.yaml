steps:
- text: 전복은 손질해 잘라주고 전복내장과 소주를 넣어서 믹서에 간다.
- text: 참기름과 마늘기름을 섞어서 불린 쌀을 볶는다.
- text: 연근, 당근, 단호박은 작은 깍두기 모양으로 잘라 각각 볶아준다.
- text: 전복은 작은 깍두기 모양으로 잘라서 칵테일새우, 바지락살, 다진마늘, 청주를 넣어 살짝 볶아준다.
- text: 냄비에 갈아준 전복내장을 만들어준 기름에 볶아주다 쌀을 넣고 볶고, 나머지 채소를 넣어 볶는다.
- text: 마지막으로 새우, 바지락을 넣고 볶아 완성한다.
