steps:
- text: 볼에 크림치즈, 무염버터, 코코넛우유를 넣고 중탕하며 부드럽게 될 때까지 섞는다. 중탕물에서 내려 달걀노른자를 섞는다.
- text: ①에 박력 밀가루, 옥수수전분을 체 쳐서 넣고 섞은 후 고운체로 한 번 더 거른다.
- text: 달걀흰자에 레몬즙을 넣고 휘핑한다. 알룰로스 가루를 1/3씩 넣으며 섞어 약간 단단한 머랭을 만든다.
- text: ②에 머랭을 1/3씩 넣고 섞어 반죽을 만든다. 케이크 틀에 유산지를 깔고 반죽을 넣는다.
- text: 큰 팬에 뜨거운 물을 붓고 케이크 틀을 올려 중탕하여 150°C로 예열한 오븐에서 30분 동안 굽는다.
- text: 케이크 틀에서 꺼내 유산지를 제거하고 마무리한다.
