steps:
- text: 연두부는 동글게 썰어 준비한다.
- text: 호박은 갈라 씨를 제거 하고 껍질을 벗겨 쪄서 작은 깍둑썰기로 썰어 준비 한다.
- text: 바나나와 파프리카 토마토는 호박과 같은 크기의 작은 깍두기로 썰어 놓는다.
- text: 닭고기살은 통후추를 넣고 약 20분 정도 삶아 건져 작은 깍두기로 썰어 준비한다.
- text: 마와 잣, 흑임자를 갈아 놓은 뒤 생크림, 요거트, 식초, 올리브오일, 설탕을 섞어 샐러드 소스를 만들어 놓는다.
- text: 썰어 놓은 연두부 위에 호박 , 닭고기, 토마토, 파프리카를 각각 올린 뒤 어린 잎을 올리고 소스를 뿌려 완성한다.
