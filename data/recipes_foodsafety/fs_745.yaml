steps:
- text: 과메기는 꼬리를 잘라낸다.
- text: 다진 생강과 마늘즙을 내어 손질한 과메기 위에 뿌린다.
- text: 고추장, 다진 마늘, 다진 파, 매실액, 고춧가루, 후춧가루, 물을 섞어 양념장을 만든다.
