steps:
- text: 전복은 내장과 분리해 손질한다.
- text: 내장은 칼로 다진다.
- text: 당근과 전복살은 송송 잘라준다.
- text: 전복 껍질과 다시마를 넣어 물 300g에 국물을 만들어준다.
- text: 만들어진 국물에 미역을 넣고 끓여준다.
- text: 다진 내장과 불린 찹쌀을 참기름에 볶다가 끓인 미역국을 넣고 더 끓여 죽을 만든다. 다진 당근, 흑임자로 마무리 완성한다.
