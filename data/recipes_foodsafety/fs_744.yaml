steps:
- text: 손질한 문어를 데친다.
- text: 양파와 감자를 적당한 크기로 자르고 톳과 당근은 잘게 다진다.
- text: 데친 문어와 양파, 감자를 믹서기에 넣고 간다.
- text: 2와 3에 우리밀가루, 다진 마늘, 후춧가루를 넣고 반죽을 치대 직사각형 모양을 만든다.
- text: 팬에 현미유를 두르고 4의 문어를 넣고 지진 후 꼬치에 끼운다.
- text: 토마토케첩과 허니머스터드소스를 곁들인다.
