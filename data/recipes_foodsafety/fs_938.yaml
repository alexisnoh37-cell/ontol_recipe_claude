steps:
- text: 고구마를 삶아 껍질을 제거하고 오븐에 넣어 수분을 제거한다.
- text: 생강을 편으로 썰어 생크림과 섞어 생강향이 우러나도록 살짝 끓인 후 체에 거른다.
- text: 볼에 1을 넣고 으깬다.
- text: 3에 2를 넣고 골고루 섞어준다.
- text: 버터, 꿀, 소금, 후추를 넣어 맛을 내고 원하는 모양으로 빚는다.
- text: 5에 밀가루, 달걀물, 빵가루 순으로 묻혀 180℃ 기름에 튀긴다.
