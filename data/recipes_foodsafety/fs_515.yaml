steps:
- text: 연어에 로즈마리를 위에 올려 마리네이드를 한다.
- text: 마리네이드를 해놓은 연어에 레몬즙을 뿌린다.
- text: 당근, 양파는 썰고 마늘과 토마토는 다져 준비한다.
- text: 냄비에 버터를 두르고, 채소(③)를 볶다가 밀가루를 넣고 볶으면서 다시 토마토소스를 넣어 볶다가 육수와 월계수잎을 넣어 끓인다.
- text: 소스가 자작 하게 끓고 있을 때, 우유를 넣고 한 소끔 끓여준다.
- text: 팬에 올리브 오일을 두르고, 연어 (①)를 올려 앞뒤로 구어 접시에 담고, 토마토소스를 올려 완성한다.
