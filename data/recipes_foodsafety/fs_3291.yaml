steps:
- text: 큰 볼에 두부를 담은 뒤 물이 담긴 무거운 그릇을 3분간 올려 수분을 제거한다.
- text: 두부 속을 사각형 모양으로 파내고, 파낸 두부 속은 물기를 꼭 짜 으깬다.
- text: 파프리카와 깻잎은 잘게 썬다.
- text: 통조림 참치는 체에 밭친 뒤, 뜨거운 물을 부어 기름과 염분을 제거한다.
- text: 볼에 으깬 두부, 손질한 채소, 잡곡밥, 참치를 넣은 뒤 양념해 고루 섞는다.
- text: 주먹밥을 동그랗게 만들고, 속을 판 두부 속에 넣어 마무리한다.
