steps:
- text: 도미살에 소금, 후추로 밑간한다.
- text: 셀러리, 당근, 대파, 양파, 피망은 채 썰고 브로컬리는 작은 송이로 자르고 레몬 껍질은 얇게 제스트하고 팽이버섯은 밑동을 자른다.
- text: 유산지는 반을 접었다가 편 뒤 안쪽에 부드러운 버터를 바른다.
- text: 4의 버터를 바른 한 쪽 면에 셀러리, 당근, 대파, 팽이버섯, 양파, 피망, 레몬 제스트를 준비된 분량의 반 정도 놓고 밑간한 도미살을 올린다.
- text: 다시 남은 야채들을 도미위에 올리고 유산지의 한 면으로 야채를 덮어주고, 모서리의 뚫린 곳을 접어 봉해준다.
- text: 160℃로 예열된 오븐에서 익혀준다.
