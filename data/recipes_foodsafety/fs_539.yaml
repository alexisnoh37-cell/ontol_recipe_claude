steps:
- text: 썰어 놓은 삼겹살에 생갑즙과 정종을 넣고 약 2시간 정도 숙성을 시켜 준비 한다.
- text: 가지는 씨가 적은 것으로 골라 반으로 갈라 어슷썰어 놓는다.
- text: 양파와 깻잎은 채를 썰고, 당근은 직사각형으로 썰고, 대파는 송송 썰고, 느타리는 손으로 찢어 준비한다.
- text: 고춧가루과 다진마늘, 간장, 올리고당, 후춧가루, 설탕을 넣고 골고루 섞어 양념장을 만든다.
- text: 숙성시켜 놓은 삼겹살에 만들어 놓은 양념장을 넣고 골고루 무쳐 놓는다.
- text: 팬에 기름을 살짝 둘러 양념한 고기(⑤) 를 먼저 볶은 후 고기가 중간쯤 익으면, 가지(②)와 썰어 놓은 채소(③)를 넣어 볶다가 마지막에 참기름과 잣을 넣고 한 번 더 볶은 후 통깨를 올려 완성한다.
