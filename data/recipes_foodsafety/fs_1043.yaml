steps:
- text: 무순의 잡티를 제거한 뒤 물에 흔들어 씻어 물기를 뺀다.
- text: 연두부는 적당한 크기로 나눈다.
- text: 다시마 육수에 분량의 재료를 섞어 냉국 국물을 만든 뒤 냉장고에 넣어 차갑게 만든다.
- text: 청, 홍고추, 대파는 2cm 길이로 곱게 채 썬다.
- text: 냉국 그릇에 2의 연두부를 담고 무순, 채썬 대파, 청, 홍고추를 가지런히 올린다.
- text: 5의 연두부에 차게 준비한 냉국 국물을 붓고 쑥갓을 얹은 뒤 통깨를 뿌린다.
