steps:
- text: 껍질을 벗기지 않은 사과와 반을 잘라 껍질을 벗긴 참마를 0.7cm 주사위모양으로 썬다.
- text: 사과에 레몬주스, 소금을 넣고 부드러워질 때 까지 익힌 뒤 참마를 넣고 살짝 끓인다.
- text: 나머지 참마는 껍질을 벗긴 뒤 토막내 두유, 물엿, 밀가루, 올리브오일과 같이 믹서에 간다.
- text: 3이 퓨레 상태가 되면 약 불에서 걸쭉하게 졸인다.
- text: 2에 건포도를 섞은 뒤 틀에 담고 4를 펴서 얹고 그 위에 슬라이스 아몬드와 설탕을 뿌린다.
- text: 200℃로 예열한 오븐에서 표면이 노릇해 질 때 까지 약 10분 간 굽는다.
