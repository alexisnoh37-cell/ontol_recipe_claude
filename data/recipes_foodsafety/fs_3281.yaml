steps:
- text: 가지와 오이는 세로로 얇게 썬다.
- text: 얇게 썬 오이는 소금(0.2ts)에 10분간 절인 뒤 물기를 꼭 짠다.
- text: 얇게 썬 가지는 약한 불로 달군 마른 팬에 올려 앞뒤로 노릇하게 구워 꺼낸다.
- text: 밥에 남은 양념을 넣어 고루 섞는다.
- text: 소금에 절인 오이와 구운 가지 위에 밥을 한입 크기로 뭉쳐 올린다.
- text: 돌돌 말아 그릇에 담아 마무리한다.
