steps:
- text: 두부는 4x4x2cm로 썰어 윗면에 대각선으로 칼집을 넣는다.
- text: 호박은 3cm길이로 곱게 채썰고 표고버섯과 소고기도 곱게 채썰어 양념한다.
- text: 팬에 채썬 호박을 볶아내고 양념해 둔 표고버섯과 소고기도 볶는다.
- text: 칼집을 넣은 두부에 볶아둔 재료들을 칼집 사이에 끼워 속을 넣는다.
- text: 준비된 두부를 찜통에 쪄낸다.
- text: 저나트륨 겨자 간장소스를 곁들인다.
