steps:
- text: 수박껍질은 흰 부분만 사용해 작게 깍둑 썰고, 토마토는 껍질을 벗겨 속씨를 제거해 작게 깍둑썬다.
- text: 닭가슴살은 수비드해 익힌 뒤 한입 크기로 썬다.
- text: 감자, 가지, 양파, 피망, 아스파라거스는 깍둑 썬 뒤 닭가슴살과 함께 볶는다.
- text: 팬에 복분자를 넣고 살짝 졸인 뒤 레몬즙을 섞어 복분자소스를 만든다.
- text: 접시에 퀴노아를 두른 후 닭가슴살과 감자, 가지, 양파, 피망, 아스파라거스를 올리면서 중간 중간에 토마토와 수박, 리코타치즈를 넣는다.
- text: 맨 위에 퀴노아를 살짝 올려주고 양상추, 플레인 요구르트, 어린잎채소를 얹어 마무리한다.
