steps:
- text: 곤약은 얇게 편으로 썰어 데친 뒤 백김치 국물에 절인다.
- text: 물에 월계수잎, 통후추, 청주를 넣고 오징어를 질기지 않게 살짝 삶는다.
- text: 파프리카는 채썰고 백김치는 물기를 제거한다.
- text: 곤약을 깔고 백김치, 오징어, 파프리카를 얹어 말아준다.
- text: 부추로 풀어지지 않게 단단히 매듭을 짓는다.
- text: 아랫부분을 정리하고 접시에 담는다.
