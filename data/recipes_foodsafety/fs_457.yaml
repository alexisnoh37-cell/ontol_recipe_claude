steps:
- text: 떡볶이는 뜨거운 물에 담그어 놓는다.
- text: 토마토, 사과는 입자 있게 다진다.
- text: 떡볶이떡은 뜨거운 물에 담그어 놓는다.
- text: 고추장과 케첩, 올리고당, 다진 마늘을 골고루 섞는다.
- text: 냄비에 버터를 녹인 뒤 토마토와 사과 (②), 소스(④)를 넣고 볶아준다.
- text: 볶고 있는 소스(⑤)에 떡볶이 떡(①)과 썰어놓은 채소와 어묵(③)을 넣고, 육수를 부어 끓이다가 대파를 넣고 한 번 더 끓여 완성한다.
