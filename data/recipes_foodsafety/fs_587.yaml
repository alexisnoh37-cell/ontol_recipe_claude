steps:
- text: 토마토는 깨끗이 씻어 슬라이스한다.
- text: 두부는 원형틀을 이용해서 토마토와 같은 크기로 만들고 소금을 살짝 뿌린 뒤 물기를 제거한다.
- text: 팬에 올리브오일을 두르고 두부를 살짝 굽는다.
- text: 어린잎은 찬물에 담근다.
- text: 발사믹소스에 설탕과 레몬즙을 넣고 골고루 섞어 소스를 만든다.
- text: 두부와 준비한 토마토를 접시에 돌려 담고 어린잎을 위에 올린 뒤 먹기 직전에 발사믹소스와 파마산치즈를 뿌려 완성한다.
