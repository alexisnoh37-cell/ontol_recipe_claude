steps:
- text: 당근, 피망, 양파를 잘게 다진 뒤 기름에 살짝 볶아 밥에 마요네즈(10g)와 함께 넣어 섞는다.
- text: 통조림 연어는 기름기를 빼고, 식초를 넣은 끓는 물에서 30초 정도 데친다.
- text: 데리야키소스와 마요네즈(10g)에 연어를 넣고 버무려 양념한다.
- text: 밥을 동그랗게 빚은 뒤 가운데에 연어를 넣고 주먹밥을 만든다.
- text: 달걀물과 빵가루를 입혀 160℃로 예열한 기름에 바삭하게 튀긴다.
- text: 연어주먹밥튀김을 담고 어린잎채소를 곁들인 뒤 오리엔탈소스를 곁들여 마무리한다.
