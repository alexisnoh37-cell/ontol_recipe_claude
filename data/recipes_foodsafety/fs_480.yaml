steps:
- text: 가지는 약 10cm 길이로 길고, 납작하게 썰어 준비한다.
- text: 팬에 올리브 오일을 살짝 둘러 썰어놓은 가지를 소금을 넣고 살짝 익힌다.
- text: 토마토는 반은 토마토 형태로 납작하게 썰어 놓는다.
- text: 토마토반은 입자있게 다져 준비한다.
- text: 다진 토마토를 준비한 토마토소스에 섞어 살짝 어우러지게 끓여 준비한다.
- text: 구운 가지위에 토마토와 모짜렐라치즈를 올려 팬에 굽고, 별도로 팽이버섯에 후춧가루를 뿌려 살짝 구워 접시에 담고, 끓여 놓은 토마토소스를 올려 완성한다.
