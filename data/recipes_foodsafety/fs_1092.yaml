steps:
- text: 고구마는 껍질을 벗기고 적당한 크기로 썰어 삶은 뒤 50g은 으깨고 25g은 작게 자른다.
- text: 으깬 고구마에 달걀노른자, 우유를 넣고 섞는다.
- text: 달걀흰자는 머랭을 만들어 2번과 섞은 뒤 크랜베리, 잘라둔 고구마와 살살 섞는다.
- text: 유리용기 안쪽에 올리브오일을 바르고 잘게 부순 아몬드와 호두를 뿌린 뒤 3번을 담고 전자레인지로 7분 간 가열한다.
- text: 제철과일을 중불에서 10분 간 끓인 뒤 올리고당을 넣고 한소끔 끓이고, 레몬즙을 넣고 다시 한소끔 끓여 저당 과일잼을 만든다.
- text: 4번을 접시에 뒤집어 담고 저당 과일잼을 곁들인다.
