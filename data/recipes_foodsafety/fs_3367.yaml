steps:
- text: 오징어는 채 썰고, 마늘과 대파는 곱게 다진다.
- text: 오징어, 대파, 마늘, 달걀노른자, 밀가루, 물(10g)을 섞어 반죽한 뒤 동그랗게 빚는다.
- text: 가라아게를 180℃ 온도의 기름에서 튀긴다.
- text: 토마토는 껍질을 제거한 뒤 잘게 다진다.
- text: 냄비에 다진 토마토, 식초, 설탕, 물(50g), 고춧가루, 전분을 넣고 끓여 칠리소스를 만든다.
- text: 오징어 가라아게에 칠리소스를 곁들여 마무리한다.
