steps:
- text: 팥을 깨끗하게 씻어 끓인 뒤 물을 따라 버리고 다시 물을 부어 팥이 무르게 삶는다.
- text: 당근을 1cm 주사위 모양으로 자른다.
- text: 1, 2에 각각 설탕을 넣고 졸인다.
- text: 볼에 현미가루, 밀가루, 우유를 넣고 덩어리가 생기지 않도록 잘 갠 뒤 30분간 둔다.
- text: 가열된 팬에 참기름을 두르고 약한 불에서 4를 한 국자 정도 떠서 둥글게 부친 뒤 식힌다.
- text: 크레이프를 펴고 각각 팥소와 당근조림을 각각 얹은 후 둥글게 만다.
