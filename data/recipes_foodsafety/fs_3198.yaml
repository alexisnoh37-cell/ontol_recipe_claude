steps:
- text: (속재료) 고구마는 쪄서 으깬 후 생크림을 넣어 부드러운 무스를 만든다. 양파와 김치는 다지고, 기름 두른 팬에 양파를 볶아 단맛을 낸 다음 김치를 볶아 볶음 김치를 만든다.
- text: 반죽재료를 모두 넣고 1단으로 믹싱한 후 올리브유를 넣고 최종단계 직전까지 믹싱한다.
- text: 1차 발효 후에 반죽을 각 100g씩 총 3개로 분할하여 둥글리기 한 후 랩을 덮어 중간발효(10분)를 해준다.
- text: 반죽에 고구마 무스 ,볶음김치을 넣어 싼 후 고구마 모양으로 만들어 준다. ★이음새가 벌어지면 구우면서 반죽이 터져지니 꼼꼼히 붙여주세요.
- text: 팬닝 후 2차 발효(30분)를 한다.
- text: 윗불 160℃, 아랫불 180℃에서 15분 굽는다.
