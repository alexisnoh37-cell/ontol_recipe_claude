steps:
- text: 닭정육과 닭뼈를 깨끗이 씻어 물, 마늘, 대파, 다시마를 넣고 육수를 끓인다.
- text: 닭 정육이 익으면 건져 잘게 찢는다.
- text: 무는 나박썰기하고 대파와 홍고추, 청양고추는 어슷썰기 하고 양파와 마늘은 다진다.
- text: 육수가 우러나면 체에 육수를 걸러낸다.
- text: 냄비에 마늘을 볶다가 닭고기를 넣고 함께 볶은 뒤 육수와 손질한 채소를 넣어 푹 끓인다.
- text: 후추로 간을 해 마무리한다.
