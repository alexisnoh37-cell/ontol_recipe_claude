steps:
- text: 새송이버섯은 모양대로 도톰하게 썰고, 방울토마토는 꼭지를 제거한 뒤 열십자 모양을 내고, 오징어 몸통 부분에 사선으로 칼집을 낸 뒤 후춧가루를 뿌린다.
- text: 칵테일새우는 양념에 버무린 뒤 20분간 재운다.
- text: 중간 불로 달군 마른 팬에 새송이버섯, 방울토마토를 넣어 노릇하게 구워 꺼낸다.
- text: 같은 팬에 새우, 오징어를 넣어 겉면의 색이 변할 때까지 구워 꺼낸다.
- text: 믹서에 페스토 재료를 넣어 곱게 간다.
- text: 그릇에 미나리 페스토를 담고, 손질한 재료를 올려 마무리한다.
