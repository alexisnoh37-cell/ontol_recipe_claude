steps:
- text: 실 곤약은 세척 후에 물기를 빼준다.
- text: 새우와 브로콜리는 데쳐 냉수에 헹궈 준비한다.
- text: 드라이 토마토는 물에 데쳐 준 후 송송 다져 준 후 올리브 오일에 버무려주고 생 바질은 데친 후 송송 다져준다.
- text: 볼에 실 곤약을 바질 페이스트에 버무려준다.
- text: 다져 놓은 채소와 새우, 브로콜리를 섞어 버무려준다.
- text: 마지막에 파마산 가루를 뿌려 완성한다.
