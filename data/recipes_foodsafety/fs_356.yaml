steps:
- text: 두부는 사방 1cm로 잘라주고, 무는 반은 나박썰기 하고 반은 국물을 낸다.
- text: 두부는 사방 1cm로 잘라주고, 무는 반은 나박썰기 하고 반은 국물을 낸다.
- text: 황태는 먹기 좋게 잘라준다.
- text: 황태, 대파뿌리, 함초, 무를 넣고 국물을 만든다.
- text: 만들어진 국물에 함초와 대파뿌리를 건져내고 어간장으로 간을 해준다. 국물을 만들고 남은 무는 나박썰기 해서 국에 넣어준다.
