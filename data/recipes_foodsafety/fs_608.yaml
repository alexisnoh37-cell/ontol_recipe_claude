steps:
- text: 닭살에 소금, 후추로 밑간을 한다.
- text: 밑간한 닭살에 카레가루를 골고루 묻힌다.
- text: 양파, 당근, 토마토, 샐러리는 주사위 모양으로 자른다
- text: 냄비에 양파, 당근, 토마토, 샐러리를 볶다가 카레가루를 넣고 끓여 카레소스를 만든다.
- text: 팬에 기름을 두르고 닭살을 익힌다.
- text: 그릇에 익힌 닭살을 담고 카레소스를 올린다.
