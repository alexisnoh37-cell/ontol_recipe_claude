steps:
- text: 박력분, 베이킹파우더, 소금을 체친 뒤 달걀을 2~3회 나누어 넣는다.
- text: 1번을 3등분 하여 대추고, 채썬대추/당근퓨레/녹차가루, 팥앙금을 각각 섞는다.
- text: 각각에 녹인 버터(50g)를 넣고 부드럽게 섞은 뒤 비닐을 덮어 실온에서 30분 간 휴지시킨다.
- text: 마들렌 팬을 깨끗이 닦고 버터를 바른 뒤 밀가루를 뿌린다.
- text: 짤주머니에 원형 깍지를 끼우고 반죽을 채운 뒤 팬에 80~90% 정도 짜 넣는다.
- text: 175℃ 오븐에서 20분 간 굽는다.
