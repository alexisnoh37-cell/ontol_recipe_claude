steps:
- text: 더덕은 껍질을 벗기고 0.3cm 두께로 편 썰어 소금물에 담궈 쓴 맛을 뺀 뒤 면보에 옮겨 밀대로 밀거나 두들겨 얇게 편다.
- text: 찹쌀가루는 소금을 넣고 혼합하여 체에 내린다.
- text: 2를 3등분 하여 가루녹차와 백년초가루를 각각 섞는다.
- text: 3에 더덕을 각각 넣고 앞, 뒤로 꼭꼭 눌러 찹쌀가루를 묻힌다.
- text: 170℃의 기름에 2번 튀긴 뒤 기름을 빼고 뜨거울 때 설탕을 약간 뿌린다.
- text: 꿀을 곁들여 찍어 먹는다.
