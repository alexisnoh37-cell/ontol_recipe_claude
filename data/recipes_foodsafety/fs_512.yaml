steps:
- text: 닭고기살은 소금과 후춧가루, 생강즙과 정종을 뿌린 후 우유를 살짝 발라 숙성을 시킨다.
- text: 오이는 길게 껍질째 썰어 놓는다.
- text: 토마토는 반으로 잘라 편으로 썰어 준비한다.
- text: 두부는 소창으로 물기를 꼭 짜 놓는다.
- text: 물기를 제거 시킨 두부에 흑임자를 넣고 골고루 섞은 뒤 냄비에 넣고 우유와 함께 은근히 끓여 속을 만든다.
- text: 팬에 토마토를 먼저 구워 접시에 담고, 숙성된 닭고기를 구워 올린 뒤, 그 위에 오이로 원형기둥을 만들고 구운 닭고기를 다시 올려 완성한다.
