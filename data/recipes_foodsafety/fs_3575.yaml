steps:
- text: 소고기는 키친타월로 핏물을 제거한다.
- text: 다진 쪽파, 다진 마늘, 저염간장, 고춧가루, 깨(18g), 물(4ml)을 섞어 양념장을 만든다.
- text: 튀김가루와 물(15ml)을 섞어 반죽을 만든다
- text: 손질한 소고기는 후추로 밑간하여 한입 크기로 다지고 김 위에 올려 돌돌 말아 김말이를 만든다.
- text: 김말이에 반죽을 묻히고 달군 팬에 식용유를 두르고 김말이를 앞뒤로 굽는다.
- text: 접시에 담고 양념장, 깨를 올려 마무리한다.
