steps:
- text: 고구마를 깨끗이 씻어 껍질을 벗긴다.
- text: 고구마를 길게 4등분 하여 4cm로 토막낸다.
- text: 깊은 팬에 식용유를 넣고 160℃로 만든다.
- text: 3에 고구마를 넣고 저어가며 4분 정도 노릇하게 튀긴다.
- text: 팬에 식용유를 약간 넣고 뜨거워지면 설탕을 넣어 중불에 녹여 갈색나는 시럽을 만든다.
- text: 튀긴 고구마를 시럽에 버무리고 검은깨를 뿌린다.
