steps:
- text: 훈제오리 가슴살은 올리브오일, 로즈마리, 후춧가루로 마리네이드한다.
- text: 새송이버섯은 편으로 썰고 팬에 굽는다.
- text: 오렌지는 슬라이스로 썬다.
- text: 땅콩과 파슬리는 입자있게 다진다.
- text: 마리네이드한 오리 고기를 구워 접시에 담는다.
- text: 유자청에 땅콩, 파슬리가루를 넣고 소스를 만들고, 구워진 오리고기 사이에 오렌지 슬라이스를 넣고 유자청소스를 올린다.
