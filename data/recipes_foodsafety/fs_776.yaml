- text: 깻잎장아찌를 바닥에 깔고 말아놓은 롤을 올린 후 한 번 더 만다.
- text: 머스트드소스를 만든다.
- text: 한입 크기로 롤을 썬 뒤 새싹과 소스를 곁들여 마무리한다.
