steps:
- text: 다시마, 양파와 물을 넣고 육수를 만든다.
- text: 새뱅이는 불순문을 제거하여 세척하고, 밀가루에 물을 넣어 손수제비 반죽을 한다.
- text: 무와 호박은 나박썰기, 고추와 파는 어슷썰기, 마늘은 다진다.
- text: 들기름 두른 냄비에 무, 고추장, 고춧가루를 볶다가 육수를 부워 끓인다.
- text: 새뱅이와 호박, 고추 마늘을 넣어 끓인다.
- text: 손수제비와 파를 넣고 간을 맞추고 마지막에 쑥갓을 올린다.
