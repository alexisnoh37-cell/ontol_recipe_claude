steps:
- text: 다진 소고기에 다진마늘, 소금, 후춧가루, 맛술을 넣고 잘 섞어 숙성을 시킨다.
- text: 미니 단호박을 반으로 잘라 속을 파낸 뒤 약 15분 정도 쪄서 호박 속을 긁는다.
- text: 긁어 놓은 호박 속에 생크림을 넣어 골고루 섞는다.
- text: 양송이와 양파, 당근, 베이컨, 햄은 사각지게 썰고, 피망과 파프리카는 속을 제거하고 사각지게 썰어 놓는다.
- text: 재워놓은 소고기(①)와 베이컨, 햄을 올리브기름에 볶다가 썰어 놓은 채소를 넣어 함께 볶아 준비한다.
- text: 속 파낸 단호박(②)에 준비해둔 호박속 (③)과 볶아놓은 햄과 채소(⑤)를 담고, 모짜렐라치즈를 올려 오븐에 약 5분 정도 구운 뒤 파슬리가루를 살짝 뿌려 완성한다.
