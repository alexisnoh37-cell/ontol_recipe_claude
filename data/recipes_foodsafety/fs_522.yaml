steps:
- text: 단호박은 칼로 잘라, 수저를 이용하여 호박씨를 제거한다.
- text: 손질이 된 단호박은 면보를 깔고, 김이 오른 찜통에서 약 15분 정도 쪄 준비한다.
- text: 다진 소고기는 파, 마늘, 양파, 참기름, 간장, 후춧가루, 매실액을 넣고 양념을 한다.
- text: 3번에 양념된 소고기에 찹쌀가루를 넣고 골고루 섞는다.
- text: 쪄 놓은 호박에 양념된 소고기를 넣고 모양을 잡아 준다.
- text: 육수가 한 소큼 끓으면 만들어 놓은 단호박떡갈비(⑤)를 넣어 약 20분 정도 은근히 쪄서 잣을 올려 완성한다.
