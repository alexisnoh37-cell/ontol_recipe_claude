steps:
- text: 바질과 양파, 브로콜리, 당근은 곱게 다진다.
- text: 소고기와 돼지고기는 곱게 간다.
- text: 2를 1:1 비율로 섞고 1과 달걀, 케첩, 후추, 빵가루와 섞어 패티를 만든다.
- text: 미니버거빵의 안쪽 면에 버터를 바른 후 팬에서 살짝 구워준다.
- text: 3을 팬에서 갈색이 나도록 익혀준다.
- text: 4에 마요네즈를 바르고 양상추, 패티, 케첩, 토마토, 양상추 순으로 올리고 마요네즈를 바른 빵으로 덮는다.
