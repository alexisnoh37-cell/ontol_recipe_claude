steps:
- text: 콜리플라워는 송이 부분만 떼어내고, 고구마와 양파는 한입 크기로 썬다.
- text: 양고기는 한입 크기로 썰어 밑간한 뒤 15분간 재운다.
- text: 재워둔 고기에 손질한 채소와 마늘을 넣어 고루 버무리고, 중간 불로 달군 팬에 올려 고구마가 약간 익을 때까지 볶는다.
- text: 양념을 넣어 재료와 고루 섞는다.
- text: 단호박은 전자레인지에 5분간 돌리고, 익으면 윗부분을 약간 잘라낸 뒤 씨를 제거하고, 양고기와 볶은 재료를 단호박 속에 채운다.
- text: 찜기에 넣어 25분간 쪄낸 뒤 8등분하여 마무리한다.
