steps:
- text: 두부를 두께 2cm로 썰어 원형틀로 찍어 준비한다.
- text: 준비한 채소는 작은 정육면체로 썰어 팬에 살짝 볶는다.
- text: 물과 카레가루를 섞어 끓이다가 감자를 넣어 끓이고 감자가 거의 익을 때쯤에 나머지 채소를 넣어 끓인다.
- text: 물과 녹말가루를 섞어 3의 카레소스의 농도를 맞춘다.
- text: 가열된 팬에 두부를 노릇노릇하게 지진다.
- text: 준비한 소스를 두부 스테이크에 뿌려낸다.
