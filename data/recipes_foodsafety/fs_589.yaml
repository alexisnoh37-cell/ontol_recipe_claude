steps:
- text: 떡볶이떡은 잘게 다진다.
- text: 현미, 흑미, 백미 및 조는 깨끗이 씻어 물에 불린다.
- text: 소고기와 돼지고기에 소금, 다진 마늘, 설탕 및 참기름을 넣고 양념한다
- text: 당근과 호박은 잘게 다진다
- text: 달걀은 황백으로 나눠 지단을 부친다.
- text: 불린 쌀로 밥을 짓고, 밥과 3번과 4번을 섞어 미니 떡갈비를 만들어 팬에 기름을 두르고 익힌 뒤 황백지단으로 장식한다.
