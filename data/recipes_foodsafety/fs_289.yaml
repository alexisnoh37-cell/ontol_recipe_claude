steps:
- text: 찬물에 육수 재료를 넣어 육수를 우린다.
- text: 육수에 미소된장을 풀어 차갑게 식힌다.
- text: 묵은 먹기 좋은 크기로 썬다.
- text: 미니양배추는 반 자르고, 적양파, 양파, 오이, 래디시, 당근, 아스파라거스, 파프리카는 채 썰고, 고추는 어슷 썰어 준비한다.
- text: 달걀은 지단으로 부쳐 채 썰고, 목이버섯은 물에 불린다.
- text: 육수에 묵을 넣고 색을 맞춰 고명을 올린 뒤 들깻가루, 참깨, 검은깨를 얹어 마무리한다.
