steps:
- text: 김치를 씻은 뒤 줄기부분은 한입 크기로 썰고, 잎은 따로 두고, 토마토, 양파도 비슷한 크기로 썬다.
- text: 오징어는 칼집을 넣고, 홍합, 바지락, 주꾸미와 함께 살짝 데친 뒤 식용유(10g) 두른 팬에 볶는다.
- text: 새우, 부추, 불린 당면과 무말랭이는 다진 뒤 녹말가루와 달걀을 넣어 반죽해 김치주머니 소를 만든다.
- text: 김치 잎에 소를 넣고 주머니 모양으로 감싸 데친 미나리로 묶는다.
- text: 김치와 채소를 볶아 냄비에 담은 뒤 해산물과 김치주머니를 넣고 끓이다가 끓어오르면 쑥갓, 느타리버섯, 팽이버섯, 고추를 올려 마무리한다.
