steps:
- text: 볼에 물을 담고 판 젤라틴을 넣어 3분 가량 불린 뒤 건진다.
- text: 냄비에 녹차가루와 소량의 물을 넣고 진하게 섞는다.
- text: 2에 우유와 크림, 설탕, 바닐라 에센스를 넣고 약한 불에서 설탕이 녹을 정도로 끓인다.
- text: 3에 불린 젤라틴을 넣고 젤라틴이 녹을 때까지 가열한다.
- text: 용기에 녹차 파나코타를 부은 후 실온에서 식힌다.
- text: 냉장고에서 한번 더 식혀 완성한다.
