steps:
- text: 게살은 잘게 찢고, 수박, 가지, 적채, 브로콜리는 5cm 길이로 채 썬다.
- text: 끓는 물(5컵)에 손질한 브로콜리를 1분간 데쳐 찬물에 담가 체에 밭친다.
- text: 중간 불로 달군 팬에 올리브유(5㎖)를 두른 뒤 가지를 2분간 볶는다.
- text: 믹서에 콩국물소스 재료를 넣고 갈아 콩국물소스를 만든다.
- text: 그릇에 수박 → 가지 → 브로콜리 → 적채 → 게살 순으로 쌓는다.
- text: 콩국물소스를 부어 마무리한다.
