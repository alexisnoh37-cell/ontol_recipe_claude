steps:
- text: 굴은 깨끗이 씻은 뒤 김 오른 찜기에 찐다.
- text: 굴을 쪄낸 물(250g)에 멸치, 표고버섯 밑동을 넣고 끓인 뒤 멸치와 표고버섯 밑동을 건져내 육수를 만든다.
- text: 느타리버섯은 밑동을 제거한 후 씻어 세로로 찢고, 표고버섯은 0.5㎝ 두께로 썬다.
- text: 무는 나박 썰고 양파는 채 썰고, 미나리는 3㎝ 길이로 썰고, 대파와 고추는 송송 썬다.
- text: 육수에 굴, 다진 마늘, 무, 양파, 버섯을 넣고 끓인다.
- text: 들깻가루와 순두부를 넣고 한소끔 끓인 뒤 국간장과 소금으로 간을 맞추고 대파, 붉은 고추, 미나리를 올려 마무리한다.
