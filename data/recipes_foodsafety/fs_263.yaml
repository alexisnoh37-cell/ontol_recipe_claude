steps:
- text: 고추는 어슷 썰고, 무, 당근, 양파, 노란 파프리카, 두부는 납작하게 썬다.
- text: 토마토소스 재료를 믹서에 갈아 토마토소스를 만든다.
- text: 두부를 제외한 납작 썬 재료를 식용유(5g)를 두른 팬에 볶다가 갈아 놓은 토마토소스를 함께 넣어 볶아 토마토채소소스를 만든다.
- text: 냄비에 육수 재료를 넣고 끓어오르면 다시마를 건진 뒤 다진 마늘을 넣고 다시 끓어오르면 콩나물과 관자를 건져내 따로 둔다.
- text: 육수에 토마토채소소스를 넣어 끓인 후, 마지막으로 두부를 넣어 약 2분 정도 끓인다.
- text: 그릇에 담고 덜어놓았던 콩나물과 관자, 고추를 올려 마무리한다.
