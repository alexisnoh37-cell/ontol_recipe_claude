steps:
- text: 두부를 네모지게 썬다.
- text: 썬 두부를 소창으로 물기를 제거한 뒤 소금과 후춧가루로 밑간 한다.
- text: 달걀에 카레가루를 넣은 뒤 잘 풀어준다.
- text: 두부의 물기를 제거하고 밀가루를 묻힌 뒤 3의 달걀을 입힌다.
- text: 식용유를 넣은 팬에 청, 홍고추 송송 썬것을 얹어 노릇하게 지진다.
- text: 저나트륨 초간장소스를 곁들여 낸다.
