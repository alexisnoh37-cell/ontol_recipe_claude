steps:
- text: 고구마 껍질을 벗기고 얇게 썬 뒤 삶아 잘게 으깬다.
- text: 요거트와 우유를 으깬 고구마에 섞어 고구마무스를 만든다.
- text: 만두피를 국자를 이용해 그릇모양으로 만들어 튀긴다.
- text: 튀긴 만두피의 기름을 제거한다.
- text: 만두피 그릇에 고구마무스를 채운다.
- text: 딸기를 입자있게 잘라 졸인 뒤 고구마무스 위에 올린다.
