steps:
- text: 펜네 파스타를 끓는 소금물에 기름을 약간 넣고 10분정도 삶아 체에 밭쳐 물기를 뺀다.
- text: 청피망, 홍피망, 양파는 펜네 파스타 길이로 썰고, 완두콩은 끓는 물에 데쳐서 찬물에 헹군 뒤 물기를 뺀다.
- text: 아스파라거스도 펜네 파스타 길이로 썰어 끓는 소금물에 데쳐 찬물에 식힌 뒤 물기를 뺀다.
- text: 블랙올리브를 링 형태로 썬다.
- text: 볼에 1과 바질 페스토, 소금을 넣고 섞는다.
- text: 5와 나머지 야채들을 같이 섞어 접시에 담는다.
