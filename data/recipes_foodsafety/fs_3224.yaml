steps:
- text: 양파, 파프리카는 채 썰고, 레몬은 얇게 썰고, 방울토마토는 2등분한다.
- text: 손질된 흰살생선에 밑간한다.
- text: 종이 포일에 채 썬 양파를 깐 뒤 밑간한 생선 → 손질한 파프리카 → 레몬 → 방울토마토 순으로 올린다.
- text: 대하, 바지락, 월계수잎, 타임을 올린 뒤 화이트와인과 올리브유를 뿌린다.
- text: 종이 포일로 감싸고 200℃로 예열한 오븐에 15~25분간 굽는다.
