steps:
- text: 두부는 두 덩어리로 잘라 넓게 편다.
- text: 새우, 관자, 파프리카를 함께 갈아 속을 만든다.
- text: 완두콩과 두유, 꿀, 검은깨를 섞은 뒤 갈아 완두콩드레싱을 만든다.
- text: 두부 사이에 속을 넣은 뒤 먹기 편한 크기로 자른다.
- text: 두부샌드를 김 오른 찜기에서 15분 정도 찐다.
- text: 완두콩드레싱과 새싹채소를 올려 마무리한다.
