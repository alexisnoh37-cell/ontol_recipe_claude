steps:
- text: 무, 청고추, 미나리, 대파는 먹기 좋게 썰어준다.
- text: 돼지머리는 냉수에 데친다. 냉수일 때부터 돼지머리를 넣어야 물이 끓어오르면 불순물이 제거된다.
- text: 일본 된장을 풀어 체에 걸러준다.
- text: 돼지머리를 살짝 졸여준다.
- text: 냄비에 국물을 끓여주다가 채소를 넣어 끓인다.
- text: 국물에 우동면을 데쳐낸 뒤 완성한다.
