steps:
- text: 물 1컵 반에 국멸치와 건다시마를 넣어 멸치다시마국물을 만든다.
- text: 국물을 우린 다시마는 채썬다.
- text: 느타리버섯은 끓는 물에 데친 후 찢는다.
- text: 감자와 두부는 3~4cm 가량으로 채를 썰고 홍고추와 대파는 어슷썬다.
- text: 멸치다시마국물 1컵에 감자를 넣고 끓인 뒤 느타리버섯을 넣어 한소끔 끓이고 두부, 파, 다진 마늘, 홍고추를 넣고 소금으로 간 한다.
- text: 채 썬 다시마를 고명으로 얹는다
