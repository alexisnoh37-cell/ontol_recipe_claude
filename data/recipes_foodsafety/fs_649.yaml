steps:
- text: 닭가슴살은 포를 떠 넓게 편다.
- text: 포 뜬 닭가슴살에 소금, 후춧가루로 밑간을 한다.
- text: 당면은 따뜻한 물에 불려 건진 뒤 3cm 길이로 썬다.
- text: 부추는 송송 썰고 당근은 곱게 채썬다.
- text: 당면, 당근, 부추는 골고루 섞어 저염간장으로 간을 한다.
- text: 밑간이 된 닭가슴살에 ?번을 넣고 돌돌 말아 김이 오른 찜통에서 약 10분 정도 찐 뒤 한 김 식혀 썬다.
