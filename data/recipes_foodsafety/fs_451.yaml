steps:
- text: 닭날개는 끝을 잘라 뒤로 뒤집어 봉을 만든다.
- text: 오렌지즙과 레몬즙을 짜서 섞어 주고, 생강을 갈아 소창에 걸러 즙을 낸다.
- text: 닭봉(①)에 생강즙, 오렌지 ․ 레몬즙 (②)을 발라 숙성시킨 후 다시 카레 가루를 입힌다.
- text: 땅콩은 물기 없이 입자있게 다진다.
- text: 양파를 입자있게 다져 다진 땅콩과 마요네즈, 파슬리가루, 요거트를 넣고 골고루 섞어 소스를 만들어 놓는다.
- text: 카레가루를 입힌 닭봉은 튀김기름 170~180℃ 온도에서 약 3분 정도 튀겨 기름을 빼고, 접시에 어린잎을 담고 만들어 놓은 소스와 닭봉을 함께 제공 하여 완성한다.
