steps:
- text: 닭다리의 살만 발라내 4cm ? 1cm 크기로 썬다.
- text: 1에 소금, 후추로 밑간한 뒤 청주를 넣어 재운다.
- text: 포도알은 2등분하고 사과, 파인애플은 한 입 크기로 썬다.
