steps:
- text: 돼지고기를 차가운 물로 헹구고 냄비에 물(300g), 대파, 생강과 같이 넣고 끓여 돼지고기가 익으면 면포에 거른다.
- text: 냄비에 물(300g)을 넣어 끓으면 가다랑어포를 넣고 1분간 끓이고 불을 꺼 가다랑어포가 가라앉으면 면포에 거르고, 다시 물(300g)을 넣어 면포에 걸러낸 가다랑어포를 넣어 약한 불로 10분간 끓인 뒤 가다랑어포가 가라앉으면 면포에 거른다.
- text: 돼지고기 육수와 가다랑어포 육수를 섞은 뒤 200g을 따로 덜어 조림양념을 넣고 끓이다가 돼지고기를 넣고 조린다.
- text: 라면은 삶아 찬물에 헹궈 건지고, 쪽파는 송송 썬다.
- text: 육수를 뜨겁게 끓인 뒤 그릇에 라면사리와 함께 담고, 돼지고기조림, 쪽파를 올리고 팬에 남은 조림 소스를 끼얹어 마무리한다.
