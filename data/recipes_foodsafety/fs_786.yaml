steps:
- text: 반죽 재료를 섞어 라비올리 반죽을 만든 뒤 냉장고에 휴지 시킨다.
- text: 우유가 끓이다 레몬즙을 넣고 응어리가 생기면 면보에 걸러 응고시킨다.
- text: 우유가 차갑게 식으면 차이브와 파마산 치즈를 섞어 리코타치즈를 만든다.
- text: 냉장 휴지시킨 라비올리 반죽을 1mm두께로 민 뒤 4x4cm 크기로 잘라 리코타치즈로 속을 채워 끎는 물에 삶는다.
- text: 양파,당근,토마토은 슬라이스하고 셀러리와 마늘은 잘게 다져 냄비에 바질, 오레가노, 로즈마리, 물, 설탕과 함께 끓여 토마토소스를 만든다.
- text: 라비올리와 토마토소스를 곁들여낸다.
