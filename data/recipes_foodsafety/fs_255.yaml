steps:
- text: 검은콩을 불려 삶는다.
- text: 마늘은 편으로 썰고, 쪽파는 송송 썬다.
- text: 동태포는 물기를 제거한다.
- text: 믹서에 피시볼반죽 재료를 넣어 간 뒤 동그랗게 빚고 콩식용유(5g)를 두른 팬에 굴려가며 익힌다.
