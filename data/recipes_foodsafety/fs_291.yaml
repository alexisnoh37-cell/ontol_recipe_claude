steps:
- text: 감자는 깍둑 썰고, 애호박은 모양대로 썰고, 쪽파, 양파, 부추는 잘게 다진다.
- text: 두부는 으깨 물기를 제거하고, 대파는 송송 썰고, 고추는 어슷 썰고, 표고버섯은 먹기 좋은 크기로 썬다.
- text: 당면, 숙주는 끓는 물에 데친 뒤 다지고, 브로콜리는 끓는 물에 살짝 데친다.
- text: 볼에 돼지고기, 다진 마늘, 쪽파, 양파, 부추, 숙주, 당면, 두부를 넣은 뒤 녹말가루를 섞어 반죽해 동글 납작하게 빚어 완자를 만들어 팬에 노릇하게 굽는다.
- text: 물(300g)에 된장을 풀고 애호박과 감자, 표고버섯을 넣고 끓이다가 날콩가루를 넣은 뒤 청양고추, 완자를 넣고 조금 더 끓인다.
- text: 그릇에 브로콜리를 담고 국물을 부은 뒤 채 썬 대파와 고추를 얹어 마무리한다.
