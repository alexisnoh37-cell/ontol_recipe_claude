steps:
- text: 팬에 기름을 두르고 홍고추와 마늘을 향이 날 때까지 볶는다.
- text: 1에 달걀물을 넣고 달걀이 부드럽게 부풀어 오르도록 기다렸다가 반 정도 익었을 때 가볍게 젓는다.
- text: 2에 닭고기, 새우, 양파를 넣고 볶는다.
- text: 3에 준비된 스파게티면을 넣고 한 번 볶은 뒤 소야소스를 넣고 면에 간이 충분히 베이도록 볶는다.
- text: 면이 볶아지면 청경채, 방울토마토를 넣고 살짝 볶는다.
- text: 5에 차갑게 한 버터를 넣어 소스에 윤기와 농도가 나도록 한다.
