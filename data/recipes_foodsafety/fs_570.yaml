steps:
- text: 비트는 껍질을 벗겨 채 썬다.
- text: 양파를 얇게 채 썬 후 물에 담근 뒤 건져 물기를 뺀다.
- text: 비트와 오렌지에 절여진 연어를 얇게 슬라이스한다.
- text: 식용꽃과 새싹은 물에 담궈 싱싱함을 살리고 건져 물기를 뺀다.
- text: 새싹과 양파를 접시에 깔고 그 위에 연어를 올린다.
- text: 올리브오일, 식초, 소금 및 설탕을 잘 섞어서 만든 드레싱을 올리고 식용꽃으로 장식한다
