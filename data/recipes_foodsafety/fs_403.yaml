steps:
- text: 가지는 먹기 좋은 크기로 잘라서 간편 어간장에 절여준다.
- text: 다진 대파, 청홍고추, 양파는 송송 잘라준다.
- text: 절여진 가지를 꼭 짜서 수분을 제거해준다.
- text: 양념장에 가지와 준비된 채소를 버무려 준다.
- text: 완성된 가지김치는 2시간 정도 후에 숙성시켜 완성한다.
