steps:
- text: 양상추는 한입 크기로 찢고, 당근은 채 썰고, 방울토마토는 4등분한다.
- text: 끓는 물(2컵)에 닭가슴살을 넣어 10분간 익힌 뒤 건져 결대로 찢는다.
- text: 끓는 물(2컵)에 메밀면을 넣어 5분간 삶아 건진 뒤 찬물에 헹궈 체에 밭쳐 물기를 제거한다.
- text: 유자오리엔탈소스를 만든다.
- text: 그릇에 준비한 재료와 어린잎채소를 담고 유자오리엔탈소스를 뿌린다.
