steps:
- text: 연근은 얇게 3㎜ 정도의 두께로 썰어 홍초물에 담가 절인다.
- text: 미나리는 연근과 비슷한 길이로 썬다.
- text: 오렌지는 껍질은 얇게 벗겨 채 썰고, 과육부분은 반달 모양으로 2조각 썬다.
- text: 과육을 오렌지주스와 섞은 뒤 갈아 오렌지소스를 만든다.
- text: 팬에 차돌박이를 펼친 뒤 오렌지소스를 조금씩 넣으며 익힌다.
- text: 그릇에 연근초절임, 미나리, 어린잎채소, 차돌박이 순서로 담은 뒤 오렌지 껍질과 오렌지소스를 얹어 마무리한다.
