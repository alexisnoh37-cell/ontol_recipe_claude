steps:
- text: 버섯들은 잘 씻어 건진다.
- text: 팬에 식용유를 두르고 버섯을 넣어 175℃ 오븐에서 5분 가열한다.
- text: 소스 양념을 모두 섞어 끓인다.
- text: 오븐에 구운 버섯에 3의 소스를 뿌린다.
