- text: 오징어는 내장을 제거하고 깨끗하고 씻어낸다.
- text: 부추, 감자, 당근, 양파는 2cm 가량으로 곱게 채 썬다.
- text: '부침가루와 미숫가루를 3 : 1의 비율로 섞는다.'
