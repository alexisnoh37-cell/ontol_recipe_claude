steps:
- text: 청포묵은 4cm 길이로 썰어 참기름과 소금에 살짝 무쳐 준비한다.
- text: 달걀은 황백으로 나누어 각각 소금을 조금씩 넣어 섞어 지단을 부친다.
- text: 오이는 돌려 깎아 채 썰고 당근도 오이 길이로 채 썰고 고사리는 길에 맞게 다듬고, 표고버섯도 채를 썰어 준비한다.
- text: 소고기는 채를 썰어 파, 마늘, 참기름, 후춧가루를 넣어 양념한다.
- text: 팬에 기름을 두르고, 준비한 곁들임 채소(③)와 다진 소고기를 재료별로 따로 볶아 준비한다.
- text: 고추장에 콩가루를 섞고, 볶아진 소고기를 넣어 다시 볶아 고추장 소스를 준비하고, 쌀밥을 그릇에 담은 후 청포묵(①), 볶아 놓은 채소와 소고기(⑤)를 올리고, 마지막에 고추장소스를 올려 완성한다.
