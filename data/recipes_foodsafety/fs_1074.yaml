steps:
- text: 마늘은 입자있게 다진다.
- text: 닭가슴살, 당근, 가지, 양송이 버섯은 먹기 좋은 크기로 자른다.
- text: 팬에 기름을 두르고 마늘을 볶다가 가지, 당근, 양송이버섯 순으로 넣고 볶는다.
- text: 그린커리 페이스트를 넣고 볶는다.
- text: 4번에 레몬그라스, 물 한 컵과 코코넛밀크 2/3를 넣고 끓인다.
- text: 코코넛밀크로 농도를 조절하여 완성한다.
