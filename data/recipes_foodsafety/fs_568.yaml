steps:
- text: 새우는 내장을 제거 하고 껍질을 벗겨 깨끗이 씻는다.
- text: 다진 새우에 전분, 후춧가루, 달걀흰자 및 요리술을 섞는다.
- text: 반죽새우를 잘 치대어 완자로 만든 후 치킨 육수에 넣고 끓인다
- text: 청경채는 깨끗이 씻어 반으로 길게 가른다.
- text: 달걀은 황백으로 나눠 지단을 부쳐 마름모꼴로 썬다.
- text: 완자가 익으면 물 녹말을 한 수저 넣고 청경채를 넣고 한소끔 끓인 뒤 그릇에 담고 황백지단을 올린다.
