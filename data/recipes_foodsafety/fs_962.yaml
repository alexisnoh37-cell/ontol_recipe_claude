steps:
- text: 도미에는 소금과 후추로 밑간을 하고 마늘, 파슬리는 다진다.
- text: 버터를 두른 팬에 다진 마늘을 넣고 마늘 향을 낸 버터물을 만든다.
- text: 2에 빵가루를 섞어 믹싱볼로 옮겨 담는다.
- text: 3에 다진 파슬리, 레몬주스, 레몬제스트, 소금, 후추를 넣고 고무주걱으로 잘 섞는다.
- text: 도미를 양념하고 도미위에 4을 얹는다.
- text: 5를 오븐에 굽는다.
