steps:
- text: 팽이버섯은 밑동을 제거하고 4cm 길이로 자른다.
- text: 청경채는 겉잎을 떼어낸 뒤 반으로 가른 뒤 팽이버섯과 같은 길이로 자른다.
- text: 썰어 놓은 팽이버섯과 청경채를 끓는 물에 데친다.
- text: 기름을 두른 팬에 팽이버섯과 청경채를 볶는다.
- text: 물 전분을 넣어 농도를 맞춘다.
- text: 참기름을 뿌려 완성한다.
