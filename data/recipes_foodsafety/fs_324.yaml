steps:
- text: 바지락은 볶은 소금에 담가 해감을 시켜준다.
- text: 물 400g에 저염 된장과 바지락을 넣어 국물을 만들어준다.
- text: 시금치 는 데 친 후 물기를 제거해 송송 다져준다.
- text: 당근, 양파와 청홍고추는 채 썰고 애호박과 감자는 반달모양으로 썰어준다.
- text: 다진 시금치와 밀가루를 이용해 완자를 만들어준다.
- text: 만들어진 국물에 옹심이를 넣어 끓여주고 나머지 채소를 넣어 완성한다.
