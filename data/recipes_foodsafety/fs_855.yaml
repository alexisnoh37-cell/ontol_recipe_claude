steps:
- text: 양송이버섯과 표고버섯은 얇게 썰고 애느타리버섯은 잘게 찢어 놓는다.
- text: 썰어놓은 돼지고기는 후춧가루와 밀가루로 밑간한다.
- text: 가열된 팬에 식용유를 넣고 고기를 굽는다.
- text: 고기를 한쪽으로 밀어두고 버섯들을 넣어 볶다가 화이트와인과 물을 넣고 끓인다. 반쯤 졸아지면 고기를 꺼낸다.
- text: 팬에 버터를 넣어 소스의 농도를 맞추고 다진 파슬리를 뿌려 소스를 완성한다.
- text: 고기에 소스를 얹어 낸다.
