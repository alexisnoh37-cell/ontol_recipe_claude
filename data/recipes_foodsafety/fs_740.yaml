ingredients:
- ingredient: laver
  raw_text: 물파래 5g
  role: sub
- ingredient: soybean
  raw_text: 노란콩 25g(불린것 52g)
  role: sub
- ingredient: wheat_flour
  raw_text: 우리밀가루 10g
  role: sub
- ingredient: cooking_oil
  raw_text: 현미유 5g
