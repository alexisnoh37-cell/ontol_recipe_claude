steps:
- text: 물파래는 씻어 체에 걸러 물기를 제거하고 잘게 썬다.
- text: 물에 5시간정도 불린 노란콩은 물 반컵을 넣고 약 10분가량 삶아 건져 믹서에 곱게 간다.
- text: 파는 다지고 홍고추는 어슷썰기 한다.
- text: 밀가루에 1,2와 물 20g을 넣어 반죽을 한다.
- text: 팬에 현미유를 두르고 반죽을 떠서 지름 8cm 가량의 크기로 동그랗게 부치면서 윗면에 홍고추로 장식한다.
- text: 간장, 파, 식초, 통깨를 넣고 초간장을 만들어 물파래콩전과 곁들인다.
