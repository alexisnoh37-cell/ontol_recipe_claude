steps:
- text: 키친타월을 이용해 돼지고기의 핏물을 뺀다.
- text: 돼지고기에 칼집을 내준다.
- text: 칼집 낸 돼지고기에 올리브유, 후추를 뿌려 재워둔다.
- text: 수박의 씨를 빼고 살만 발라 믹서에 간다.
