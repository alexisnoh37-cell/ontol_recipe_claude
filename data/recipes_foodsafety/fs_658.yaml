steps:
- text: 쌀은 깨끗이 씻어 30분 정도 불린 뒤 고슬고슬하게 밥을 짓는다.
- text: 취나물과 참나물은 끓는 물에 소금을 넣고 데쳐 헹군다.
- text: 곤드레나물은 충분히 불려 삶아 헹군다.
- text: 유부는 끓는 물에 살짝 데쳐 기름기를 제거 하고 반으로 자른다.
- text: 식초, 설탕, 소금을 섞어 촛물을 만든다.
- text: 촛물을 밥에 섞고 준비한 나물을 다져 골고루 섞고 데친 유부에 넣고 초밥을 만들어 접시에 담은 뒤 나물과 토마토를 올린다.
