steps:
- text: 아귀는 얇게 포를 뜬다.
- text: 새우를 다져 아귀포 안에 채워 넣은 뒤 데친 미나리로 묶는다.
- text: 냄비에 간장소스, 아귀, 아귀찜양념을 넣고 약한 불에서 끓인다.
- text: 아귀가 익으면 고추를 어슷 썰어 올린 뒤 살짝 더 익힌다.
- text: 콩나물은 끓는 물에 데친 뒤 참기름, 참깨를 넣고 무친다.
- text: 아귀찜에 콩나물무침을 곁들여 마무리한다.
