steps:
- text: 식빵은 가장 자리를 잘라 밀대를 이용 하여 얇게 밀어 준비한다.
- text: 감자는 삶은 뒤 곱게 으깨어 올리고당을 넣고 골고루 섞는다.
- text: 달걀은 약 13분 정도 삶아 껍질을 벗기고, 반으로 갈라 썰어놓는다.
- text: 당근과 양파 오이도 얇게 썰어놓는다.
- text: 토마토는 포를 떠서 준비한다.
- text: 으깬 감자(②)에 준비한 달걀(③)과 채소(④)를 넣고 소금을 약간 넣은 뒤 골고루 섞어, 밀어 놓은 식빵에 토마토, 치즈, 양상추와 함께 넣어 돌돌 말아 완성한다.
