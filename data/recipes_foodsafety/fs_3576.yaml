steps:
- text: 양상추, 적채는 채 썰어 찬물에 담근다. 마요네즈, 홀그레인 머스터드, 파인애플청을 섞어 샐러드 드레싱을 만든다.
- text: 데친 느타리버섯, 만가닥버섯과 불린 건표고버섯의 물기를 제거하고 깍둑 썰기하여 예열한 팬에 볶고 진간장,참기름(3g)으로 간한다.
- text: 라이스페이퍼에 올리고 한입 크기로 싼다. 예열한 팬에 식용유(10g)를 두르고 굽는다.
- text: 물기를 제거한 양상추, 적채를 라이스페이퍼에 올리고 싼 뒤, 감태 위에 올려 돌돌 말고 한입 크기로 썬다.
- text: 예열한 팬에 식용유(10g)를 두르고 다진 청고추, 홍고추, 대파, 마늘을 볶아 향을 내고 굴 소스, 올리고당, 식초, 참기름(3g)을 넣어 깐풍 소스를 만든다.
- text: 접시에 담고 샐러드 드레싱과 깐풍 소스를 곁들여 마무리한다.
