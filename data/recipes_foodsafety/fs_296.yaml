steps:
- text: 곤약을 식촛물에 살짝 데친 뒤 나머지 반죽 재료와 함께 믹서에 넣고 갈아 치댄다.
- text: 스테이크 반죽을 동글납작하게 빚고 팬에 식용유를 살짝 둘러 구운 뒤 140℃로 달군 오븐에서 30분간 굽는다.
- text: 새송이버섯, 가지, 브로콜리, 양파, 파프리카, 방울토마토, 아스파라거스는 올리브유에 구워 준비한다.
- text: 팬에 유자청과 저염간장, 물을 넣고 끓여 유자청간장소스를 만든다.
- text: 접시에 곤약함박스테이크를 담고 어린잎채소를 올리고, 구운 채소와 유자청간장소스를 곁들여 마무리한다.
