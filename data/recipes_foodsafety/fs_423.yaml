steps:
- text: 주꾸미, 전복, 칵테일새우는 각각 물에 데쳐서 준비한다.
- text: 이때 데치고 남은 물을 국물에 이용해주고 여기에 청주를 넣어준다.
- text: 양파, 청고추, 홍고추는 먹기좋게 썰어준다.
- text: 계란을 황백으로 부쳐서 먹기좋게 썰어준다.
- text: 만들어진 국물에 거피한 들깨가루와 국물재료를 넣어 끓여서 준비한다.
- text: 준비된 재료를 냄비에 넣고 국물을 부어 끓여 완성한다.
