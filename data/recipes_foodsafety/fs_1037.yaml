steps:
- text: 솔을 이용해 게를 깨끗이 씻어 물기를 뺀 뒤 등딱지를 떼고 먹기 좋은 크기로 토막내 소금, 후춧가루, 청주로 밑간 한다.
- text: 전분을 묻힌 뒤 찜통에 찐다.
- text: 마늘, 생강은 얇게 편썰고 실파는 3cm 길이로 썰고 건 고추는 어슷하게 썬다.
- text: 팬에 기름을 두르고 마늘, 생강, 건고추를 넣고 볶는다.
- text: 매콤한 향이 나면 양념장을 넣고 살짝 볶으면서 찐 게를 넣어 맛이 베이도록 뒤적이며 볶는다.
- text: 마지막에 실파를 넣고 참기름으로 향을 낸다.
