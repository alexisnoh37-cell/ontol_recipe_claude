steps:
- text: 카레가루를 미지근한 물에 개어 쌀을 넣고 밥을 한다.
- text: 묵은지는 헹궈서 다지고 양파도 다진다.
- text: 참치의 기름을 빼고 묵은지, 양파를 넣고 마요네즈에 버무린다.
- text: 3번을 넣고 카레밥으로 주먹밥을 만든다.
- text: 주먹밥을 배 모양으로 만든다.
- text: 애호박과 가지 껍질로 배 꼭지와 잎을 만들어 장식한다.
