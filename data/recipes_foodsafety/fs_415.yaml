steps:
- text: 무는 모양 틀로 자른다.
- text: 무와 연근을 손질해 놓은 후 소금에 살짝 절여준다.
- text: 사과와 배는 먹기 좋게 잘라 레몬즙에 뿌려 갈변을 막아준다.
- text: 물에 청양고추를 넣어 끓여서 식힌다.
- text: 식힌 물에 국물 재료를 넣어 국물을 만든다.
- text: 만들어진 국물에 절여진 무, 연근, 사과, 배를 넣어주어 완성한다. 24시간 이후부터 시원하게 먹는다.
