steps:
- text: 연어는 얇게 모양을 살려 슬라이스 한 후 정종에 소금을 섞어 분무기에 넣어 냉장고에 넣어둔다.
- text: 건조된 방울토마토는 올리브오일과 후추로 양념하여 사용한다.
- text: 양상추는 먹기 좋은 크기로 뜯어 어린잎과 함께 찬물에 담가 물기를 제거한 후 사용한다.
- text: 유자청과 감식초는 함께 섞어 믹서에 갈아 드레싱소스를 완성한다.
- text: 양파는 모양을 살려 얇게 슬라이스 하여 찬물에 담가 물기를 제거한 뒤 사용한다.
- text: 샐러드 접시에 준비된 모든 채소를 담고, 연어는 장미 모양으로 접어서 보기좋게 담아 드레싱 소스를 곁들여 완성한다.
