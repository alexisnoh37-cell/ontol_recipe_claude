steps:
- text: 다시마를 물에 씻어 낸 후 찬물에 우려낸다.
- text: 시금치와 비트는 다시마 우린물을 넣고 각각 갈아 준다.
- text: 계란과 우유를 섞어 계란물을 만든다.
- text: 계란물을 3등분 하여 나눠 담아 놓는다.
- text: 나눠 놓은 계란물에 시금치, 비트를 각각 섞는다.
- text: 3가지 계란물을 순서대로 쪄 내고, 애플민트로 장식한다.
