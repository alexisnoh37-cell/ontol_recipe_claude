steps:
- text: 돼지고기는 깨끗이 손질한 뒤 잘게다진다.
- text: 두부는 1cm 정사각형 모양으로 썬다
- text: 토마토는 껍질과 씨를 제거한 뒤 두부와 같은 크기로 썬다.
- text: 기름을 두른 팬에 파와 생강을 넣고 볶아 향이 나면 1을 넣고 볶은 뒤 따로 담아둔다.
- text: 기름을 두른 팬에 토마토, 두부, 고기를 넣고 볶다가 육수를 자작하게 부은 뒤 간장, 소금으로 간을 한다.
- text: 소스가 졸아들면 두부를 넣고 물 전분을 넣어 소스 농도를 맞춘다.
