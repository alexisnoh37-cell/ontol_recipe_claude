steps:
- text: 닭다리는 기름기를 제거하고 냄비에 물 3컵 반을 부어 통마늘과 삶아 육수를 만든다.
- text: 삶은 마늘을 체에 걸러 으깬 뒤 다시 육수에 넣는다.
- text: 닭 육수 2컵 반에 찬밥을 넣고 밥알이 무르도록 끓인다.
- text: 삶은 닭다리 살을 발라 잘게 찢어 넣는다.
- text: 감자, 양파, 당근, 부추는 잘게 다진다.
- text: 4에 5를 넣고 끓인 뒤 소금, 후춧가루로 간 한다.
