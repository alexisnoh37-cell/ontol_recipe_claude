steps:
- text: 닭가슴살에 로즈마리, 후춧가루를 넣고, 15분 정도 우유에 담그어 놓는다.
- text: 당근과 감자는 사각으로 깎아 양 모서리를 칼로 다시 다듬어 주사위 모양으로 둥그스럼하게 만들어 준비한다.
- text: 냄비에 물이 끓으면, 브로컬리와 깎아 놓은 당근과 감자를 데쳐 준비한다.
- text: 양송이는 껍질을 제거하고 모양 그대로 편으로 썰어 준비하고, 토마토와 마늘은 잘게 다져 냄비에 버터를 두르고 볶다가 케첩을 넣어준다.
- text: 볶아지는 4번에 썰어 놓은 양송이와 생크림을 넣고, 다시 살짝 한 번 더 볶아준다.
- text: 팬에 버터를 녹이고, 재워놓은 닭가슴살 (①)을 속이 익도록 노릇노릇 하게 익혀 접시에 담고, 만들어 놓은 감자와 당근, 브로컬리로 장식을 하고, 소스를 함께 올려 완성한다.
