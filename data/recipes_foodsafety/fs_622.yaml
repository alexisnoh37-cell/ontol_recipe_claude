steps:
- text: 쌀과 강황쌀은 깨끗이 씻어 30분 정도 불린 뒤 밥을 짓는다.
- text: 고사리는 불린 뒤 삶고 잘게 썰어 저염간장에 볶는다.
- text: 두부, 당근은 채썰고, 애호박은 반달모양으로 썰어 볶는다.
- text: 숙주는 꼬리를 떼고 살짝 데친다.
- text: 호박잎은 끓는 물에 데친다.
- text: 고추장, 올리고당, 갈은 파인애플을 섞어 소스를 만들고, 데친 호박잎에 볶은 강황밥과 두부, 야채를 넣고 고추장소스를 넣고 둥글게 말아 완성한다.
