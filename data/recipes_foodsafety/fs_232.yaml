steps:
- text: 현미는 1시간 정도, 멥쌀은 30분 정도 각각 불린 뒤 섞는다.
- text: 쑥갓과 달래는 줄기부분과 잎으로 나누어 1㎝ 길이로 썬다.
- text: 쑥갓과 달래의 줄기부분은 불린 쌀과 함께 냄비에 넣고 밥물을 맞춰 센 불에서 끓어오르면 중약 불로 줄여 밥을 15분간 짓는다.
- text: 약한 불로 줄여 밥을 뜸 들인다.
- text: 다시마육수를 제외한 두부 양념장 재료를 믹서에 곱게 갈아 다시마 육수, 남겨둔 나물의 잎을 팬에 넣어 끓여 두부장을 만든다
- text: 나물밥에 두부장을 곁들여 마무리한다.
