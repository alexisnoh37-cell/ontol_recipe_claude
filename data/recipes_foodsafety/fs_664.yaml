steps:
- text: 광어는 비늘을 제거하고 포를 뜬다.
- text: 손질된 광어에 레몬과 청주를 뿌려 숙성 시킨다.
- text: 저염간장에 레몬즙, 와사비, 발사믹소스를 넣고 소스를 만든다.
- text: 당근, 애호박은 쿠퍼로 동글동글하게 깎는다.
- text: 당근, 애호박, 콜리플라워는 김이 오른 찜통에 5분 정도 쪄 낸다.
- text: 가지와 파프리카는 팬에 굽고, 숙성시킨 광어도 팬에 구워 접시에 담고 쪄 낸 야채를 담은 뒤 소스를 올린다.
