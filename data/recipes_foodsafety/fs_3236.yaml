steps:
- text: 단호박은 껍질을 벗겨 찜기에 넣어 5분간 찐 뒤 으깬다.
- text: 감자와 표고버섯은 채 썰고, 불린 곤드레나물은 잘게 썬다.
- text: 냄비에 불린 쌀, 채 썬 감자와 표고버섯, 불린 곤드레나물, 물(20㎖)을 넣어 센 불로 5분 30초간 끓인다.
- text: 오븐 팬에 감자곤드레밥을 얇게 편 뒤 180℃로 예열한 오븐에 구워 누룽지를 만든다.
- text: 으깬 단호박에 건과일과 볶은 호두, 볶은 아몬드 슬라이스를 넣어 고루 섞는다.
- text: 그릇에 건과일과 견과류를 섞은 단호박을 예쁘게 담고 곤드레 누룽지와 라즈베리, 요거트를 올린다.
