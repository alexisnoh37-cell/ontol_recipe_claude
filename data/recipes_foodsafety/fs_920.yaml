steps:
- text: 불린 쌀은 믹서나 절구를 이용하여 간다.
- text: 참치 살, 표고버섯, 무, 양파는 곱게 다진다.
- text: 팬에 참기름을 두르고 1과 다진 표고버섯, 무, 양파를 볶는다.
- text: 3에 물을 넣어 무른 밥을 짓는다.
- text: 4의 밥이 끓어오르면 다진 참치 살을 넣고 저어가며 끓인다.
- text: 참치 살이 다 익으면 통깨를 뿌린다.
