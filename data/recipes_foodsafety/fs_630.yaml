steps:
- text: 뼈갈비는 찬물에 담궈 핏물을 뺀다.
- text: 핏물을 뺀 뼈갈비를 건져 냄비에 넣고 끓여 육수를 만든다
- text: 쑥은 데치고, 당근, 감자는 한입크기로 썰고, 홍고추, 청양고추는 어슷썬다.
- text: 데친 쑥은 곱게 다진다.
- text: 찹쌀가루에 다진 쑥을 넣고 뜨거운 물로 익반죽 한 뒤 비닐에 담아 숙성시킨다.
- text: 숙성된 찹쌀반죽을 작게 잘라 가운데를 비벼 조랭이 쑥 떡을 만들고, 끓인 육수에 준비 한 야채와 함께 한소끔 끓인다.
