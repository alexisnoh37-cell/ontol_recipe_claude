steps:
- text: 감자는 껍질을 벗긴 후 곱게 채썰어 식초를 살짝 탄 물에 담가 갈변을 방지한다.
- text: 달걀흰자에 밀가루, 베이킹 파우더를 넣어 덩어리 지지 않게 푼다.
- text: 마늘가루, 후춧가루를 넣어 잘 섞어 반죽을 만든다.
- text: 썰어 둔 감자를 체에 받쳐 물기를 뺀 후 키친타올을 이용해 완전히 물기를 제거한 후 만들어 둔 반죽에 넣어 섞는다.
- text: 팬에 식용유를 넣고 반죽을 부어 지름 6cm 정도로 둥글게 편 뒤 양면을 노릇하게 굽는다.
- text: 체리, 사과, 청포도 등의 제철 과일을 설탕물에 졸여 팬케익에 곁들인다.
