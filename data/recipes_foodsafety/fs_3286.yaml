steps:
- text: 브로콜리는 윗동만 분리해 다지고, 양파, 파프리카, 청양고추는 잘게 다지고, 쪽파는 송송 썰고, 레몬은 2등분한다.
- text: 블랙타이거새우는 깨끗하게 씻은 뒤 머리를 제거한다.
- text: 약한 불로 달군 팬에 식용유를 두르고, 다진 마늘을 넣어 튀기듯 볶은 뒤 양파를 넣어 볶는다.
- text: 손질한 블랙타이거새우와 버터를 넣은 뒤 새우의 색이 변할 때까지 볶고, 다진 파프리카, 청양고추, 브로콜리를 넣어 2분간 볶는다.
- text: 그릇에 현미밥을 담고, 볶은 블랙타이거 새우와 국물을 골고루 뿌린다.
- text: 송송 썬 쪽파와 레몬을 올려 마무리한다.
