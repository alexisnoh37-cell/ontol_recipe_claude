steps:
- text: 닭은 먹기 좋은 크기로 잘라 준비한다.
- text: 토막 낸 닭 에 생강즙과 소주를 넣어 숙성한다.
- text: 양파, 당근은 얇게 썰고, 양배추는 깍뚝 썰고, 깻잎은 4등분하여 잘라놓는다.
- text: 작은 깍둑썰기로 자른 토마토와 고구마에 토마토소스, 마늘, 고춧가루, 고추장, 매실청을 넣어 골고루 섞는다.
- text: 닭을 먼저 냄비에 볶는다.
- text: 볶아지는 닭에 만들어 놓은 소스를 넣고, 볶다가 준비한 채소를 넣어 한 번 더 볶아 완성한다.
