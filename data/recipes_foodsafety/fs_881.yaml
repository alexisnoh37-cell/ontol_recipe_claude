steps:
- text: 낙지는 밀가루를 넣어 주물러 미끈거리는 것을 씻어내고 흐르는 물에 헹군다.
- text: 끓는 물에 데쳐 한 입 크기로 썬다.
- text: 오이는 가운데 씨를 잘라낸 뒤 눈썹 모양으로 썰고 홍피망과 미나리는 5cm 길이로 썬다.
- text: 배는 굵게 채 썰고 밤은 얇게 썬다.
- text: 잣은 곱게 다져 분마기에 넣고 배즙을 조금씩 넣어가며 뽀얗게 즙을 내고 레몬즙과 흰후춧가루, 소금을 넣어준다.
- text: 준비된 재료를 잣소스에 버무린다.
