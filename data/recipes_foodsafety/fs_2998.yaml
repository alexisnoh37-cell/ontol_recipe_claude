steps:
- text: 유자청을 잘게 다진 뒤 저염간장, 식초, 올리브유, 레몬즙을 섞어 드레싱을 만든다.
- text: 두부는 2cm 크기로 깍둑썰기 한다.
- text: 까망베르치즈도 깍둑썰기 한다.
- text: 새싹채소는 세척 후 건져 물기를 제거한다.
- text: 그릇에 새싹채소를 담고 두부, 치즈를 얹는다.
- text: 드레싱과 아몬드를 뿌린다.
