steps:
- text: 닭가슴살을 슬라이스하여 소금, 후춧가루로 밑간을 하고 다진 생강을 발라 잡냄새를 제거한다.
- text: 밑간한 닭가슴살에 찹쌀가루를 묻힌다.
- text: 녹말, 식용유, 물을 섞어 반죽을 만든다.
- text: 2번에 반죽을 골고루 묻혀 170℃ 기름에서 튀긴다.
- text: 식초와 유자청을 넣고 끓인 후 간장으로 간을 맞추고 전분을 풀어 농도를 맞춘다.
- text: 튀긴 꿔바로우를 소스에 넣고 버무린다.
