steps:
- text: 고구마는 찜통에 찐 후 껍질을 제거하고 으깨 생크림, 꿀을 넣고 섞는다.
- text: 새우살, 파프리카, 양파는 잘게 다진 뒤 팬에 버터를 두르고 볶는다.
- text: 볼에 1번과 2번을 넣고 서로 잘 섞이도록 치댄다.
- text: 3번을 한입 크기로 떼어낸 후 가운데 모짜렐라 치즈를 넣고 공모양으로 만든다.
- text: 크로켓에 밀가루, 달걀물, 빵가루 순으로 묻힌다.
- text: 180℃의 기름에 크로켓을 튀긴다.
