steps:
- text: 토마토홀과 토마토는 송송 다져준다.
- text: 다진양파, 다진마늘과 다진토마토를 섞어 소스를 볶아서 신맛을 날려준다.
- text: 푸실리는 삶아 오일에 버무려주고 볶아준다.
- text: 양파, 애호박, 가지, 파프리카를 먹기 좋게 잘라 팬에 볶아준다.
- text: 접시에 볶아진 채소와 파스타면을 서로 다시 볶아준다.
- text: 접시에 푸슬리를 올려 셋팅하고 토마토소스를 뿌려주고 치즈가루를 뿌려 완성한다.
