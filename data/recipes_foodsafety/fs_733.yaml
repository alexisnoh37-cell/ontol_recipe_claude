steps:
- text: 감자는 익기 쉽도록 토막 내고 완두콩과 옥수수알과 함께 김이 오른 찜통에 10~15분간 찐다.
- text: 찐 감자를 으깬다.
- text: 달걀은 삶아 흰자는 굵게 다지고 노른자는 체에 곱게 내린다.
- text: 파프리카는 옥수수알 크기로 썬다.
- text: 2에 완두콩, 옥수수, 파프리카, 달걀 흰자를 넣어 섞는다.
- text: 마요네즈, 호상요구르트, 달걀노른자, 소금을 넣어 샐러드드레싱을 만들어 5와 곁들인다.
