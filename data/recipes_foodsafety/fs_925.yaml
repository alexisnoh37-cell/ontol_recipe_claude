steps:
- text: 초대리 재료를 분량대로 섞어 설탕, 소금이 녹을 정도로만 가열해 초대리를 만들어 고슬고슬하게 지은 따듯한 밥에 넣고 섞어 식힌다.
- text: 달걀은 삶아 흰자와 노른자로 따로 체에 내려 가루를 만들어 놓는다.
- text: 햄, 치즈는 원하는 모양틀로 찍는다.
- text: 기름을 제거한 참치에 다진 양파와 셀러리, 마요네즈를 섞는다.
- text: 칵테일 새우는 데쳐서 식힌다.
- text: 모양틀에 밥을 찍어내고 그 위에 준비한 재료들을 올려 완성한다.
