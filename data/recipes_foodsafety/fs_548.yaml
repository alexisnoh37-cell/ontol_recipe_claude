steps:
- text: 배는 껍질을 벗겨 배즙을 갈아 준비한다.
- text: 소고기에 배즙과 정종을 넣어 버무려 숙성시킨다.
- text: 양배추와 양파, 깻잎, 표고버섯은 채 썰고 대파와 당근은 납작하게 5cm 길이로 썰고 청·홍고추는 어슷 썰어 준비한다.
- text: 간장과 올리고당, 참기름, 다진마늘, 후춧가루를 넣어 소스를 만든다.
- text: 만든 소스를 소불고기에 넣어 2차 숙성을 시킨다.
- text: 팬에 고기를 볶고 별도로 채소를 볶은 뒤 씨를 빼고 얇게 썬 대추와 통깨를 얹어 접시에 함께 담아 완성한다.
