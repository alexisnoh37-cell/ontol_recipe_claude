steps:
- text: 버섯은 채썬다.
- text: 끓는 물에 채썰어 놓은 버섯을 데쳐낸다.
- text: 다시마는 물에 담궈 다시마 물을 만들어 식초와 설탕 저염간장을 넣고 골고루 섞어 소스를 만들어 놓는다.
- text: 미나리는 끓는 물에 소금을 넣고 데친다.
- text: 배추는 끓는 물에 양배추와 함께 데쳐 찬물에 헹구고 양배추는 채 썬다.
- text: 김발에 데친 배추를 놓고 표고버섯, 만송이버섯, 미나리, 양배추 채를 넣고 돌돌 말아 먹기 좋게 썰어 접시에 담은 뒤 소스를 담는다.
