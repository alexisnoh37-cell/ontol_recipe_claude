steps:
- text: 배추는 잎을 떼서 크게 썬 다음 3cm 길이로 결대로 찢는다.
- text: 기름을 넣어 가열 된 팬에 배추를 넣고 살짝 볶아 낸 후 수분을 제거한다.
- text: 달걀을 풀어 팬에 익힌다.
- text: 채 썬 돼지고기를 팬에 볶고 파, 다진 생강, 간장을 넣고 다시 볶는다.
- text: 4에 목이버섯, 배추, 달걀을 넣고 잘 섞는다.
- text: 5에 육수, 소금, 물전분을 넣는다.
