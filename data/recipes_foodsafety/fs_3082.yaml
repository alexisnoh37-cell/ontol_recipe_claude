steps:
- text: 닭고기는 부위별로 토막 내어 끓는 물에 살짝 데친다.
- text: 데친 닭고기에 양념 재료를 섞어 30분 이상 재운다.
- text: 무, 당근, 양파는 사각 썰고, 고추는 송송 썬다.
- text: 무청시래기는 끓는 물에 한 번 더 살짝 데치고, 6cm 길이로 썬다.
- text: 냄비에 물(30g)과 닭고기, 시래기를 넣고, 청홍고추를 제외한 손질한 채소를 넣어 조린다.
- text: 홍고추와 청고추를 올려 마무리한다.
