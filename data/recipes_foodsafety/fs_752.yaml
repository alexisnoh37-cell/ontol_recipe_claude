steps:
- text: 오징어는 다리를 떼 내서 내장과 눈을 제거하고, 데친 취나물은 물기를 짜내고 다진다.
- text: 오곡밥에 다진 취나물, 간장, 마늘, 후추, 참기름을 넣어 고루 섞는다.
- text: 오징어 몸통에 양념한 밥을 넣어 이쑤시개로 끝을 고정시킨다.
- text: 김이 오른 찜통에 오징어를 넣고 3분간 쪄낸다.
- text: 소스 재료를 섞어 취나물된장소스를 만든다.
- text: 쪄낸 오징어순대를 썰어 접시에 담고 소스를 곁들여 낸다.
