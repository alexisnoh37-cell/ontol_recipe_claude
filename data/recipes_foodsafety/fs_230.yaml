steps:
- text: 닭고기 삶는 재료를 물(100g)에 넣어 끓이다가 닭가슴살을 넣고 삶아 한입 크기로 썬다.
- text: 양배추는 곱게 채 썰고, 청포묵은 먹기 좋은 크기로 썬다.
- text: 숙주는 끓는 물에 데쳐 물기를 뺀다
- text: 비빔소스를 만든다.
- text: 쌀에 물을 붓고 밥을 짓는다.
- text: 밥 위에 닭가슴살, 양배추, 청포묵, 숙주, 달걀지단, 무순을 담아 마무리한다.
