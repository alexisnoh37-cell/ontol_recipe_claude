steps:
- text: 찹쌀과 현미는 깨끗이 씻어 30분 이상 충분히 불려 밥을 지어, 둥글둥글하게 패티를 만들어 놓는다.
- text: 마늘과 양파는 곱게 다져 볶아 준비 한다.
- text: 다진고기에 볶은 양파와 마늘, 빵가루, 생크림, 으깬두부, 소금, 후춧가루를 넣어 골고루 섞는다.
- text: 섞어진 소고기를 둥글게 패티를 만들어 놓는다.
- text: 토마토는 편으로 썰어 준비한다.
- text: 팬에 올리브 오일과 버터를 넣고 팬이 따끈하게 달궈지면, 밥패티를 먼저 굽고, 소고기 패티를 구운 후, 밥패티에 마요네즈를 살짝 바르고, 치즈와 토마토를 올리고, 구운 소고기패티를 올려 다시 밥패티를 덮어 완성한다.
