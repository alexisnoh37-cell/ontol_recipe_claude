steps:
- text: 조갯살은 연한 소금물로 헹구어 물기를 뺀다.
- text: 부추는 2~3cm 길이로 썰고 당근은 짧게 채 썬다.
- text: 냄비에 분량의 조림장 재료를 전부 넣고 한소큼 끓어 오르면 조갯살을 넣어 살짝 데쳐 건져둔다.
- text: 3의 냄비에 물 3컵을 더 넣고 당근을 넣어 조림장 분량이 2/3정도가 될 때까지 졸인다.
- text: 다른 팬에 기름을 두르지 않고 콩비지를 넣어 보슬보슬해질 때 까지 볶는다.
- text: 5에 4를 전부 붓고 채썬 부추와 데친 조갯살도 넣어 간이 고루 들도록 저어가며 볶는다.
