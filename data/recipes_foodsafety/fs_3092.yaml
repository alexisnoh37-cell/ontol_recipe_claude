steps:
- text: 당면은 물에 불리고, 물에 불린 당면과 가지, 부추, 양파를 다진다.
- text: 계란은 잘 풀어 둔다.
- text: 계란과 전처리한 야채, 후추를 넣고 골고루 섞는다.
- text: 기름 두른 팬에 반죽을 지름이 10cm되는 타원형 모양으로 올리고, 반쯤 익으면 접어 납작 만두 모양을 만든다.
- text: 토마토홀, 월계수잎, 함초소금을 끓여 소스를 만든다.
- text: 완성된 계란만두에 소스를 끼얹고 파슬리로 장식한다.
