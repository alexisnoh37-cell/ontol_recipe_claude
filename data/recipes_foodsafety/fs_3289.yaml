steps:
- text: 콜리플라워는 잘게 썰고, 양송이버섯과 양파는 3mm 두께로 채 썰고, 마늘(2쪽)은 납작 썬다.
- text: 믹서에 잘게 썬 콜리플라워, 무가당 두유, 물(1컵), 마늘(1쪽)을 넣어 곱게 갈아 콜리플라워 크림을 만든다.
- text: 중간 불로 달군 팬에 올리브유를 두른 뒤 다진 마늘을 볶고, 납작 썬 마늘, 양파, 양송이버섯을 넣어 양파가 숨이 죽을 때까지 볶는다.
- text: 콜리플라워 크림을 넣은 뒤 끓어오르면 강황가루와 두부면을 넣어 골고루 섞는다.
- text: 바질을 넣어 고루 섞고, 불을 끈 뒤 식초를 넣어 고루 섞는다.
- text: 그릇에 카레크림 두부면 파스타를 담고, 파슬리가루를 뿌려 마무리한다.
