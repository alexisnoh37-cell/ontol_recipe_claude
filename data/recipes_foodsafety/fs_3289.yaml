id: fs_3289
title: 카레크림 두부면 파스타
cuisine: 미분류
source: foodsafety
status: draft
confidence: low
note: '출처: 식품의약품안전처 식품안전나라 조리식품의 레시피 DB(COOKRCP01) 일련번호 3289. 요리종류 기타, 조리방법 볶기. 자동 변환: role(모두 sub)·cuisine·조리시간·난이도·맛은 검수 때 정함'
ingredients:
- ingredient: cauliflower
  raw_text: 콜리플라워(200g)
  role: sub
- ingredient: button_mushroom
  raw_text: 양송이버섯(2개)
  role: sub
- ingredient: onion
  raw_text: 양파(½개)
  role: sub
- ingredient: garlic
  raw_text: 마늘(3쪽)
  role: sub
- ingredient: soy_milk
  raw_text: 무가당 두유(2컵)
  role: sub
- ingredient: tofu
  raw_text: 두부면(1팩=100g)
  role: sub
- ingredient: basil
  raw_text: 바질(3장)
  role: sub
- ingredient: olive_oil
  raw_text: 올리브유(1Ts)
  role: sub
- ingredient: garlic
  raw_text: 다진 마늘(1ts)
  role: sub
- ingredient: turmeric_powder
  raw_text: 강황가루(2Ts)
  role: sub
