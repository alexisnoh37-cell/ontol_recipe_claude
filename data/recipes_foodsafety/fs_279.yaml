steps:
- text: 통조림 햄을 썰어 끓는 물에 데친다.
- text: 애호박은 반달모양으로 썰고, 두부는 도톰하게 썰고, 팽이버섯은 3등분하고, 청양고추는 어슷 썬다.
- text: 김치는 씻어서 잘게 썬다.
- text: 양념장을 만든다.
- text: 냄비에 물과 다시마를 넣고 살짝 끓여 육수를 만든다.
- text: 육수에 손질한 재료를 담고 양념장의 1/2 분량을 넣고 중간 불에 끓이다가 쑥갓과 남은 양념장을 넣고 약한 불에 조금 더 끓여 마무리한다.
