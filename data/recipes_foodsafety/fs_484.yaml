steps:
- text: 새송이와 느타리, 표고버섯은 먹기 좋은 형태로 썰어 준비한다.
- text: 썰어 놓은 버섯에 소금을 살짝 뿌려 놓는다.
- text: 소금 뿌린 버섯에 녹말가루와 달걀물을 넣고 골고루 섞는다.
- text: 오이, 당근, 양파, 키위는 작은 깍두기 모양으로 썰어 준비한다.
- text: 냄비에 저염간장에 설탕을 넣고 골고루 섞어 끓이다가, 물녹말을 풀어 농도를 맞추고 썰어놓은 오이, 당근, 양파를 넣어 소스를 만든다.
- text: 튀김기름의 온도가 약 170~180℃ 정도 올라오면 녹말옷을 입힌 버섯(③)을 재빠르게 튀겨 기름을 제거하고, 접시에 담아 소스(⑤)를 얹고 키위를 올려 완성 한다.
