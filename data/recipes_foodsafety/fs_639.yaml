steps:
- text: 찹쌀은 깨끗이 씻어 30분 정도 불린다
- text: 불린 찹쌀은 냄비에 넣고 질게 밥을 한다.
- text: 닭가슴살은 넓게 펴서 소금, 후춧가루를 뿌린다.
- text: 호박잎과 미나리는 끓는 물에 살짝 데치고, 대추는 돌려 깎아 씨를 제거하고 인삼은 뇌두를 제거한 뒤 채를 썰어둔다.
- text: 데친 호박잎에 닭 가슴살을 올린다.
- text: 닭 가슴살위에 찹쌀밥과 준비한 야채와 대추를 올려 돌돌 말아 질게 된 찹쌀밥에 넣고 약 20분 정도 더 쪄낸다.
