steps:
- text: 대추는 돌려 깍아 씨를 제거 하고 곱게 다진다.
- text: 다진 소고기와 돼지고기에 대추와 소금 후춧가루를 넣고 치댄다.
- text: 애호박과 단호박, 파프리카는 입자있게 썰어 ?에 넣고 잘 치댄다.
- text: 양송이는 편으로 썰어 팬에 익히고, 인삼을 뇌두를 자르고 깨끗이 씻어 팬에 볶아 잘게 썰어 ?에 넣는다.
- text: 재료가 골고루 섞인 떡갈비를 갈비 모양으로 만든다.
- text: 떡갈비를 팬에 굽고, 접시에 배춧잎을 깔고 익힌 양송이를 올리고 떡갈비를 담는다.
