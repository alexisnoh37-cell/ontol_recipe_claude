steps:
- text: 아욱 줄기 끝부분을 꺽어 손질한다.
- text: 손질한 아욱을 소금을 약간 넣은 물에 넣어 치대듯이 주무른다.
- text: 끓는 물에 아욱을 삶은 뒤 찬물에 헹궈 물기를 짠다.
- text: 아욱을 먹기 좋은 크기로 썬다.
- text: 마늘을 곱게 다진다.
- text: 아욱에 된장, 다진마늘, 참기름, 저염간장, 깨를 넣고 버무린다.
