steps:
- text: 고구마는 1cm의 주사위모양으로 썰어 놓는다.
- text: 물에 씻은 김치를 송송 썰어서 참기름을 두른 팬에 볶다가 마늘과 소금을 넣어 볶은 뒤 깨소긂으로 마무리한다.
- text: 냄비에 불린 쌀과 고구마, 볶은 김치를 넣고 고슬고슬하게 밥을 짓는다.
- text: 사과의 꼭지 부분을 자른 뒤 속을 파내고 밥을 채운다.
- text: 160℃로 예열된 오븐에 밥을 채운 사과를 넣고 사과가 익을 정도로 구워준다.
- text: 양념장 재료를 섞어 양념장을 만들고 밥과 곁들여 낸다.
