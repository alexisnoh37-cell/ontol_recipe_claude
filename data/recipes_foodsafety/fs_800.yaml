steps:
- text: 메밀가루, 달걀, 우유, 밀가루, 설탕을 믹서에 갈아 놓는다.
- text: 양송이버섯과 양파는 얇게 썬다. 감자는 1cm 정육면체로 잘라서 삶아 놓는다.
- text: 팬에 식용유를 두르고 다진 마늘과 로즈마리, 파슬리, 감자를 볶는다.
- text: 또 다른 팬에서는 양파를 볶다가 양송이버섯을 넣고 볶아둔다.
- text: 팬에 1의 반죽을 얇게 부친 뒤 뒤집어 볶은 양송이버섯과 3의 감자, 달걀을 올린다.
- text: 에멘탈 치즈를 고루 뿌리고 반을 접어 완성한다.
