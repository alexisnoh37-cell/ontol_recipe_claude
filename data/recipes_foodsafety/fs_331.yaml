steps:
- text: 갈비는 핏물을 빼주고 뜨거운 물에 80% 이상 데쳐준 뒤 갈비와 감자를 물을 자작하게 넣고 청주, 생강청을 넣고 푹 삶아준다.
- text: 양파, 청고추, 홍고추는 먹기 좋게 썰어준다.
- text: 마른미역줄기는 냉수에 행군 뒤 물기를 빼준다.
- text: 양념장을 바글바글 끓여준다.
- text: 끓고 있는 양념장에 삶아진 갈비, 감자, 당근 순으로 끓이다 메추리알을 넣고 졸여준다.
- text: 마지막에 미역줄기를 넣고 볶아주는 형식으로 갈비찜을 완성한다.
