steps:
- text: 유리볼에 고기를 담고 로즈마리, 통후추 으깬 것, 양송이버섯 썬 것, 월계수잎, 포도주스를 넣고 절인다.
- text: 작은 유리볼에 토마토소스와 소고기육수, 바질, 오레가노, 설탕, 마늘가루를 넣고 섞는다.
- text: 재워둔 고기를 꺼내 가열된 팬에 앞 뒷면을 익힌다.
- text: 고기를 구웠던 팬에 1의 남은 국물과 2의 토마토소스를 붓는다.
- text: 팬에 붙은 고기 조각들을 긁어내 함께 중불에서 끓여 양송이버섯 소스를 만든다.
- text: 스테이크를 썰어 그릇에 담고 양송이버섯 소스를 끼얹는다.
