steps:
- text: 콜라비는 껍질을 벗긴 뒤 깍둑 썬다.
- text: 손질한 콜라비에 천일염을 뿌려 1시간 동안 절인다.
- text: 홍고추, 양파, 생강, 마늘을 믹서에 곱게 간다.
- text: 갈아 낸 채소에 양념장 재료를 넣어 양념장을 만든다.
- text: 절여 놓은 콜라비는 물기를 제거하고, 쪽파는 적당한 길이로 썬다.
- text: 콜라비에 쪽파, 양념장을 넣고 버무려 하루 동안 숙성해 마무리한다.
