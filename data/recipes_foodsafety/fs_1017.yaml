steps:
- text: 가지에 세로로 칼집을 넣어 소금을 뿌린다.
- text: 표고버섯, 느타리버섯은 채 썰고 새송이버섯은 세로로 자른다.
- text: 돼지고기를 곱게 다진 뒤 볶는다.
- text: 팬에 버터를 넣어 녹으면 밀가루를 넣고 볶아서 루를 만든 뒤 우유를 넣어 화이트소스를 만든다.
- text: 오븐용기에 화이트소스를 깔고 그 위에 가지를 올린 뒤 가지 사이에 버섯, 토마토소스, 화이트소스, 버섯을 넣는다.
- text: 남은 화이트소스와 치즈, 빵가루 순으로 얹고 180℃로 예열된 오븐에서 윗면이 노릇한 색이 나도록 굽는다.
