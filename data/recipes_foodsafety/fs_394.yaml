steps:
- text: 삼겹살은 길이로 잘라서 마늘기름, 통후추, 로즈마리에 마리네이드 해준다.
- text: 대파는 흰 부분만 잘라 구워주고, 꽈리고추도 함께 구워준다.
- text: 대파는 가늘게 채 썰어 물에 담가준다.
- text: 물에 담가진 대파를 물기를 빼고 양념해준다.
- text: 삼겹살을 꼬치에 끼워 굽고 구워진 채소, 대파채와 함께 완성한다.
