steps:
- text: 물 한 컵에 설탕, 식초, 소금, 피클링스파이스를 넣고 식촛물을 만든다.
- text: 배는 스쿱으로 동그랗게 판다.
- text: 토마토는 1/6등분으로 썬다.
- text: 마와 우엉은 슬라이스 한다.
- text: 썰어 놓은 마와 우엉을 식촛물에 담근다.
- text: 와인에 먹물, 설탕을 넣고 섞어 식촛물에 넣고 배, 토마토, 새싹을 넣는다.
