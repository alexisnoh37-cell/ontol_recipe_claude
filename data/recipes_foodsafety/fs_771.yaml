steps:
- text: 거피녹두를 깨끗이 씻는다.
- text: 씻은 녹두에 물을 넣고 푹 삶아낸다.
- text: 삶아 낸 녹두를 체에 밭쳐 물기를 제거하고 으깬다.
- text: 마른 팬에 녹두 소를 넣어 살짝 볶아 수분을 날린 다음 설탕, 소금으로 간한다.
- text: 절편을 5cm 길이로 잘라 밀대로 얇게 민다.
- text: 절편에 녹두소와 호두를 넣고 돌돌 말아 진달래를 붙인다.
