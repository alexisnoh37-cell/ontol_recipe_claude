steps:
- text: 수삼은 흙을 깨끗이 씻은 후 잔뿌리를 다듬어내고 길이로 얇게 썬다.
- text: 배, 오이, 셀러리도 각각 1.5cm x 7cm 크기로 얇게 썬다.
- text: 대추와 유자는 잘게 다진다.
- text: 수삼, 오이, 배, 셀러리는 차가운 물에 담가 조직감을 살린다.
- text: 대추, 유자청, 소금, 식초, 꿀물을 합하여 저나트륨 냉채소스를 만든다.
- text: 4의 채소를 건져서 물기를 제거하고 소스에 살짝 버무려 낸다.
