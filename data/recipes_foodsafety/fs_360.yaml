steps:
- text: 양파는 네 번 정도 칼집을 내어 준다.
- text: 절임물을 만들고 절임 물에 칼집 낸 양파를 하루(24시간) 정도 절여준다.
- text: 절임물을 버리지 말고 절임물 반에 생강청, 식초, 청양고추를 잘라서 섞어주고 국물을 만든다.
- text: 만들어진 국물에 절여진 양파를 담가준다.
- text: 24시간 후부터 먹을 수가 있다.
