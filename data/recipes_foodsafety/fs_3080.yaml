steps:
- text: 한돈은 사태로 준비하여 깍둑썰기하여 세척한다.
- text: 양파, 파, 다시마, 표고버섯, 마늘은 깨끗이 세척 후 적당한 크기로 자르고, 당근, 곤약은 깍뚝썰기하여 준비한다.
- text: 냄비에 물과 저염간장을 2:1 비율로 조림장을 준비한다.
- text: 조림장에 구기자 및 양파, 파, 다시마, 표고버섯, 마늘을 넣고 끓인다.
- text: 조림장이 끓으면 사태, 메추리알, 당근, 곤약을 넣고 조린다.
- text: 접시에 담아서 완성한다.
