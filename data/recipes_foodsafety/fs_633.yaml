steps:
- text: 물에 다시마를 넣고 끓인다.
- text: 끓여 놓은 다시마 육수에 마늘, 저염간장, 가쓰오부시를 넣고 살짝 끓인 뒤 걸러서 소스를 만든다.
- text: 양배추는 찜통에 찐다.
- text: 돼지고기는 저염간장과 후춧가루를 뿌려 볶고 식힌다
- text: 파프리카, 사과, 당근은 굵게 채썬다.
- text: 쪄낸 양배추에 깻잎과 썰어놓은 야채를 올려 둥그렇게 말아 준비한 소스에 살짝 적신다.
