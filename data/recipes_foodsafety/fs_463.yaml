steps:
- text: 펜네는 10분정도 삶아 데치고, 떡볶이 떡은 뜨거운 물에 살짝 불려 놓는다.
- text: 양파는 채를 썰어 준비한다.
- text: 냄비에 버터를 넣고 밀가루를 넣어 볶는다.
- text: 볶아지는 밀가루에 준비한 육수를 넣는다.
- text: 육수가 은근히 끓으면 우유와 생크림 넣어준다.
- text: 끓고 있는 냄비에 떡볶이떡, 삶은 펜네와 양파를 넣어 끓인 후 모짜렐라치즈를 넣고 치즈가 녹으면 파슬리가루를 살짝 뿌려 완성한다.
