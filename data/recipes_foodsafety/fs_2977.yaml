steps:
- text: 밀가루에 소금을 섞어 반죽한 뒤 숙성시킨다.
- text: 황태머리를 구운 뒤 찬물에 넣고 끓여 육수를 만들어 거즈에 거른다.
- text: 냄비에 2의 육수를 붓고 콩나물 1/2를 넣은 뒤 끓어 오르면 고추장과 고춧가루를 풀어 끓인다.
- text: 숙성된 수제비 반죽을 밀어 따로 끓인 물에 삶아 건진다.
- text: 3에 4의 수제비를 넣고 한소끔 끓인다.
- text: 나머지 콩나물을 넣어 완성한다.
