steps:
- text: 오징어 몸통을 가르고 껍질을 벗긴 후 씻어서 물기를 제거 한다.
- text: 오징어 안쪽에 대각선으로 0.3cm 간격의 칼집을 넣고 반대방향으로도 칼집을 넣는다.
- text: 오이와 파프리카는 0.4cm 폭으로 길게 썬다.
- text: 오징어의 칼집을 넣지 않은 부분에 오이와 파프리카를 얹고 김밥처럼 말아 실로 엮은 후 찜통에 넣고 찐다.
- text: 치킨양념소스는 다진 마늘과 다진 양파를 팬에 기름을 두르지 않고 살짝 구워 향을 낸 후 고추장, 토마토케첩, 물엿을 넣고 소스를 만든다.
- text: 익은 오징어 말이는 2~3cm 길이로 썰고 5의 소스를 곁들인다.
