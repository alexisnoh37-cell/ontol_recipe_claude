steps:
- text: 닭을 깨끗이 손질하고, 부위별로 자른다.
- text: 냄비에 가시오가피, 대파, 다시마, 마늘, 건새우를 넣고 은근히 끓인 후 닭을 넣고 약 20분 정도 삶아 건진 뒤 살을 찢어둔다.
- text: 양파, 오이는 채썰고 식초, 설탕, 소금을 넣고 초절임한다
- text: 겨자가루에 30℃ 정도의 물을 넣고 골고루 섞어 발효시키고, 설탕, 식초, 소금을 넣고 겨자소스를 만든다
- text: 흰곤약과 비트, 치자가루를 섞은 곤약, 채썬 다시마를 접시에 담는다.
- text: 양파, 오이 초절임과 닭살을 한쪽에 담아 먹기 직전에 겨자소스를 올린다.
