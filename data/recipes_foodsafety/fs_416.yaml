steps:
- text: 다진마늘을 버터에 충분히 볶아준다.
- text: 화이트와인을 뿌려주고 소스재료로 소스를 만들어준다.
- text: 찜기에 살짝 져 준다. 이때 80% 정도까지만 익혀준다.
- text: 쪄준 조기는 와인과 후추로 밑간을 해준 후 전분을 발라준다.
- text: 전분를 바른 조기에 허브크러스트를 두툼하게 올려준다.
- text: 팬에 기름을 두르고 조기를 한쪽부터 구운 뒤, 뒤집어서 다시 구워주고 소스를 뿌려 완성한다.
