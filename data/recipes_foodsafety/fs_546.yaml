steps:
- text: 오징어는 껍질을 벗겨 안 쪽으로 칼집을 넣어 무늬를 만들어 놓는다.
- text: 끓는 물에 소금을 넣고 미나리를 데쳐 찬물에 헹구고, 바로 오징어를 데쳐 준비한다.
- text: 준비한 토마토 반은 굵게 다지고, 반은 썰어서 접시에 돌려 담아놓는다.
- text: 다진 토마토와 고추장, 식초, 생강즙, 올리고당을 골고루 섞어 양념장을 만든다.
- text: 당근, 양파, 대파, 청 ․ 홍고추를 썰어 놓는다.
- text: 만들어 놓은 양념장에 데친 오징어와 채소를 넣어 무친 후 토마토를 돌려 담은 접시에 담아 통깨를 올려 완성한다.
