steps:
- text: (속재료) 단호박은 쪄서 먹기 좋은 크기로 썰어둔다.
- text: 통밀가루와 강력분, 전립분, 물, 소금을 섞어 5℃에서 반나절동안 1차 발효를 시킨다.
- text: 반죽을 썰어 모양을 잡고, 중간발효를 15분동안 한다.
- text: 반죽 가운데에 썰은 단호박과 참깨를 넣고 가볍게 접어서 말아 면포에 올린다.
- text: 굽기 전에 쿠프(칼집내기)를 한다.
- text: 230℃ 로 예열한 오븐에 넣고 스팀 후 210℃에서 25분 굽는다.
