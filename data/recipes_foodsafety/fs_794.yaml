steps:
- text: 호박은 채썰어 굵게 다진 뒤 소금을 뿌렸다가 물기를 제거하고 센불에 충분히 볶아 식힌다.
- text: 표고버섯은 불려서 꼭지를 떼고 두꺼운 것은 포를 뜬 뒤 채썰어 들기름을 넣고 무쳐 센불에 볶고 청고추는 다진 뒤 살짝 볶는다.
- text: 볶은 호박과 고추, 버섯이 완전히 식으면 섞어서 통깨, 후춧가루, 참기름에 무친다.
- text: 분량의 밀가루와 물을 섞어 반죽을 만든 뒤 0.2cm 두께로 밀어 지름 7~8cm 정도의 동그란 틀을 이용해 찍어 만두피를 만든다.
- text: 만두피에 만두소를 넣어 만두를 만든다.
- text: 김이 오른 찜통에 젖은 소창을 깔고 만두를 넣어 찌거나 끓는 물에 소금을 약간 넣고 터지지 않게 삶는다.
