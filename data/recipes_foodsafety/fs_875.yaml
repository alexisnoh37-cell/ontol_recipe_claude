steps:
- text: 굴은 소금으로 깨끗이 씻어 물기를 뺀다.
- text: 두부는 2x2x1cm 크기로 썰고, 실파는 2cm 길이로 자른다.
- text: 김은 구워서 잘게 찢거나 가위로 자른다.
- text: 고추는 채썰어 씨를 제거한다.
- text: 다시마 육수를 끓이다가 두부와 굴을 넣고 뭉근히 끓인 뒤 새우젓과 다진 마늘을 넣고 한소끔 끓인다.
- text: 실파와 홍고추를 넣고 마지막에 김과 참기름을 넣는다.
