steps:
- text: 배추, 오이는 얇게 채 썬 뒤 소금물에 담가 절인 후 물기를 꼭 짜고, 표고버섯은 채 썬 뒤 참기름과 간장을 넣어 양념하고, 피망과 당근은 얇게 채 썬다.
- text: 예열된 팬에 배추, 오이, 채 썬 피망, 표고버섯 순으로 센 불에서 각각 볶고, 당근은 물기를 제거한 뒤 녹말가루를 묻혀 150℃로 예열한 기름에 튀긴다.
- text: 닭가슴살은 얇게 저민 후 후춧가루로 밑간을 한 뒤 볶아놓은 채소를 올려 말아 계만두를 만든다.
- text: 찜기에 물과 마늘, 대파를 넣고 육수를 내면서 예열하다가 김이 오르면 말아놓은 계만두를 넣고 약 8분 정도 찐다.
- text: 빠금장에 휘핑크림과 우유, 다진 청양고추, 후춧가루, 참깨를 넣고 끓여 빠금장소스를 만든다.
- text: 계만두에 튀긴 당근과 삶은 메추리알을 곁들인 뒤 빠금장소스를 곁들여 마무리한다.
