steps:
- text: 감자, 양파, 당근, 피망은 볶음밥에 넣을 분량은 잘게 다지고, 카레에 넣을 분량은 한입 크기로 썬다.
- text: 닭가슴살도 한입 크기로 잘라 후춧가루로 밑간한다.
- text: 팬에 식용유(15g)를 두른 뒤 잘게 다진 감자, 양파, 당근, 피망을 넣고 볶다가 밥을 넣고 같이 볶는다.
- text: 식용유(15g)를 두른 팬에 닭고기를 먼저 볶다가 한입 크기로 썬 감자, 당근, 양파, 피망, 브로콜리를 넣고 볶은 뒤 마지막에 방울토마토를 넣는다.
- text: 토마토페이스트을 넣고 볶다가 파프리카가루를 넣어 향을 낸다.
- text: 카레가루를 푼 물(300g)을 부어 끓이다가 플레인 요구르트를 넣고 농도를 맞춘 뒤 밥 위에 얹어 마무리한다.
