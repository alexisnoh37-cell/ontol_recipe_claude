steps:
- text: 냄비에 다시마와 물(250g)을 넣고 중간 불에서 끓여 끓어오르면 다시마를 건진다.
- text: 감자와 연근은 껍질을 벗겨 깍둑 썰고 물에 헹궈 전분기를 제거한다.
- text: 마른 미역은 미지근한 물에 담가 불린 후 손으로 바락바락 주물러 한입 크기로 썬다.
- text: 찹쌀가루에 물(25g)과 소금(0.1g)을 넣고 반죽해 작은 새알심을 만든다.
- text: 냄비에 들기름을 두르고 미역과 다진 마늘을 넣고 볶다가 다시마물과 감자, 연근을 넣고 끓인다.
- text: 감자가 익을 때쯤 새알심을 넣어 익힌 후 들깻가루를 넣고 국간장으로 간을 해 마무리한다.
