steps:
- text: 닭은 포를 떠서 생강즙과 정종을 섞어 발라 놓는다.
- text: 시금치는 살짝 데쳐 썰고, 당근, 양파, 샐러리, 파프리카는 약 6Cm 길이로 채를 썰어 절반은 닭고기말이에 사용 하고, 절반은 곁들임채소로 사용한다.
- text: 느타리는 끓는 물에 소금을 넣고 데쳐 손으로 찢어놓고, 포를 뜬 닭가슴살에 느타리와 썰어 놓은 채소를 넣어 말아 주고, 육수를 끓여서 말아놓은 닭을 넣고 익혀낸다.
- text: 주꾸미와 새우는 끓는 물에 살짝 데치고, 청경채는 반으로 썰어 살짝 데쳐 준비 한다.
- text: 튀김기름 온도가 180℃ 정도 되면 누룽지를 넣고 튀겨 기름을 밭쳐 놓는다.
- text: 닭을 넣은 육수(③)에 간장과 녹말, 마늘, 소금, 후춧가루를 넣고 끓이다가, 곁들임채소로 남겨 놓은 채소(②)와 데쳐 놓은 해물 및 청경채를 넣고 한 번 더 끓인 뒤 튀겨진 누룽지를 넣어 완성한다.
