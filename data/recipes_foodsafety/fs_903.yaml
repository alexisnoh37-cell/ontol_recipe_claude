steps:
- text: 천도복숭아는 반으로 잘라 씨를 제거하고 각각 2등분하고 자두는 반으로 갈라 씨를 제거한다.
- text: 사과는 8등분하여 씨를 제거한다.
- text: 포도는 알알이 떼어내고 체리는 꼭지를 떼어내고 블루베리와 산딸기는 분량대로 준비한다.
- text: 냄비에 포도주스와 설탕, 준비한 과일을 넣고 약한불에서 끓인다.
- text: 천도복숭아가 부드러워지고 포도주스에 농도가 생기면 불을 끈다.
- text: 접시에 졸인 과일과 주스를 함께 담는다.
