steps:
- text: 바지락은 해감을 시켜준 후 물에 넣어 바지락 육수를 만들어준다.
- text: 바지락살은 따로 떼어내어 다진소고기와 다시 다져서 양념해 볶아준다.
- text: 두부는 물기제거를 한 후 함초, 깻잎, 다진양파, 를 넣어 치대어 두부볶음을 만들어준다.
- text: 애호박은 채 썰어주고 양파, 오이, 당근, 표고도 채 썰어 각각 볶아준다.
- text: 볶은 바지락과 쌀을 넣어 밥을 한다.
- text: 몰드에 밥과 각종 채소들을 올려주고 마지막에 두부 스크램블을 올려 밥을 완성한다.
