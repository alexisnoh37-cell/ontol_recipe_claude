steps:
- text: 시금치를 끓는 물에 살짝 데친다.
- text: 데친 시금치는 찬물에 헹구어 내고 물기를 짠다.
- text: 방울토마토는 끓는 물에 살짝 데쳐 껍질을 제거한다.
- text: 껍질을 제거한 방울토마토는 반으로 자른다.
- text: 데친 시금치에 토마토, 함초가루, 참기름, 참깨, 마늘을 넣어 무친다.
