steps:
- text: 당근, 시금치, 사과는 물에 익힌 후 각각 갈아 퓨레를 만든다.
- text: 볼에 버터를 부드럽게 풀고 소금, 꿀을 섞어 녹이고 달걀을 2~3회 나눠 넣으며 크림을 만든다.
- text: 2번에 박력분, 베이킹소다, 베이킹파우더를 체쳐 넣고 가볍게 섞는다.
- text: 반죽을 3등분 한 뒤 당근퓨레/ 사과퓨레/시금치퓨레를 각각 섞고 크랜베리, 호두로 장식한다.
- text: 잘 섞은 반죽을 머핀틀에 70% 채워 넣는다.
- text: 175℃ 오븐에서 30분 간 굽는다.
