steps:
- text: 양파, 2가지색 파프리카, 청고추는 작은 깍두기 모양으로 잘라준다.
- text: 파인애플도 먹기 좋게 썰어준 뒤 레몬소금을 살짝 뿌려준다.
- text: 계란은 풀어서 팬에 스크램블을 만들어준다.
- text: 마늘을 다진 후 마늘기름으로 칵테일 새우를 볶아준다.
- text: 볶아진 칵테일새우에 잘라준 채소를 넣어 다시 볶아준다.
- text: 여기에 밥을 넣어서 볶아주고 파인애플과 맛간장, 통깨를 넣어서 볶아준다.
