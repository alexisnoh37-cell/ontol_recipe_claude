steps:
- text: 단호박은 삶아 으깬다.
- text: 양파, 석박지, 파프리카, 가지는 깍둑 썰고, 두부는 으깬다.
- text: 팬에 다진 마늘, 양파, 석박지를 넣어 볶다가 두부를 넣고 수분이 없어질 때까지 볶다가 가지, 파프리카도 넣어 볶는다
- text: 밥과 저염된장, 후춧가루를 넣고 볶다가 들기름을 넣어 한 번 더 볶는다.
- text: 그릇에 담고 으깬 단호박과 세발나물을 곁들여 마무리한다.
