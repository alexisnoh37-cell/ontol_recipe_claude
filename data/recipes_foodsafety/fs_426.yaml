steps:
- text: 콜라비는 껍질을 벗긴 후 저염간장에 30분 정도 절여준다.
- text: 우렁은 뜨거운 물에 데친 후 행군 뒤 물기를 빼준다.
- text: 미나리는 먹기 좋은 크기로 잘라준다.
