steps:
- text: 미역과 파래는 깨끗이 씻어 물기를 짜서 잘게 다지고, 김은 살짝 구워 부스러뜨린다.
- text: 양파와 유자청 건더기는 잘게 다진다.
- text: 1과 2를 합해 감자전분과 달걀을 넣어 반죽한다.
- text: 반죽을 동그랗게 뭉쳐 기름에 튀긴다.
- text: 유자청 국물에 물을 섞어 팬에 넣고 걸쭉하게 끓여 소스를 만든다.
- text: 해초튀김에 소스를 곁들여 낸다.
