steps:
- text: 쌀은 불린 후 밥을 짓는다.
- text: 고사리는 끓는 물에 삶고, 잘게 썬 파프리카는 고사리 삶는 물에 살짝 데친다.
- text: 고사리 삶는 중간에 취나물을 넣어 함께 데친다.
- text: 고사리와 취나물은 잘게 썬다 .
- text: 파프리카, 고사리, 취나물에 참기름, 마늘, 소금, 통깨를 넣고 양념을 한다.
- text: 밥에 참기름, 통깨, 소금을 넣어 양념한 후 4의 재료를 섞어 주먹밥을 만든다.
