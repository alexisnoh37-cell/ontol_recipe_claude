steps:
- text: 카레가루를 물에 풀어서 30분 정도 숙성 시켜준다.
- text: 닭가슴살은 사방 1cm 크기로 잘라주고, 칵테일새우도 세척해 준비한다.
- text: 알 마 늘 , 감자는 사 방 1 c m 길이로 잘라 물 400g에 먼저 익혀준다.
- text: 방울토마토, 애호박은 사방 1cm 크기로 썰어준다.
- text: 끓고 있는 냄비에 풀어 놓은 카레가루를 섞어 다시 끓여준다.
- text: 양파는 사방 1cm 길이로 잘라주고 끓고 있는 카레에 양파, 방울토마토, 애호박을 넣고 끓여 완성한다.
