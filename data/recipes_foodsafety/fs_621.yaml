- text: 동량의 물과 저염간장에 대파, 양파, 마늘을 넣고 은근히 졸인다.
- text: 마늘이 익을 정도로 끓으면 체에 거른다.
- text: 부추는 길게 썰고, 양파는 채썬다
- text: 두릅은 데친 후 찬물에 헹군다.
- text: 졸인 간장에 요리술을 넣고 다시 졸인다.
- text: 고기를 구운 뒤 준비한 야채와 두릅을 넣고 돌돌 말아 간장에 졸인다.
