steps:
- text: 등갈비는 찬물(5컵)에 담가 1시간 이상 핏물을 제거한다.
- text: 등갈비는 한 쪽씩 썬다.
- text: 손질한 등갈비는 밑간한 뒤 마늘, 로즈메리와 함께 버무려 30분 정도 재운다.
- text: 재운 등갈비는 190℃로 예열한 오븐에 40분간 굽고, 뒤집어서 같은 온도에 30분간 더 굽는다.
- text: 디핑소스를 만든다.
- text: 그릇에 등갈비구이를 담은 뒤 레몬을 짜 즙을 뿌리고, 디핑 소스를 곁들여 마무리한다.
