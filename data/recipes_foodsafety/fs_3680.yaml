steps:
- text: 바나나는 으깨고 양파, 양송이버섯, 감자, 바질은 작게 자른다. 방울토마토는 1/4 크기로 자른다.
- text: 볼에 손질한 바나나, 양파, 양송이버섯, 감자, 바질을 넣고 검은콩두유, 달걀, 후추, 다진 마늘을 넣고 섞는다.
- text: 볼에 아몬드가루, 베이킹파우더, 강황가루를 체 쳐서 넣고 섞어 반죽을 완성한다.
- text: 머핀 틀에 반죽을 2/3 정도 넣고, 손질한 방울토마토 3~4토막을 올린다.
- text: 170°C로 예열한 오븐에서 20분 동안 구운 후 꺼낸다.
- text: 바질로 장식하여 마무리한다.
