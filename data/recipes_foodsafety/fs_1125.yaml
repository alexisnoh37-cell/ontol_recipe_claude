steps:
- text: 말린오미자는 깨끗이 씻은 뒤 생수 150g을 부어 하루정도 우려낸다.
- text: 우려낸 오미자를 체에 거른다.
- text: 배를 강판에 곱게 간 뒤 면포에 싸서 배즙을 짠다.
