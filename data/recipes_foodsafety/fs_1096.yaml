steps:
- text: 차가운 버터에 박력분, 아몬드가루, 소금을 넣어 으깨가면서 섞는다.
- text: 달걀과 물을 넣고 섞어 반죽을 만들어 휴지시킨다.
- text: 휴지시킨 반죽을 밀대로 밀어 커터로 모양을 찍은 뒤 180℃ 오븐에 굽는다.
- text: 땅콩호박을 삶아 체에 걸러 으깬 뒤 사과즙, 달걀을 넣고 중탕하여 섞는다.
- text: 4번에 전분을 조금씩 넣으면서 농도를 맞춘 뒤 요거트를 넣는다.
- text: 5번을 짤주머니에 담은 뒤 3번 위에 굵게 짜주고 다진 호두를 뿌린다.
