steps:
- text: 새우는 잘게 다지고 흰자, 소금, 후추와 함께 섞어서 간이 배도록 한다.
- text: 다진 물밤과 실파를 1과 섞어준 뒤 종이타월을 이용해서 물기를 제거한 리치의 속의 채운다.
- text: 속이 채워진 리치에 전분을 묻혀 기름에 튀긴다.
- text: 가열된 팬에 올리브오일을 두르고 양파, 마늘, 생강 다진 것을 살짝 볶는다.
- text: 4에 물, 고추기름, 설탕, 소금, 후춧가루를 넣고 간을 한 뒤 물전분으로 농도를 맞춘다.
- text: 감자는 껍질을 벗겨 채칼로 얇게 슬라이스 한 뒤 물에 담궈 전분을 빼고 튀겨 접시에 깔고 3, 4를 담는다.
