steps:
- text: 꽁치는 머리와 꼬리를 떼어 내고 포 뜨듯이 길게 살만 발라내 잔뼈를 발라 쌀뜨물에 담갔다 건져 물기를 제거한다.
- text: 오렌지를 간 뒤 레몬즙과 설탕, 소금을 섞어 오렌지소스를 만든다.
- text: 마늘종은 꽁치 폭에 맞춰 썰고, 양파와 파프리카도 채 썬다.
- text: 수분을 제거한 꽁치에 밀가루를 묻혀 깻잎→마늘종→양파→ 파프리카 순으로 올려 돌돌 말아 꼬치로 꽂아 고정한다.
- text: 밀가루를 묻히고 달군 팬에 앞뒤가 노릇노릇하게 익힌다.
- text: 소스를 팬에 넣고 끓이다가 꽁치 꼬치를 넣고 졸인 뒤 그릇에 무순, 새싹과 함께 담아 마무리한다.
