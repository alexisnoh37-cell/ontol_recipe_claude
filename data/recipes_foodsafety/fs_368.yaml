steps:
- text: 다진 쇠고기는 양념장에 버무려주고 두부는 으깨준다.
- text: 애호박, 당근은 송송 다져준다.
- text: 표고버섯은 불려준 뒤 채 썰어 참기름과 버섯마늘소금에 살짝 무쳐서 볶아준다.
- text: 양념된 소고기는 팬에 볶아준다.
- text: 소고기를 볶아주던 팬에 밥과 표고를 넣고 끓여주다 두부를 넣고 죽을 해준다.
- text: 다진 애호박, 당근을 넣어서 끓여주고 불을 끄기 전에 청국장과 흑임자를 넣어 죽을 완성한다.
