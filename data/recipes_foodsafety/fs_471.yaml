steps:
- text: 닭가슴살은 가운데 1/4 정도 깊은 칼집 넣어 소금과 후추를 뿌려놓는다.
- text: 느타리버섯은 찢고, 베이컨은 네모지게 썰어놓는다.
- text: 시금치는 살짝 데쳐 썰고, 양파와 대파는 입자있게 썰어 준비한다.
- text: 팬에 버터를 두르고, 시금치와 버섯을 넣어 볶다가 굴소스를 넣고 다시 볶아 준다.
- text: 닭가슴살에 볶아 놓은 시금치와 버섯을 넣어 팬에 올리브기름으로 구워 익힌다.
- text: 냄비에 베이컨과 양파를 넣어 볶다가 카레가루를 넣어 살짝 볶고, 다시 우유와 생크림, 대파를 넣고 끓여 카레소스를 만들고, 어린잎채소와 닭스테이크 (⑤)를 접시에 담고 카레 소스를 올려 완성한다.
