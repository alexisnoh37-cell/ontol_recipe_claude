steps:
- text: 보쌈용 삼겹살을 깨끗이 씻어 생강채와 양파채, 월계수잎, 통후추와 소주를 넣고 약 1시간 정도 숙성을 시킨다.
- text: 찜통에 물과 된장, 편마늘을 넣고 숙성된 삼겹살을 올려 약 50분 정도 찜을 하다가 부추를 올려 1분 정도 더 찜을 한다.
- text: 부추는 약 6cm 길이로 썰어 준비한다.
- text: 홍고추는 반으로 갈라 씨를 제거하고, 채를 썰어 놓는다.
- text: 냄비에 간장과 물, 설탕, 올리고당, 통후추, 생강을 넣고 은근히 끓인다.
- text: 소스가 은근히 끓고 있을 때 채로 생강과 통후추를 걸러내고, 물녹말을 풀어 한 소큼 더 끓인 후, 찜통에서 쪄 나온 부추와 삼겹살을 썰어 접시에 담고, 그 위에 소스와 홍고추를 올려 완성한다.
