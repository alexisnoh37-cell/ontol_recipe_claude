steps:
- text: 새우, 조개, 홍합은 손질한다.
- text: 버섯은 먹기 좋은 크기로 썰고, 양파는 채 썰고, 토마토는 씨를 제거해 다진다.
- text: 라면은 끓는 물에 데친 뒤 체에 밭쳐 물기를 제거한다.
- text: 냄비에 식용유(10g)를 두른 뒤 새우와 조개, 홍합을 넣어 살짝 볶아 건진다.
- text: 같은 냄비에 토마토, 우유, 생크림을 넣은 뒤 월계수잎과 정향을 넣고 끓인다.
- text: 끓으면 데친 라면, 새송이버섯, 홍합, 새우, 조개, 양파를 넣고 끓여 다 익으면 파르메산 치즈가루를 뿌린 후 그 위에 파슬리가루를 뿌려 마무리한다.
