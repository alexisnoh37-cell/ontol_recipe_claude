steps:
- text: 돼지고기를 흐르는 물에 담궈 핏물을 제거한다.
- text: 파인애플 일부는 먹기 좋은 크기로 썰고 나머지는 믹서에 간다.
- text: 간 파인애플과 양념을 섞어 양념장을 만든다.
- text: 핏물을 제거한 돼지고기에 양념장을 섞어 재운다.
- text: 프라이팬에 기름을 두르고 양념한 돼지고기와 한 입 크기로 썬 채소를 볶는다.
- text: 썰어둔 파인애플을 넣는다.
