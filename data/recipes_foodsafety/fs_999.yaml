steps:
- text: 오렌지는 껍질을 벗긴 뒤 잘게 썰고 사과는 껍질 째 깨끗하게 씻어서 잘게 썬다.
- text: 냄비에 오렌지와 사과를 각각 넣고 설탕을 넣어 중간 불에서 타지 않도록 졸인다.
- text: 졸이는 도중에 과일에서 나온 물로 질척해지면 물전분을 넣어 농도를 맞춘 뒤 차게 식힌다.
- text: 식빵은 가장자리를 잘라낸 다음 밀대로 납작하게 밀어 버터를 바른다.
- text: 졸인 과일을 얹고 돌돌 만 다음 양끝을 포크로 눌러 붙인다.
- text: 식빵의 표면에 버터를 얇게 바르고 170℃로 예열된 오븐에 넣어 노릇하게 굽는다.
