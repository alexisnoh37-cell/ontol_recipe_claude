steps:
- text: 매생이와 바지락은 소금기를 없애기 위해 물에 여러 번 헹군다.
- text: 튀김가루, 부침가루에 물을 넣고 반죽을 만든다.
- text: 매생이를 잘게 다져 반죽에 섞어준다.
- text: 팬에 매생이 반죽을 얹고 바지락살을 넣고 노릇하게 구워준다.
- text: 구워진 전에 홍고추 고명을 얹어 준다.
- text: 그릇에 담아 마무리 한다.
