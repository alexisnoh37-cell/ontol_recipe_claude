  role: sub
steps:
- text: 통 도라지는 껍질을 벗기고 0.3cm 두께로 썬다.
- text: 손질한 도라지는 옅은 소름물에 잠시 담가 쓴맛을 없애고 차가운 물에 헹궈 물기를 닦는다. (3% 소금물)
- text: 그릇에 찹쌀가루와 튀김가루를 넣어 걸쭉한 농도가 되도록 물을 부어 튀김옷의 농도를 맞춘다.
- text: 농도를 맞춘 튀김옷 반죽에 검은깨를 섞는다.
- text: 손질한 도라지에 튀김옷을 입혀 170℃의 식용유에 튀긴다.
- text: 저나트륨 간장소스를 곁들인다.
