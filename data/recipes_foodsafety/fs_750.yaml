steps:
- text: 콩비지를 체에 받혀 물기를 제거한다.
- text: 깍두기와 새우젓을 잘게 다진다.
- text: 1에 다진 돼지고기, 깍두기, 새우젓, 계란, 전분, 후추, 파, 마늘을 넣고 치댄다.
- text: 치댄 반죽을 한입 크기로 동그랗게 완자를 빚는다.
- text: 냄비에 멸치다시마 국물을 넣고 끓으면 완자를 넣어 거품을 걷어가며 끓인다.
- text: 완자가 익어서 떠오르면 청경채, 대파, 마늘을 넣고 살짝 끓여 국간장으로 간하여 불에서 내린다.
