steps:
- text: 소 불고기는 양념장을 버무려 팬에 볶아준다.
- text: 청고추, 홍고추는 가늘게 채 썰어준다.
- text: 양파는 채 썰고 쪽파도 한입 크기로 잘라준다.
- text: 팽이도 먹기 좋은 크기로 잘라준다.
- text: 계란물을 풀어준다.
- text: 채소를 각각 볶아주다가 볶은 불고기에 섞어 주고 계란물을 풀어서 밥에 올려서 통깨를 뿌려 완성한다.
