steps:
- text: 동치미에 배를 갈아 넣고, 설탕과 식초를 넣어 양념을 한 후 냉장고에 보관한다.
- text: 양파는 채를 썰고, 오이와 당근은 편으로 썰어 소금물에 살짝 절여 준비한다.
- text: 다진 소고기는 다진 대파와 다진 마늘, 매실액, 참기름, 통깨, 후춧가루, 정종, 설탕, 간장을 넣어 양념을 한다.
- text: 양념을 한 소고기를 잘 치대어 둥글게 떡갈비를 만들어 냉장고에서 숙성을 시킨다.
- text: 숙성된 떡갈비를 팬에 기름을 살짝 둘러 은근히 익혀, 냅킨에 올려 기름을 빼놓는다.
- text: 끓는 물에 국수를 삶아 찬물에 여러 번 헹구어 건져 그릇에 담고, 그 위에 떡갈비를 올리고, 차게 보관한 동치미 국물을 부은 뒤 곁들임채소로 오이와 당근, 양파를 얹어 완성한다.
