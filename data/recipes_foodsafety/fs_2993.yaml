steps:
- text: 알배추는 세척 후 먹기 좋은 크기로 잘라 물에 담군다.
- text: 대파와 풋고추는 어슷썰고 양파는 굵게 채 썬다.
- text: 마늘은 곱게 다지고 사과는 믹서에 간다.
- text: 사과즙, 다진마늘, 고춧가루, 매실액, 식초를 섞어 겉절이 양념을 만든다.
- text: 물에 담궈뒀던 알배추를 건져 물기를 뺀 뒤 넓은 볼에 담는다.
- text: 알배추와 양파, 대파, 풋고추, 무청을 겉절이 양념에 골고루 버무린다.
