steps:
- text: 양송이는 꼭지를 제거하고 밀가루를 살짝 묻혀준다.
- text: 청양고추를 송송 다진다.
- text: 청양고추, 다진 돼지고기, 계란을 함께 버무려 준다.
- text: 양송이 소에 양념된 돼지고기를 채워준다.
- text: 소스를 만들어준다.
- text: 팬에 양송이를 구워준 후 로즈마리를 올려주고 소스와 함께 낸다.
