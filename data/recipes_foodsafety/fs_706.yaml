steps:
- text: 칼등으로 두부를 으깨 면보에 싸서 물기를 짜낸다.
- text: 새우, 부추, 표고버섯은 잘게 다진다.
- text: 두부에 다진 새우, 부추, 표고버섯, 소금, 후추를 넣어 소를 만든다.
- text: 만두피에 소를 10g씩을 올리고 새우 꼬리를 밖으로 나오게 넣고 오므린다.
- text: 찜기에 젖은 면보를 깔고 만두를 넣어 7분 간 찐다.
- text: 양념장과 함께 곁들여 낸다.
