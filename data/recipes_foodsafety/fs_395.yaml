steps:
- text: 저염 된장을 물 300cc에 풀어준 뒤 건새우를 담가 30분 정도 담가준 뒤 살짝 끓여준다.
- text: 새우를 풀어준 된장 물을 체에 걸러준다.
- text: 아욱은 뜨거운 물에 데쳐서 먹기 좋게 썬다.
- text: 냄비에 밥과 된장 물을 풀어 끓인다.
- text: 어느 정도 끓으면 칵테일새우와 건져 놓았던 새우를 다시 넣어준다.
- text: 불을 끄기 전에 아욱을 넣어 한 번 더 끓여준 후 완성한다.
