steps:
- text: 마늘은 잘게 다지고 양송이 버섯은 2mm 두께로 썬다.
- text: 팬에 기름을 두르고 다진 마늘을 볶다가 양송이버섯을 넣고 볶아 접시에 담아둔다.
- text: 2의 팬에 쌀을 넣고 볶는다.
- text: 3에 닭육수를 넣고 수분을 흡수 할 때까지 잘 젓는다.
- text: 쌀이 어느 정도 익으면 2를 넣고 쌀이 완전히 익을 때까지 조리한다.
- text: 파마산치즈, 소금, 후추, 다진 타임, 다진 파슬리를 넣는다.
