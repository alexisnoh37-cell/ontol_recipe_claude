steps:
- text: 소고기는 올리브오일, 매실액, 레몬즙, 소금, 후춧가루로 밑간한다.
- text: 묵은지는 흐르는 물에 헹궈 양념을 제거한다.
- text: 팽이버섯은 굵은 가닥으로 분리하고 아스파라거스는 밑기둥을 제거한다.
- text: 빨강, 노랑, 주황 파프리카는 막대모양으로 썬다.
- text: 묵은지 위에 달걀 흰자를 바르고 소고기를 펼치고 전분을 묻힌 뒤 야채를 넣고 돌돌 만다.
- text: 200℃로 예열한 오븐에 넣고 15분간 굽는다.
