steps:
- text: 보리는 깨끗이 씻어 물을 충분히 붓고 약 30분 정도 불려 준비한다.
- text: 주꾸미는 밀가루를 넣고 조물조물 주물러 다시 깨끗이 씻어 준비한다.
- text: 씻어놓은 주꾸미는 살짝 데쳐 입자 있게 다져 놓는다.
- text: 미나리와 당근, 양파는 입자있게 다져 놓는다.
- text: 냄비에 참기름을 두르고, 주꾸미를 먼저 볶다가 불린 보리쌀을 넣고 다시 볶은 뒤 썰어놓은 채소(④)를 넣는다.
- text: 냄비에 육수를 넣고 나무주걱으로 은근히 저어가면 끓이다가 죽이 어우러 지면, 우유와 치즈, 간장을 살짝 넣고 한 번 더 끓여 완성한다.
