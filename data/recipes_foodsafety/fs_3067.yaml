steps:
- text: 배추, 양파, 두부는 한입 크기로 썰고 대파와 청양고추는 어슷썰어 준비한다.
- text: 전처리 후 남은 양파껍질, 대파뿌리와 다시멸치를 넣고 육수를 우린 후 거른다.
- text: 두부는 끓는 물에 10분정도 넣어서 염분기를 빼준다.
- text: 냄비에 참기름과 배추를 넣어 볶다가 쌀뜨물과 육수를 넣어 끓인다.
- text: 두부와 양파, 대파, 고추를 넣는다.
- text: 된장, 간마늘, 생강즙을 넣어 간을 맞춘다.
