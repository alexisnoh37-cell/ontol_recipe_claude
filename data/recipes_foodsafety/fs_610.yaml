steps:
- text: 냄비에 망고퓨레, 레몬, 설탕을 넣고 은근히 끓인다.
- text: 젤라틴은 찬물에 불린 뒤 중탕으로 녹여 망고퓨레에 넣고 틀에 굳힌다.
- text: 생크림은 차갑게 휘핑하여 요거트와 섞는다.
- text: 생크림을 섞은 요거트에 설탕, 크림치즈를 섞는다
- text: 냄비에 라즈베리, 설탕을 넣고 은근히 끓인다.
- text: 접시에 굳힌 망고무스에 담고 그 위에 라즈베리 소스와 크림치즈 소스, 다진 파스타치오를 올리고 애플민트로 장식한다.
