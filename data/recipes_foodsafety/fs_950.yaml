steps:
- text: 치자를 따뜻한 물에 담궈 색을 우려내고, 백련초가루는 물에 푼다.
- text: 두부는 면보에 물기를 짠 뒤 칼로 으깬다.
- text: 두 개의 냄비에 한천을 필요량 만큼 넣고 1을 각각 넣고 30분 정도 불린다.
- text: 3에 으깬 두부를 반씩 나누어 넣고 설탕을 넣은 뒤 골고루 섞는다.
- text: 4를 모양 틀에 넣고 냉장고에서 굳힌다.
- text: 양갱이 굳으면 틀 째 미지근한 물에 담궈 뒤집어 뺸다.
