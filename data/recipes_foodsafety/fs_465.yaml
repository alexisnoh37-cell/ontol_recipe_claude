steps:
- text: 닭고기살은 곱게 다져 준비한다.
- text: 대추는 씨를 빼고 다진다.
- text: 당근과 양파, 표고버섯, 마늘은 다진다.
- text: 삶은 브로컬리는 우유와 함께 갈아 놓는다.
- text: 닭고기살에 대추(②)와 채소(③), 소금, 후춧가루, 참기름을 넣어 골고루 섞는다.
- text: 섞여진 닭고기살(⑤)을 동글동글 하게 완자를 지어 살짝 데쳐내고, 냄비에 버터와 밀가루를 넣어 볶다가, 육수를 넣고 끓인 뒤 우유와 브로컬리 갈은 것 (④)과 생크림을 넣어 한 소큼 끓여 완성 한다.
