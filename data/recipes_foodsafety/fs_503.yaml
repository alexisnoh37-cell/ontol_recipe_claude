steps:
- text: 두부는 소창에 넣고, 짜서 물기를 제거하고, 으깨어 놓는다.
- text: 으깬 두부에 소금과 코코넛 밀크를 넣고 골고루 섞는다.
- text: 섞여진 두부를 김이 오른 찜통에 넣고 약 5분 정도 찐다.
- text: 당근과 양파는 사각지게 썰고, 브로컬리는 데쳐 당근 크기로 썰어 놓는다.
- text: 돼지고기와 감자는 당근 크기로 썰어 주고, 냄비에 버터를 녹여 돼지고기를 먼저 볶다가 양파와 당근, 감자, 브로컬리를 넣고 다시 볶아 준 뒤, 쪄놓은 두부를 넣어 한 번 더 볶아준다.
- text: 볶아지는 냄비(⑤)에 카레 가루를 넣고 살짝 더 볶아준 뒤, 물을 넣고 자작하게 끓여 완성한다.
