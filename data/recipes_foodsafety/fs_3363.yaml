steps:
- text: 명태포는 키친타월에 올려 물기를 제거한다.
- text: 후춧가루와 레몬즙을 뿌려 비린내를 제거한다.
- text: 볼에 튀김가루와 달걀, 식용유, 물을 섞어 튀김옷을 만든다
- text: 명태포에 튀김옷을 입힌 뒤 170℃ 기름에서 두 번 튀긴다.
- text: 삶은 달걀, 홍고추, 청양고추, 양파를 다져 볼에 섞은 뒤 마요네즈와 레몬즙, 후춧가루를 섞어 소스를 만든다
- text: 생선까스에 타르타르소스를 곁들여 담는다.
