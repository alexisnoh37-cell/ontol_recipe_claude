steps:
- text: 구이소스 재료를 이용해 소스를 만든다.
- text: 통삼겹은 닭육수에 삶아 냉수에 헹궈 물기를 빼준다.
- text: 통삼겹에 만들어진 소스를 발라 준 뒤 10분 정도 숙성시켜준다.
