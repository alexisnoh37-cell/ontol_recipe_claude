ingredients:
- ingredient: red_bean
  raw_text: 팥 10g
  role: sub
- ingredient: glutinous_rice_flour
  raw_text: 찹쌀가루 15g
  role: sub
- ingredient: mugwort
  raw_text: 쑥가루 5g
  role: sub
- ingredient: sikhye
  raw_text: 식혜 110g
  role: sub
- ingredient: salt
  raw_text: 소금 적당량
