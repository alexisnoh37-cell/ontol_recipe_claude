steps:
- text: 팥을 깨끗하게 씻어 물을 부어 끓인 뒤 물을 버리고 다시 찬물을 부어 삶는다.
- text: 부드럽게 삶아진 팥의 물기를 제거한 후 으깬다.
- text: 찹쌀가루를 둘로 나누어 하나는 쑥가루를 넣고 하나는 맨 찹쌀가루에 뜨거운 물로 익반죽 하여 경단을 만든 뒤 끓는 물에 익힌다.
- text: 익힌 경단을 바로 차가운 얼음물에 담궈 식힌다.
- text: 식혜에 으깬 팥을 넣고 소금 간을 한 뒤 그릇에 담아 냉동실에 얼리면서 1시간 마다 공기가 들어가도록 포크로 저어준다.
- text: 샤베트가 부드럽게 얼면 준비한 그릇에 경단과 함께 담는다.
