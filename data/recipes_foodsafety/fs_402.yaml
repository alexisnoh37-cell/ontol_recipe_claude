steps:
- text: 닭가슴살은 먹기 좋은 크기로 잘라서 우유에 재워준 뒤 뜨거운 물에 데쳐준다.
- text: 방울토마토는 반으로 자르고, 양파는 먹기 좋은 크기로 잘라준다.
- text: 감자, 당근, 브로콜리는 먹기 좋은 크기로 잘라 뜨거운 물에 순서대로 데쳐준다.
- text: 모든 재료를 올리브유에 볶아준다.
- text: 토마토페이스트와 닭가슴살을 데쳐낸 물을 섞어 끓여준다.
- text: 끓고 있는 국물 50g에 밀가루를 섞어 농도를 맞추어 준다.
