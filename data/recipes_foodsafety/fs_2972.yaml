steps:
- text: 생강과 마늘을 잘게 다진다.
- text: 코다리를 세척 후 다진마늘, 다진생강, 소금, 후추로 밑간한다.
- text: 냄비에 다시멸치, 다시마를 넣고 끓여 육수를 우린 뒤 건져낸다.
- text: 무, 대파, 양파, 연근, 우엉, 호박, 느타리버섯, 표고버섯, 청양고추를 깨끗이 씻어 먹기좋은 크기로 썬다.
- text: 육수에 대파, 청양고추, 쑥갓을 뺀 야채를 넣고 끓이다가 들깨가루와 천일염을 넣어 간 한다.
- text: 마지막으로 코다리를 넣고 거품을 걷어가며 끓인 뒤 대파, 청양고추, 쑥갓을 올린다.
