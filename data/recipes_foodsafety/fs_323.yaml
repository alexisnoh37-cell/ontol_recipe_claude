steps:
- text: 먼저 영양부추를 뺀 재료로 양념장을 30분 전에 만들어준다.
- text: 쌀은 30분전에 불려주고 고구마는 껍질째 작은 깍두기 모양으로 잘라 냉수에 담가준다.
- text: 닭육수에 강황가루를 풀어주고 쌀과 고구마를 고루 섞어 밥을 해준다.
- text: 만들어진 양념장에 영양부추를 한입 크기로 잘라 최종 양념장을 만들어준다.
- text: 그릇에 강황고구마밥을 담아주고 양념장과 함께 완성한다.
