steps:
- text: 오징어는 내장을 빼서 흐르는 물에 깨끗이 씻은 후, 다리는 송송 다져주고 레몬즙을 살짝 뿌려준다.
- text: 강낭콩은 먼저 삶아준다.
- text: 피망, 당근, 양파, 대파, 파프리카는 송송 다져준다.
- text: 잘라준 오징어다리는 다진마늘과 살짝 볶아준다.
- text: 볼에 귀리밥을 넣고 카레가루를 넣고 모든 재료를 섞어 소 재료를 만든다.
- text: 오징어 안쪽에 밀가루를 묻혀주고 소를 채워 팬에 구워준다.
