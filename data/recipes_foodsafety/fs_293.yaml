steps:
- text: 버섯은 밑동을 제거해 먹기 좋게 손질하고, 양파는 채 썰고, 대파와 청양고추는 어슷 썬다.
- text: 토마토는 아주 잘게 다진다.
- text: 된장양념을 만든다.
- text: 냄비에 육수 재료를 넣고 15분간 끓인 뒤 체로 건더기를 건지고, 된장양념을 체에 내리면서 푼다.
- text: 버섯을 넣고 끓으면 토마토, 다진 마늘, 고춧가루, 들깻가루, 채 썬 양파를 넣고 끓인다.
- text: 송송 썬 대파와 청양고추를 넣고 조금 더 끓여 마무리한다.
