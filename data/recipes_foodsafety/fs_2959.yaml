steps:
- text: 소고기는 채썰고 마늘, 대파는 다진 뒤 섞는다.
- text: 1에 계란노른자와 밀가루, 물을 섞어 반죽하고 조그만 공 모양으로 만들어 튀긴다.
- text: 토마토는 껍질을 제거한 뒤 다지고, 마늘도 다진다.
- text: 식초, 설탕, 물을 끓이다가 다진 토마토, 마늘, 고춧가루를 넣어 끓인다.
- text: 전분으로 소스의 농도를 맞춘다.
- text: 소고기 가라야게에 칠리소스를 곁들인다.
