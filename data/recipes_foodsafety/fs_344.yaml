steps:
- text: 백미와 귀리는 세척해 백미는 30분, 귀리는 1시간 정도 불려준다.
- text: 귀리를 먼저 물을 넣어 볶아 충분히 익혀준다.
- text: 귀리가 어느 정도 익을 때 쯤 쌀을 섞어 한 번 더 볶아준다.
- text: 귀뢰와 쌀이 익어갈 때 쌀의 물 1배를 넣고 밥을 해 준다.
- text: 불을 끄고 크린베리를 바로 넣어서 뚜껑을 덮어 5분 후에 밥을 완성한다.
