steps:
- text: 닭살을 깎뚝 썰어 소금, 후춧가루, 밀가루 넣어 살살 털어 준비해 놓는다.
- text: 마늘과 토마토, 양파는 입자있게 다져 놓는다.
- text: 양송이는 껍질을 벗겨 다져 준비한다.
- text: 냄비에 버터 넣고, 다진 마늘과 양파를 볶는다.
- text: 볶아지는 냄비에 밀가루 뭍힌 닭살을 넣어 살짝 볶는다.
- text: ⑤번에 양송이와 다진 토마토, 토마토 소스, 올리고당, 굴소스를 넣고 살짝 볶다가 육수를 넣어 끓인 후 다시 우유를 넣고 은근히 끓이고, 스파게티는 약 10분 정도 삶아 건져 접시에 담아, 끓인 소스를 붓고, 위에 모짜렐라치즈를 올려 오븐에 약 5분 정도 구어 완성한다.
