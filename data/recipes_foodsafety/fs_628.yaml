steps:
- text: 두부는 3X4cm 크기로 썰어 소금을 살짝 뿌려둔다.
- text: 소금을 뿌려 놓은 두부는 물기를 제거하고 밀가루를 골고루 묻힌다.
- text: 팬에 기름을 두르고 두부를 앞뒤로 노릇노릇하게 구워 접시에 담는다.
- text: 매실액에 간장과 설탕을 넣고 골고루 섞어 소스를 만든다.
- text: 홍피망, 파프리카, 적채, 양파, 깻잎은 곱게 채썬다.
- text: 썰어 놓은 야채를 각각 물에 담궜다 건져 두부 옆에 담고 소스를 뿌리고 흑임자를 올린다.
