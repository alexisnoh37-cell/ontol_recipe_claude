steps:
- text: 사과와 배는 껍질을 베이킹파우더에 깨끗이 씻어 납작하게 썰어 설탕물에 담그어 색이 변하지 않게 준비한다.
- text: 바나나는 동글하게 썰고, 키위는 껍질을 제거하고 은행잎 모양으로 썰고, 파인애플은 가운데 심을 제거하고 사각형 모양으로 썰어놓는다.
- text: 마는 껍질을 벗겨 동글하게 썰어 준비 한다.
- text: 마늘은 입자있게 다져, 팬에 식용유를 두르고 살짝 볶는다.
- text: 고춧가루에 볶은 마늘(④), 식초. 설탕, 간장, 고춧가루를 넣고, 골고루 섞어 양념장을 만든다.
- text: 설탕물에 사과와 배를 건지고, 준비한 과일과 마를 담은 후 먹기 직전에 만들어 놓은 양념장을 넣어 버무려 완성한다.
