steps:
- text: 망고를 먹기 좋은 크기로 자르고 소스재료로 소스를 만들어준다.
- text: 호두를 곱게 다져준다.
- text: 안심에 만들어진 소스를 발라주고 곱게 다진 호두가루를 발라준다.
- text: 감자, 당근, 아스파라거스는 먹기 좋은 크기로 잘라서 버터에 볶아준다.
- text: 호두를 발라준 안심을 구워준다.
- text: 남은 망고소스를 다시 졸여서 구워진 안심 위에 뿌려주고 볶은 채소랑 완성한다.
