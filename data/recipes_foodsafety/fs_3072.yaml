steps:
- text: 삶은 문어, 배, 호두, 아몬드는 작게 자르고, 파와 마늘은 다진다.
- text: 대추는 돌려 깍기 하여 돌돌 말아 자른다.
- text: 돈민찌, 우민찌는 잘 섞어주고 ①재료와 참기름, 후추, 찹쌀가루를 넣어 치대어 준다.
- text: 데쳐서 익힌 떡에 밀가루를 얇게 입히고 ③의 반죽을 붙혀 떡갈비를 만든다.
- text: 떡갈비를 팬에 올려 속이 익을 때까지 굽는다.
- text: 잘라놓은 대추와 잣을 고명으로 올려 완성한다.
