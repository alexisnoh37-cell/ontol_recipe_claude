steps:
- text: 양배추, 양파, 표고버섯, 양송이버섯, 파프리카, 피망은 먹기 좋은 크기로 깍둑 썰고, 대파는 어슷 썬다.
- text: 마늘은 편 썰어 기름 두른 팬에 투명해질 때까지 4~5분 정도 볶는다.
- text: 토마토는 김 오른 찜기에 찐 후 껍질을 벗겨 양파와 함께 으깨가며 볶는다.
- text: 비트도 곱게 갈아 넣고 함께 볶는다.
- text: 식용유를 두른 팬에 돼지고기를 넣고 토마토비트소스와 함께 볶는다.
- text: 양념을 넣어 간을 맞춘 후 양배추, 표고버섯, 양송이버섯, 파프리카, 피망, 대파를 넣고 살짝 볶아 마무리한다.
