steps:
- text: 두부는 살짝 구워 물기를 제거하고 멸치는 설탕과 함께 볶는다.
- text: 알비트, 시금치에 약간의 물을 넣고 각각 믹서에 간다.
- text: 찹쌀가루를 알비트, 시금치 간 물에 반죽한다.
- text: 두부를 으깨 볶은 멸치와 함께 부침가루에 넣고 반죽한다.
- text: 식용꽃과 쑥갓을 씻어 물기를 제거한다.
- text: 팬에 3과 4를 각각 부치고 식용꽃과 쑥갓으로 장식하고 꿀을 곁들인다.
