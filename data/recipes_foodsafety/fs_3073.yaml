steps:
- text: 도라지, 사과, 배, 연근은 갈아서 뭉근하게 조려 퓨레를 만든다.
- text: 연근, 토마토, 양파, 양송이버섯, 당근, 청피망 등 모든 채소는 곱게 다진다.
- text: 고기에 퓨레, 달걀, 후추, 생강, 빵가루를 넣어 찰지게 반죽하고 납작하게 빚어서 오븐에 굽는다.
- text: 소스제조를 위해 밀가루, 버터를 볶아 루를 만든다.
- text: ④에 ②에서 다져놓은 야채를 넣어 끓이고, 소금간과 레몬즙을 뿌려준다.
- text: 구운 수제함박스테이크에 새싹채소-파인애플-방울토마토 순으로 장식하고 소스와 함께 제공한다.
