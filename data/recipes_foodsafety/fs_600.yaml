steps:
- text: 닭가슴살은 곱게 다진다
- text: 시금치와 브로콜리는 끓는 물에 데쳐 찬물에 헹구고 토마토와 함께 입자있게 다져 다진 닭가슴살과 섞는다.
- text: 닭가슴살에 치즈를 섞는다.
- text: 고구마는 찜통에 넣고 쪄서 체에 내린다.
- text: 냄비에 물, 복분자, 고구마를 넣고 끓인다.
- text: 5번에 전분을 넣고 걸죽하게 소스를 완성하고, 아스파라거스와 버섯은 팬에 구워 쪄낸 닭테린 옆에 담은 뒤 소스를 올린다.
