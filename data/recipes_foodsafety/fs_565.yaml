steps:
- text: 닭가슴살에 소금, 후춧가루로 밑간하고 랩으로 말아 50℃ 정도의 물에서 천천히 익힌다.
- text: 달걀은 황백 지단을 만들어 채를 썰고, 표고버섯, 당근, 오이, 파프리카 및 고구마도 채를 썰어 팬에 볶는다.
- text: 미나리는 끓는 물에 소금을 넣고 살짝 데친 뒤 찬물에 헹군다
- text: 취나물은 끓는 물에 소금을 넣고 살짝 데친 뒤 찬물에 헹구어 넓게 펴 놓는다.
- text: 누룽지는 손으로 잘라 기름에 튀긴다.
- text: 취나물에 익힌 닭가슴살과 볶은 야채를 돌돌 말아 미나리를 감고 먹기 좋은 크기로 썰어 접시에 담은 뒤 튀긴 누룽지를 올린다.
