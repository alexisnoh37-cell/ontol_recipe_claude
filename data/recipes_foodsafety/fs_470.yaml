steps:
- text: 판젤라틴을 얼음물에 담군 후 흐물흐물 해질 때까지 불려 둔다.
- text: 토마토는 물을 넣고 갈아 준비한다.
- text: 갈아 놓은 토마토에 올리고당과 레몬즙을 넣어 골고루 섞는다.
- text: 레몬즙을 넣은 토마토를 은근히 끓인다.
- text: 끓고 있는 토마토에 불린 젤라틴을 넣고 녹여주고, 젤라틴이 녹으면 불을 끄고, 접시에 담아 냉장고에 약 20분 정도 굳힌다.
- text: 팬에 설탕을 넣고 설탕이 녹으면, 블루베리를 넣어 은근히 졸여진 후 굳어진 토마토젤리 위에 올려 완성한다.
