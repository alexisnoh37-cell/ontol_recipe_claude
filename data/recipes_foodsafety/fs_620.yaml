steps:
- text: 잡곡은 깨끗이 씻어 충분히 불린 뒤 밥을 짓는다.
- text: 호박, 청피망, 홍피망, 양파, 표고버섯은 입자있게 다지고 부추는 송송 썰고 마늘은 다진다.
