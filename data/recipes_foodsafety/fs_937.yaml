steps:
- text: 곱게 다진 새우살에 소금, 흰 후춧가루로 밑간한다.
- text: 1에 달걀흰자, 전분을 넣어 치댄후 지름 2cm 정도의 완자를 만든다.
- text: 불린 당면, 팽이버섯, 부추는 5cm 길이로 자르고 홍고추는 2cm 길이로 채썬다.
- text: 냄비에 다시마 육수를 넣어 끓으면 2의 완자를 넣고 불을 줄인다.
- text: 완자가 떠오르면 불린 당면, 팽이버섯, 부추, 홍고추 순으로 넣는다.
- text: 다진마늘, 국간장, 소금으로 간한다.
