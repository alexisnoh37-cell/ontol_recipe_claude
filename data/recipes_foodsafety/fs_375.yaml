steps:
- text: 쪽갈비는 물에 와인을 넣어 80% 이상을 삶아 냉수에 헹군다. 데쳐낸 쪽갈비를 올리브오일 과 로즈마리와 통후추를 뿌려서 구워준다.
- text: 소스를 만들어준다.
- text: 레몬껍질은 채 썰어준다.
- text: 방울토마토는 먹기 좋게 자르고 양파도 먹기 좋게 잘라 팬에 구워준다.
- text: 쪽갈비를 레몬껍질과 함께 굽는다.
- text: 구워진 채소에 함께 쪽갈비를 굽고 소스와 함께 완성한다.
