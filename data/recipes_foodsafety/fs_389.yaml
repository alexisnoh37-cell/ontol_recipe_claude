steps:
- text: 쇠고기는 칼집을 살짝 넣어준 후 건 바질을 뿌려 1시간 정도 숙성시킨다.
- text: 감자는 껍질을 벗긴 후 먹기 좋게 잘라 뜨거운 물에 70% 정도 익혀준다.
- text: 익혀준 감자를 버터를 살짝 바른 후 팬에 파슬리가루를 뿌려 구워준다.
- text: 시금치는 데쳐내 물기를 제거하고 다진 양파와 함께 버터에 볶아준다.
- text: 사과는 사방 1cm 크기로 자른 후 레몬즙을 살짝 뿌려준 후 버터에 볶아 소스를 만들어 준다.
- text: 숙성된 소고기를 팬에 구워주고 곁들이 채소와 소스를 완성한다.
