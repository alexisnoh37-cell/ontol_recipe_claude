steps:
- text: 토마토 페이스트는 신맛이 날아가도록 볶아 준다.
- text: 피망, 파프리카와 양파 , 애호박은 작은 사각형으로 잘라준다.
- text: 잘라준 채소를 올리브오일에 볶은 뒤 볶아진 페이스트에 함께 볶아준다.
- text: 가지는 어슷하고 도톰하게 잘라준다.
- text: 가지를 팬에 구워준다.
- text: 팬에 구운 가지를 올려주고 볶아진 채소를 올려주고 다진 치즈를 뿌려서 완성한다.
