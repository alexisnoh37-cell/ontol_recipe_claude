steps:
- text: 서리태를 2시간 정도 물에 불려둔다.
- text: 셀러리, 양파, 청피망, 토마토를 굵게 다지고 베이컨은 얇게 채썬다.
- text: 팬에 식용유를 두르고 다진 마늘을 넣어 볶아 향을 낸 뒤 다진 소고기를 넣어 볶는다.
- text: 팬에 식용유를 두르고 베이컨, 양파, 셀러리, 토마토, 청피망 순으로 넣어 볶는다.
- text: 냄비에 현미, 볶은 소고기, 닭육수를 넣어 현미가 반쯤 익도록 끓인다.
- text: 불린 서리태, 볶은 채소, 월계수잎, 타임, 카엔페퍼를 넣고 현미와 서리태가 완전히 익도록 낮은불에서 은근히 끓인다.
