- text: 끓는 물(800㎖)에 양배추와 시금치를 넣어 데친 뒤 찬물에 헹궈 체에 밭쳐 물기를 제거한다.
- text: 데친 시금치와 오이, 당근은 얇게 채 썬다.
- text: 데친 양배추를 깔고 위에 채 썬 재료를 올려 돌돌 말아준다.
- text: 양념장을 만든다.
- text: 양배추말이를 한입 크기로 썰어 그릇에 담은 뒤 양념장을 곁들인다.
