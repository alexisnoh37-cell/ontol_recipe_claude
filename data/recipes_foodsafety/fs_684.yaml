steps:
- text: 머위대를 잘라 데쳐서 껍질을 벗긴다.
- text: 데친 머위대를 찬물에 1~2 시간 담가 쓴맛을 제거한다.
- text: 양념을 넣어 머위대를 무친다.
- text: 팬에 들기름을 두르고 양념한 머위대를 볶는다.
- text: 물 반컵을 넣고 국물이 자박하도록 푹 끓여낸다.
- text: 완성된 머위나물을 식혀서 냉장고에 차게 보관하였다가 먹는다.
