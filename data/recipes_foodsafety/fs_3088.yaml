steps:
- text: 부추는 깨끗이 씻어 4~5cm 길이로 썬다.
- text: 애호박, 당근, 양파는 가늘게 채썬다.
- text: 홍고추, 풋고추는 어슷하게 썬다.
- text: 검정콩은 삶아서 거칠게 갈고, 콩을 삶은 물은 보관한다.
- text: 모든 재료를 섞고 콩 삶은 물로 반죽 농도를 맞춘다.
- text: 1인 분량씩 노릇하게 부친다.
