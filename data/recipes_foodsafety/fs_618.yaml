- text: 닭가슴살을 소금과 후추로 밑간한다.
- text: 토마토와 마늘은 입자있게 다진다
- text: 다진 토마토와 마늘을 냄비에 담아 볶다가 물과 오레가노를 넣고 끓여 소스를 만든다.
- text: 팬에 올리브오일을 두르고 밑간 한 닭가슴살을 노릇노릇하게 굽는다.
- text: 가지는 길게 썬다.
- text: 가지에 치즈를 감싸 익히고, 구운 닭 스테이크를 옆에 담고 소스를 옮긴다.
