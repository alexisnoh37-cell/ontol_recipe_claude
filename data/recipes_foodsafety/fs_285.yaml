steps:
- text: 보리를 김 오른 찜기에 넣고 쪄서 저염된장과 섞은 뒤 재워 보리된장을 만든다.
- text: 검은콩은 삶아서 간다.
- text: 검은콩 삶은 물(200g)에 바지락, 멸치, 다시마를 넣고 끓여 육수를 만든다.
- text: 애호박, 양파, 검은콩두부, 표고버섯은 깍둑 썰고, 붉은 고추, 청양고추, 대파는 어슷하게 썬다.
- text: 육수에 보리된장을 풀고 호박, 양파, 표고버섯을 넣고 끓인다.
- text: 갈아놓은 검은콩을 넣어 농도를 맞춘 후 검은콩두부, 대파, 고추를 넣고 한소끔 끓여 마무리한다.
