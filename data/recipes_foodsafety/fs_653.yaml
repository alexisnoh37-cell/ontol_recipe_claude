steps:
- text: 곤약은 얇게 썬다.
- text: 끓는 물에 식초를 한두 방울 넣고, 썰어 놓은 곤약을 데친다.
- text: 표고는 불려서 채를 썬다.
- text: 마늘을 다져서 냄비에 볶는다.
- text: 냄비에 표고버섯과 새송이버섯을 넣고 함께 볶는다.
