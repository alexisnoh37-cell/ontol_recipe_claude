steps:
- text: 뜨거운 물에 실곤약을 넣고, 약 20초 정도 삶아 건진다.
- text: 양파와 청 피망, 홍고추는 약 5cm 길이로 채를 썰고, 홍고추 몇 개는 어슷썰어 놓는다.
- text: 굴소스에 다진 마늘과 액젓을 넣고 섞는다.
- text: 냄비에 소스(③)을 넣고 바글바글 끓여 팟타야소스를 만들어 놓는다.
- text: 소고기는 만들어 놓은 팟타야소스에 볶는다.
- text: 팬에 기름을 두르고, 채소를 먼저 볶다가 실곤약을 넣고 살짝 볶은 후 팟타야소스를 넣어 다시 볶다가 접시에 담고, 숙주와 고기를 올려 완성한다.
