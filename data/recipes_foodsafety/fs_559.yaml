steps:
- text: 양상추, 부추를 데친다.
- text: 양송이버섯은 얇게 슬라이스하고 팬에 기름을 살짝 두르고 굽는다.
- text: 전복은 수저로 떼어 소금으로 씻고 일정한 크기로 썰어 팬에 굽는다.
- text: 닭고기는 일정한 크기로 썬 뒤 삶고, 소고기도 일정한 크기로 썰어 양념 한 뒤 볶는다.
- text: 토마토, 양파, 당근은 잘게 썰고, 쌀은 깨끗이 씻어 불려 야채를 넣고 밥을 짓는다.
- text: 쪄낸 양배추에 볶은 고기, 삶은 닭고기, 구운 전복, 밥을 넣고 돌돌 말아 부추로 묶어 접시에 담고, 한쪽에 구운 버섯을 담는다.
