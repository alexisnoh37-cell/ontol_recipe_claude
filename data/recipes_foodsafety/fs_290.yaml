steps:
- text: 물(600g)에 육수 재료를 넣고 15분간 센 불에 끓인 후 10분간 약한 불로 끓여 육수를 만든다.
- text: 우삼겹을 펼쳐 깔고 그 위에 깻잎, 느타리버섯, 팽이버섯 순으로 올린다.
- text: 돌돌 말고 쪽파로 묶어 고정시킨다.
- text: 육수에 저염된장을 풀고 다진 마늘을 넣은 뒤 청양고추와 돌돌 만 고기를 넣고 약한 불에 살짝 익힌다.
- text: 그릇에 담은 뒤 붉은 고추를 올려 마무리한다.
