steps:
- text: 병어에 칼집을 내어 소금을 뿌린다.
- text: 무는 두툼하게 썰고 양파는 굵게 채 썰고 고추와 대파는 어슷 썬다.
- text: 양념장 재료를 모두 섞어 양념장을 만든다.
- text: 양념장의 ¼만 남기고 나머지 양념장을 물 반컵에 풀어 무를 넣어 끓인다.
- text: 무에 간이 배면 양파와 병어를 넣고 남은 양념장을 넣어 졸여준다.
- text: 고추와 대파를 넣어 마무리한다.
