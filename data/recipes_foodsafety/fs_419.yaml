steps:
- text: 양파는 채 썰어 물에 담가주고, 오이는 돌려 깎기 해서 물에 담가준다.
- text: 연근은 껍질을 까고 얇게 썰어서 식초 2방울을 넣은 물에 데쳐준다.
- text: 밤도 아주 얇게 썰어서 물에 담가준다.
- text: 소스 재료를 모두 넣고 믹서에 간다.
- text: 물에 데쳐낸 연근은 키친타월에 올려서 물기를 완전히 제거한다.
- text: 모든 재료를 넣고 소스에 버무려준다.
