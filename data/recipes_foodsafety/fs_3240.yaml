steps:
- text: 감자는 슬라이스하고, 양파는 채 썬다.
- text: 끓는 물(5컵)에 감자를 넣어 7분간 삶아 건진다.
- text: 중간 불로 달군 팬에 버터를 두른 뒤 양파를 넣어 3~5분간 볶아 꺼낸다.
- text: 믹서에 삶은 감자와 양파, 우유를 넣어 곱게 간다.
- text: 냄비에 믹서에 간 재료들을 넣어 약한 불로 3분간 끓여 농도를 맞춘다.
- text: 소금과 후춧가루로 간을 맞춘 뒤 시판 크루통과 파슬리가루를 올린다.
