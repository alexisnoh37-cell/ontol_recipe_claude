steps:
- text: 마늘은 곱게 다지고 양파, 당근, 방울토마토는 입자있게 다진다.
- text: 토마토는 씨와 껍질을 제거하고 채를 썰어놓는다.
- text: 브로컬리를 끓는 물에 데쳐 찬물에 헹구어 작게 썰어 준비한다.
- text: 펜네는 끓는 물에 약 10분 정도 삶아 건진다.
- text: 건져진 펜네는 올리브오일을 넣어 무친 후 그릇에 담아놓는다.
- text: 냄비에 오일을 넣고 마늘과 양파를 볶다가 당근과 방울토마토를 넣어 볶으면서 육수를 붓고 설탕과 소금, 레몬즙, 월계수잎을 넣고 끓인 뒤 월계수잎을 건져내고, 차갑게 식힌 후 그릇에 담겨 있는 펜네에 토마토채(②)와 브로컬리(③)를 함께 넣어 담아 완성 한다.
