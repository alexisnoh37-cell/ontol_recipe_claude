steps:
- text: 고구마는 삶은 뒤 껍질을 제거한다.
- text: 쌀가루, 보릿가루, 밀가루는 체에 내린다.
- text: 체에 내린 가루에 삶은 고구마, 감말랭이, 냉동딸기, 흑임자를 넣고 믹서에 간다.
- text: 믹서에 간 반죽을 10cm 길이의 스틱모양으로 성형한다.
- text: 170℃ 기름에 반죽을 튀긴다.
- text: 기름을 제거하고 그릇에 담는다.
