steps:
- text: 새우는 껍질을 벗겨 손질한다.
- text: 보리는 깨끗이 씻어 불린다.
- text: 불린 보리와 새우에 5배 정도 물을 넣고 죽을 쑨다.
- text: 고등어는 포를 뜬다.
- text: 포 뜬 고등어에 생강, 레몬, 막걸리를 넣고 비린맛을 제거한다.
