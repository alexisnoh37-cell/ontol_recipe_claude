steps:
- text: 돼지고기(등심)을 고기망치로 두드려 1cm 정도 두께로 편다.
- text: 돼지등심에 소금, 후추로 간을 한다.
- text: 파마산치즈, 빵가루, 건바질, 타임을 섞어 허브 빵가루를 만든다.
- text: 고기에 밀가루, 달걀물, 허브 빵가루 순으로 묻힌다.
- text: 가열한 팬에 기름을 두르고 커틀렛을 익힌다.
- text: 커틀렛이 익으면 기름을 빼고 그릇에 담는다.
