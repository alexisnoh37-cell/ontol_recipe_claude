steps:
- text: 연근 껍질을 제거하고 0.5cm 두께로 끓는 물에 소금, 식초를 넣어 살짝 데친다.
- text: 고구마는 껍질을 제거하고 삶아 으깬다.
- text: 견과류는 잘게 다져 삶은 고구마에 섞어 동그랑땡 모양으로 만든다.
- text: 튀김가루, 달걀, 소금을 넣고 튀김 반죽을 만든다.(백년초가루로 2가지 색의 반죽을 만든다)
- text: 연근 사이에 으깬 고구마를 넣는다.
- text: 연근 샌드위치를 만들어 170℃ 기름에 튀긴다.
