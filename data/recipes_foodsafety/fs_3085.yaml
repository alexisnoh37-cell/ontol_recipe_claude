steps:
- text: 연근은 얇게 썰어 찬물에 담가 전분기를 제거한다.
- text: 건새우는 곱게 갈아준다.
- text: 시금치, 비트는 각각 믹서기에 갈아 즙을 준비한다.
- text: 튀김가루에 새우가루와 물을 넣어 반죽을 한다.
- text: 반죽에 시금치, 카레, 비트를 각각 넣어 3가지 색의 반죽을 만든다.
- text: 연근에 전분가루를 묻히고 튀김옷을 입혀 바삭하게 튀겨낸다.
