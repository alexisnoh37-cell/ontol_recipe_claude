steps:
- text: 냄비에 다시마가 잠길 정도의 물을 붓고 중불에서 삶아 10여분 두었다가 건져 찬물에 휑군 뒤 18cm 크기로 자른다.
- text: 청, 홍고추는 씨를 빼 잘게 다지고 부추와 새우 살도 다진다.
- text: 밀가루에 물과 소금을 넣고 반죽을 한 뒤 다진 채소들을 넣고 골고루 섞는다.
- text: 3에 다시마를 넣어 반죽 물을 입히고 팬에 기름을 둘러 노릇하게 지진다.
- text: 다시마전이 한 김 식은 후 돌돌 말아 자를 수 있도록 꼬치로 고정시킨다.
- text: 5를 4cm 정도 길이로 자르고 멸치액젓소스를 곁들인다.
