steps:
- text: 단호박, 감자는 가늘게 채 썰어 기름에 바싹 튀겨준다
- text: 불고기에 다진 양파를 섞어 양념장에 버무려 준다.
- text: 양념된 불고기는 완자로 만들어 밀가루, 계란, 빵가루 순으로 묻혀서 기름에 튀겨준다.
