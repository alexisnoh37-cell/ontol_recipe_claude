steps:
- text: 소고기와 돼지고기를 섞어, 후춧가루, 매실액, 맛술을 넣어 재워둔다.
- text: 양파와 당근, 새송이, 대파는 입자있게 다지고 마늘은 곱게 다져 준비한다.
- text: 재워둔 고기(①)에 파, 마늘, 양파, 당근, 새송이를 넣고 골고루 섞는다.
- text: 떡은 잘게 썰어 뜨거운 물에 잠시 담그어 놓는다.
- text: 섞어 놓은 고기(③)에 불려 놓은 떡을 섞는다.
- text: 고기반죽(⑤)을 조금씩 떼어 둥글게 완자를 빚고, 팬에 기름을 둘러 굴리듯이 굽는다. 냄비에 간장과 올리고당을 넣고 끓이다가 구운 완자와 참기름을 넣어 은근히 졸인 뒤 통깨를 얹어 완성한다.
