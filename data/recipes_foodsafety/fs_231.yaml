steps:
- text: 찬물에 다시마를 넣고 끓여 건져 내고 불을 끈 후 가다랑어포를 넣어 우려 육수를 만든다.
- text: 두부, 가지는 깍둑 썰고, 표고버섯, 양파는 채 썰고, 달걀은 곱게 푼다.
- text: 두부, 가지는 물기를 제거한 뒤 후춧가루로 밑간하고 녹말가루를 얇게 입혀 식용유를 두른 팬에서 구워 건진다.
- text: 육수(1컵)에 청주, 설탕, 간장을 넣고 표고버섯, 양파를 넣고 조려 덮밥 소스를 만든다.
- text: 달걀물을 붓고 익을 때까지 저은 후 녹말물을 넣어 되직하게 끓인다.
- text: 밥을 그릇에 담고 덮밥소스를 곁들인 후 두부, 가지, 가다랑어포를 얹어 마무리한다.
