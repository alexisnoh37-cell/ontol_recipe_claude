steps:
- text: 냄비에 무와 양지육, 마늘을 넣고 은근히 끓여 육수를 만들어 놓는다.
- text: 배추와 미나리는 면보를 깔고 찜통에서 약 10분 정도 쪄서 식혀놓는다.
- text: 두부는 면보에 넣어 손으로 물기를 짜 놓는다.
- text: 부추는 송송 썰고, 표고, 느타리버섯은 잘게 다지고, 소고기도 다져 놓고, 저염 간장과 파, 마늘, 참기름, 후춧가루, 통깨를 넣고 잘 섞어서 만두속을 만들 어 놓는다.
- text: 쪄놓은 배추를 한 장 펴놓고, 그 위에 만들어 놓은 만두속을 넣어 양 쪽을 접어 말아준다.
- text: 말아놓은 배추만두를 쪄 놓은 미나리 끈으로 묶은 후, 만들어 놓은 육수가 끓으면 배추만두를 넣고 간장으로 간을 한 뒤 한 번 더 끓여서 완성한다.
