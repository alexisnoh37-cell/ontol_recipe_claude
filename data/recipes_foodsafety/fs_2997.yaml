steps:
- text: 양파, 피망은 반은 다지고 반은 작은 주사위모양으로 썰고 당근은 다진다.
- text: 두부는 칼등으로 으깬 뒤 물기를 제거한다.
- text: 2에 캔참치, 다진채소, 표고버섯가루, 밀가루, 후추를 넣어 반죽한 뒤 치대 모양을 만든다.
- text: 팬에 식용유를 두르고 3을 노릇하게 굽고 1을 볶는다.
- text: 토마토는 주사위모양으로 썰어 케찹과 함께 볶아 소스를 만든다.
- text: 접시에 스테이크와 볶은 채소를 담고 토마토소스를 곁들인다.
