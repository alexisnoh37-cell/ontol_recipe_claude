steps:
- text: 양상추는 깨끗이 씻어 먹기 좋은 크기로 썬다.
- text: 당근과 적양배추는 곱게 채 썰고, 치커리는 잘게 썬다.
- text: 사과는 껍질과 심을 제거한 뒤 한입 크기로 썬다.
- text: 파인애플은 껍질과 심을 제거한 뒤 한입 크기로 썬다.
- text: 손질한 과일과 레몬즙을 믹서에 넣어 곱게 갈아 드레싱을 만든다.
- text: 양상추와 당근, 적양배추를 접시에 깔고 드레싱을 곁들여 마무리한다.
