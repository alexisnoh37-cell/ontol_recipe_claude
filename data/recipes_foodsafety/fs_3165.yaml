steps:
- text: 순무는 2.5*2.5*0.3 cm 크기로 나박 모양으로 썬다.
- text: 고운 고춧가루, 굵은 고춧가루, 다진마늘, 소금, 요거트를 섞어 양념장을 만든다.
- text: 쪽파는 0.2cm 크기로 송송 썰어 준비한다.
- text: 순무에 양념장을 넣고 버무려 준다.
- text: 양념된 순무를 하루 정도 냉장보관하여 숙성시킨다.
- text: 숙성된 순무김치에 쪽파를 고명으로 얹어 제공한다.
