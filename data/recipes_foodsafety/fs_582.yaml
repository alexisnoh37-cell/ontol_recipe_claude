steps:
- text: 새우는 껍질을 벗겨 다진다.
- text: 오징어는 썰어서 다진다.
- text: 양파, 샐러리, 마늘은 다져 팬에 볶아 식힌다.
- text: 토마토는 껍질을 벗겨 다진다.
- text: 다진 토마토를 팬에 볶다가 다진 새우와 오징어, 밥을 넣어 볶고, 3번을 넣고 볶아 동그랗게 모양을 만든다
- text: 동그란 밥에 레몬을 섞은 달걀노른자를 묻히고 빵가루 옷을 입혀 팬에 기름을 둘러 굴려가며 익힌 후 접시에 담고 어린잎을 올린다.
