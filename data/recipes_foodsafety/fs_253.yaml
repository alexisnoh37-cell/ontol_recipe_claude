steps:
- text: 오리고기에 고기 밑간을 해 재운다.
- text: 가지, 양파, 파프리카, 새송이버섯, 브로콜리는 깍둑 썰고, 부추는 5㎝ 길이로 썰고, 방울토마토는 꼭지만 따서 씻은 뒤 2등분한다.
- text: 토마토, 양파, 풋고추는 갈아둔다.
- text: 팬에 기름을 두르고 다진 마늘을 넣고 볶다가 고추장과 갈아놓은 토마토, 양파, 풋고추와 물엿을 넣고 볶으면서 농도를 맞춰 토마토고추장소스를 만든다.
- text: 오리고기와 가지, 양파, 파프리카, 새송이버섯, 브로콜리를 같이 볶다가 토마토고추장소스를 넣어준다.
- text: 접시에 담은 뒤 부추와 방울토마토를 곁들여 마무리한다.
