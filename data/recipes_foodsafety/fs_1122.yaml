steps:
- text: 다양한 색상의 가루를 각각 멥쌀가루와 섞은 뒤 물 15g을 넣고 섞는다.
- text: 1번을 한번 더 체에 내리고 설탕 3g을 넣고 섞는다.
- text: 2번에 불린 대추 속살을 섞는다.
- text: 찜기에 김이 오르면 면보를 깔고 모양틀을 넣은 뒤 3번을 넣는다.
- text: 윗면을 고르게 정리하고 20분 간 찐다.
- text: 호박씨, 대추로 장식한다.
