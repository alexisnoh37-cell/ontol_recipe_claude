steps:
- text: 따뜻한 물에 부린 목이버섯, 동태살, 당근, 오이, 양파를 먹기 좋은 크기로 썬다.
- text: 동태살에 소금과 흰후추로 밑간을 하고 녹말과 계란 흰자를 섞어 튀김옷을 만든다.
- text: 동태살에 튀김옷을 입혀 기름에 튀긴다.
- text: 물, 계란, 튀김가루를 섞어 튀김옷을 만든 뒤 단호박을 튀긴다.
- text: 프라이팬에 기름을 두르고 당근, 양파, 목이버섯을 볶는다.
- text: 5에 키위소스, 식초를 넣고 전분물을 넣어 농도를 맞춘 뒤 튀긴 재료와 오이를 섞는다.
