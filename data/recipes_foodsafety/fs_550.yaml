steps:
- text: 곤약은 끓는 물에 넣어 데친다.
- text: 데친 곤약은 찬물에 헹구어 채에 받쳐 물기를 빼 놓는다.
- text: 무는 얇게 썰어 식초, 소금, 설탕에 넣어 김치를 만든다.
- text: 파프리카는 5cm 길이로 썰고, 배와 오이도 같은 길이로 얇게 썬 뒤 오이는 살짝 절인다.
- text: 달걀은 삶아 껍질을 벗겨, 실로 잘라 놓는다.
- text: 동치미 국물에 배즙 , 홍초, 설탕 , 겨자, 식초를 넣어 섞는다. 그릇에 곤약국수를 담고, 무김치(③)와 준비한 채소(④)를 올리고, 삶은 달걀(⑤)을 얹고, 국물을 살며시 넣어 완성한다.
