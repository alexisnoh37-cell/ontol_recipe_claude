steps:
- text: 고구마는 껍질을 벗겨 1cm 크기로 깍둑썰기 한 뒤 삶는다.
- text: 양송이버섯과 양파는 굵게 다지고 느타리버섯은 데친다.
- text: 냄비에 식용유를 넣어 양파, 고구마, 양송이버섯 순으로 볶는다.
- text: 현미 1/2공기와 물 1/2컵을 넣어 믹서에 굵게 간다.
- text: 3에 4와 나머지 우유를 넣어 끓인다.
- text: 5를 그릇에 담고 고구마, 데친 느타리버섯을 가운데 담는다.
