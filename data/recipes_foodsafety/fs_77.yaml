steps:
- text: 그릇에 다진 마늘, 사과식초, 설탕, 물을 섞어 설탕이 녹을 때까지 저어 마늘 드레싱을 만든다.
- text: 양상추는 찬물에 담갔다가 물기를 빼서 한입 크기로 찢고, 무순은 손질하여 물기를 빼고, 방 울토마토는 꼭지를 떼고 반으로 자른다.
- text: 키위는 껍질을 벗기고 둥근 모양으로 썰고 그릇에 양상추, 방울토마토, 키위, 아몬드, 땅콩을 넣고 마늘 드레싱에 버무려 접시에 담아 무순을 곁들인다.
