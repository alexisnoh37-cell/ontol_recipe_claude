steps:
- text: 검은콩은 깨끗이 씻어 약 12시간 정도 충분히 불린다.
- text: 불린 검은콩은 20분 정도 삶아 깨끗이 씻는다.
- text: 삶은 검은콩은 믹서기에 곱게 갈아 차갑게 식힌다.
- text: 오이는 씨를 제거하고 깨끗이 씻어 채썬다.
- text: 물을 끓여 메밀면을 삶고, 찬물에 여러번 헹구어 건져 물기를 뺀다.
- text: 메밀면을 그릇에 담고 차가운 콩 국물, 땅콩, 잣, 오이, 방울토마토 및 통깨를 올린다.
