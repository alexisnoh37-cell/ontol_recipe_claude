steps:
- text: 레몬소스를 만들어 약한 불에 졸인다.
- text: 미나리는 4cm 간격으로 썬 뒤 잎 부분을 레몬소스에 버무려 놓는다.
- text: 즙을 짜고 남은 레몬은 얇게 썰어 준비한다.
- text: 명태는 손질한 뒤 후춧가루를 뿌려 밑간한다.
- text: 김 오른 찜기에 면포를 깔고 명태를 올린 뒤 미나리줄기와 얇게 썬 레몬을 올려서 중간 불에서 10분, 약한 불에서 10분 정도 찐다.
- text: 명태가 다 익으면 레몬소스에 버무린 미나리 잎과 남은 레몬소스를 끼얹어 마무리한다.
