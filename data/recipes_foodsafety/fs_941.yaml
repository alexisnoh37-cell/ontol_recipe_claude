steps:
- text: 당근과 감자를 2cm 주사위모양으로 자르고 버섯은 4등분한다.
- text: 산마를 끓는 물에 데친다.
- text: 기름을 두른 팬을 가열한 후 당근, 감자, 데친 마를 넣고 볶은 뒤 육수를 넣는다
- text: 육수가 끓으면 양송이버섯과 목이버섯을 넣고 소금으로 간한다.
- text: 물 전분을 넣어 농도를 맞춘다.
- text: 참기름을 넣어 향을 낸다.
