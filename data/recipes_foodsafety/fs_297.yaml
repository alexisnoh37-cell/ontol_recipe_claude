steps:
- text: 냄비에 육수 재료와 물(400g)을 넣고 푹 끓인다.
- text: 양송이버섯을 잘게 다진 뒤 버터에 살짝 볶아 건져 한김 식힌 뒤 닭다리살과 닭가슴살, 아몬드를 다져 볶은 양송이버섯과 섞어 동그랗게 빚어 밀가루옷을 입힌다.
- text: 식용유(15g)를 두른 팬에서 겉을 노릇하게 굽는다.
- text: 육수(150g), 우유, 들깻가루를 끓여 소스를 만든 뒤 아몬드 치킨볼과 브로콜리를 넣고 졸인다.
- text: 마늘은 편 썰어 낮은 온도의 식용유에서 바삭하게 튀긴다.
- text: 접시에 아몬드치킨볼을 담고 튀긴 마늘을 얹어 마무리한다.
