steps:
- text: 오이, 양파, 파프리카는 같은 길이로 채 썰고, 도토리묵은 2~3cm 두께로 채 썬다.
- text: 양파는 찬물에 5분간 담가 매운맛을 제거하고, 해조국수는 찬물에 헹궈 건진다.
- text: 양념장을 만든다.
- text: 그릇에 해조국수를 가운데 담고, 손질한 채소와 묵을 올린다.
- text: 양념장을 곁들여 마무리한다.
