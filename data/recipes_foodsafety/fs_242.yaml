steps:
- text: 닭가슴살은 곱게 다진다.
- text: 당근은 채 썰어서 단촛물에 5분 정도 절이고, 시금치는 데쳐서 물기를 제거하고, 마른 표고버섯은 불린 뒤 곱게 채를 썰어 간장과 참기름에 버무린다.
- text: 종이포일에 다진 가슴살을 올리고 그 위에 시금치, 당근, 표고버섯과 견과류를 올려 말아준다
- text: 김 오른 찜기에 넣어서 25분간 찐다.
- text: 겨자소스를 만든다.
- text: 닭가슴살말이에 겨자소스를 곁들여 마무리한다.
