steps:
- text: 끓는 물에 바지락을 넣고, 바지락이 입을 벌릴 때 까지 삶는다.
- text: 삶아진 바지락을 채에 밭쳐 바지락 국물을 만들어 놓는다.
- text: 브로컬리는 끓는 물에 소금을 조금 넣어 데쳐 찬물에 헹구어 잘라놓고, 마늘은 편으로 썰고, 파프리카는 채를 썰고, 청양고추는 어슷썰어 놓는다.
- text: 팬에 올리브 오일을 조금 넣고 마늘과 청양고추를 먼저 볶는다.
- text: 볶아지는 팬에 바지락과 브로컬리를 넣고 볶는다.
- text: 볶아지는 팬에 바지락 국물을 넣어 졸이다가 실곤약과 파프리카, 후춧 가루를 넣고, 한 번 더 졸여 완성한다.
