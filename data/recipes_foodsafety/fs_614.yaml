steps:
- text: 닭 살을 곱게 다진다.
- text: 다진 닭살에 소금, 후춧가루, 매실청 및 다진 마늘을 넣고 골고루 양념한다.
- text: 믹서에 양파, 마늘, 감자, 찹쌀가루를 넣고 간다.
- text: 갈아 놓은 감자에 양념된 닭살과 달걀을 섞는다.
- text: 4번을 잘 치대 떡갈비 모양으로 만든다.
- text: 팬에 기름을 살짝 두르고 떡갈비를 앞뒤로 구워 익힌다.
