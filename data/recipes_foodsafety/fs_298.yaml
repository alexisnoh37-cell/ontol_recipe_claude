steps:
- text: 현미와 쌀을 씻어 30분간 불린 뒤 물기를 빼고, 다시마를 우려낸 물(불린 쌀 동량)로 밥을 지어 식힌 후 새우가루를 넣어 섞는다.
- text: 양배추는 15~20분 정도 쪄서 준비한다.
- text: 얇게 저민 쇠고기를 팬에 올려 익힌다.
- text: 달래는 0.5㎝ 정도로 송송 썰어 간장, 참기름에 버무린다.
- text: 김발에 양배추, 고기, 밥 순서대로 올려 돌돌 말아 양배추롤을 만든다.
- text: 롤을 한입 크기로 썰어 담고 달래 무침을 얹은 뒤 송송 썬 붉은 고추를 올려 마무리한다.
