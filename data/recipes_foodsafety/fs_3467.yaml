steps:
- text: 당근, 양파, 깻잎은 깨끗이 씻고, 오이, 양배추, 사과는 채 썬다.
- text: 리코타 치즈, 연두부, 다진 레몬청 과육을 섞어 소스를 만들고 양배추, 사과와 함께 버무려 두부 리코타 샐러드를 만든다.
- text: 메밀면을 4분간 삶아 물기를 제거한 후 참기름, 간장을 넣어 버무린다.
- text: 족발은 전자레인지에 1분간 돌리고 채 썰어 준비한다.
- text: 김을 깔고 양념한 메밀면 → 깻잎 → 오이 → 당근 → 양파 → 두부 리코타 샐러드 → 족발 순서로 올려 말아 김밥을 만든다.
- text: 김밥을 먹기 좋은 크기로 썰고 달걀지단을 올려 마무리한다.
