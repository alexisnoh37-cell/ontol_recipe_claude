steps:
- text: 연근, 우엉은 껍질을 벗겨 0.2cm 두게로 슬라이스한 뒤 식촛물에 담군다.
- text: 레디쉬는 얇게 슬라이스하여 얼음물에 담그고 오렌지는 껍질을 벗겨 과육만 분리한다.
- text: 우엉과 연근을 끓는 물에 데친 뒤 얼음물에 담궈 열기를 식히고 물기를 뺀다.
- text: 요거트와 머스터드를 섞어 소스를 만들고 땅콩, 호두는 잘게 부순다.
- text: 연근, 우엉, 레디쉬, 오렌지, 땅콩, 호두를 만들어둔 소스와 함께 버무린다.
- text: 그릇에 담고 크랜베리를 올린다.
