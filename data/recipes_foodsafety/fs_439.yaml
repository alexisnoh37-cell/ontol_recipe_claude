steps:
- text: 당근, 양파, 호박, 버섯은 입자있게 다지고, 파인애플은 작은 깍뚝썰기로 썰어 준비한다.
- text: 닭고기살은 작게 썰어 팬에 저염간장과 양파, 다진마늘, 올리고당을 넣어 볶으면서 졸인다.
- text: 팬에 버터를 녹인 후 준비한 밥을 넣고 볶는다.
- text: 볶은밥(③)에 썰어놓은 채소(①)를 넣고, 다시 볶아준다.
- text: 밥과 채소가 볶아지면, 닭고기살(②)을 넣고, 토마토 페스트와 토마토를 다져넣고 볶는다.
- text: 파프리카의 속을 파내고, 그 안에 볶아진 밥(⑤)을 넣고, 달걀물을 씌우고 모짜렐라치즈를 뿌려 치즈가 녹을 때까지 팬에 뚜껑을 덮어 약불에서 익힌 후 파슬리가루를 올려 완성한다.
