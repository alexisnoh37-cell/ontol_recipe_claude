steps:
- text: 연근은 껍질을 벗겨 0.2 cm 길이로 얇게 썰어 물 반컵에 식초를 넣은 후 10분정도 담갔다가 물기를 제거한다.
- text: 배추, 사과, 배는 씻어 4~5cm 길이로 채썬다.
- text: 땅콩과 호두는 칼로 굵게 다진다.
- text: 연근은 팬에 현미유를 두르고 노릇노릇하게 구어 연근칩을 만든다.
- text: 홍시, 호상요구르트, 3배 식초, 소금을 섞어 홍시드레싱을 만든다.
- text: 그릇에 배추, 사과, 배, 연근칩, 땅콩, 호두를 넣고 버무린 뒤 홍시드레싱을 곁들인다.
