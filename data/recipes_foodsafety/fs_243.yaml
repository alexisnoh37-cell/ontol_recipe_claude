steps:
- text: 두부는 으깨어 면포에 물기를 짜고, 불린 표고버섯도 물기를 꼭 짠 뒤 다지고, 닭가슴살은 곱게 다진다.
- text: 두부, 표고버섯, 닭가슴살에 반죽양념을 넣어 치댄다.
- text: 톳은 데쳐서 송송 썬다.
- text: 쿠킹포일에 참기름을 바르고 반죽을 펼친 뒤 깻잎을 얹고 그 위에 톳을 올려 김밥 말듯이 만다.
- text: 쿠킹 포일에 구멍을 내고 김이 오른 찜통에 10-15분 정도 찐다.
- text: 두부말이가 식으면 적당한 크기로 썬 뒤 레몬소스를 살짝 뿌려 마무리한다.
