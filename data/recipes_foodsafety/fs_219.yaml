steps:
- text: 쌀은 씻어서 체에 건져 1시간 이상 불린 후 동량의 물을 부어 밥을 짓는다.
- text: 아스파라거스, 새송이버섯은 작게 깍둑 썰고, 무와 우엉, 미나리는 다진다.
- text: 식용유(10g)를 두른 팬을 중간 불로 달궈 달걀을 넣고 스크램블로 볶는다.
- text: 문어, 새우살, 주꾸미는 끓는 물에 살짝 데쳐 작게 자른다.
- text: 식용유(15g)를 두른 팬을 중간 불로 달궈 밥을 넣어 볶다가 문어, 새우살, 주꾸미, 스크램블 에그를 넣고 조금 더 볶는다.
- text: 무와 우엉에 고추장과 참기름, 물(40g)을 넣고 묽게 졸인 후 불을 끄고 미나리를 넣고 섞어 미나리볶음고추장을 만들어 밥에 곁들여 마무리한다.
