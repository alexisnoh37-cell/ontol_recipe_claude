steps:
- text: 닭다리살, 닭안심살은 키친타월로 물기를 제거하고 끓는 물에 데쳐 한입 크기로 썬다.
- text: 칼집을 낸 토마토를 뜨거운 물에 살짝 데치고 껍질을 제거하여 깍둑썰고, 방울토마토는 모양을 살려 반으로 자른다.
- text: 양파, 감자는 껍질을 제거하고 깍둑썬다. 시금치는 밑동을 제거하고 깨끗이 씻어 한입 크기로 썬다.
- text: 볼에 손질한 닭고기, 양파, 감자를 담고, 고추장, 고춧가루, 다진 마늘, 진간장, 알룰로스를 넣어 버무린다.
- text: 달군 팬에 넣고 중약 불로 살짝 볶은 후 물을 부어 끓인다. 채소가 익으면 불을 끄고 시금치를 넣어 잔열로 익힌다.
- text: 접시에 담고 삶은 스파게티면을 곁들여 마무리한다.
