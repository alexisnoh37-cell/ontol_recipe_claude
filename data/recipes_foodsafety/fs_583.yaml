steps:
- text: 닭고기는 넓게 펴 소금, 후추로 밑간을 한다.
- text: 찹쌀은 깨끗이 씻어 밥을 짓는다
- text: 인삼은 뇌두를 제거 하고 깨끗이 씻어 길게 썬다.
- text: 미나리는 데쳐 찬물에 헹구고, 대추는 씨를 제거하고 채를 썬다.
- text: 호박잎은 끓는 물에 데쳐 찬물에 식힌다.
- text: 데친 호박잎에 밑간한 닭고기와 찹쌀밥을 올리고 그 위에 인삼, 데친 미나리, 대추를 올려 돌돌 말아 찜통에 찐 뒤 먹기 좋게 썬다.
