steps:
- text: 돼지고기는 채 썬 뒤 소금, 물전분을 넣고 양념한다.
- text: 양념한 고기를 기름 두른 팬에 볶으면서 달라붙지 않도록 저어준다.
- text: 시금치와 부추를 4~5cm 가량으로 썬다.
- text: 가열된 팬에 기름을 두르고 파, 생강, 팔각을 넣어 향을 낸다.
- text: 4에 2와 간장을 넣고 볶는다.
- text: 물 전분을 넣어 농도를 맞춘 뒤 마직막으로 부추, 시금치를 넣는다.
