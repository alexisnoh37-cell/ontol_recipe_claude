steps:
- text: 돼지등심을 넓게 피고 소금과 후춧가루 올리브오일을 발라 숙성시킨다.
- text: 우유를 끓이다가 레몬즙을 넣고 몽글 거리면, 소창에 걸러 리코타치즈를 만든다.
- text: 양파와 토마토, 마늘, 사과는 입자있게 다져 케첩을 섞어준다.
- text: 숙성시킨 등심에 리코타치즈를 올려준다.
- text: 리코타치즈를 올린 등심에 다시 모짜렐 라치즈를 넣고 등심을 다시 위에 올려, 밀가루와 달걀물, 빵가루 순서로 입힌 뒤 튀김온도 170~180℃에 약 3분 정도 튀겨 기름을 빼 놓는다.
- text: 냄비에 준비해 놓은 소스(③)를 넣고 볶다가 돈가스 소스를 넣고 다시 한 번 더 끓인 후 튀겨놓은 리코타돈가스(⑤)에 곁들여 완성한다.
