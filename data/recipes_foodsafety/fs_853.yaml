steps:
- text: 소고기등심은 손질하여 칼등으로 부드럽게 두드린 뒤 4cm 길이로 썰어서 재움장에 30분 정도 재운다.
- text: 오이는 0.2cm 두께로 동그랗게 썰어 소금에 살짝 절였다 짠다.
- text: 배는 껍질과 씨를 제거하고 반달모양으로 0.2cm 두께로 썬다.
- text: 팬에 식용유를 두르고 오이는 센불에서 살짝 볶고 배는 노릇하게 지진다.
- text: 팬에 재워둔 소고기등심을 지지고 초간장소스를 만든다.
- text: 노릇하게 지진 배에 소고기등심을 오이, 잣가루를 얹고 가볍게 싸서 저나트륨 초간장에 찍어 먹는다.
