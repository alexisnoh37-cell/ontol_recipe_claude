steps:
- text: 돼지고기와 쇠고기는 고기 밑간을 넣고 반죽을 만든다.
- text: 가지를 길고 얇게 썬다.
- text: 깨끗이 씻은 떡을 가지로 돌돌 말고 그 위에 고기를 말아 떡갈비를 만들고 팬에서 겉면이 노릇해질 때까지만 익힌 뒤 김 오른 찜기에 넣어 10분~15분 정도 찐다.
- text: 유자청과 간장을 섞고 팬에서 농도를 맞춰주며 살짝 졸여 유자소스를 만든다.
- text: 연근은 모양대로 얇게 썰어 기름에 튀겨 연근칩을 만든다.
- text: 떡갈비에 유자소스를 바르고 연근칩을 올려 마무리한다.
