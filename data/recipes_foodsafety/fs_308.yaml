steps:
- text: 라면을 살짝 익힌다.
- text: 배와 파인애플을 한입 크기로 썰고, 파프리카는 깍둑 썬다.
- text: 팬에 쇠고기 양념장과 파인애플을 넣어 끓이다가 채 썬 쇠고기를 넣는다.
- text: 레드와인을 넣고 알코올을 날린 뒤 매실청을 넣고 조린다.
- text: 라면과 파프리카, 배를 섞은 후 라이스페이퍼에 올려 만다.
- text: 달걀물을 묻힌 후 빵가루를 입혀 튀긴 뒤 그릇에 어린잎채소와 함께 담아 조린 쇠고기를 곁들여 마무리 한다.
