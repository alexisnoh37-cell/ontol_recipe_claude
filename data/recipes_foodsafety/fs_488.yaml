steps:
- text: 밀가루는 세 군데로 나눠 각각 뽕잎 가루와 호박가루, 백년초가루를 넣고 올리브오일을 넣어 반죽을 하고, 비닐봉투에 넣어 숙성시킨다.
- text: 닭은 작게 토막을 내어 생강과 정종, 소금, 후춧가루를 뿌려 숙성시킨다.
- text: 파프리카와 피망은 속을 파내고 작은 깍두기 모양으로 썰고, 깻잎은 잘게 썰어둔다.
- text: 숙성된 밀가루를 각각 꺼내 밀대로 밀어, 파스타 굵기로 썰어 면을 데쳐 접시에 담아 놓는다.
- text: 숙성한 닭(②)은 녹말가루와 달걀을 섞은 반죽을 입혀 170℃의 튀김기름에 두 번 튀겨 기름을 제거한다.
- text: 파스타면(④) 위에 튀긴 닭(⑤)을 올리고 냄비에 크림소스를 끓이다가 설탕을 넣고, 다시 끓으면 파프리카와 피망, 깻잎(③)을 넣고, 한 번 더 끓인 후 깐풍파스타에 올려 완성한다.
