steps:
- text: 양배추, 어묵, 파프리카를 길게 썰고 부추는 한번 데친다.
- text: 팬에 식용유를 살짝 두르고 어묵을 볶아 꺼내고, 같은 팬에 소고기 양지를 구워 준비한다.
- text: 냄비에 물과 누들 떡볶이 떡을 넣어 끓이고 떡이 익으면 건져낸다.
- text: 떡볶이양념파우더를 넣고 조려서 떡볶이 소스를 만든다.
- text: 쌈두부를 깔고 조리한 소고기 양지, 떡과 손질한 어묵, 파프리카, 양배추를 올린 후 싸서 데친 부추로 묶는다.
- text: 떡볶이 소스를 곁들여 마무리한다.
