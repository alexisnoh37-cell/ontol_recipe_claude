steps:
- text: 냄비에 물, 대파, 생강, 마늘, 통후추, 맛술, 된장을 넣고 끓인다.
- text: 1이 끓으면 삼겹살 덩어리를 넣고 35~40분 간 삶는다.
- text: 새우, 오징어, 주꾸미는 모양을 내 데치고 파프리카와 오이, 당근, 양파는 가늘게 채 썬다.
- text: 겨자가루를 개어 숙성시켜 설탕, 식초로 냉채 소스를 만든 뒤 3을 넣고 무친다.
- text: 2의 삽겹살을 모양대로 썬다.
- text: 수육과 해물냉채를 담는다.
