steps:
- text: 돼지고기 앞다리 살에 칼집을 낸다.
- text: 돼지고기에 된장, 생강가루, 다진마늘, 통후추, 월계수잎을 입혀 숙성시킨다.
- text: 파와 대파는 큼지막하게 썰어 준비한다.
- text: 냄비 혹은 오븐용기의 밑 부분에 양파와 대파를 놓아준다.
- text: ④에 숙성시킨 돼지고기를 올려 약 50분 정도 가열하여 완전히 익혀준다.
- text: 0.5cm 두께로 썰어서 제공한다.
