steps:
- text: 프라이팬에 물에 불린 귀리, 아몬드슬라이스, 피칸을 넣고 살짝 볶는다.
- text: 볼에 땅콩버터, 클로렐라가루, 알룰로스를 넣고 섞다가 코코넛우유, 아몬드우유를 넣어 고루 섞는다.
- text: 볶은 귀리, 아몬드슬라이스, 피칸과 대추채, 카카오닙스, 건크랜베리를 넣고 섞어 크런치 토핑을 만든다.
- text: 볼에 카카오매스, 다크초콜릿을 넣고 전자레인지에서 20~25초 동안 녹인다.
- text: 팬에 유산지를 깔고 크런치 토핑을 넣고 평평하게 편 후 녹인 초콜릿을 코팅하듯 바른다.
- text: 냉동실에 20분 동안 넣어 굳히고 먹기 좋은 크기로 썰어 마무리한다.
