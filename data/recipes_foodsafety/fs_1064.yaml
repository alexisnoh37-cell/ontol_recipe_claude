steps:
- text: 쌀을 씻어 밥을 짓는다.
- text: 양파, 표고버섯, 당근, 피망은 입자있게 다지고 대추는 씨를 제거한 뒤 다진다.
- text: 닭가슴살은 먹기 좋은 크기로 썬다.
- text: 팬에 기름을 두르고 다진 마늘을 볶은 뒤 닭가슴살을 볶는다
- text: 닭가슴살이 다 익으면 손질한 채소를 넣고 볶다가 밥, 우유, 치즈, 대추를 넣고 끓인다.
- text: 우유가 반으로 졸아들면 불을 줄이고 소금, 후추로 간한다.
