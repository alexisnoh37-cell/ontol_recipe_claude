steps:
- text: 베이컨은 뜨거운 물에 살짝 데쳐준다.
- text: 배춧잎 위에 깻잎 2장을 양쪽으로 깔고, 그 사이에 베이컨을 얹는 방식으로 반복하여 겹겹이 올려준 후 먹기 좋게 잘라준다.
- text: 냄비 바닥에 끓인 무와 청경채, 숙주나물을 깔아준다.
- text: 2가지 소스를 만들어준다.
- text: 가운데 부분은 백일송이버섯으로 채워주고 먹기 직전에 만든 육수를 부어 끓여주고 소스와 함께 완성한다.
