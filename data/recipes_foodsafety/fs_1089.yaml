steps:
- text: 무와 배추를 1x4x1cm 크기로 자른다.
- text: 비트는 2x4x0.3cm로 자른다.
- text: 당근은 모양내어 자른다.
- text: 껍질 벗긴 사과와 물을 1:1 비율로 넣고 갈아 체에 내려 건더기를 제거한다.
- text: 4번에 식초를 2:1 비율로 넣고 월계수잎, 통후추를 넣고 끓여준다.
- text: 손질한 무, 배추, 비트, 당근을 넣고 식혀준다.
