steps:
- text: 곤약과 감자는 2cm ? 2cm 크기로 썰고 풋고추와 홍고추는 송송 썰어 씨를 제거한다.
- text: 물(200g)에 다시마를 넣고 끓여 육수를 만든 뒤 다시마를 건진다.
