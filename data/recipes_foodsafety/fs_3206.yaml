steps:
- text: 배추는 한입 크기로 썰고, 대파는 6cm 길이로 썰어 길게 2등분하고, 가자미는 먹기 좋은 크기로 자른다.
- text: 가자미에 밑간을 고루 버무린 뒤 냉장실에서 20분간 재운다.
- text: 찹쌀싸라기 재료를 고루 섞는다.
- text: 재워둔 가자미에 찹쌀가루(5g)를 고루 바른 뒤 찹쌀싸라기를 촘촘히 입힌다.
- text: 찜기에 배추와 대파를 깔고 가자미를 올린 뒤 12분간 찌고 불을 꺼 5분간 뜸 들인다.
- text: 그릇에 담아 마무리한다.
