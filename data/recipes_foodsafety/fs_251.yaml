steps:
- text: 콩고기는 물에 담가 20분 정도 불린 뒤 양념장 ½과 버무린다.
- text: 양파, 당근은 채 썰고, 양배추와 깻잎, 버섯은 한입 크기로 썬다.
- text: 부추와 미나리는 양파와 비슷한 길이로 썰고, 청양고추는 어슷 썬다.
- text: 들기름을 두른 팬에 다진 파와 마늘, 생강을 넣고 약한 불에 볶다가 콩고기를 넣고 나머지 양념장을 뿌려 볶는다.
- text: 어느 정도 볶아지면 양파, 당근을 넣고 볶다가 양배추를 넣고 볶는다.
- text: 양배추가 익으면 먹기 좋게 손질한 버섯을 넣고 살짝 볶아 마무리한다.
