steps:
- text: 영양부추, 시금치는 먹기 좋게 잘라 물에 담가준다.
- text: 단호박은 삶아서 체에 내려준다.
- text: 토마토는 곱게 다져주고 시금치도 데친 후 단호박, 연두부와 섞어준다.
- text: 연어를 포를 떠서 만들어진 단호박과 연두부를 연어에 돌돌 말아 냉동실에 살짝 얼려준다.
- text: 소스재료로 소스를 만든다.
- text: 접시에 준비된 채소를 깔고 연어를 올리고 소스를 올려 완성한다.
