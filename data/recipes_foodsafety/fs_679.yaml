steps:
- text: 닭은 찬물에 담가 핏물을 제거하고 끓는 물에 넣고 데쳐 기름을 뺀다.
- text: 당면과 표고버섯은 각각 물에 담가 불리고 버섯 불린 물은 따로 받아둔다.
- text: 표고버섯, 감자, 양파, 당근은 한입 크기로 썰고 수삼과 대파는 어슷 썬다.
- text: 냄비에 닭과 양념, 버섯, 감자, 양파, 당근, 건고추, 버섯 불린 물 3/4컵을 넣고 조린다.
- text: 닭이 반쯤 익었을 때 수삼을 넣고 계속 조린다.
- text: 닭이 다 익으면 당면, 대파, 다진 마늘을 넣고 살짝 끓여 담아낸다.
