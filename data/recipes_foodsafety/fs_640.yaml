steps:
- text: 된장에 두부를 넣고 골고루 섞는다.
- text: 표고버섯과 마늘은 함께 갈아둔다.
- text: 미역은 충분히 불린다.
- text: 냄비에 황태채와 갈아둔 표고버섯, 마늘을 넣고 은근히 끓여 육수를 만든다.
- text: 곤약은 납작납작하게 썰어 끓는 물에 데친다.
- text: 육수에서 황태를 건져 두부된장과 함께 갈아 육수에 붓고, 미역, 곤약, 들깨가루를 넣고 약 20분 정도 끓인 후 액젓으로 간을 한다.
