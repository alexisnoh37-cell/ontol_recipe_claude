steps:
- text: 콩은 삶아서 표고버섯과 함께 물(30g)을 넣고 간다.
- text: 저염된장, 날콩가루, 갈아 놓은 콩과 표고버섯을 섞어 저염재래된장을 만든다.
- text: 냄비에 육수 재료를 끓여낸 뒤 건진다.
- text: 산나물과 애호박, 양파는 먹기 좋게 썰고, 청양고추와 대파는 어슷하게 썬다.
- text: 저염재래된장을 육수에 풀고 곤드레나물, 고구마순, 취나물을 넣고 끓여 반 이상 익으면 애호박, 양파를 넣는다.
- text: 순두부, 양념, 청양고추, 대파를 넣고 마무리한다.
