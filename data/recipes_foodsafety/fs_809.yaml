steps:
- text: 고추는 반으로 갈라 속을 제거한다.
- text: 손질한 고추는 3cm 길이로 채썬다.
- text: 죽순, 표고버섯, 대파, 생강을 채썬다.
- text: 돼지고기는 얇게 저민 후 0.3x5cm 길이로 곱게 채썰어 밑간 한다.
- text: 밑간 한 돼지고기를 달걀흰자, 녹말가루에 묻혀 놓는다.
- text: 팬에 식용유를 넣고 생강을 볶아 향을 내고 채소, 고기를 넣어 볶다가 간을 한 다음 참기름을 두르고 굽는다.
