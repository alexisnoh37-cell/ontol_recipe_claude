steps:
- text: 연어는 불려준 다시마에 싸주어 24시간 염지 시켜준다.
- text: 잎 녹차는 물에 불려준다.
- text: 뒤 수분을 빼주고 팬에 올려서 연어를 약불 에서 구워내 준다.
- text: 브로콜리, 호두도 먹기 좋게 잘라준다.
- text: 귀리와 쌀은 1시간정도 불려준다.
- text: 닭 육수와 미소된장을 넣어 볶아주다가 불린 쌀을 넣어 볶아주어 리조또를 완성하고 접시에 리조또를 담고 구운 연어를 올려 완성한다.
