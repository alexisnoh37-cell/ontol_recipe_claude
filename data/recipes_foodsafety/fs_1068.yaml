steps:
- text: 파인애플은 7cm로 자르고 남은 자투리와 파, 마늘, 양파, 표고버섯은 곱게 다진다.
- text: 갈빗살은 곱게 다져 간장, 설탕, 파, 마늘, 참기름, 추후로 양념한다.
- text: 다진 파인애플, 양파, 표고버섯은 볶아 수분을 제거한다.
- text: 전분 일부와 갈빗살, 다진 파인애플, 양파, 표고버섯을 섞고 치댄다.
- text: 잘라둔 파인애플에 남은 전분을 묻힌 뒤 고기반죽으로 감싼다.
- text: 팬 또는 오븐(180℃, 15분)에 노릇하게 굽는다.
