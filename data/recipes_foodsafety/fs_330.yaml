steps:
- text: 뜨거운 물에 파스타면을 삶아낸 뒤 물기를 빼준다.
- text: 송송 썬 청양고추를 생들기름에 볶아주다 면을 볶는다.
- text: 볶아준 청양고추에 삶아진 면을 볶아준다.
- text: 열무김치는 송송 썰어서 들기름에 살짝 볶아준다.
- text: 오이는 돌려깎기 해서 채 썰어주고 청고추, 2가지색 파프리카, 당근도 채 썰어 각각 볶아 준다.
- text: 청양고추에 볶아진 파스타면을 볶은 채소와 한 번 더 볶아 완성한다.
