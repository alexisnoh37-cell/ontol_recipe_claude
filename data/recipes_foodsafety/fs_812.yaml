steps:
- text: 단호박은 깨끗이 씻어 반을 갈라 씨를 제거하고 찜통에서 쪄낸다.
- text: 식힌 단호박은 껍질을 제거하고 한 입 크기로 썬다.
- text: 두부는 1.5cm 정육면체로 썰어 데친다.
- text: 마늘은 편으로 썰고 청고추는 송송 썰어 팬에 볶는다.
- text: 간장에 분량의 재료를 한데 섞어 살짝 끓여 식힌다.
- text: 준비된 재료를 담고 소스를 뿌린다.
