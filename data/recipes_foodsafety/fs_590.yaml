steps:
- text: 연어는 깍둑 썰기한다.
- text: 냄비에 우유를 넣고 은근히 끓이다가 레몬즙과 소금을 넣고 뭉글거리게 한다.
- text: 뭉글거리는 우유를 체에 걸러 리코타치즈를 만든다
- text: 토마토, 아보카도, 오이 및 파인애플은 주사위 모양으로 썬다.
- text: 어린잎은 찬물에 담궈 싱싱해지면 물에서 건져 놓는다
- text: 오렌지와 파인애플은 즙을 만들어 리코타치즈와 섞어 소스를 만들고, 연어와 야채를 담은 뒤 그 위에 소스를 올린다.
