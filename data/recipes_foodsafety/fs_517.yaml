steps:
- text: 양파와 양송이, 표고버섯, 느타리버섯은 작게 썰어 준비해 놓는다.
- text: 멸치와 새우, 마늘을 냄비에 담고, 물을 약 500㎖ 정도 붓고 끓여 육수를 만든다.
- text: 냄비에 버터를 넣고, 양파와 버섯을 넣어 볶는다.
- text: ③번의 냄비에 불린 쌀을 넣고 은근히 볶는다.
- text: 볶아지는 냄비에 만들어 놓은 육수를 조금 넣는다.
- text: 육수를 넣고 다시 은근히 볶으면서 뚜껑을 덮어 충분히 익힌 후, 마지막에 생크림과 소금을 넣고 완성한다.
