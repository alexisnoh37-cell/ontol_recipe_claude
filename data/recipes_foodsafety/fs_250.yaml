steps:
- text: 돼지고기는 핏물을 제거하고 된장육수에 살짝 데친다.
- text: 데친 돼지고기에 양념장을 넣고 재운다.
- text: 단호박은 도톰하게 썰고, 죽순, 양파는 채 썰고, 대파는 어슷 썰고, 마른 표고버섯은 불린 뒤 먹기 좋은 크기로 썬다.
- text: 팬에 올리브유를 두르고 재운 돼지고기와 된장육수(50g)를 넣고 볶는다.
- text: 반 정도 익었을 때 단호박과 죽순, 양파, 대파, 표고버섯, 다진 마늘을 넣고 볶는다.
- text: 부순 참깨와 참기름을 넣어 마무리한다.
