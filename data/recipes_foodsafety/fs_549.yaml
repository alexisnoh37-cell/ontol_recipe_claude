steps:
- text: 멸치, 건새우, 무, 양파, 마늘을 넣고 육수를 만들어 소창에 걸러 준비한다.
- text: 홍합은 끓는 물에 살짝 데쳐 놓는다.
- text: 숙주는 씻어 놓고 청경채는 반으로 자르고 청 ․ 홍고추는 어슷썰어 준비 한다.
- text: 만들어 놓은 육수에 고춧가루와 굴소스를 넣어 끓인다.
- text: 달걀은 풀어 준비한다.
- text: 육수(④)가 끓으면 라면을 넣고, 다시 한 번 더 끓으면 홍합을 넣어 끓이다가, 불을 줄인 뒤 달걀을 넣어 줄알을 치고, 청경채와 숙주, 홍고추와 대파를 넣고 살짝 끓은 뒤 그릇에 담아 완성한다.
