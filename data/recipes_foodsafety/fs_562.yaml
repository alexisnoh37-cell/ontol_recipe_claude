steps:
- text: 푸실리는 뜨거운 물에 약 10분 정도 삶아 건져 올리브오일을 살짝 바른다.
- text: 머윗대는 살짝 데친 후 찬물에 헹궈 껍질을 벗긴다.
- text: 껍질 벗긴 머윗대는 푸실리 크기로 자른다.
- text: 양파, 마늘은 입자있게 다진다.
- text: 팬에 올리브오일을 두르고 다진 마늘과 양파를 볶다가 화이트와인을 넣고 볶는다.
- text: 5번에 생크림, 소금을 넣고 믹서에 간 뒤 푸실리와 머윗대를 넣고 한소끔 끓인다.
