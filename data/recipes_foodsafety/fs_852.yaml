steps:
- text: 돼지고기는 간장, 물엿, 다진마늘, 후춧가루로 밑간 한다.
- text: 레디쉬, 깻잎, 대파는 채썬다.
- text: 소스 재료들은 모두 믹서에 간다.
- text: 돼지고기에 찹쌀가루를 두 번 입힌다.
- text: 가열된 팬에 옷입힌 돼지고기를 지진다.
- text: 구운 돼지고기에 썰어둔 채소를 얹은 후 고기를 말아 소스와 곁들인다.
