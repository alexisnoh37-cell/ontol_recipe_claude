steps:
- text: 닭은 깨끗이 씻고 포를 뜬다.
- text: 닭고기는 15분 정도 삶아 식으면 곱게 다져 다진 마늘, 대파, 저염간장을 넣고 완자를 만든다.
- text: 인삼은 뇌두를 제거하고 깨끗이 씻는다.
- text: 찹쌀은 약 30분 정도 충분히 불린다
- text: 대추는 소금물에 깨끗이 씻고 씨를 제거한다.
- text: 믹서에 인삼과 대추, 불린 찹쌀, 물을 정도 넣고 곱게 간 뒤, 냄비에 담아 죽을 쑤다가 다 익으면 만들어 놓은 완자를 넣고 한소끔 더 끓인다.
