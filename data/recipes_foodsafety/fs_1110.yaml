steps:
- text: 완두콩은 삶은 뒤 믹서에 간다.
- text: 간 완두콩에 올리고당, 우유를 넣고 졸인다.
- text: 찹쌀가루는 익반죽하여전자레인지에 3분 가열 후 숟가락으로 젓고 2분 간 더 돌려떡을 만든다.
- text: 식빵은 밀대로 밀어 납작하게 한 뒤 가장자리를 자른다.
- text: 식빵위에 찹쌀떡을 넓게 펴 바르고 그 위에 졸인 완두콩을 올린다.
- text: 5번을 돌돌 말아 고정시킨 뒤 먹기 좋은 크기로 자른다.
