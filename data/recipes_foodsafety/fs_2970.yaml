steps:
- text: 두부를 으깨고 오징어와 새우는 잘게 다진다.
- text: 볼에 1의 재료와 감자전분을 넣고 섞어 완자모양으로 만든다.
- text: 감자전분과 부침가루를 섞어 완자에 묻힌다.
- text: 가루를 묻힌 완자에 계란물을 입혀 기름 두른 팬에 굴려가며 익힌다.
- text: 마늘과 파를 다진 뒤 새우가루, 꿀, 저염간장을 섞어 소스를 만든다.
- text: 양파를 채 썰어 냄비에 소스와 함께 끓인 뒤 전분물을 넣어 농도를 맞추고 완자를 넣는다.
