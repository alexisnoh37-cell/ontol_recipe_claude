steps:
- text: 쌀은 깨끗이 씻고 불려 밥을 짓는다.
- text: 소고기는 핏기를 제거하고 버섯, 당근, 양파, 대파는 한 입 크기로 썰어서 준비한다.
- text: 절반의 마늘과 진간장, 양파, 배, 후춧가루를 넣고 믹서에 갈아 양념을 만든다.
- text: 핏기를 제거한 소고기에 3번의 양념을 넣고 섞는다.
- text: 나머지 마늘은 얇게 편썰어 기름에 튀겨 마늘 칩을 만든다.
- text: 숙성 시킨 불고기를 팬에 볶고, 그릇에 담은 밥 위에 올리고 마늘 칩으로 장식한다.
