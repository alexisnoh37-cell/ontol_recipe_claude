steps:
- text: 김은 티를 골라낸다.
- text: 홍고추, 마늘, 생강은 곱게 채썬다.
- text: 간장소스의 양념들은 모두 합하여 20분 가량 낮은 불에서 끓여서 식힌다.
- text: 김은 먹기 좋은 크기로 12~18등분으로 자른다.
- text: 양념간장에 마늘, 생강, 홍고추채를 섞는다.
- text: 김을 차곡차곡 쌓은 뒤 양념간장을 위에 부어준다.
