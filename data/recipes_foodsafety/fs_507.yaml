steps:
- text: 통 삼겹살에 함초와 소금, 후춧가루를 뿌려 숙성을 시킨다.
- text: 부추는 약 6cm 길이로 썰고, 양파는 채를 썰어 놓고, 당근은 납작하게 편으로 썰어 준비한다.
- text: 연두부는 잘게 다져 놓는다.
- text: 유자청에 쌈장과 설탕, 생크림을 넣어 골고루 섞는다.
- text: 골고루 섞은 유자청에 다져 놓은 연두부를 넣어 섞어 냄비에 넣고, 썰어 놓은 양파와 당근을 넣어 은근히 끓여 소스를 만들어 놓는다.
- text: 숙성시킨 통삼겹은 버터를 녹인 팬에 살짝 구워 다시 오븐에서 20분 정도 익힌 후 먹기 좋게 썰은 뒤, 접시에 부추를 깔고 그 위에 구워진 삼겹을 올리고 소스를 얹어 완성한다.
