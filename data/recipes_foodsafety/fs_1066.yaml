steps:
- text: 쌀과 곤약은 깨끗이 씻어 밥을 짓는다.
- text: 시금치는 데쳐 잘게 다지고 당근은 잘게 다져 팬에 볶고, 달걀은 삶아 노른자만 체에 거른다.
- text: 소고기는 간장, 참기름, 대파, 마늘, 물엿, 후춧가루를 버무려 볶는다.
- text: 멸치는 올리고당으로 볶고 밥은 소금과 참기름으로 밑간한다.
- text: 밥과 멸치, 밥과 소고기를 각각 버무려 동그랗게 빚는다.
- text: 동그랗게 빚은 밥은 시금치, 당근, 달걀노른자에 각각 굴린다.
