steps:
- text: 방울토마토는 3등분하고, 깻잎과 양파는 곱게 다진다.
- text: 연두부와 두부를 크림 형태가 될 때까지 으깬다.
- text: 다진 깻잎과 양파에 깻잎 드레싱 재료를 넣어 고루 섞는다.
- text: 중간 불로 달군 팬에 다진 마늘을 볶아 마늘 플레이크를 만든다.
- text: 그릇에 연두부 크림과 방울토마토, 치즈를 올린다.
- text: 깻잎 드레싱을 뿌리고 마늘 플레이크를 올려 마무리한다.
