steps:
- text: 우유에 닭가슴살을 넣어 약20분 정도 재워 놓는다.
- text: 양송이버섯은 껍질을 벗기고, 양파와 캐슈넛과 각각 다져 준비한다.
- text: 우유에 재워놓은 닭가슴살은 소금, 후춧가루를 뿌려 밀가루와 달걀물, 빵가루 순서로 입혀 기름에 튀기듯이 익혀 기름을 빼놓는다.
- text: 팬에 버터를 넣고, 버터가 녹으면, 양송이와 양파를 넣고 볶는다.
- text: 볶아지는 채소에 크림소스를 넣어 은근히 볶는다.
- text: 소스가 볶아지면, 마지막에 다져 놓은 캐슈넛과 생크림, 모짜렐라치즈를 넣고 한 번 더 익힌 후, 접시에 어린잎과, 닭가슴살을 놓고, 크림소스를 곁들여 완성한다.
