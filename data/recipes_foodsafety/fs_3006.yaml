steps:
- text: 배추에 세로로 칼집을 낸 뒤 저염소금을 뿌리고, 10분 뒤 씻는다.
- text: 무는 깨끗이 손질하여 씻은 뒤 얇게 채 썰고, 쪽파는 4cm 길이로 썰고, 양파는 채 썬다.
- text: 볼에 참깨를 제외한 무, 쪽파, 양파, 다진 마늘, 다진 생강과 저염소금을 제외한 양념재료를 넣고 버무려 양념을 만든다.
- text: 저염소금에 절여 씻은 배추를 김치 양념에 골고루 버무린다.
- text: 참깨를 뿌려 마무리한다.
