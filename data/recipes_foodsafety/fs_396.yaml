steps:
- text: 감자를 슬라이스 하여 찜통에 찐 후 체에 으깬다. 깻잎을 잘게 채 썰어서 냉수에 담가 향을 빼준다.
- text: 베이컨을 한 번 데쳐내 송송 썰어준 후 다진 마늘과 볶아준다.
- text: 으깬 감자와 깻잎을 다져서 반죽을 만들고 엄지손가락 크기로 떼어 밀가루를 뿌리고, 둥글게 빚은 후 포크로 자국을 내 뇨끼를 만든다.
- text: 만들어진 뇨끼를 삶아 건져준다.
- text: 팬에 버터를 넣고 다진양파, 다진마늘, 다진 대파, 볶은 베이컨, 새송이, 흰후추를 볶다가 우유와 생크림, 설탕을 넣고 끓여준다.
- text: 뇨끼를 넣어 한 번 더 끓여준 뒤 완성한다.
