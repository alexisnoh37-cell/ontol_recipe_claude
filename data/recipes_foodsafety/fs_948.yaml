steps:
- text: 고구마를 찜통에 찐다.
- text: 고구마의 껍질을 벗기고 체에 곱게 내린다.
- text: 카스텔라는 윗면의 갈색 부분을 잘라내고 믹서에 곱게 갈아 가루로 만든다.
