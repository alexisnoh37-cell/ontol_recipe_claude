steps:
- text: 단호박을 반 갈라 씨를 빼고 8등분 한다.
- text: 김이 오른 찜통에 단호박을 찐다.
- text: 찐 단호박을 껍질을 벗겨 으깨고 호두는 잘게 다진다.
- text: 으깬 단호박에 다진 호두와 꿀 넣고 섞는다.
- text: 깻잎 뒷면에 4 를 한 숟가락 올리고 양끝을 오무려 돌돌 만다.
- text: 찹쌀가루에 물 한 큰술을 섞은 튀김옷을 골고루 입혀 바삭하게 튀겨낸다.
