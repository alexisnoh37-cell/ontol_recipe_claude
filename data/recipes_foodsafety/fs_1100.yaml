steps:
- text: 믹서로 버터를 풀어준 뒤 달걀, 꿀을 넣고 섞는다.
- text: 박력분과 아몬드가루는 체에 내려 주걱으로 섞은 뒤 밀봉하여 냉장고에서 30분 간 휴지시킨다.
- text: 0.2~0.3cm 두께로 밀어 편 뒤 틀에 담아 포크로 구멍을 내고 170℃ 오븐에서 25분 간 굽는다.
- text: 생크림을 끓인 후 블랙초콜릿을 넣고 섞는다.
- text: 구운 타르트에 4번을 반 정도 채운 뒤 냉동실에서 10분 간 굳힌다.
- text: 과일을 적당한 크기로 잘라 타르트에 올린다.
