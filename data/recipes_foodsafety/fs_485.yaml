steps:
- text: 등갈비는 찬물에 약 2시간 이상 담그어 핏물을 빼고, 월계수잎과 생강, 통훗추를 넣고 약 1시간 삶아 건져 놓는다.
- text: 적양배추와 당근, 양파를 채를 썰어 찬물에 담그어 놓는다.
- text: 유자청에 밤을 다져넣고 사과즙, 생크림, 설탕, 소금, 식초를 넣어 골고루 섞어 소스를 만든다.
- text: 물에 담그어 놓은 채소는 채에 올려 물기를 빼 놓는다.
- text: 팬에 기름을 두르고 다진마늘을 볶아 마늘기름을 만들어 놓는다.
- text: 마늘기름으로 삶아 놓은 등갈비를 노릇노릇 하게 굽고, 접시에 담아 물기를 빼 놓은 채소를 담고 유자소스를 올려 완성한다.
