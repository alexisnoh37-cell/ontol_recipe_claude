steps:
- text: 돼지고기와 소고기를 섞어, 매실액을 넣고 30분 정도 냉장고에서 숙성을 시킨다.
- text: 숙성된 돼지고기와 소고기에 다진마늘, 로즈마리, 빵가루, 후춧가루를 넣고 골고루 섞는다.
- text: 파프리카는 반으로 잘라 그 안에 씨를 수저를 이용해서 파낸다.
- text: 속을 파낸 파프리카에 양념한 고기를 넣고, 꼭꼭 눌러 두툼하게 잘라 구워 접시에 담는다.
- text: 양파는 입자있게 다져 팬에 기름을 넣고 은근히 볶아 양파 향을 낸다.
- text: 볶아진 팬(⑤)에 준비한 플레인요거트와 설탕, 매실액을 넣고 끓이다가, 식초와 녹말을 넣고 한 번 더 끓여 소스를 완성한다. 햄버거스테이트(④)에 소스를 얹고, 어린잎을 올려 완성한다.
