steps:
- text: 닭은 살을 발라 소금, 후춧가루로 밑간을 한다.
- text: 오곡을 불려 밥을 짓는다.
- text: 오이, 아스파라거스, 당근, 양파는 길이대로 채썬다.
- text: 닭살에 지어 놓은 오곡밥을 넣는다
- text: 오곡밥을 넣은 닭살에 카레가루를 골고루 묻힌다.
- text: 팬에 기름을 두르고 5번을 올려 은근히 익혀 접시에 담고, 썰어 놓은 야채를 닭살위에 담은 뒤 디종머스터드를 올린다.
