steps:
- text: 볼에 실온의 녹차, 건다시마를 넣어 녹차물을 만든다. 콩나물, 달래는 깨끗이 씻어 손질한다. 대구살은 한입 크기로 잘라 키친타월로 물기를 제거한다.
- text: 끓는 물에 손질한 콩나물을 2분간 데친 후 물기를 제거한다. 팬에 데친 콩나물, 현미밥, 콩나물밥 양념을 넣고 볶는다. 불을 끄고 가다랑어포(5g), 손질한 달래를 잘게 잘라 넣고 섞어 콩나물밥을 만든다.
- text: 볼에 대구살 양념을 모두 넣고 섞은 후 손질한 대구살을 넣고 전자레인지에서 3분간(700W 기준) 조리한다.
- text: 볼에 통깨, 가다랑어포(5g), 양파가루, 고춧가루를 넣고 곱게 빻은 뒤 조리한 대구살에 뿌린다.
- text: 그릇에 콩나물밥을 넣고 조리한 대구살을 올린 후 달걀지단을 만들어 고명으로 올린다.
- text: 다시마를 제거한 녹차물을 따뜻하게 데워 콩나물밥에 붓고 마무리한다.
