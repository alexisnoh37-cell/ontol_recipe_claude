steps:
- text: 쌀은 깨끗이 씻어 30분 이상 불려 밥을 지어 식힌다.
- text: 옥수수콘은 체에 걸러 물기를 뺀다.
- text: 양파, 애호박, 당근, 양파 및 새송이버섯은 옥수수콘 크기로 썰고 마늘은 다진다.
- text: 팬에 기름을 두르고 야채를 먼저 볶는다.
- text: 볶은 야채에 식혀놓은 밥을 넣고 볶다가 저염간장, 후춧가루로 간을 하고 옥수수콘을 넣고 살짝 볶는다.
- text: 팬에 기름을 자작하게 넣고, 라이스페이퍼를 둥글게 넣고 튀겨 그릇에 담은 뒤 볶음밥을 담는다
