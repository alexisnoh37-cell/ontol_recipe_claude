steps:
- text: 시금치와 당근은 각각 믹서에 물을 넣고 간다.
- text: 밀가루는 반으로 나눠 시금치 즙과 당근 즙을 넣고 소금을 넣어 각각 반죽 한다.
- text: 2의 반죽을 직경 1.5cm 정도의 동그란 경단모양으로 빚는다.
- text: 감자와 애호박은 1.5cm 주사위모양으로 자르고 실파는 2cm 길이로 썬다.
- text: 멸치 육수에 감자, 수제비 경단, 애호박, 다진마늘, 실파 순서로 넣고 끓인다.
- text: 5에 간장과 소금으로 간한다.
