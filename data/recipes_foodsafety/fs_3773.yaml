steps:
- text: 근대, 호박잎은 1분간 데치고 근대 줄기는 한입 크기로 자른다. 칼집을 낸 토마토는 데친 뒤 껍질을 벗겨 2×2cm 크기로 자르고 홍고추는 얇게 자른다. 양파는 1×1cm 크기로 자르고 당근은 10cm 길이로 길게 잘라 끓는 물에 1분간 데친다.
- text: 소고기는 키친타월로 핏물을 제거한다. 믹서에 캐슈넛, 무가당 두유를 넣고 갈아 캐슈넛 크림을 만든다.
- text: 예열한 팬에 쌀가루, 물(25ml)을 넣어 중간 불로 30초간 끓이다 불을 끄고 고춧가루, 파프리카가루, 표고버섯가루, 메주가루, 강판에 곱게 간 배를 넣어 수제 고추장을 만든다.
- text: 올리브유를 두른 팬에 손질한 소고기를 바싹 볶아 식힌다. 팬에 손질한 양파, 다진 마늘을 넣고 볶아 갈색빛이 나면 볶은 소고기, 손질한 토마토, 물(125ml), 카레가루, 오레가노, 수제 고추장을 넣고 센 불에서 10분간 끓인다. 강낭콩을 넣고 5분간 더 조려 고추장카르네를 만든다.
- text: 볼에 따뜻한 현미밥, 참기름을 넣고 고루 섞는다. 한입 크기로 나눠 데친 근대와 호박잎으로 감싸고 데친 당근으로 묶어 쌈밥을 만든다.
- text: 그릇에 고추장카르네, 쌈밥을 올린다. 캐슈넛크림을 뿌리고 손질한 근대 줄기, 홍고추, 참깨를 올려 마무리한다.
