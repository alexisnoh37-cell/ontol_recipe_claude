steps:
- text: 두부는 사방 3cm 길이와 두께로 잘라 허브 소금을 뿌려 수분을 완전히 빼고 속을 파서 밀가루를 묻힌다.
- text: 소 재료를 골고루 양념해 속을 파준 두부에 채워준다.
- text: 채워진 두부를 김을 두른 뒤 팬에 은근하게 구워준다.
- text: 고구마, 단호박, 아스파라거스를 편으로 썰어 준다.
- text: 마늘과 토마토를 각각 다진 후 오일에 볶다가 레드와인을 넣어 졸인다. 불을 끄기 직전에 버터를 넣어 소스를 만든다.
- text: 채소를 각각 구워주고 구워진 두부스테이크를 담고 레드와인 소스를 뿌려 완성한다.
