steps:
- text: 브로콜리는 소금물에 담궜다가 씻는다.
- text: 브로콜리를 작은 송이로 자른 뒤 기름, 소금을 넣은 물에 데쳐 찬물에 헹군다.
- text: 생강과 당근, 마늘, 소고기를 얇게 슬라이스 한다.
- text: 소고기를 밑간 한 뒤 10분 정도 재웠다가 기름을 두르고 살짝 익힌다.
- text: 마늘, 생강, 당근, 익혀둔 소고기를 팬에 넣고 브로콜리를 넣어 볶는다.
- text: 물 전분을 이용해 소스의 농도를 맞춘다.
