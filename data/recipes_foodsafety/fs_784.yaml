steps:
- text: 두부는 으깨서 소창을 이용하여 물기를 짠다.
- text: 후라이팬에 납작하게 펴서 노릇하게 굽는다.
- text: 구워진 두부를 대충 부서뜨린 후 간장을 넣어서 볶는다.
