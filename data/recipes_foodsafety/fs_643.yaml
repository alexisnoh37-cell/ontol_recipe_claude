steps:
- text: 전복은 수저로 떼어내어 소금으로 비벼 깨끗이 씻는다.
- text: 시금치는 데쳐 다지고, 새우는 껍질을 벗겨 전복, 해초와 함께 다진다.
- text: ?번을 잘 섞어 전복 껍질에 넣는다.
- text: 찜통에 김이 오르면 속을 채운 전복 껍질을 넣고 약 10분 정도 찐다.
- text: 저염간장, 레몬, 설탕, 다진마늘을 넣고 살짝 끓여 소스를 만든다.
- text: 간장소스에 전분을 풀어 농도를 맞추고, 전복찜에 여러번 바르고 식용꽃을 올린다.
