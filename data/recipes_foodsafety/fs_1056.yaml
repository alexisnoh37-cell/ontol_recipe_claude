steps:
- text: 들깨가루, 검은깨, 두유, 레몬즙, 꿀, 물, 참기름을 섞어 레몬 들깨 소스를 만든다.
- text: 떡 군데군데 꼬챙이로 찌르거나 칼집을 넣는다.
- text: 팬에 기름을 두르고 160℃ 정도에서 기름이 튀지 않도록 주의하며 떡을 튀긴다.
- text: 꼭지를 땐 잣과 호두를 굵게 다진다.
- text: 떡은 꼬치에 꽂아 접시에 담는다.
- text: 레몬 들깨소스를 바르고 잣, 호두를 고명으로 뿌린다.
