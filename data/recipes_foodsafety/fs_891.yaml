steps:
- text: 새우는 손질하여 물기를 제거한다.
- text: 달걀, 녹말가루, 밀가루로 튀김옷을 만들어 새우에 묻힌다.
- text: 튀김옷을 입힌 새우를 170℃ 식용유에 두 번 튀겨낸다.
- text: 대파, 마늘, 생강은 다진다.
- text: 팬에 고추기름을 두르고 2를 넣고 볶다가 청주, 두반장, 케첩을 첨가하여 볶은 후 물을 넣고 설탕, 식초로 간을 맞춘다.
- text: 살짝 졸인 뒤 튀긴 새우와 완두콩을 넣고 물녹말로 농도를 맞추고 마지막으로 참기름을 넣는다.
