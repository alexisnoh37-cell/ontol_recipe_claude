steps:
- text: 단호박은 껍질을 까고 작게 잘라주고, 양파도 작게 잘라준다.
- text: 브로콜리는 뜨거운 물에 데쳐내 준 후 송송 잘라준다.
- text: 찹쌀가루는 물 100g에 풀어준다.
- text: 단호박과 양파는 물 300g에 삶아준다.
- text: 단호박과 양파가 익으면 믹서에 갈아서 다시 끓여준 뒤 찹쌀가루물을 넣어 끓여준다.
- text: 호박죽이 끓어오르면 치즈가루를 넣어준 후 볶은 현미랑 완성한다.
