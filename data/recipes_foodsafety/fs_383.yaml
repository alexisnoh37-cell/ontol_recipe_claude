steps:
- text: 닭날개를 멕시코고추와 고추가루에 설탕, 다진마늘, 후추를 넣어 밑간을 해준다.
- text: 감자는 먹기 좋게 썰어 뜨거운 물에 70% 정도 익혀준다.
- text: 감자는 데쳐 낸 후 버터에 볶아준다.
- text: 브로콜리는 데치고, 사과와 토마토는 잘게 잘라준다.
- text: 냄비에 다진마늘과 다진양파를 볶아주다 토마토를 넣어 소스를 만들어준다.
- text: 닭날개를 팬에 구워주고 감자와 샐러드를 곁들여 완성한다.
