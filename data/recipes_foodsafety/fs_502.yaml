steps:
- text: 감자는 껍질을 벗겨 삶는다.
- text: 오이와 당근은 어슷썰기를 하고 양파는 채를 썰어놓는다.
- text: 썰어 놓은 채소에 소금과 물을 넣고 살짝 절여, 물기를 짜놓는다.
- text: 삶아 놓은 감자를 채에 내리고 생크림을 넣어 섞는다.
- text: 생크림을 넣은 감자에 절여 놓은 채소와 모짜렐라치즈를 넣고 골고루 섞는다.
- text: 섞여진 감자를 크로켓 모양을 만들어 밀가루, 달걀물, 빵가루를 묻혀 튀김기름 170~180℃ 온도에서 바삭하게 튀겨 냅킨에 올려 기름을 제거하고, 접시에 담아 완성한다.
