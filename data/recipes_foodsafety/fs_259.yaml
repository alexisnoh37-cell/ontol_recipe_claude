steps:
- text: 미나리, 숙주는 적당한 길이로 썰고, 양파는 채 썰고, 대파, 고추, 아스파라거스는 어슷하게 썬다.
- text: 해산물을 끓는 물에 데친다.
- text: 해산물 데친 물에 육수 재료를 넣고 끓인 뒤 체에 걸러 육수를 만든다.
- text: 냄비에 데친 해산물과 미나리, 숙주, 양파, 대파, 청양고추, 아스파라거스, 붉은 고추를 얹은 뒤 육수를 넣어 끓인다.
- text: 녹말물을 넣어 농도를 맞춘 뒤 조려 마무리한다.
