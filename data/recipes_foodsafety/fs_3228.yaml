steps:
- text: 약한 불에 멸치와 황태포를 5분간 볶은 뒤 나머지 육수 재료와 물(1L)을 넣어 끓어오르면 30분간 끓이고 체에 밭쳐 거른다.
- text: 건진 멸치는 잘게 다지고, 전복은 껍질과 내장을 제거한 뒤 칼집을 넣고, 애호박, 표고버섯, 당근, 달걀지단은 채 썬다.
- text: 잘게 다진 멸치에 멸치 양념장 재료를 넣어 멸치 양념장을 만든다.
- text: 냄비에 육수를 붓고 약한 불에 손질한 전복을 넣어 5분간 익힌다.
- text: 중간 불로 달군 팬에 식용유(5㎖)를 두른 뒤 손질한 채소를 볶는다.
- text: 그릇에 삶은 소면 → 볶은 재료 → 익힌 전복 순으로 담고 육수를 붓는다.
