steps:
- text: 생선살에 생강즙과 정종을 넣고 약 30분 정도 숙성을 시켜 비릿한 맛 제거 및 생선 살의 탱탱함을 살려준다.
- text: 콩가루와 밀가루, 카레가루, 녹말가루, 달걀을 넣고 골고루 섞어 튀김 반죽을 만들어 놓는다.
- text: 깻잎은 반으로 접어 채를 썰어 물에 잠시 담그어 놓는다.
- text: 깻잎(③)은 물기를 제거하고 튀김반죽(②)을 골고루 입힌다.
- text: 숙성시킨 생선살(①)에 녹말가루를 살짝 입히고 튀김 반죽(②)을 골고루 입힌 뒤, 튀김반죽을 입힌 깻잎(④)을 얹어 튀김 기름 170℃ 온도에 넣어 약 2분 정도 튀겨 기름을 자연스럽게 빼 놓는다.
- text: 마요네즈와 요구르트, 설탕, 식초를 넣어 골고루 섞어 튀김소스를 만들고, 튀김을 접시에 담아 양상추와 함께 얹어 완성한다.
