steps:
- text: 스파게티는 약 10분 정도 삶아 건져 찬물에 헹궈 물기를 빼고 올리브오일을 발라 준비한다.
- text: 소고기는 넓게 편으로 펴서 간장, 설탕, 마늘을 넣어 양념을 한다.
- text: 양념된 소고기를 팬에 구워 냅킨위에 올려 기름을 빼놓는다.
- text: 깻잎과 양파, 파프리카는 길게 채를 썰어 준비한다.
- text: 팬에 기름을 넣고 팬이 뜨거울 때 양파를 넣어 재빠르게 볶아낸다.
- text: 준비한 육수에 설탕과 식초, 저염간장을 넣어 차갑게 냉장보관하고, 그릇에 스파게티를 담고, 그 위에 볶은 양파와 깻잎, 파프리카와 구운 고기를 올린 후 차가운 육수를 부어 완성한다.
