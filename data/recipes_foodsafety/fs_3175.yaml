steps:
- text: 감귤은 껍질을 제거하고 알을 분리하여 반을 갈라 준다.
- text: 치커리는 한입크기로 썰어 준비한다.
- text: 완두콩, 수수, 율무, 병아리콩은 하루 전에 물에 불린 후 삶아준다.
- text: 삶은 콩은 체에 받쳐 물기를 제거한다.
- text: 손질한 재료를 모두 섞는다.
- text: 올리브오일과 유자청을 넣어 버무린다.
