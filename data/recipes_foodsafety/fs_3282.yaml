steps:
- text: 어린잎채소는 깨끗하게 씻어 물기를 제거하고, 견과류는 굵게 다진다.
- text: 건두부는 끓는 물에 데쳐 건져낸 뒤 물기를 제거한다.
- text: 건두부 위에 어린잎채소(3컵)를 올리고, 돌돌 말아 한입 크기로 썬다.
- text: 남은 어린잎채소에 다진 견과류와 슈레드모차렐라치즈를 고루 섞는다.
- text: 라임청의 라임을 얇게 다지고, 나머지 라임청드레싱 재료와 고루 섞는다.
- text: 그릇에 건두부말이와 샐러드를 담고, 라임청 드레싱을 뿌려 마무리한다.
