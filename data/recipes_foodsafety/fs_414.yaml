steps:
- text: 주꾸미를 몸과 다리를 분리 후 잘 씻어준다.
- text: 주꾸미 다리, 미나리, 양파, 당근을 다져준다.
- text: 다진 채소를 계란, 다진마늘, 생강청에 양념 한다.
- text: 양념한 3을 주꾸미 머리 속에 넣어주고 이쑤시개로 꽂아준다.
- text: 찜기에 찐다. 찔 때 레몬즙을 뿌리면 더욱 탱탱하다.
- text: 소스를 만든 뒤 주꾸미를 함께 완성한다.
