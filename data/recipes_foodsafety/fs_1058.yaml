steps:
- text: 찹쌀을 3-5시간 불려둔 뒤 물기를 제거하고 믹서기에 간다.
- text: 고구마는 껍질을 벗기고 작게 썰어 찜통에 찐 뒤 말랑말랑해지면 잘 으깨어 반죽하기 편할 정도로 만든다.
- text: 검정깨는 믹서기에 곱게 갈고 호두와 땅콩은 잘게 다진 뒤 황설탕과 섞어 호떡소를 만든다.
- text: 으깬 고구마에 찹쌀가루를 넣은 뒤 호떡 반죽을 만든다.
- text: 완성된 반죽을 적당량 떼어내 동그랗게 빚어 준비해둔 호떡소를 적당량 넣고 봉합한 뒤 납작하게 누른다.
- text: 팬에 현미유를 두르고 호떡을 살짝 눌러가면서 앞뒤로 노릇노릇하게 굽는다.
