steps:
- text: 광어는 포를 길게 떠서 소금과 후춧가루에 밑간을 해 놓는다.
- text: 아몬드와 호두는 입자있게 다져 준비한다.
- text: 밑간이 되어 있는 광어포에 밀가루와 달걀물을 입힌다.
- text: 달걀물을 입힌 광어살에 다시 다져 놓은 견과류를 입혀 준다.
- text: 팬에 올리브 오일을 넣고, 팬이 따끈해 지면 광어 살을 조심스럽게 앞뒤로 익혀 접시에 담는다.
- text: 플레인요거트에 꿀과 레몬즙을 넣고 골고루 섞어 광어스테이크소스를 만들어 완성한다.
