steps:
- text: 쌀은 불려 놓고, 마늘은 작게 다지고, 양파는 새송이와 파프리카와 함께 입자를 크게 다져 준비한다.
- text: 소고기는 포를 넓게 떠서 소금과 후춧가루를 뿌려 밑간을 해 놓는다.
- text: 냄비에 버터를 넣고, 마늘과 양파를 먼저 볶다가, 새송이와 파프리카를 넣는다.
- text: ③번에 다시 불린 쌀과 강화를 넣고, 볶다가 불을 줄여, 쌀이 익을 때까지 익혀 준다.
- text: 쌀이 익으면, 밑간이 되어 있는 소고기에 넣고 돌돌 말아 준비한다.
- text: 하얀 된장에 생크림을 넣어 골고루 섞고, 냄비에 육수를 넣고 생크림을 섞은 하얀 된장을 넣어 끓으면, 말아놓은 소고기를 넣고 은근히 졸여 완성한다.
