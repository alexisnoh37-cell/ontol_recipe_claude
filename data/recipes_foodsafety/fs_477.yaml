steps:
- text: 수삼은 뇌두를 제거하고 양파와 대파, 마늘과 함께 다진다
- text: 다진 소고기에 다진 재료(①)와 간장, 후춧가루, 정종, 찹쌀가루를 넣어 골고루 섞는다.
- text: 대추는 씨를 제거하고 채를 썰어 곁들임채소로 준비하고, 새송이는 길이로 썰어 갈비뼈 모양으로 만들어 놓는다.
- text: 양념이 된 소고기(②)를 새송이(③)에 감싸듯 타원형 모양으로 떡갈비를 만든다.
- text: 만들어 놓은 떡갈비를 팬에 은근히 익힌다.
- text: 간장과 올리고당, 설탕, 육수를 넣고 섞어가며 바글바글 끓인 뒤, 익힌 떡갈 비(⑤)를 넣고 살짝 졸인 후 접시에 담고, 그 위에 통깨를 살짝 뿌리고, 대추채(③)와 어린잎을 곁들임채소로 올려 완성한다.
