steps:
- text: 다시마 우린 물에 가다랑어포를 넣고 10분간 담갔다가 체에 거르고, 쌀로 밥을 짓는다.
- text: 돼지고기는 소금과 후춧가루로 밑간을 한 뒤 굽는다.
- text: 양파, 표고버섯, 팽이버섯은 채 썰고, 쪽파는 버섯 길이로 썬다.
- text: 육수에 저염간장을 넣어 한소끔 끓이다가 양파와 버섯을 넣고 끓인다.
- text: 다시 한 번 끓어오르면 쪽파와 달걀을 고루 풀어 넣고 젓지 말고 그대로 끓인다.
- text: 그릇에 밥을 담고, 돼지고기와 숙주를 올린 뒤 뜨거운 육수를 부어 마무리한다.
