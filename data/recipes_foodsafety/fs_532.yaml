steps:
- text: 고구마는 찜통에 약 20분 정도 쪄서 껍질을 벗겨 준비한다.
- text: 뜨거운 고구마가 한김 빠지면, 곱게 으깨 놓는다.
- text: 으깨진 고구마에 바나나를 썰어 요거트와 함께 넣는다.
