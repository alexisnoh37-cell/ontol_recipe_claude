steps:
- text: 삼겹살은 덩어리로 준비하여 삶아낸다.
- text: 배, 사과, 파인애플, 양파, 깐마늘, 깐생강은 갈아서 체에 거르고 간장과 함께 끓인다.
- text: ②에 삶아낸 삼겹살을 넣어 윤기 나게 조린다.
- text: 대파는 가늘게 채 썰고, 새싹채소는 깨끗하게 씻는다.
- text: 레몬즙, 식초, 설탕, 국간장, 고춧가루를 넣어 만든 소스를 야채에 버무린다.
- text: 한입 크기로 썬 삼겹살과 ⑤를 곁들여 낸다.
