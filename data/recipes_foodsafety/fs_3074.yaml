steps:
- text: 단호박은 쪄서 속을 파내고, 우유와 올리고당을 넣고 끓여 소스를 만든다.
- text: 소고기, 돼지고기, 양파, 마늘, 당근은 모두 잘게 다진다.
- text: ②에 빵가루, 달걀, 소금, 후추를 넣고 치댄다.
- text: 치댄 반죽을 둥글고 납작하게 만들어 준다.
- text: 팬에 기름을 두르고 노릇하게 굽는다.
