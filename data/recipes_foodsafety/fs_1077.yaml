steps:
- text: 참나물은 데친 뒤 잘게 다진다.
- text: 양파와 당근은 잘게 다진 뒤 볶는다.
- text: 단호박을 찐 뒤 으깨고 다진 참나물, 볶은 양파, 당근을 넣고 소금, 후춧가루로 밑간한다.
- text: 빵가루를 조금 넣고 섞어 되직한 반죽을 만든다.
- text: 반죽에 모짜렐라치즈를 넣고 한입 크기로 빚은 뒤 달걀, 빵가루 순으로 옷을 입힌다.
- text: 170℃ 기름에 튀긴다.
