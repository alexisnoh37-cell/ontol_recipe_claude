steps:
- text: 현미는 깨끗이 씻어 30분 이상 충분히 불린 뒤 밥을 짓는다
- text: 두부는 끓는 물에 데쳐 물기를 빼고 곱게 다져 된장, 생크림, 매실청을 넣고 골고루 섞는다.
- text: 데친 두부에 된장, 생크림 및 매실청을 골고루 섞는다.
- text: 아욱과 단호박은 각각 찐 후 식힌다.
- text: 찐 아욱 위에 현미밥을 올리고 두부소스, 날치알, 새싹 단호박을 올린다.
- text: 아욱에 올린 밥을 동그랗게 말아 접시에 담는다.
