steps:
- text: 소고기는 소금, 후추로 밑간을 하고 실파는 송송 썬다.
- text: 참치는 기름을 제거하고 양파, 셀러리, 마요네즈, 소금, 후추, 설탕을 넣고 양념한다.
- text: 상추는 작게 다듬어 얼음물에 담근다.
- text: 팬에 기름을 두르고 다진 마늘을 넣고 볶다가 밑간한 소고기를 넣고 볶는다.
- text: 4에 기호에 맞게 참기름과 실파를 넣는다.
- text: 물기를 제거한 상추에 밥 한 숟가락을 놓고 볶은 소고기, 참치, 마요네즈, 소스 순으로 얹는다.
