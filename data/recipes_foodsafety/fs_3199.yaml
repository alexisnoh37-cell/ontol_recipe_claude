steps:
- text: (속재료) 고구마를 삶아서 껍질을 제거하고 우유를 넣어가며 으깨서 부드러운 무스 상태로 만든다. ★ 고구마를 물에 삶으면 수분이 많아 우유량을 조절해야 해요.
- text: 버터를 제외한 모든 반죽 재료를 넣고 클린업 단계까지 믹싱하다가 버터를 넣어 최종단계까지 믹싱한다.
- text: 반죽은 처음 부피의 2배 정도 되도록 1차 발효하여 50g씩 분할하여 둥글리기 한 다음 중간 발효(10-15분)한다.
- text: 중간 발효가 끝난 반죽은 납작하게 펴고 만들어 놓은 고구마무스를 넣어 동그란 모양으로 일정하게 만든 후 팬닝한다.
- text: 팬닝된 반죽을 호떡처럼 윗면을 살짝 눌러준다.
- text: 190℃에서 15분 정도 굽는다.
