steps:
- text: 두부는 소창에 싸서 으깬다.
- text: 마는 껍질을 벗기고 강판에 간다.
- text: 홍고추는 다지고 표고버섯은 물에 불린 후 잘게 다진다. 오징어도 손질하여 잘게 다진다.
