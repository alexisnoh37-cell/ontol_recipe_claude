steps:
- text: 카스텔라는 반으로 잘라준 후 꿀을 발라준다.
- text: 견과류는 먹기 좋게 잘라준다.
- text: 자른 카스텔라 위에 꿀을 발라준다.
- text: 바른 카스텔라 위에 자른 견과류를 뿌려준다.
- text: 브로콜리를 뺀 해독주스 재료를 끓이다 마지막에 브로콜리를 넣어 살짝 끓여준 뒤 믹서에 간다.
