steps:
- text: 시레기는 1cm 길이로 자른다.
- text: 저나트륨 청국장은 굵게 다진다.
- text: 청, 홍고추와 새우 살도 굵게 다진다.
- text: 불에 준비된 청국장, 시래기, 청, 홍고추를 도토리가루와 밀가루, 물, 달걀을 넣어 되직하게 반죽한다.
- text: 팬에 식용유를 두르고 반죽을 부친다.
- text: 반죽 위에 새우 살을 얹어 전을 부친다.
