steps:
- text: 로메인 상추를 한 입 크기로 썬다.
- text: 파프리카는 사방 0.3cm 크기로 썬다.
- text: 누룽지를 튀긴 후 으깬다.
- text: 유자청, 레몬즙, 올리브유, 식초, 후추를 섞어 드레싱을 만든다.
