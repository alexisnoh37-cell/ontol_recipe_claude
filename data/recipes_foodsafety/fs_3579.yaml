steps:
- text: 알배추는 한입 크기로 자른다.
- text: 쪽파는 3cm 길이로 썰고, 찐 감자는 한입 크기로 자른다
- text: 마늘, 생강, 무, 양파는 깨끗이 씻어 한입 크기로 자른다.
- text: 믹서에 찐 감자, 고춧가루, 매실청, 까나리액젓, 새우젓, 무, 양파, 생강, 마늘을 넣고 갈아 겉절이 양념을 만든다.
- text: 손질한 알배추, 쪽파, 겉절이 양념(15g)을 버무린다.
- text: 접시에 담고 통깨를 뿌려 마무리한다.
