steps:
- text: 생선살은 가시를 발라내고 곱게 으깨어 놓는다.
- text: 으깬 생선살에 맛술 과 생강즙, 소금을 넣어 골고루 치댄다.
- text: 잘 치댄 생선살에 밀가루를 넣어 다시 치대어 준다.
- text: 양파와 당근, 샐러리, 마늘은 곱게 다지고, 옥수수는 알맹이를 준비한다.
- text: 생선살에 다진 채소와 어린이 치즈를 다져 섞는다.
- text: 채소를 다져 섞은 생선살을 동글동글 하게 완자를 빚어 튀김기름에 약 150℃ 온도에서 은근히 5분 정도 튀겨 완성 한다.
