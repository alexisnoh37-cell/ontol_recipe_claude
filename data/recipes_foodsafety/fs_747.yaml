steps:
- text: 찹쌀을 3~5시간 불린 후 물기를 제거하고 믹서기에 간다.
- text: 고구마는 껍질을 벗기고 작게 썰어 찜통에 넣고 찐 후 으깬다.
- text: 검정깨는 믹서기에 갈고, 호두와 땅콩은 굵게 다지고 황설탕과 찹쌀가루를 함께 섞어 호떡소를 만든다.
- text: 으깬 고구마에 찹쌀가루를 넣고 반죽을 한다.
- text: 4의 반죽을 동그랗게 빚어 3의 호떡소를 넣고 둥글납작하게 만든다.
- text: 팬에 현미유를 두르고 호떡을 눌러가며 앞뒤로 굽는다.
