steps:
- text: 쌀은 깨끗이 씻어 30분 정도 불려 밥을 짓는다.
- text: 달걀을 풀어 소금을 넣고 지단을 만들어 채썬다.
- text: 도라지, 애호박, 양파, 홍고추는 채를 썰어 소금에 살짝 절여 볶고, 청포묵은 채를 썰어 참기름에 버무린다.
- text: 돼지 안심은 소금, 후춧가루로 양념 한 뒤 팬에 익힌다.
- text: 찬물에 식초, 설탕, 소금을 넣고 채 썬 오이를 넣어 냉국을 만든다.
- text: 고추장에 고춧가루를 섞어 쌈밥장을 만들고, 라이스페이퍼를 물에 담궈 건져 밥과 준비한 야채, 달걀지단, 쌈무, 쌈밥장을 올려 돌돌 말고 데친 미나리로 묶는다.
