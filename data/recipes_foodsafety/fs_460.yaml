steps:
- text: 새우는 내장을 제거하고, 오징어는 껍질을 벗겨 안쪽으로 칼집을 넣은 뒤 준비한 새우, 오징어, 조개살을 살짝 데친다.
- text: 양배추와 파프리카를 길쭉하게 썰고 당근, 양파는 채를 썰어 준비한다.
- text: 굴소스와 칠리소스를 섞어 소스를 만들어 놓는다.
- text: 우동은 끓는 물에 한 번 데쳐 준비한다.
- text: 팬에 버터를 둘러 해물을 먼저 볶다가 만들어 놓은 소스를 넣는다.
- text: 5번에 채소를 넣어 살짝 볶다가 데친 우동을 넣고 한 번 더 볶은 후 접시에 담고 그 위에 가쯔오부시를 올려 완성한다.
