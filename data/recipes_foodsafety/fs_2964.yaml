steps:
- text: 단호박을 잘게 다진다.
- text: 마를 0.3cm 두께로 썰어 뜨거운 물에 데친다.
- text: 잘게 다진 단호박에 밀가루와 찹쌀가루, 물, 소금을 넣어 반죽한다.
- text: 프라이팬에 식용유를 두르고 반죽을 두른다.
- text: 두른 반죽 가운데 마를 올려 부친다.
- text: 먹기 좋게 담은 후 건대추를 고명으로 올린다.
