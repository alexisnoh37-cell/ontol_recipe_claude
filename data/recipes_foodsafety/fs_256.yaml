steps:
- text: 냄비에 닭육수 재료를 넣고 20분간 끓여 면포에 거른다.
- text: 대하를 흐르는 물에 잘 헹구고 머리와 껍질을 제거한 뒤 화이트와인에 재운다.
- text: 시금치를 손질한 후 끓는 물에 살짝 데친다.
- text: 팬에 닭육수(100g)와 유자청과 매실액을 넣고 끓이다가 잘 섞이면 대하를 넣어 조린다.
- text: 대하가 익어갈 때쯤 시금치를 넣고 1분간 더 조린다.
- text: 그릇에 시금치를 올리고 그 위에 대하를 올린 후 아보카도와 토마토를 먹기 좋게 썰어 얹어 마무리한다.
