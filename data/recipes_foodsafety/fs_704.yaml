steps:
- text: 꽃게는 손질하여 먹기 좋은 크기로 자른다.
- text: 물 1컵에 건다시마와 꽃게를 넣고 끓여 육수 ⅔컵을 만든다.
- text: 양배추와 토마토는 씻어 1cm×1cm 크기로 썬다.
- text: 파는 씻어 어슷썰기 한다.
- text: 육수 낸 꽃게는 건져 살을 발라낸다.
- text: 육수에 된장을 풀고 양배추와 토마토를 넣고 한소끔 끓인 후 발라놓은 꽃게 살과 파, 다진 마늘을 넣어 완성한다.
