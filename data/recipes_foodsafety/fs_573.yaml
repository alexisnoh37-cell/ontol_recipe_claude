steps:
- text: 연어는 끝을 뾰족하게 살려 슬라이스한다.
- text: 쌀은 깨끗이 씻어 30분 이상 불려 밥을 지어 식힌다.
- text: 냄비에 식초, 설탕, 소금 약간과 물을 동량으로 넣고 끓인 뒤 식혀 촛물을 만들어 밥에 넣고 골고루 섞는다.
- text: 당근과 표고버섯은 입자있게 다져 살짝 볶아 식혀놓은 초밥에 넣고 잘 섞어준다.
- text: 와사비 가루에 30℃정도의 물을 넣고 섞은 뒤 발효 시키고, 초밥 형태를 만들어 그 위에 와사비를 바르고 연어를 올린 후 접시에 담는다
- text: 새싹과 파슬리는 찬물에 담았다 건져 물기를 빼고, 연어 초밥 옆에 올린다.
