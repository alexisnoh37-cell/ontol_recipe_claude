steps:
- text: 돼지고기등심은 자근자근 두들겨 소금과 후추를 뿌려 숙성시킨다.
- text: 깻잎, 당근, 피망, 양파는 채를 썰어 준비한다.
- text: 숙성된 돼지고기(①)에 썰어놓은 채소 (②)와 치즈를 넣어 말아준다.
- text: 마요네즈에 두부를 으깨어 넣고 생크림과 요구르트, 설탕, 머스터드를 넣어 골고루 섞어준다.
- text: 어린잎은 찬물에 잠시 담그어 놓았다가 채에 건져 물기를 제거한다.
- text: 말아놓은 등심에 밀가루, 달걀물, 빵가루 순서로 입혀 튀김기름 170~180℃의 온도에 약 3분 정도 튀겨 기름을 빼 놓고, 튀김소스(④)와 어린잎(⑤)을 접시에 담아 완성한다.
