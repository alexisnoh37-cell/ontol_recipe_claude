steps:
- text: 미숫가루는 설탕을 넣고 체에 한 번 거른다.
- text: 달걀노른자에 설탕을 넣고 중탕으로 익힌다.
- text: 버터는 중탕으로 녹이고 검은콩은 불린 뒤 삶아 통조림콩, 버터와 함께 간다.
- text: 바나나는 곱게 으깨고 흑임자는 곱게 간다.
- text: 우유는 냄비에 넣고 따끈하게 데운다.
- text: 데워진 우유에 미숫가루와 모든 재료를 골고루 섞는다.
