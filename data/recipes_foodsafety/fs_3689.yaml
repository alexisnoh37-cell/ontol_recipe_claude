steps:
- text: 볼에 아몬드가루, 무가당 코코아가루①을 체 쳐서 넣고 귀리, 코코넛오일, 알룰로스①, 소금을 넣고 섞어 반죽을 만든다.
- text: 반죽은 냉장고에서 30분 동안 휴지한다.
- text: 볼에 무가당 코코아가루②를 체 쳐서 넣고 땅콩버터, 알룰로스②를 넣는다. 완전히 섞이면 아몬드우유를 넣고 섞어 초코필링을 만든다.
- text: 냉동실에서 30분 동안 굳힌 그릭요거트에 알룰로스③을 섞어 숟가락으로 모양을 잡아 그릭요거트 토핑을 만든다.
- text: 머핀 틀에 코코넛오일을 바르고 반죽을 넣어 타르트지 모양을 잡는다. 170°C로 예열한 오븐에 20분 동안 구운 후 완전히 식힌다.
- text: 초코필링을 채우고 그릭요거트 토핑을 올려 마무리한다.
