  role: sub
- ingredient: black_pepper
  raw_text: 후추적당량[양송이 속양파다진것 10g, 버터적당량, 양송이 30g, 빵가루 5g, 생크림 적당량
  role: sub
steps:
- text: 양파는 곱게 다지고 양송이는 0.5cm로 슬라이스 한다.
- text: 팬에 버터를 넣고 녹으면 양파를 볶다가 양송이를 넣어 볶는다.
- text: 생크림, 소금, 후추로 간을 하고 양송이에서 물이 빠져나오면 빵가루를 넣어 되직하게 농도를 맞춘 뒤 그릇에 옮겨 식힌다.
- text: 차이브, 오레가노, 바질, 파슬리를 잘게 다진다.
- text: 간 닭고기와 3, 4를 볼에 넣고 섞어 치대 찰지게 만든 뒤 지름 10cm 정도의 원형 모양이나 럭비공 모양으로 만든다.
- text: 팬에 기름을 두른 뒤 치킨 스테이크를 익혀주거나 팬에서 색만 내고 오븐에서 익힌다.
