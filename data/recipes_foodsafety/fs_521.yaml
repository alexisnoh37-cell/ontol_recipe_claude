steps:
- text: 양배추는 깨끗이 씻어 찜기에 김이 오르면 쪄서 식혀 준비한다.
- text: 느타리, 표고 ,팽이버섯, 당근, 오이는 약 5cm 길이로 채를 썰어 준비한다.
- text: 소고기도 가늘게 채를 썰어 준비하고, 파, 마늘, 참기름, 설탕을 넣어 양념을 한다.
- text: 팬에 준비한 채소에 소량의 소금을 넣어 먼저 볶다가 양념한 소고기를 넣고 재빠르게 볶아 식혀 준비한다.
- text: 쪄 놓은 양배추를 김발 위에 올려 넣고, 볶아놓은 채소와 소고기를 넣는다.
- text: 김발을 이용하여 양배추를 돌돌 말고, 미나리를 데쳐 끈으로 묶어 접시에 올리고, 간장과 맛술, 참기름을 섞은 간장소스를 만들어 담는다.
