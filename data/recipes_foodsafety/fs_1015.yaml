steps:
- text: 바지락살과 새우는 소금물에 흔들어 씻어 체에 받쳐 물기를 제거한다.
- text: 대파, 청, 홍고추는 송송 썰고, 마늘, 생강은 다진다.
- text: 끓는 물에 칼국수 면을 삶아 냉수에 헹군 뒤 참기름으로 버무린다.
- text: 멸치 육수에 분량의 재료를 넣고 간장 소스를 만든다.
- text: 팬에 식용유를 두르고 다진 마늘, 생강, 고추를 넣어 볶다가 센 불에서 바지락살과 새우, 청주를 넣어 볶은 뒤 간장소스를 넣고 끓인다.
- text: 5가 반정도 졸면 칼국수 면을 넣어 볶으면서 물전분으로 농도를 맞춘 뒤 송송 썬 파와 참기름을 넣고 마무리한다.
