steps:
- text: 육수 재료를 넣고 20분간 끓여 육수를 낸다.
- text: 닭가슴살과 당근을 다져 모양을 잡은 뒤 김 오른 찜기에 넣고 찐다.
- text: 고추, 대파는 어슷 썰고, 쑥갓, 표고버섯, 애호박, 김치는 먹기 좋은 크기로 썰고, 팽이버섯은 밑동을 잘라 손질한다.
- text: 당면과 숙주는 뜨거운 물에 데쳐 준비한다.
- text: 양념장 재료를 섞은 뒤 육수(13g)를 넣고 양념장을 만든다.
- text: 준비한 재료를 담고 육수를 부은 뒤 양념장을 넣고 끓여 마무리한다.
