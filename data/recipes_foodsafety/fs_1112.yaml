steps:
- text: 호떡반죽에 물을 넣고 반죽한 뒤 발효시킨다.
- text: 밤, 고구마, 대추, 곶감, 호두를 다진다.
- text: 2번에 잣, 호박씨, 계피가루, 홍시를 섞는다.
- text: 발효시킨 반죽에 3번을 채우고 동그랗게 빚는다.
- text: 팬에 식용유를 두른다.
- text: 가열된 팬에 반죽을 올린 뒤 납작하게 눌러 굽는다.
