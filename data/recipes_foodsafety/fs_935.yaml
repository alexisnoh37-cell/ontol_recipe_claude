steps:
- text: 냄비에 버터를 녹인 후 마늘, 양파, 셀러리, 생강을 넣고 볶는다.
- text: 양파와 셀러리가 부드러워지면 닭육수를 넣는다.
- text: 2에 단호박, 고구마를 넣고 단호박이 부드러워질 때까지 약한불로 끓인다.
- text: 단호박이 다 익으면 믹서에 부드러운 상태가 되도록 간다.
- text: 4를 다시 냄비에 넣고 중간불로 끓인다.
- text: 5에 우유, 라임주스, 소금, 후추, 크림을 넣어 마무리한다.
