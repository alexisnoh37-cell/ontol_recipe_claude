steps:
- text: 비지는 살짝 데쳐 물기를 뺀다.
- text: 무장아찌는 잘게 다져 비지에 골고루 섞어 소스를 만든다.
- text: 토마토는 슬라이스로 썰어 팬에 오일을 두르고 익힌다.
- text: 포카치아빵은 반으로 갈라 비지소스를 바른다.
- text: 생치즈는 동그랗게 원형으로 찍어, 비지를 바른 빵에 구운 토마토와 함께 올리고, 다시 그 위에 비지를 올려 접시에 담는다.
- text: 루꼴라는 찬물에 담궈 건져 포카치아빵 옆에 함께 놓는다
