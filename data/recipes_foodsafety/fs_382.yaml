steps:
- text: 닭가슴살과 단호박은 사방 2.5cm 크기로 잘라준다.
- text: 양파 2가지, 색파프리카, 대파는 닭 크기와 비슷하게 잘라준다.
- text: 닭가슴살과 소라살은 통후추, 올리브오일에 재워준다.
- text: 소스를 만들어준다.
- text: 모든 재료를 꼬치에 꽂는다.
- text: 꼬치를 팬에 구워주면서 소스를 발라준다.
