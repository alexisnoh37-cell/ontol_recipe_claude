steps:
- text: 저염 간장, 식초, 물(10㎖)을 섞은 뒤 얇게 채 썬 적양파를 넣어 30분간 숙성해 양파장아찌를 만든다.
- text: 두부와 생새우, 팽이버섯, 당근, 깻잎, 파프리카는 믹서에 넣어 곱게 간다.
- text: 중간 불로 달군 팬에 다진 소고기를 살짝 볶은 뒤 곱게 간 재료와 감자전분(45g), 달걀흰자와 섞어 소를 만든다.
- text: 애호박은 양끝을 자른 뒤 속을 파내고 안쪽에 감자전분(5g)을 고루 묻힌다.
- text: 애호박에 소를 채운 뒤 찜기에 넣어 8분간 찐다.
- text: 애호박 순대를 1cm 두께로 썰어 그릇에 담고 양파장아찌를 올린다.
