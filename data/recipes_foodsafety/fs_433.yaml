steps:
- text: 당근은 모양틀로 잘라서 편으로 썰어준다.
- text: 연 근 은 껍 질 을 벗 겨 서 식 초 물 에 살 짝 담가준다.
- text: 청고추, 홍고추, 미나리는 먹기 좋게 썰어준다.
- text: 마늘은 편으로 썰어서 물 400g에 끓여주다 불을 끄고 치자가루를 넣어 국물을 만들어준다.
- text: 국물에 연근을 담가 색을 들인다.
- text: 여기에 생강청, 식초, 설탕, 볶은소금과 준비된 채소를 넣어 치자 연근물김치를 완성한다.
