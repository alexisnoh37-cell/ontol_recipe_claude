steps:
- text: 양파, 대파, 호두, 닭가슴살은 잘게 다진다.
- text: ①에 물기를 제거한 두부와 생강, 마늘, 후추를 섞어 반죽한다.
- text: 반죽을 쌀가루, 계란물, 빵가루 순으로 묻히고 튀겨 크로켓을 만든다.
- text: 믹서에 두부, 두유를 넣고 갈아 두부 마요네즈를 만든다.
- text: 순무와 양파는 다지고, 계란은 삶아 다져 준비한다.
- text: 두부 마요네즈에 ⑤의 재료와 설탕, 레몬, 식초, 땅콩버터, 후추, 홀그레인, 파슬리가루를 넣어 타르소스를 만든다.
