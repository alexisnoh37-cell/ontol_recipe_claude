steps:
- text: 렌틸콩을 삶아 믹서에 간다.
- text: 딸기(100g)를 믹서에 갈고 1번, 우유, 꿀, 레몬즙을 넣고 섞는다.
- text: 젤라틴을 물에 담궈 불린다.
