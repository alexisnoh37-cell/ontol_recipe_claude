steps:
- text: 달걀을 완숙으로 삶아 찬물에 담궈 식혀 껍질을 벗긴 뒤 볼에 넣어 포크로 거칠게 으깬다.
- text: 으깬 달걀에 머스타드, 레몬주스, 소금, 후춧가루, 마요네즈를 섞는다.
- text: 아보카도는 껍질을 제거하고 얇게 슬라이스 한다.
- text: 식빵은 노릇하게 양면을 굽는다.
- text: 4에 아보카도를 얹고 그 위에 달걀 샐러드를 얹어 식빵으로 덮는다.
- text: 샌드위치의 가장자리 부분은 잘라내고 원하는 적당한 크기로 자른다.
