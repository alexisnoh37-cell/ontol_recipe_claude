steps:
- text: 양파는 링으로 자르고 나머지 야채는 0.5cm 주사위모양으로 잘라 볼에 담는다.
- text: 볼에 담긴 야채에 소금을 뿌려 골고루 간이 베이도록 섞는다.
- text: 오븐용기에 야채를 가지런히 깔고 올리브 오일을 뿌리뒤 소금과 후추로 간을 한다.
- text: 그릇에 파마산 치즈와 빵가루를 넣고 잘 섞는다.
- text: 3의 야채 위에 4를 뿌려 덮는다.
- text: 180℃로 예열된 오븐에 굽는다.
