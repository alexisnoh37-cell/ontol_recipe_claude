steps:
- text: 감자는 삶아 껍질을 벗긴다.
- text: 아스파라거스는 2등분 하고, 방울토마토와 함께 끓는 물에 살짝 데친다.
- text: 닭고기에 소금, 후추, 배즙을 넣고 숙성 시킨다.
- text: 저염간장에 다진 마늘, 설탕, 후춧가루, 참기름을 넣고 양념장을 만들어 3번에 묻혀 굽는다
- text: 흑미는 충분히 불려 밥을 짓는다
- text: 깻잎은 간장, 식초, 설탕에 절여 흑미밥과 너비아니 구이를 넣고 돌돌 말아 쌈밥을 만든다
