- text: 유자청, 레몬즙, 카놀라유, 흰 후추를 넣어 유자 드레싱을 만든다.
- text: 실곤약은 끓는 물에 데치고 찬물에 헹궈 물기를 빼준다. 오이, 사과, 당근, 빨강 파프리카는 4cm 길이로 가늘게 채 썬다.
