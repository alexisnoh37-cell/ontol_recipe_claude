steps:
- text: 냄비에 물 2컵을 넣고 돼지고기, 양파, 파, 통마늘, 생강, 후춧가루를 넣고 삶는다.
- text: 삶은 돼지고기는 2cm × 3cm × 0.3cm 가량의 크기로 썬다.
- text: 참나물은 먹기 좋은 크기로 자른다.
- text: 양파는 다져준다.
- text: 다진양파, 설탕, 간장, 고춧가루, 올리브유, 식초, 마늘, 통깨를 넣어 샐러드드레싱을 만든다.
- text: 2의 돼지고기와 3의 참나물을 그릇에 담고 샐러드드레싱을 곁들인다.
