steps:
- text: 양파, 당근, 오이는 채 썰어준다.
- text: 열무 물김치와 탄산수, 어간장을 넣어 국수 국물을 만들어준다.
- text: 달걀은 삶아준다.
- text: 실곤약은 삶을 때 레몬즙을 넣어서 곤약의 특이한 냄새를 제거한다.
- text: 물기를 제거한 곤약에 어간장을 넣어 밑간을 해준다.
- text: 그릇에 담고 국물을 부어주고, 채소와 달걀을 곁들여 완성한다.
