steps:
- text: 오징어는 껍질을 벗긴 후 안쪽에 대각선으로 칼집을 넣어 데친다.
- text: 당근, 시금치, 불린 표고버섯은 0.5cm 두께로 썬다.
- text: 시금치는 끓는 물에 데쳐 찬물에 헹군 뒤 물기를 제거한다.
- text: 달걀은 잘 풀어 도톰하게 달걀말이를 만 후 당근처럼 썬다.
- text: 오징어의 물기를 제거하고 밀가루를 살짝 뿌린후 2, 3의 재료를 모두 넣어 김밥 말듯이 돌돌말아 꼬치로 두군데를 고정시킨다.
- text: 토마토케첩소스의 재료를 섞어 팬에서 졸이다가 4의 오징어를 넣고 소스를 끼얹어가며 졸여 1.5cm의 두께로 썬다.
