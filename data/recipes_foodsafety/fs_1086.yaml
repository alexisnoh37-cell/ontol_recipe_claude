steps:
- text: 무를 깍둑썰기하여 소금에 30분 간 절인다.
- text: 실파를 잘게 다진다.
- text: 파프리카, 사과, 멸치액젓, 올리고당을 믹서에 넣고 간다.
- text: 멸치로 다시물을 만들고 현미밥과 다시물을 1:1로 넣어 끓인 후 현미풀을 만든다.
- text: 3번에 실파, 현미풀, 다진 마늘을 넣고 양념을 만든다.
- text: 절인 무를 체에 받쳐 소금물을 제거하고 양념을 넣어 버무린다.
