steps:
- text: 코다리는 먹기 좋게 잘라서 물에 헹궈 물기를 빼준다.
- text: 감자와 무, 백일송이버섯, 미나리는 먹기 좋게 썰어준다.
- text: 양파, 청양고추도 먹기 좋게 썰어준다.
- text: 냄비에 참기름을 넣어 코다리를 살짝 볶아준다.
- text: 코다리를 볶은 냄비에 무, 감자, 국물 재료를 넣고 충분히 끓인다.
- text: 끓고 있는 국에 양파, 청양고추, 백일송이 버섯을 올려 완성한다.
