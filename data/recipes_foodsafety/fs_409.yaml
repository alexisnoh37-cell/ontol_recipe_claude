steps:
- text: 더덕은 손질해 어슷하게 잘라 소금물에 살짝 담가준다.
- text: 사과는 먹기 좋게 썰어서 레몬즙에 살짝 뿌려준다.
- text: 주꾸미는 레몬즙을 넣어 살짝 데쳐준다.
- text: 청고추, 홍고추는 씨를 제거하고 사과처럼 잘라주고. 양파도 잘라준다.
- text: 소스를 만들어준다.
- text: 모든 채소와 주꾸미를 섞어 소스랑 한데 버무려 완성한다.
