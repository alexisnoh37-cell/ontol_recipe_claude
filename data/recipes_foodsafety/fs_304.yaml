steps:
- text: 감자는 한입 크기로 썰고, 양파와 당근, 대파는 길게 채 썰고, 청양고추는 다지고, 팽이버섯은 깨끗이 씻어 준비한다.
- text: 달걀은 노른자와 흰자를 분리해 지단을 부쳐 채 썬다.
- text: 당면은 찬물에 2시간 정도 불린다.
- text: 물(300g)에 멸치를 넣어 육수를 만든 후, 황태포를 넣어 다시 한 번 진하게 육수를 우려낸다.
- text: 육수에 감자, 당근, 양파, 당면을 순서대로 넣고 끓인 후 불을 끄고 팽이버섯을 얹어 잔열로 익힌다.
- text: 다진 마늘, 청양고추, 저염간장, 소금, 후춧가루를 넣어 간을 한 뒤 지단, 쑥갓, 대파를 얹어 마무리한다.
