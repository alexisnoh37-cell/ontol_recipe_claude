steps:
- text: 배추를 소금물에 하루 동안 절인 후 물기를 빼고 석류는 즙을 낸다.
- text: 무는 채 썰고, 쪽파와 미나리는 4cm로 자른다.
- text: 무채, 미나리, 쪽파, 다진 마늘, 다진 생강, 새우젓국을 넣고 섞어 소를 만들고 절인 배추에 소를 넣고 오므려 싼다. 석류즙에 소를 채운 배추를 담가 완성한다.
