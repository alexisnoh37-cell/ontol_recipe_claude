steps:
- text: 돼지고기는 덩어리로 준비해 충분히 무르도록 대파, 마늘, 생강, 통후추를 넣어 삶는다.
- text: 부추와 양파는 3cm 길이로 썰어 매운 소스 양념에 가볍게 무친다.
- text: 무는 채썰어 소금, 설탕, 식초에 절였다가 꼭 짠다.
- text: 삶은 돼지고기를 건져 얇게 저민다.
- text: 저민 돼지고기와 양념한 부추, 무를 곁들여 접시에 담는다.
- text: 두부를 곱게 다져 분량의 소스 재료와 섞어 저나트륨 두부 된장소스를 만들어 수육과 함께 낸다.
