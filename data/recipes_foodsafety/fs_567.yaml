steps:
- text: 닭은 살을 발라 소금, 후춧가루로 밑간을 하고 닭뼈는 삶아 육수를 만든다.
- text: 인삼은 뇌두를 제거하고 깨끗이 씻어 채 썰고, 대추도 씨를 제거 한 후 채 썬다.
- text: 양파, 대파, 당근은 채썰고, 찹쌀은 깨끗이 씻어 충분히 불린 뒤 함께 볶는다.
- text: 충분히 볶아지면 육수를 자작하게 넣고 익힌다.
- text: 랩에 닭살을 놓고 찹쌀과 인삼채, 대추채를 올려 돌돌 만다.
- text: 마늘, 생강, 월계수잎 및 통후추를 넣고 끓인 물에 김이 올라오면 말아놓은 닭살을 찜통에서 20분 정도 찌고 한 김 식으면 썰어 접시에 담는다.
