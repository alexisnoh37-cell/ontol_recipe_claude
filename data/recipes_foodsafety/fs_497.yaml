steps:
- text: 흑임자는 곱게 갈아 밀가루와 우유를 넣고 반죽을 해서 비닐에 넣어 숙성 시킨다.
- text: 닭가슴살은 삶아 건져 후춧가루를 살짝 넣고, 입자있게 다진다.
- text: 입자있게 다진 닭가슴살을 마늘과 함께 팬에서 볶아놓는다.
- text: 마와 바나나는 강판에 갈고, 캐슈넛과 잣은 입자있게 다진 뒤 냄비에 마, 바나나, 캐슈넛, 잣, 머스터드를 넣어 섞은 뒤, 우유를 넣고 살짝 끓여 편수 육수를 만들어 놓는다.
- text: 부추와 양파, 파는 입자있게 썰어, 볶아 놓은 닭가슴살(③)에 섞어 편수 속을 만들어 놓는다.
- text: 숙성시킨 밀가루 반죽(①)은 얇게 밀어 사각형으로 썰어 그 안에 속을 채워 넣고, 찜통에 약 5분 정도 쪄 접시에 담고, 그 위에 편수 육수를 올려 완성한다.
