steps:
- text: 망고는 손질 후 버터로 살짝 볶고 레드와인을 넣고 졸이다가 믹서로 갈아주고 딸기잼으로 간과 농도를 맞추어 레드와인 소스를 만든다.
- text: 소 채끝살은 손질 후 만들어진 레드와인 소스에 마리네이드 해준다.
- text: 감자는 껍질을 제거 후 먹기 좋은 크기로 잘라서 뜨거운 물에 데쳐내 버터에 볶아준다. 당근은 먹기좋은 크기로 잘라 뜨거운 물에 데쳐 버터 에 볶아주고, 시금치도 데친 후 수분을 제거하 고 버터에 볶는다.
- text: 마리네이드 한 고기를 구워준다.
- text: 마리네이드 하고 남은 망고소스를 다시 팬에 졸여 소스를 만든다.
- text: 접시에 준비된 채소와 안심을 담고 소스를 뿌려 완성한다.
