steps:
- text: 밀가루에 소금과 녹말가루를 넣고 반죽을 한다.
- text: 냄비에 건새우와 머리와 내장을 제거한 멸치, 다시마, 무, 마늘, 양파를 넣고 약30분 정도 끓여 체에 걸러 육수를 만들어 놓는다.
- text: 호박은 반달모양으로 썰고, 느타리는 손으로 찢고, 양파와 대파는 길게 썰어 준비한다.
- text: 새우는 요지를 이용하여 새우등의 내장을 제거하고, 홍합은 족사를 때어 내고 솔을 이용하여 껍질을 깨끗이 씻어낸 후 흐르는 물에 깨끗하게 행구고, 미더덕은 깨끗이 씻어 놓는다.
- text: 반죽을 해 놓은 밀가루에 덧 밀가루를 뿌려가며 얇게 밀어준다.
- text: 얇게 밀어 놓은 밀가루를 칼로 썰어 덧밀가루를 털어내고, 만들어 놓은 육수에 칼국수를 넣고, 준비한 채소 (③)와 해물(④)을 넣고 간장으로 간을 맞추어 완성한다.
