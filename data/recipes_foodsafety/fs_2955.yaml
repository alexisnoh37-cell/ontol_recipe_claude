steps:
- text: 양파, 양송이버섯, 당근, 감자, 토마토를 잘게 다진다.
- text: 다진 소고기와 다진 양파, 다진 양송이버섯, 다진 마늘, 빵가루, 계란노른자를 넣고 치댄다.
- text: 반죽을 70g씩 나눠 스테이크 모양을 만들어 굽는다.
- text: 다진 당근, 감자, 양파, 토마토, 마늘과 카레가루를 물에 넣고 끓인다.
- text: 카레 소스가 농도가 날 때 까지 끓인다.
- text: 스테이크와 카레소스를 곁들여 담는다.
