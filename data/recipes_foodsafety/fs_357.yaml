steps:
- text: 주꾸미는 먹기 좋게 잘라주고, 바지락살은 물에 데쳐서 수분을 빼고 생강청으로 비린내를 제 거한 뒤 볶아준다.
- text: 소고기와 닭가슴살은 각각 양념해준다.
- text: 양파, 청고추, 홍고추, 당근은 채 썰어 함께 볶아준다.
- text: 볶아 놓은 채소와 고기, 해산물은 양념장에 버무린다.
- text: 미나리와 배를 곱게 채 썰어 올려서 완성한다.
