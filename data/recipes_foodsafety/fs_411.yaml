steps:
- text: 감자는 껍질을 벗겨서 1개를 채 썰고 물에 담가둔다.
- text: 감자 1개는 강판에 갈아서 즙과 건지를 따로 분리해준다.
- text: 양파를 곱게 채 썰어주고 볼에 강판에 간 건지와 채 썬 감자, 채 썬 양파를 섞어 반죽을 만들어 준다.
- text: 소스를 만들어준다.
- text: 팬에 한입 크기로 전을 부쳐준다.
- text: 루콜라를 물에 살짝 헹궈주고 전과 함께 접시에 셋팅한다.
