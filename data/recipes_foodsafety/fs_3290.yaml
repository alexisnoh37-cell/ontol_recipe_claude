steps:
- text: 상추는 깨끗하게 씻어 한입 크기로 뜯고, 레몬은 모양대로 얇게 썰고, 아보카도는 씨와 껍질을 제거한 뒤 한입 크기로 썬다.
- text: 파프리카는 씨를 제거한 뒤 한입 크기로 썰고, 토마토는 한입 크기로 썬다.
- text: 끓는 소금물(물4컵+소금0.2ts)에 식초를 넣은 뒤 달걀을 넣고 수란을 만든다.
- text: 드레싱을 만든다.
- text: 그릇에 손질한 채소를 담고 수란과 얇게 썬 레몬을 올려 마무리한다.
