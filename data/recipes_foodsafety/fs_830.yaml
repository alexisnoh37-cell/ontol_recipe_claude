steps:
- text: 양파, 셀러리, 마늘, 토마토를 굵게 다진다.
- text: 팬에 양파를 볶다가 셀러리와 마늘을 볶는다.
- text: 콩과 두유를 넣은 뒤 토마토, 육수, 큐민, 파슬리, 카엔패퍼를 넣는다.
- text: 볶은 재료들을 모두 믹서로 간다.
- text: 믹서에 간 재료들을 체에 거른다.
- text: 체에 거른 것을 끓여주고 사워크림으로 장식한다
