steps:
- text: 고등어의 내장을 제거한다.
- text: 내장을 제거한 고등어를 길이로 반을 갈라 각각 2등분 한다.
- text: 양념장 재료를 모두 섞어 양념장을 만든다.
- text: 고등어에 양념장을 발라 30분 이상 재운다.
- text: 고등어의 양념장을 가볍게 긁어낸다.
- text: 팬에 기름을 두르고 양파 속껍질과 얇게 썬 양파 위에 고등어를 올려 굽는다.
