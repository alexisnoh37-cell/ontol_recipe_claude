steps:
- text: 토마토는 십자로 칼집을 내고 끓는 물에 살짝 데쳐 껍질을 벗긴다.
- text: 사과, 복숭아는 깍둑썰고 소금에 10분 정도 절인다.
- text: 배를 강판에 갈고, 마늘은 다진다.
- text: 갈아둔 배에 고춧가루, 다진 마늘, 깨, 참기름을 섞어 양념을 만든다.
- text: 절여둔 과일을 양념과 섞는다.
- text: 치커리를 넣고 섞는다.
