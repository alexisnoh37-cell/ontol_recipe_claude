steps:
- text: 닭고기살은 천일염과 후춧가루를 뿌려 마리네이드를 해놓는다.
- text: 양배추와 부추는 김이 오른 찜통에 쪄서 식혀 놓는다.
- text: 깻잎은 채를 썰고, 파프리카는 속을 제거 하고 5cm 길이로 채를 썰고, 당근과 양파도 같은 길이로 채를 썰어 놓는다.
- text: 마리네이드를 해 놓은 닭고기살은 팬에 기름을 두르고, 팬이 따끈해지면 앞뒤를 돌려가며 정종을 살살 뿌려 닭고기살을 굽고, 닭고기살이 익으면 살을 찢어 준비 한다.
- text: 요거트와 머스터드, 꿀 ,레몬즙, 설탕을 넣고 고루 섞어 소스를 만들어 놓는다.
- text: 쪄 놓은 양배추에 준비한 채소(③)와 닭고기살(④)을 넣고, 돌돌 말아 쪄 놓은 부추로 양배추를 묶어 완성하고, 만들어 놓은 요거트 소스를 함께 제공 한다.
