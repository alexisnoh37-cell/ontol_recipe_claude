steps:
- text: 포두부, 양파, 피망, 파, 생강은 가늘게 채 썬다.
- text: 참느타리버섯, 게맛살은 가늘게 찢는다.
- text: 냄비에 물을 끓이고 포두부는 미리 데쳐 체에 밭쳐 물기를 뺀다.
