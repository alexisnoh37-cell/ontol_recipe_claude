steps:
- text: 잣은 고깔을 떼어낸 뒤 젖은 행주로 문질러 먼지를 닦는다.
- text: 호두는 미지근한 물에 불려 껍질을 제거한다.
- text: 대추는 얇게 돌려 깎아 곱게 다진다.
- text: 물엿과 설탕을 냄비에 담고 물을 조금 넣은 뒤 약한불에서 투명한 시럽으로 만든다.
- text: 잣, 호두, 통깨에 다진 대추와 시럽을 넣고 덩어리지게 섞는다.
- text: 살짝 뜨거울 때 손으로 동그랗게 뭉쳐준다.
