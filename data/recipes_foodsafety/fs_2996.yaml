steps:
- text: 세발나물을 살짝 데쳐 말린 뒤 가루를 내고 닭뼈를 이용해 육수를 만든다.
- text: 퀴노아를 볶아 쓴맛을 제거하고 삶은 팥과 믹서에 곱게 간다.
- text: 팬에 버터 일부를 녹인 뒤 밀가루를 넣어 루를 만든다.
- text: 양파를 갈아 버터 녹인 냄비에 볶은 뒤 닭육수와 2를 넣어 끓인다.
- text: 세발나물가루로 간을 맞추고 향을 낸 뒤 루를 넣어 농도를 맞춘다.
- text: 우유와 휘핑을 넣어 고소함을 더하고 설탕을 소량 넣어 간을 한다.
