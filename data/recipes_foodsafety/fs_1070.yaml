steps:
- text: 당근, 새송이버섯, 소고기, 양파는 가늘게 채 썰어 간장, 꿀, 생강가루, 다진 마늘로 양념한 뒤 볶는다.
- text: 두부는 반으로 잘라 속에 칼집을 낸 뒤 소금을 뿌려 수분을 제거한다.
- text: 두부에 전분을 골고루 묻힌다.
- text: 볶은 야채와 고기를 두부 사이에 넣는다.
- text: 튀김가루, 전분, 차가운 맥주를 섞어 튀김 반죽을 만든 뒤 두부에 입혀 170℃기름에 튀긴다.
- text: 고추장, 케첩, 올리고당을 섞고 냄비에 졸여 소스를 만들고 튀긴 두부를 지진다.
