steps:
- text: 냄비에 물 한 컵을 넣고 끓으면 소금을 조금 넣고 쌀을 넣어 끓인다.
- text: 쌀이 물을 흡수하면 버터를 넣고 골고루 섞은 뒤 파마산치즈가루를 넣고 섞어 접시에 펼쳐 식힌다.
- text: 방울토마토는 굵게 다진 뒤 물기를 제거하고 바질은 얇게 채 썬다.
- text: 모짜렐라치즈는 손으로 작게 뜯어 반은 바질, 토마토와 섞어 소금과 올리브오일로 간을 하고, 나머지는 옥수수와 섞는다.
- text: 식은 밥에 4번의 소를 각각 넣고 동그랗게 빚는다.
- text: 달걀물, 빵가루 순으로 묻혀 170℃ 기름에서 튀긴다.
