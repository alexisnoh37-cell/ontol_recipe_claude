steps:
- text: 닭가슴살은 끓는 물에 7분간 삶아 건진 뒤 결대로 찢어 준비한다.
- text: 노랑 파프리카, 양파, 오이, 당근은 채 썬다.
- text: 곤약면은 끓는 물에 살짝 데쳐 건진 뒤 찬물에 씻어 체에 밭쳐 물기를 제거한다.
- text: 들깨소스를 만든다.
- text: 곤약면에 삶은 닭가슴살, 채 썬 채소, 들깨소스를 넣어 버무린다.
- text: 그릇에 담고 어린잎채소를 올린다.
