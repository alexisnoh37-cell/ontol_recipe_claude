steps:
- text: 달걀 노른자를 휘핑하고 박력분을 넣은 뒤 우유와 녹인 버터를 넣고 섞는다.
- text: 달걀 흰자는 레몬즙과 설탕을 3번에 나누어 넣으면서 머랭을 만든다.
- text: 머랭과 크랜베리를 노른자 반죽에 넣고 부드럽게 섞는다.
- text: 180℃ 오븐에서 15분 정도 구워 시트를 만든 뒤 컵모양으로 자른다.
- text: 고구마와 단호박은 삶은 뒤 껍질을 벗기고 각각 체에 내려 생크림을 섞는다.
- text: 시트, 단호박무스, 고구마무스 순서로 여러겹 쌓아 올린다.
