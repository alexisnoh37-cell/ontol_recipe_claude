steps:
- text: 양파는 갈고 애호박과 풋고추는 잘게 다진다.
- text: 물 1/2컵에 고추장을 풀고 우리밀가루를 넣어 골고루 섞는다.
- text: 1의 재료를 2에 넣어 반죽한다.
- text: 팬에 현미유를 두르고 3의 재료를 얇게 부친다.
- text: 밥에 참기름과 흑임자, 소금을 넣고 양념을 한다.
- text: 애호박장떡에 양념한 밥을 얇게 펴놓고 돌돌 말아 2~3cm 가량의 길이로 자른다.
