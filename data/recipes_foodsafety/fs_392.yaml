steps:
- text: 당근, 양파, 샐러리는 사방 2cm 정도로 잘라준다.
- text: 레몬은 껍질을 아주 곱게 채 썰어준다.
- text: 소고기는 사방 3cm 정도로 자르고 흰 후추를 뿌려준다.
- text: 홀토마토는 먹기 좋게 부수어 준 후 볶아준다.
- text: 팬에 버터를 넣고 소고기부터 볶기 시작하다 채소를 넣고 볶아준다. 이 때 두꺼운 채소부터 볶아주는 것이 고기랑 익는 시간이 같아진다.
- text: 마지막에 다져 놓은 홀토마토를 넣고 함초소금 으로 간을 한 후 레몬껍질을 올려서 마무리 한다.
