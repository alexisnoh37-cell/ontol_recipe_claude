steps:
- text: 어린잎은 찬물에 담근다.
- text: 마는 껍질을 벗겨 동글동글하게 썬다
- text: 썰어 놓은 마는 팬에 기름을 살짝 두르고 앞뒤로 굽는다.
- text: 참나물, 돈나물, 토마토, 레디쉬는 먹기 좋은 크기로 썬다.
- text: 겨자가루는 30℃ 물을 섞어 발효 시킨다.
- text: 저염간장에 식초, 설탕, 발효겨자를 넣고 골고루 섞어 소스를 만들고, 접시에 구운 마와 손질한 야채를 넣고 만들어 놓은 소스와 어린잎을 올린다.
