steps:
- text: 다시마, 건새우, 물을 약 20분 정도 끓인 뒤 체에 걸러 육수를 만든다.
- text: 단호박은 껍질을 벗기고, 속을 깨끗이 파내 슬라이스 한다
- text: 슬라이스한 단호박을 까나리액젓에 20분 정도 절인 뒤 물로 씻는다.
- text: 부추는 5cm 길이로 썰고, 양파는 채썰고, 배는 껍질을 벗겨 슬라이스로 썰어둔다.
- text: 만들어 놓은 육수에 고춧가루, 매실액, 다진마늘을 섞어 양념장을 만든다
- text: 단호박, 배, 양파, 부추를 양념장에 버무린다.
