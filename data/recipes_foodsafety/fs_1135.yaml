steps:
- text: 고구마를 쿠킹호일에 싸 직화냄비에 넣고 약한 불에서 30분 간 굽는다.
- text: 우유를 냄비에 끓여 데운다.
- text: 구운 고구마의 껍질을 제거한다.
- text: 우유와 고구마를 믹서에 넣고 간다.
- text: 4번을 체에 걸러 부드럽게 한다.
- text: 컵에 담고 고구마칩을 올린다.
