steps:
- text: 두부를 칼등으로 곱게 으깬 후 면포에 싸서 물기를 짠다.
- text: 식빵은 믹서에 갈아 빵가루를 만들고, 포도는 믹서에 간 뒤 걸러 포도즙을 만든다.
- text: 냄비에 포도즙, 꿀, 물, 소금을 넣고 끓으면 불을 끄고 식용유를 넣고 섞는다.
- text: 밀가루에 계피가루, 으깬 두부, 검은깨, 다진 호두를 넣고 반죽한다.
- text: 짤주머니에 반죽을 넣고 15cm 길이로 팬에 짠다.
- text: 반죽표면에 3번을 바르고 180℃ 오븐에 15분 간 굽는다.
