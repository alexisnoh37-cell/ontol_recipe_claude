steps:
- text: 반죽을 모두 섞어 30분 발효 후 punch 후 40분 발효한다. ★punch는 가스를 빼는 과정을 얘기해요.
- text: 150g으로 분할 후 중간발효 20분을 한다.
- text: 찰 반죽 80g 분할 후 밀대로 얇게 펴서 크림치즈와 바질페스토를 섞은 속재료를 짜고 삶아 낸 고구마 다이스를 촘촘한 간격으로 올린 후 말아준다.
- text: 중간발효를 마친 바게트 반죽은 최대한 기공을 살려 조심히 펴 준다. 펴준 반죽 위에 찰 반죽을 놓고 가볍게 환목모양으로 말아준다.
- text: 반죽에 물을 뿌린 후 덧 가루를 묻혀 1시간 동안 2차 발효한다.
- text: 빵이 터지지 않게 꾸쁘는 사선으로 세 번 내고 , 195℃의 컨벡션 오븐에 16분 스팀 8초 설정을 하여 굽는다.
