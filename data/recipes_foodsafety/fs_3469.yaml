steps:
- text: 감자로 만든 옹심이 반죽을 숟가락의 절반 크기로 동그랗게 모양을 만든다.
- text: 180도로 예열한 에어프라이어에 홍새우 튀김을 15분 동안 익힌다.
- text: 팬에 식용유를 두르고 양파를 채 썰어 넣고 갈색이 나도록 볶는다.
- text: 컬리플라워, 감자튀김, 불린 미역을 넣고 3분 동안 더 볶는다.
- text: 커리 소스, 물(1/2컵=100g), 옹심이를 넣고 3분 동안 끓인다.
- text: 접시에 담고 홍새우 튀김을 올려 마무리한다.
