steps:
- text: 냄비에 물, 건다시마, 대파를 넣고 약불에서 30분간 맛이 우러나게 끓인다.
- text: 체에 걸러 다시마 국물을 만든다.
- text: 키조개 관자를 얇게 자른다.
- text: 당근은 껍질을 벗기고 채소와 버섯은 깨끗이 씻어 한입 크기로 자른다.
- text: 소스 재료를 냄비에 넣고 약불에서 5분간 끓여 양념장을 만든다.
- text: 샤브샤브 냄비에 1을 넣고 끓으면 키조개 관자, 채소, 버섯을 넣고 살짝 익혀 소스에 찍어 먹는다.
