steps:
- text: 복숭아는 반으로 갈라 씨를 발라내고 두께 0.5cm가량만 남기고 속을 파낸다.
- text: 복숭아와 식혜, 설탕시럽을 넣고 믹서기에 굵게 간다.
- text: 2를 냉동실에서 4~5시간 정도 얼리면서 1시간마다 숟가락으로 긁어 샤벳을 만든다.
- text: 속을 파낸 복숭아도 냉동실에서 얼려 샤벳 그릇으로 사용한다.
- text: 3의 복숭아 식혜 샤벳을 떠서 얼린 복숭아 그릇에 담는다.
- text: 민트로 장식하여 완성한다.
