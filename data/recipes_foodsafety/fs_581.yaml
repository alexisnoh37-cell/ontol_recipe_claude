steps:
- text: 소고기는 후춧가루, 올리브오일로 밑간을 한다.
- text: 더덕은 칼로 껍질을 돌려 깎고, 파프리카, 아스파라거스와 함께 가늘게 채썬다.
- text: 파인애플, 양파, 당근, 대파는 채썬다.
- text: 밑간한 고기를 팬에 굽는다.
- text: 따로 갈아 놓은 파인애플과 레몬즙 꿀을 섞어 드레싱을 만는다
- text: 구워 놓은 고기에 더덕과 파인애플 아스파라거스 깻잎을 넣어 돌돌 말고, 팬에 발사믹 소스를 끓인 뒤 말아 놓은 소고기롤을 넣어 졸인다.
