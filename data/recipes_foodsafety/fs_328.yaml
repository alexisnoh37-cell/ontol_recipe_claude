steps:
- text: 당근, 청경채, 배추, 애호박, 팽이버섯은 먹기 좋은 크기로 잘라준다.
- text: 흑돼지고기, 저염된장, 후추를 넣어서 불순물을 제거하면서 고기를 삶아준다.
- text: 천연다시다로 육수를 만들어 체에 걸러준다.
- text: 손질한 야채들과 청양고추를 잘라 함께 육수에 데쳐 국물에 매운 맛을 낸다.
- text: 곁들이장을 만들어 준다.
- text: 냄비에 데쳐준 채소와 국물을 붓고 고기를 먹기좋게 썰어 소스랑 완성한다.
