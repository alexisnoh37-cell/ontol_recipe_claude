steps:
- text: 달걀노른자, 밀가루, 베이킹파우더, 우유, 소금을 섞어 반죽을 만든다.
- text: 바나나 절반은 0.5cm 두께로 자르고 나머지는 잘게 다진다.
- text: 타르트팬에 버터를 바른 뒤 반죽을 얇게 깔고 그 위에 바나나를 담고 소금을 조금 뿌린다.
- text: 3번에 달걀흰자로 만든 머랭을 올린다.
- text: 머랭 가운데 바나나 1조각을 올리고 노른자 물을 바른다.
- text: 달군 팬에 물을 넣고 타르트팬 채로 넣은 뒤 약불에서 15분 간 익힌다.
