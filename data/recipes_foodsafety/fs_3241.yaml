steps:
- text: 끓는 물(500㎖)에 참나물 줄기를 1분간 데쳐 건진 뒤 찬물에 헹군다.
- text: 무는 둥근 모양을 살려 얇게 썰고, 참나물 잎은 얇게 채 썰고, 레몬은 강판에 갈아 제스트를 만든다.
- text: 냄비에 절임물 재료와 물(40㎖)을 넣어 2분간 끓인 뒤 손질한 무를 넣어 30분간 절인다.
- text: 믹서에 김칫국물 재료를 넣어 간 뒤 고운체에 거른다.
- text: 절인 무에 채 썬 참나물 잎을 올려 돌돌 말고 데친 참나물 줄기로 묶는다.
- text: 그릇에 무말이와 김칫국물을 담은 뒤 레몬 제스트를 뿌린다.
