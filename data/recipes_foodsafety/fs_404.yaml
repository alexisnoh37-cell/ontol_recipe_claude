steps:
- text: 함초와 쪽파는 1cm 길이로 자른다. 청고추, 홍고추, 무는 한입 크기로 잘라주고 마늘은 편으로 썰어준다.
- text: 물 1컵에 찹쌀가루를 풀어서 풀을 쑨다.
- text: 물 2컵에 함초, 편마늘을 넣고 국물을 만든다.
- text: 이 물로 무를 절여준다. 이때 무를 절였던 물을 버리지 말고 찹쌀 풀과 섞어 국물을 만들어 준다.
- text: 만들어진 국물과 찹쌀 풀을 섞어 체에 내려 준다.
- text: 모든 재료를 한데 섞어서 저염 동치미를 완성한다.
