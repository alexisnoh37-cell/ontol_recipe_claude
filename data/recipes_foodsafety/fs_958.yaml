steps:
- text: 잡곡밥에 소량의 물을 넣고 밥알을 풀어준다.
- text: 기름을 두르지 않은 팬에 1을 0.4cm두께로 노릇하게 양면을 굽는다.
- text: 양파와 청, 홍피망, 햄은 적당한 크기로 썰고 캔 옥수수는 물기를 뺀다.
- text: 냄비에 식용유를 두르고 다진 마늘과 다진 양파, 다진 소고기를 넣고 볶은 뒤 토마토 케첩과 물을 약간 넣어 졸이면서 설탕, 간장, 후춧가루로 간한다.
- text: 누룽지에 4를 골고루 펴 바르고 그 위에 토핑 재료, 피자치즈, 송송 썬 실파를 뿌린다.
- text: 5번을 예열된 오븐에 굽는다.
