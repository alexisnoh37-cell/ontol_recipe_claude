steps:
- text: 곤약은 세척 후 물기를 빼준다.
- text: 사과는 가늘게 채 썰어 레몬에 살짝 담가 주고, 다진양파도 레몬즙에 살짝 담가준다.
- text: 팬에 다진양파를 버터에 볶다가 나머지 볶음 재료를 넣고 볶음양념을 만들어준다.
- text: 볶음양념에 곤약 을 넣 어 고들고들하게 볶아준다.
- text: 사과를 물기를 완전히 제거하고 소스재료를 섞어 곁들이 소스를 만들어준다.
- text: 볶음곤약을 그릇에 담고 그라놀라를 뿌려서 완성한다.
