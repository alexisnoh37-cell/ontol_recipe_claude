steps:
- text: 연어는 주사위모양으로 썬다.
- text: 흰후춧가루를 살짝 뿌린 후 녹말가루를 묻힌다.
- text: 녹말을 묻힌 연어는 김 오른 찜통에 찌고 식혀둔다.
- text: 오이, 래디쉬, 셀러리, 배는 곱게 채썰어 냉수에 담갔다가 건진다.
- text: 캔 파인애플을 잘게 썰어 분량의 재료들과 함께 믹서기에 곱게 간다.
- text: 접시에 준비된 채소와 찐 연어를 담고 소스를 곁들인다.
