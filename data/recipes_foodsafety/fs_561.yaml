steps:
- text: 닭날개에 칼집을 넣고 뒤집어 튤립모양의 봉을 만든다.
- text: 닭날개에 소금, 후춧가루로 밑간을 한다.
- text: 파슬리는 곱게 다져 가루를 만든다
- text: 양파, 마늘은 즙을 내서 튀김가루, 파슬리 가루와 함께 골고루 섞어 튀김반죽을 만든다.
- text: 어린잎은 찬물에 담궈 건져 놓는다.
- text: 튀긴 닭날개의 기름을 빼고 레몬과 어린잎으로 장식한다.
