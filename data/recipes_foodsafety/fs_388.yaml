steps:
- text: 뚜껑을 만들 배의 윗동을 자르고, 수저로 배 속을 판다.
- text: 탄산수와 생강청을 미리 30분 전에 섞어준다.
- text: 방울토마토를 먹기 좋게 잘라준 후 속을 파낸 배에 후르츠 칵테일과 방울토마토를 넣어준다.
- text: 과일로 채워진 배에 미리 만든 생강탄산수를 부어준다.
- text: 배를 뚜껑을 덮어 호일로 싼 후 팬에 구워준다.
