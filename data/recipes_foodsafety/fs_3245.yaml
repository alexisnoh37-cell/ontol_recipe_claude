steps:
- text: 참나물은 얇게 썰고, 방울토마토는 2등분하고, 잣은 곱게 빻아 잣가루를 만든다.
- text: 믹서에 참나물 페스토 재료를 넣고 갈아 페스토를 만든다.
- text: 끓는 소금물(물 8컵과 소금 1g 비율)에 스파게티를 넣어 8분간 삶아 건진다.
- text: 스파게티에 페스토를 넣어 버무린다.
- text: 그릇에 스파게티를 담은 뒤 손질한 참나물을 올리고 올리브유, 잣가루를 뿌린다.
- text: 손질한 방울토마토를 곁들여 마무리한다.
