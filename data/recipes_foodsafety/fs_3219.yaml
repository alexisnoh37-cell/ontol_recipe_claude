steps:
- text: 닭은 우유에 담가 20분간 재운다.
- text: 냄비에 물(1.5L)과 닭, 삼계탕 티백, 소금을 넣어 30분간 삶아 건진 뒤 살을 발라 한입 크기로 찢는다.
- text: 끓는 삼계탕 육수(800㎖)에 메밀면을 4분간 삶아 건져 얼음에 비벼 식힌 뒤 돌돌 말아준다.
- text: 끓는 물(500㎖)에 깻잎을 넣어 1분간 살짝 데쳐 건진 뒤 펼쳐 찢은 닭고기, 들깨소스, 바질을 얹어 돌돌 말아준다.
- text: 믹서에 국물 재료를 넣어 간 뒤 체에 거른다.
- text: 그릇에 메밀면과 깻잎말이를 담은 뒤 국물을 부어 마무리한다.
