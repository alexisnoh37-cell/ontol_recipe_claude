steps:
- text: 닭가슴살은 포를 떠 후춧가루로 밑간을 한다.
- text: 인삼은 뇌두를 제거하고 깨끗이 씻어 절반은 다지고, 양파와 마늘도 다진다.
- text: 나머지 인삼은 채썰고, 대파, 깻잎도 채를 썰어 물에 담군다.
- text: 다진 양파, 마늘을 볶다가 생크림을 넣고 은근히 졸인 뒤 오렌지, 레몬즙을 넣고 소스를 만든다.
- text: 닭가슴살에 밀가루에 찬물, 달걀을 넣고 튀김옷을 만들어 입힌다.
- text: 팬에 기름을 넉넉히 넣고 지지듯이 닭가슴살을 튀겨 접시에 담고 인삼소스를 뿌린 뒤, 그 위에 깻잎과 대파, 인삼채를 올린다.
