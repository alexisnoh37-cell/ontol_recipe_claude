steps:
- text: 배추는 연한 잎으로 골라 한 장씩 떼어 길게 갈라놓는다.
- text: 배추에 소금을 뿌려 절인다.
- text: 쪽파는 4cm 길이로 썰고, 마늘과 생강은 다진다.
- text: 고춧가루에 홍시를 으깨서 나머지 양념을 섞는다.
- text: 물기를 제거한 배추에 고춧가루 양념을 넣고 무친다.
- text: 쪽파, 통깨, 참기름을 넣고 마무리한다.
