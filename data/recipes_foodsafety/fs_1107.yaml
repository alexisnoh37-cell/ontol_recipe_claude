- text: 고구마는 깨끗하게 씻은 뒤 껍질을 벗기고 찐다.
- text: 찐 고구마를 으깨고 요거트와 섞는다.
- text: 카스테라를 체에 갈아 가루를 만든다.
- text: 키위, 파인애플을 적당한 크기로 자른다.
- text: 무스틀에 2번을 넣어 평평하게 펴주고 키위, 블루베리, 파인애플을 넣고 요거트를 올린 뒤 다시 고구마를 넣어 펴준다.
- text: 카스테라 가루를 뿌리고 키위, 블루베리, 파인애플을 올린다.
