steps:
- text: 멸치는 티를 골라내어 선별해 두고 실파는 썬다.
- text: 팬에 식용유를 두르고 소스의 양념들을 넣어 최대한 낮은 불에서 서서히 졸여 농도를 낸다.
- text: 찹쌀가루 중 1/3분량만 묽게 풀을 쑤어 식힌다.
- text: 멸치에 풀을 가볍게 익히고 남은 찹쌀가루를 묻힌다.
- text: 튀김기름의 온도를 170~180℃에 맞추어 4의 멸치를 재빨리 튀겨낸다.
- text: 식은 후에 (2)의 소스에 버무리거나 끼얹어 낸다.
