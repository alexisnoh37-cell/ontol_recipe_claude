steps:
- text: 토마토는 먹기 좋은 크기로 잘라준다.
- text: 청고추, 홍고추, 양파는 채 썰고 부추는 먹기 좋게 잘라준다.
- text: 바나나, 배, 젓갈을 갈아 준 뒤 고춧가루와 섞어준다.
- text: 만들어진 국물에 나머지 재료를 넣고 최종 김치 국물을 만들어준다.
- text: 국물에 영양부추만 뺀 재료를 넣고 버무려준다.
- text: 마지막에 영양부추를 넣어 김치를 완성한다.
