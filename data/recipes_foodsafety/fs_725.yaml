steps:
- text: 새송이버섯과 파프리카는 가늘게 채썬다.
- text: 채선 야채는 팬에 기름을 두르고 살짝 볶아낸다.
- text: 찹쌀가루, 물, 소금을 섞어 찹쌀 반죽을 만든다.
- text: 팬에 기름을 두르고 반죽을 한 스푼씩 떠 넣어 동그랗게 부친다.
- text: 소스 재료를 모두 넣어 믹서에 간다.
- text: 채소볶음을 잣소스에 무쳐 찹쌀전병 위에 한 스푼씩 올려낸다.
