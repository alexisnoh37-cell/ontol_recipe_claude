steps:
- text: 죽순은 빗살을 살려 썰고 밤은 껍질을 벗겨 4등분한다.
- text: 찐 어묵은 얇게 썰고 표고버섯은 미지근한 물에 불려 어슷하게 4등분 한다.
- text: 볼에 달걀 풀고 달걀 부피의 2.5배의 멸치 육수를 넣고 소금으로 간을 한 뒤 거품기로 잘 풀어 체에 내린다.
- text: 끓는 물에 은행, 죽순, 밤, 새우 순으로 데친다.
- text: 데쳐 낸 은행은 껍질을 벗기고 새우는 머리와 껍질을 제거한다.
- text: 찜 용기에 준비한 속 재료들을 담고 준비한 달걀 물을 부어 찜통에서 약 12분간 찐다.
