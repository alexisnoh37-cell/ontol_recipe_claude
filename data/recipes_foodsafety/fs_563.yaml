steps:
- text: 대추는 돌려 깎아 씨를 제거하고 곱게 다지고 팬에 볶는다.
- text: 소고기, 돼지고기, 양파 및 마늘을 다진다.
- text: 배춧잎, 파프리카, 새송이버섯, 당근은 입자있게 다진다.
- text: 다진 소고기, 돼지고기, 양파, 마늘, 대추, 배춧잎, 파프리카, 새송이버섯, 당근 및 양파에 소금, 후춧가루를 섞어 잘 치대어 스테이크 모양으로 만든다
- text: 팬에 기름을 살짝 두르고, 스테이크 고기를 충분히 익혀 접시에 담고, 단호박은 껍질을 벗겨 팬에 구워 담는다.
- text: 배는 갈아 저염간장과 설탕을 넣고 잘 저어 소스를 만들고 익혀 놓은 스테이크에 올려 완성한다.
