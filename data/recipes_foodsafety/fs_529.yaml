steps:
- text: 청포묵을 약 6~7cm 길이로 썰어 맛소금과 참기름에 살짝 버무려 놓는다.
- text: 소고기는 채를 썰어 간장과 설탕, 참기름에 볶아놓고 미나리는 데쳐 찬물에 식혀 5~6cm 길이로 썰고, 숙주는 머리와 꼬리를 떼어 내고, 뜨거운 물에 데쳐 식혀 준비한다.
- text: 홍파프리카는 씨를 제거하고 약 6cm 길이로 썰어 놓는다.
- text: 달걀은 황백으로 나눠 각각 지단을 부쳐 채를 썰어 놓는다.
- text: 김은 살짝 구어 봉투에 넣고 부수어 김가루를 만들어 놓는다.
- text: 저염간장에 설탕과 식초를 넣어 골고루 섞어 탕평채 양념장을 만들고, 접시에 준비한 청포묵을 담고, 그 위에 채소와 고기를 올리고, 맨 위에 달걀지단과 김가루를 올린 후 양념장을 끼얹어 완성 한다.
