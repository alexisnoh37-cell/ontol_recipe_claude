steps:
- text: 잔멸치는 잡티를 제거하고 기름을 두르지 않은 팬에서 살짝 볶는다.
- text: 고슬고슬하게 지은 밥에 1과 통깨, 설탕을 넣고 골고루 섞는다.
- text: 사각 틀에 2를 넣고 랩을 씌워 밀대로 평평하게 민다.
- text: 3을 바람이 잘 통하는 곳에서 건조 시킨다.
- text: 175℃로 예열된 오븐에 4를 넣고 밥이 바삭해질 때 까지 굽는다.
- text: 먹기 좋은 크기로 부숴 접시에 담고 설탕을 뿌린다.
