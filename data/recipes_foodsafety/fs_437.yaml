steps:
- text: 유부는 1/4 정도를 잘라 준비한다.
- text: 잘라진 유부는 끓는 물에 약 20초 정도 데쳐 물기를 짜 놓는다.
- text: 새우는 내장과 껍질을 제거 하고 곱게 으깨 준비한다.
- text: 배추와 미나리는 끓는 물에 데치고, 표고버섯은 뜨거운 물에 불려 준비 한다.
- text: 데친 배추와 표고버섯을 입자있게 다지고, 양파와 당근도 입자있게 다져 준비한다.
- text: 두부는 물기를 짜 놓은 후 새우(③)와 다진 야채(⑤), 마늘, 소금, 후춧가루 를 넣고 골고루 섞는다. 유부(②)에 속을 넣고 미나리로 묶은 후, 끓는 육수에 유부주머니를 넣고 간장으로 간을 하여 완성한다.
