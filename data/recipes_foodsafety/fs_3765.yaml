steps:
- text: 닭다리살은 기름기를 제거하고 키친타월로 물기를 제거한다. 1.5×1.5cm 크기로 잘라 소금(0.1g), 후추로 밑간해 20분간 재운다.
- text: 마늘은 다지고, 적양파(50g)는 1.5×1.5cm 크기로 깍둑썰기하고, 나머지 적양파(50g)는 채 썬다. 깻잎은 깨끗이 씻어 젖은 키친타월에 보관하고, 레몬은 세로로 1/4 크기로 자른다.
- text: 팬에 식용유(40g), 강황가루(0.5g), 고운 고춧가루를 넣어 고추기름을 내고 밑간한 닭다리살을 볶는다. 닭다리살이 익으면 다진 마늘, 깍둑썬 적양파를 넣고 볶다가 간장, 소금(0.2g), 물을 넣고 조린다.
- text: 다른 팬에 식용유(90g), 강황가루(0.5g), 소금(0.2g), 채 썬 적양파(50g)를 넣고 약한 불에서 튀긴 후 식힌다.
- text: 끓는 물에 소면을 넣고 3분 30초 동안 삶은 후 찬물에 비벼 씻는다. 삶은 소면을 동그랗게 말아 접시에 담고, 조린 닭다리살, 청국장가루, 김가루를 얹는다.
- text: 손질한 깻잎을 채 썰고, 튀긴 적양파와 함께 소면 주위에 두른다. 손질한 레몬 조각을 올려 마무리한다.
