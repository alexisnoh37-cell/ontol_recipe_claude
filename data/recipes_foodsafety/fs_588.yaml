steps:
- text: 표고버섯은 뜨거운 물에 약 1시간 정도 불려 다지듯이 썬다.
- text: 마는 껍질을 벗겨 썰어서 갈아주고, 연근은 껍질을 벗겨 팬에 굽는다.
- text: 애호박은 반달모양으로 썰어 끓는 물에 감자와 함께 데친다.
- text: 소고기와 돼지고기는 곱게 다져 저염간장, 설탕, 다진마늘 및 간 마를 넣고 골고루 치대어 떡갈비를 만들고, 팬에 기름을 두르고 앞뒤로 굽는다
- text: 깻잎은 저염간장에 살짝 절인다
- text: 구워 놓은 떡갈비와 깻잎, 표고버섯, 연근, 애호박 및 감자를 접시에 담고 간 마와 두유를 섞어 자작하게 끓여 만든 소스를 그 밑에 담아 완성한다
