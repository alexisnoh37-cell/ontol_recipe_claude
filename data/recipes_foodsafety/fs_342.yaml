steps:
- text: 두유와 두부를 믹서에 생수 100g을 넣고 갈아준다.
- text: 애호박은 돌려깎기 해서 채 썰어주고 양파, 홍고추, 청고추도 가늘게 채 썰어준다.
- text: 백일송이는 가늘게 찢어 볶아준다.
- text: 애호박, 당근, 청고추, 홍고추를 각각 볶아준다.
- text: 메밀면을 삶아서 준비한다.
- text: 볼에 메밀면을 담고 고명을 올려준 후 믹서 에 갈은 두부두유를 뿌려 완성한다.
