steps:
- text: 곤드레는 뜨거운 물에 데쳐낸 뒤 깨끗하게 헹구고 송송 썰어준다.
- text: 두부의 물기를 짜 준다.
- text: 양념장 재료와 물기를 짠 두부로 양념장을 만들어준다.
