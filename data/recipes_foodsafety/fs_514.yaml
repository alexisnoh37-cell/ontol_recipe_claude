steps:
- text: 모시조개는 물에 소금을 넣고, 담그어 해감을 한다.
- text: 연어는 사각지게 썰어 준비한다.
- text: 당근, 양파, 감자는 사각크기로 썰어 놓고, 청피망은 채를 썰어 당근과 비슷한 길이로 잘라둔다.
- text: 냄비에 버터와 밀가루를 넣고 볶다가 채소를 넣어 같이 볶는다.
- text: 볶아지는 냄비에 모시조개와 육수를 넣고 끓인다.
- text: 거품을 걷어내고, 월계수 잎과 통후추, 통마늘을 넣고 끓이다가 연어와 생크림을 넣어 한 소큼 끓으면 완성한다.
