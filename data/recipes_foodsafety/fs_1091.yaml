steps:
- text: 강력분, 꿀, 달걀, 이스트, 소금, 탈지분유, 제빵개량제, 물을 믹서에 넣고 섞는다.
- text: 가루가 모두 녹아 섞이면 버터를 넣고 완전히 섞은 뒤 세 덩어리로 나눈다.
- text: 60분 간 1차 발효 후 40g씩 분할하여 둥글리기하고 15분 간 중간 발효 한다.
- text: 반죽을 손으로 굴려 뭉툭한 원뿔 모양을 만들고 밀대로 밀어 긴 삼각형 모양을 만든다.
- text: 각 반죽에 홍시/호두, 곶감/대추, 블루베리/크랜베리를 넣고 버터롤을 모양을 만든다.
- text: 40분 간 2차 발효 후 210℃ 오븐에서 10분 간 굽는다.
