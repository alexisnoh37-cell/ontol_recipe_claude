steps:
- text: 골뱅이는 뜨거운 물에 살짝 데친 뒤 물기를 빼고 4등분으로 썬다.
- text: 양파와 깻잎은 채썰고, 당근은 양파랑 같은 길이로 얇게 저미고, 고추와 대파는 어슷썰고, 양배추는 1~2cm 두께로 썬다.
- text: 사과와 배는 채를 썰고 황도와 바나나, 파인애플은 작게 깍둑썰기 한다.
- text: 고추장에 고춧가루, 다진 마늘, 케첩, 설탕, 식초, 매실액, 생강즙, 참기름을 골고루 섞어 양념장을 만든다.
- text: 양념장에 준비한 골뱅이(①), 채소(②), 과일(③)을 넣고 고루 섞은 뒤 통깨를 얹어 완성한다.
