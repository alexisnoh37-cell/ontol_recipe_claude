steps:
- text: 두부는 물기를 없앤 뒤 체에 밭쳐 으깬 뒤 칼등으로 한 번 더 으깬다.
- text: 고구마는 삶아 껍질을 벗겨 으깬다.
- text: 마늘, 대파, 양파는 잘게 다진 뒤 식용유(5g)를 두른 팬에서 살짝 볶아 키친타월에 밭쳐 물기를 제거하며 식힌다.
- text: 볶은 채소, 두부, 고구마, 다진 견과류, 찹쌀가루를 섞은 뒤 반죽해 둥글 납작하게 모양을 빚고, 식용유(15g)를 두른 팬에서 앞뒤로 노릇하게 굽는다.
- text: 양송이버섯은 채 썬다.
- text: 다시마육수에 청국장, 유자청, 녹말가루, 양송이버섯을 넣고 조린 청국장소스를 곁들여 마무리한다.
