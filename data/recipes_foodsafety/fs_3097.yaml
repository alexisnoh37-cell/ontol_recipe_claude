steps:
- text: 낙지는 살짝 데치고 한입 크기로 썬다.
- text: 오이와 당근, 표고, 가지는 얇게 동그란 모양으로 썰고 가지와 표고를 살짝 구워준다.
- text: 설탕, 식초, 물로 초절이 양념을 만들어 오이, 당근, 구운 가지와 표고를 절인다.
- text: ③의 재료에 낙지를 올린 후 데친 미나리로 감싼다.
- text: 사과를 잘게 다져서 준비한다.
- text: 사과, 간장, 고춧가루, 설탕, 식초, 깨로 소스를 만들어 초말이와 제공한다.
