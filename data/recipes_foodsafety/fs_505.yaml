steps:
- text: 닭고기살은 작게 썰어 소금과 후춧 가루를 살짝 뿌려 밑간을 하고 달걀을 넣어 섞는다.
- text: 달걀을 넣어 섞은 닭고기 살에 녹말 가루를 넣어 골고루 묻힌다.
- text: 국수는 각각 끓는 물에 살짝 데쳐 물기를 빼놓는다.
- text: 물기가 빠진 국수는 튀김기름 170℃ 온도에서 각각 작은 채에 그대로 살짝 튀겨 둥지를 만든 후 기름을 냅킨에 빼 놓는다.
- text: 녹말가루를 묻힌 닭고기살도 튀김 기름에 튀겨 기름을 빼 놓은 둥지국수 위에 올린다.
- text: 냄비에 레몬과 설탕을 넣고 물을 넣어 끓이다가 레몬은 건져 내고, 마늘과 생강, 연유, 식초, 녹말을 풀어 넣고 살짝 한 번 더 끓여 녹말소스를 만들어, 튀겨진 닭고기 위에 올려 완성한다.
