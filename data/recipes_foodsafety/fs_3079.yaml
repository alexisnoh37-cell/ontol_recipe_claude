steps:
- text: 돈등심은 널찍하게 성형한다.
- text: 새송이 버섯은 길게 채썰고, 미나리도 비슷한 사이즈로 썰어 준다.
- text: 고기에 미나리, 새송이를 감싸 말아 찹쌀가루를 묻혀 굽는다.
- text: 참나물, 취나물, 올리브오일, 땅콩, 마늘, 후추를 믹서에 갈아 소스를 만든다.
- text: 소스에 파마산 치즈를 섞어준다.
- text: 구워진 고기에 소스를 곁들여 낸다.
