steps:
- text: 소고기, 돼지고기, 가래떡, 양파, 새송이버섯, 파는 잘게 다진다
- text: 사과와 배는 믹서에 간 뒤 간장, 청주, 다진 마늘, 후춧가루를 넣고 양념장을 만든다.
- text: 다진 고기와 양념장을 섞은 뒤 다진 재료를 넣고 잘 치대어 먹기 좋은 크기로 만든다.
- text: 팬에 기름을 두르고 함박스테이크를 굽는다.
- text: 파프리카는 다지고, 사과, 배는 갈아서 고추장, 간장, 다진 마늘을 섞은 뒤 끓여 소스를 만든다.
- text: 밥에 참기름을 넣고 함박스테이크를 담은 뒤 소스를 올려 완성한다.
