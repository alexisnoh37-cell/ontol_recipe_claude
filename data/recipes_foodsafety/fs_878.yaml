steps:
- text: 꽁치는 머리와 내장을 제거해 손질하고 칼집을 낸다.
- text: 손질한 꽁치에 후춧가루와 청주를 뿌려 밑간해 둔다.
- text: 밑간해 둔 꽁치의 수분을 제거하고 밀가루를 묻힌다.
- text: 밀가루 묻힌 꽁치를 팬에서 노릇하게 굽는다.
- text: 팬에 저나트륨 고추장소스 재료를 넣고 살짝 졸인다.
- text: 구워진 꽁치에 소스를 뿌려낸다.
