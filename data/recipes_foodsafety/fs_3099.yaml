steps:
- text: 통마늘과 견과류들은 먹기 좋은 크기로 자른다.
- text: 흑마늘 진액과 간장, 물엿, 물을 넣어 흑마늘 소스를 만든다.
- text: 대두유를 두르고 마늘을 팬에 노릇하게 구워준다.
- text: 구워진 마늘에 각종 견과류를 넣어 볶는다.
