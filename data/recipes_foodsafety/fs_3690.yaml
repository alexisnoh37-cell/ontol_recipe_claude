steps:
- text: 냄비에 검은콩을 넣고 20분 동안 삶아 체에 거르고 으깨어 검은콩 퓨레를 만든다.
- text: 달걀흰자에 설탕을 넣으며 단단한 머랭을 만든다. 달걀노른자, 박력 밀가루를 머랭에 넣고 자르듯이 섞어 머랭 반죽을 만든다.
- text: 퓨레에 머랭 반죽을 나누어 섞어 3가지 반죽을 만든다.
- text: 종이컵에 각각의 반죽을 2/3 정도 넣고, 전자레인지에 50~55초 동안 굽는다.
- text: 10분 동안 식혀 종이컵에서 분리한다
- text: 모양을 내어 자른 후 허브가루를 뿌리고 접시에 담아 마무리한다.
