steps:
- text: 떡볶이떡은 반으로 잘라 끓는 물에 데쳐 건진다.
- text: 꼬막은 씻어 떡을 데친 끓는 물(잔열)에 살짝 삶아 건진 후 식으면 꼬막살을 뺀다.
- text: 꼬치에 데친 떡과 꼬막살을 번갈아 가며 꽂는다.
- text: 파와 양파는 다진다.
- text: 고추장, 양파, 파, 다진 마늘, 조청, 간장, 고춧가루, 참기름을 넣어 고추장양념을 만든다.
- text: 팬에 현미유를 조금 두르고 고추장양념을 볶다가 3의 꼬막떡꼬치에 고추장양념을 입힌 후 통깨를 뿌린다.
