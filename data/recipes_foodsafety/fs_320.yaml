steps:
- text: 귀리는 불려준 뒤 닭육수에 삶아준다.
- text: 브로콜리는 잘 손질하여 잘게 썰어 놓는다.
- text: 양파는 채 썰어 버터로 볶다가 1의 브로콜리와 귀리, 아몬드슬라이스를 넣고 같이 볶아준다.
- text: 어느 정도 볶아지면 우유를 넣고 다시 한 번 볶아준다.
- text: 닭육수를 넣고 귀리가 익을 때 까지 푹 익힌 후 믹서에 갈아 체에 걸러준다.
- text: 마지막으로 생크림을 넣고 농도를 조절하고 녹차가루를 올려 완성한다.
