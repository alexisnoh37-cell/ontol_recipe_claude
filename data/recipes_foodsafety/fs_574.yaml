steps:
- text: 찹쌀가루는 체에 내려 2등분한다.
- text: 찹쌀가루는 오미자와 치자를 우린 뜨거운 물로 익반죽하여 비닐봉투에 담아 숙성시킨다
- text: 대추는 씨를 발라내 곱게 다지고 귤병, 유자청, 꿀을 섞어 원소병 소를 만든다.
- text: 굴병과 꿀을 섞어 원소병 소를 준비한다.
- text: 익반죽을 지름 3cm 크기로 동그랗게 만들고 안에 소를 넣어 다시 동그랗게 만든다
- text: 녹말가루를 입혀 끓는 물에 넣은 뒤 떠오르면 건져 찬물에 헹궈 물기를 빼고 그릇에 담아 꿀물을 붓고 잣을 올린다.
