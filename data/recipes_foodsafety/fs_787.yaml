steps:
- text: 마른 미역은 물에 담가 불린 후 먹기 좋은 크기로 썬다.
- text: 우엉은 연필깍기 하여 냉수에 여러 번 주물러 씻어 쓴맛을 뺀다.
- text: 들깨는 믹서기에 물을 넣어 곱게 갈아 준비한다.
- text: 냄비에 들기름을 넣고 우엉을 넣어 부드럽게 볶다가 미역을 넣어 함께 볶는다.
- text: 4에 들깨물을 넣어 미역이 부드러우질 때까지 끓인다.
- text: 들깨 미역국이 부드러워지면 조랭이 떡을 넣고 다진 마늘을 넣어 떡국을 끓여낸다.
