steps:
- text: 감자는 껍질을 벗겨 슬라이스로 썰어 찬물에 담궈 전분을 빼고 건져 물기를 제거한다.
- text: 토마토, 양파, 새송이버섯. 표고버섯은 입자있게 다지고, 당근은 샤또 모양으로 썰어 준비한다.
- text: 오리 가슴살은 소금, 후춧가루로 밑간을 한다.
- text: 팬에 올리브오일을 두르고 마리네이드한 오리 가슴살을 넣고 구워 기름이 빠지면 접시에 담는다.
- text: 오리 가슴살을 구운 팬에 아스파라거스, 당근, 감자를 구워 접시에 담는다.
- text: 냄비 또는 팬에 다진 야채를 넣고 볶다가 발사믹소스를 넣고 졸여 소스를 만들고, 접시에 담아 놓은 오리 스테이크에 올린다.
