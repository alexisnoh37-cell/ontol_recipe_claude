steps:
- text: 바닥이 두꺼운 팬의 표면에 마늘을 문질러 마늘 즙을 골고루 묻힌다.
- text: 1을 가열한 뒤 버터를 녹인다.
- text: 팬에 닭육수와 물전분을 넣고 약한 불에서 덩어리가 생기지 않도록 저어가며 끓인다.
- text: 자른 에멘탈치즈를 넣고 나무 주걱을 이용하여 한 방향으로 젓는다.
- text: 치즈가 다 녹으면 기호에 맞게 넉맥, 소금, 후추를 넣는다.
- text: 바케트, 방울토마토, 키위 등을 적당한 크기로 잘라 꼬치에 꼿아 곁들인다.
