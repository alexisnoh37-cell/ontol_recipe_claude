steps:
- text: 소시지는 먹기 좋은 크기로 썰어 나무 막대기에 꽂아놓는다.
- text: 파프리카는 작게 다져 준비한다.
- text: 으깬 감자를 준비된 밥과 함께 골고루 섞는다.
- text: 으깬 감자를 다시 준비된 밥과 함께 소금을 조금 넣고 골고루 섞는다.
- text: 밥과 감자가 잘 섞어지면, 다시 다져진 파프리카를 넣고 섞어준다.
- text: 막대기에 밀가루를 살짝 바르고, 소시 지에 반죽(⑤)을 감싸듯 손으로 둥글게 말아 밀가루와, 달걀물, 빵가루 순서로 입혀 튀김 기름 170℃의 온도에서 약 2분 정도 튀긴 후 기름을 제거하여 완성한다.
