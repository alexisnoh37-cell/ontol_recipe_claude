steps:
- text: 장어는 생강청에 20분 정도 재워준다.
- text: 생강, 양파는 아주 가늘게 채 썰어서 냉수에 담가 매운맛을 빼준다.
- text: 소스 재료로 소스를 만들어준다.
- text: 채 썬 양파와 생강채를 냄비에 깔고 장어를 수분 없이 쪄준다.
- text: 쪄낸 장어는 접시에 올리고 양파, 생강채를 올려 소스와 함께 완성한다.
