steps:
- text: 아몬드는 곱게 갈아 체에 내려 준비한다.
- text: 달걀흰자로 머랭을 만들어 짤주머니로 짜준 후 20분 정도 말리고 오븐에 13분간 구워 마카롱을 만든다.
- text: 냄비에 설탕, 물엿, 소금을 넣고 끓인다.
- text: 달걀노른자, 설탕, 우유 및 생크림을 끓이다가 망고퓨레를 넣고 섞는다
- text: 판젤라틴은 물에 불려 중탕으로 녹여 4에 섞고, 차갑게 휘핑한 생크림을 넣는다.
- text: 5를 틀에 굳힌 후, 접시에 담고 마카롱으로 장식한다.
