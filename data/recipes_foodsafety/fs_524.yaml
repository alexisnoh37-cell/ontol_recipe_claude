steps:
- text: 홍합은 끓는 물에 살짝 데쳐 준비하고, 조개는 소금물에 담그어 해감을 해 놓는다.
- text: 표고는 기둥을 제거하고 편으로 썰고, 양파는 채를 썰고, 홍파프리카와 피망은 씨를 제거한 뒤 5~6cm 길이로 채를 썰어 놓는다.
- text: 새우는 요지를 이용하여 등에 있는 내장을 제거해 놓고 오징어는 피망과 비슷한 크기로 채를 썰어 놓는다.
- text: 스파게티면은 끓은 물에 소금을 넣고 약 10분 정도 삶아 건져 올리브오일을 살짝 발라 준비한다.
- text: 팬에 올리브 오일을 두르고, 편 마늘을 넣어 먼저 볶아 향을 만든다.
- text: 마늘의 향이 나오면, 스파게티면을 넣어 볶다가 카레가루를 넣고, 다시 볶으면서 준비한 해물과 채소를 넣어 볶아 완성한다.
