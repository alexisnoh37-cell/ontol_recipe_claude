steps:
- text: 고사리와 쪽파는 길이를 반으로 자르고, 홍고추는 길이는 살려 길게 썬다.
- text: 기름을 두른 팬에 ①을 얹고 밀가루, 계란 푼 반죽을 부워 지져낸다.
- text: 단감을 0.4cm 원형으로 썰고 꽃 모양 틀로 찍어낸다.
- text: 찹쌀가루에 감자전분물을 넣어 반죽한다.
- text: 기름 두른 팬에 반죽을 동그랗게 만든 후 감과 대추 꽃을 얹어 부친다.
- text: 단감전과 먹기 좋은 크기로 썬 고사리 파전을 그릇에 담아 완성시킨다.
