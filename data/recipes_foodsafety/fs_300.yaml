steps:
- text: 콩고기를 15분~20분 정도 물에 불려 물기를 완전히 제거한 뒤 저염간장양념으로 버무려 볶는다.
- text: 아보카도, 바나나, 가지, 연근은 깍둑 썰고, 방울토마토는 반을 가른다.
- text: 팬에 식용유(5g)를 둘러가며 방울토마토, 가지, 연근을 각각 볶아 건진다.
- text: 만두피를 작은 체에 넣고 바구니 모양으로 만들어 튀긴다.
- text: 콩고기와 아보카도, 바나나, 방울토마토, 가지, 연근을 튀긴 만두피에 담은 뒤 허브오일드레싱을 곁들여 마무리한다.
