steps:
- text: 통삼겹에 건로즈마리와 로즈마리, 올리브유를 넣고 마리네이드 해준다.
- text: 양파는 먹기 좋게 썰어 식초, 설탕, 로즈마리에 살짝 버무려준다.
- text: 양파, 2가지색 미니파프리카는 송송 다져서 설탕, 식초에 담가 꼭 짜서 수분을 빼준다.
- text: 당근은 먹기 좋은 크기로 잘라서 버터에 살짝 볶아주다 백일송이 버섯도 함께 볶아준다.
- text: 재워 놓은 통삼겹은 플레인요구르트에 다시 30분 정도 더 재워준 후 소스에 졸여준다.
- text: 감자를 쪄서 버터에 매쉬포테이토를 만들어 담아주고, 구운 통삼겹과 준비된 채소와 볶은 현미를 올려 완성한다.
