steps:
- text: 수박껍질의 녹색부분을 제거하고 얄팍하게 채 썬다.
- text: 채 썬 수박껍질에 소금을 뿌려 살짝 절여 물기를 짠다.
- text: 고추는 길이로 2등분하여 씨를 뺀다.
- text: 씨를 뺀 고추는 굵게 채 썬다.
- text: 팬에 기름을 두르고 수박껍질과 고추를 넣어 살짝 볶는다.
- text: 소금으로 간을 맞추고 마무리한다.
