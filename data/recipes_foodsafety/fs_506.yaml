steps:
- text: 새우는 꼬리를 자르고 내장을 제거 한다.
- text: 스테이크 소고기는 소금과 로즈마리를 뿌리고 후춧가루를 살짝 뿌려 놓는다.
- text: 아스파라거스는 팬에 기름 없이 굽는다.
- text: 새송이와 가지는 길게 썰어 브로컬리와 함께 기름 없이 팬에 살짝 구워 놓는다.
- text: 팬에 버터를 살짝 넣고 새우를 굽고, 스테이크를 구워 접시에 담는다.
- text: 팬에 와인과 설탕을 넣고 끓이다가, 당근, 양파와 토마토 마늘, 대파를 다져 넣고 볶듯이 끓이다가 발사믹소스를 넣고 한 번 더 졸인 소스를 스테이크 위에 얹고, 브로컬리와 새송이, 가지, 아스파라거스를 함께 놓아 완성한다.
