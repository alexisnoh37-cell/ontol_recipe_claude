steps:
- text: 토란은 감자칼로 껍질을 벗겨 3~4 등분한다.
- text: 소고기와 배추는 5mm 너비로 썰고 대파는 어슷 썬다.
- text: 토란을 연한 소금물(물 1컵 + 소금 1g)에 담근다.
- text: 참기름에 소고기와 다진 마늘을 볶다가 향이 우러나면 고춧가루를 넣고 잠시 더 볶는다.
- text: 볶은 고기에 물을 붓고 된장을 풀어 넣는다.
- text: 국물이 끓으면 배추, 토란, 대파를 넣고 한소끔 끓인다.
