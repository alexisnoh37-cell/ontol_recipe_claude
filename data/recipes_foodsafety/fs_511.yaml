steps:
- text: 닭고기살은 끓는 물에 데쳐 손으로 찢고, 느타리버섯도 데쳐 손으로 찢어 준비한다.
- text: 사과는 씨를 제거하고 약 6cm 길이로 채를 썰고, 오이와 파프리카도 같은 길이로 채를 썰어 놓는다.
- text: 애호박은 반달로 썰어 식초에 살짝 절여서 볶고, 양파는 채를 썰어 물에 잠시 담가 놓는다.
- text: 아몬드는 우유를 넣어 갈아 준비한다.
- text: 머스터드에 올리고당을 넣어 잘 섞어 준다.
- text: 또띠아를 팬에 기름 없이 굽고, 그 안에 닭고기 살과 느타리버섯, 오이, 사과, 파프리카와 호박을 넣어 속이 보이도록 말아놓고, ④번과 ⑤번은 섞어서 소스를 만들어 완성한다.
