steps:
- text: 묵말랭이는 따뜻한 물에 5시간 정도 불린 후, 끓는 물에 15분간 삶아 식힌다.
- text: 양배추, 당근은 채 썰고, 쪽파는 잘게 자른다.
- text: 냄비에 물(180ml), 소바육수 재료를 모두 넣고 끓인다.
- text: 끓인 육수를 체에 거르고 냉동실에서 차갑게 식혀 소바육수를 만든다.
- text: 올리브유를 두른 팬에 고등어를 구운 뒤, 소바육수(5g), 맛술(5g), 유자청(5g), 물(30ml)을 넣고 조린다.
- text: 그릇에 불린 묵말랭이를 담고 차가운 소바육수를 넣는다. 조린 고등어, 손질한 채소를 올려 마무리한다.
