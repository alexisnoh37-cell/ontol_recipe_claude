steps:
- text: L.A 갈비는 물에 담그어 핏물과 갈비 톱밥을 제거시켜 놓는다.
- text: 강판에 배와 양파를 곱게 갈아 준비 한다.
- text: 핏물을 제거한 갈비에 배즙과 양파즙을 넣어 숙성시킨다.
- text: 냄비에 저염간장과 월계수잎, 통후추, 올리고당, 정종, 설탕, 물, 매실액을 넣어 은근히 약 30분 정도 끓여 식힌다.
- text: 끓여 식힌 간장에 파, 마늘, 참기름, 통깨를 넣는다.
- text: 숙성시킨 L.A 갈비에 만들어 놓은 양념을 넣고 다시 하루 정도 더 숙성 후 팬에 구워 완성한다.
