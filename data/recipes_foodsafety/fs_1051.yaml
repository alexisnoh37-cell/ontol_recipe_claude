steps:
- text: 자몽은 껍질을 벗겨내고 과육만 0.5cm 주사위모양으로 자른다.
- text: 오렌지는 껍질을 벗겨내고 과육만 자몽과 같은 크기로 자른다.
- text: 키위도 껍질을 벗겨내고 자몽과 같은 크기로 자른다.
- text: 썰어 둔 과일에 플레인 요거트, 꿀을 넣고 버무린다.
- text: 또띠아를 반으로 자른다.
- text: 버무린 과일을 넣고 말아준다.
