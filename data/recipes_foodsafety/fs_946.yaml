steps:
- text: 그릇에 다진고기, 파, 생강, 소금, 물 전분을 넣어 골고루 버무린 뒤 케첩을 넣는다.
- text: 1을 한 방향으로 치댄 뒤 고기에 양념이 베도록 둔다.
- text: 청경채는 1cm 정사각형 모양으로 썬다.
- text: 2에 끈기가 생기도록 다시 치대준 뒤 지름 1.5cm의 완자 모양으로 빚는다.
- text: 팬에 물을 넣고 끓으면 완자를 넣어 익힌다.
- text: 청경채를 넣고 살짝 끓인 뒤 소금으로 간을 하고 소스가 약간 남도록 더 끓인다.
