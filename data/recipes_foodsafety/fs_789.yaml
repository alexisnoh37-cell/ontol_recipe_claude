steps:
- text: 서리태를 씻어 물에 충분히 불리고 오이는 곱게 채썬다
- text: 냄비에 서리태를 넣고 자작하게 물을 부어 한소끔 끓고 나면 불을 끄고 삶아진 서리태를 차가운 물에 헹구면서 껍질을 벗긴다.
- text: 믹서에 서리태와 잣을 넣고 물을 넣어 곱게 간다.
- text: 밀가루에 소금을 소량 넣어 반죽 한다.
- text: 반죽을 가늘고 얇게 국수로 만들어 끓는 물에 넣고 삶는다.
- text: 그릇에 국수를 담고 잣, 콩물을 부은 후 채썬 오이와 반 가른 체리토마토를 얹고 흑임자를 뿌려 완성한다.
