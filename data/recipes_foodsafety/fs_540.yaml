steps:
- text: 끓는 물에 식초 한 방울을 떨어 뜨려 주꾸미를 데쳐 한김 식혀 먹기 좋게 썰어놓는다.
- text: 끓는 물에 식초 한 방울을 떨어 뜨려 주꾸미를 데쳐 한김 식혀먹기 좋게 썰어놓는다.
- text: 양상추는 손으로 뜯어, 찬물에 담그어 놓는다.
- text: 미나리는 약 4cm 길이로 썰고, 홍고추는 어슷 썰어 씨를 살짝 제거하고 피망은 씨를 제거하고 미나리와 비슷한 길이로 썰어놓는다.
- text: 강판에 곱게 간 배즙과 무즙에 와사비, 설탕, 다진마늘, 식초, 소금을 넣어 샐러드소스를 만든다.
- text: 만들어 놓은 샐러드소스와 함께 썰어 놓은 주꾸미(②)와 채소(③, ④)를 넣어 먹기 직전에 버무려 완성한다.
