steps:
- text: 두부는 2cm의 정사각형으로 썰어 전분과 계란물을 무쳐 기름에 튀긴다.
- text: 무는 믹서기나 강판에 갈아준다.
- text: 끓는 물에 가쓰오부시를 살짝 넣었다 빼내어 국물을 우려낸다.
- text: 무와 가쓰오부시 국물에 설탕, 미향, 레몬즙, 식초, 저염간장을 넣고 섞어준다.
- text: 깻잎은 곱게 채를 쳐준다.
- text: 접시에 두부와 깻잎을 담고, 소스를 곁들여 낸다.
