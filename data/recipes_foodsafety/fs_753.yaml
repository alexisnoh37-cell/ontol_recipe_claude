steps:
- text: 코다리는 배를 갈라 길이로 2등분하여 뼈를 제거한다.
- text: 손질한 코다리를 반으로 잘라 안쪽에 누룽지 가루를 묻힌다.
- text: 분량의 재료를 섞어 양념장을 만든다.
- text: 팬에 기름을 두르고 코다리를 굽는다.
- text: 코다리에 양념장을 발라 다시 한번 살짝 굽는다.
- text: 다진 홍고추와 실파를 뿌려 마무리한다.
