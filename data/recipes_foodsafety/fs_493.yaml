steps:
- text: 양송이는 껍질을 벗겨 형태 그대로 썰고, 표고버섯은 기둥을 제거하고 편으로 썰어놓는다.
- text: 팬에 버터를 살짝 넣고 썰어놓은 버섯을 소금을 살짝 뿌려 볶아 준비한다.
- text: 냄비에 버터와 밀가루를 넣고, 은근히 볶아 화이트루를 만든다.
- text: 화이트 루에 우유를 조금씩 넣고 뭉치지 않게 풀어 끓이다가 다시 생크림을 넣고 한 소큼 끓여 놓는다.
- text: 스파게티는 끓는 물에 약 10분 정도 삶아 건져 올리브 오일에 볶아 접시에 담는다.
- text: 끓여 놓은 크림소스에 볶아진 버섯과 후춧가루를 넣고 한 소큼 더 끓여 스파게티를 담은 접시에 넣고 완성한다.
