steps:
- text: 소고기는 포를 두툼하게 떠서, 소금과 후춧가루를 뿌려 숙성을 시킨다.
- text: 인삼은 뇌두를 잘라 씻어 약 2cm 두께로 썰고, 파인애플과 파프리카도 두툼하게 썰고, 표고버섯과 대파, 토마토를 썰어 준비하고, 베이컨도 2cm 길이로 썰어 준비한다.
- text: 팬에 기름 없이 파인애플과 파프리카를 먼저 굽는다.
- text: 잘라놓은 인삼은 올리브오일을 살짝 넣고 굽는다.
- text: 마늘은 썰어 굽고, 준비한 재료를 꼬치에 차례로 꽂아 프라이팬 또는 직화로 구워 담는다.
- text: 유자청에 저염간장과 레몬, 설탕을 넣고 골고루 섞어 구워 놓은 소고기 꼬지에 올려 완성한다.
