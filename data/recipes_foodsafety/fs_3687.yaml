steps:
- text: 믹서에 삶은 병아리콩①, 두유, 코코넛오일을 넣고 곱게 간다.
- text: 볼에 담고 유자필을 넣어 섞는다.
- text: 쌀가루, 아몬드가루, 감태가루를 체 쳐서 넣고 섞어 반죽을 만든다.
- text: 반죽은 10~12cm 크기의 원형으로 성형하고, 유자앙금과 삶은 병아리콩②를 섞어 반죽 위에 올린다
- text: 4~5등분으로 자르고 오븐 팬에 올린다.
- text: 175°C로 예열한 오븐에 170°C에서 20분 동안 구워 마무리한다.
