steps:
- text: 닭고기살은 넓게 펴서, 약 10분 정도 우유에 담그어 놓는다.
- text: 수수와 쌀은 깨끗이 씻어 찬물에 약 30분 정도 불려 밥을 지어 놓는다.
- text: 파프리카는 가운데 씨를 제거하고 채를 썰고, 당근과 양파도 파프리카 길이로 채를 썰고, 애호박은 껍질 부분만 돌려 깎아 채를 썰어 준비한다.
- text: 팬에 기름을 살짝 둘러 준비한 채소(③)에 소금을 넣고 볶아 놓는다.
- text: 우유에서 닭고기를 건져 후춧가루를 살짝 뿌린 후 잡곡밥(②)과 볶아 놓은 채소(④)를 넣어 돌돌 말아 준다.
- text: 토마토는 입자있게 다져 다진 마늘과 함께 볶다가 케첩과 육수를 넣고 끓인 뒤 말아놓은 닭고기를 넣고 은근히 졸이듯 익혀 완성한다.
