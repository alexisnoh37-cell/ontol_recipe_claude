steps:
- text: 황태는 가위로 약 3cm 길이로 잘라 스프레이로 물기를 준다.
- text: 밀가루를 세 군데로 나눠 각각 찹쌀 가루와 녹말가루, 삼색 가루를 넣어 세 가지의 색을 만든다.
- text: 만들어 놓은 밀가루에 달걀을 넣어 골고루 섞는다.
- text: 튀김 반죽(③)에 황태(①)를 넣어 섞은 후, 튀김 기름 170℃ 의 온도에서 약 1분 정도 튀겨 기름을 빼 놓는다.
- text: 파프리카는 속씨를 제거하고, 양파와 당근, 오이, 파인애플과 함께 썰어 준비 한다.
- text: 저염간장에 설탕과 식초를 넣어 골고루 섞은 후 냄비에서 바글바글 끓이다가 물녹말을 넣고, 썰어놓은 채소를 넣어 한 번 더 끓인 후 황태 탕수육(④)에 곁들여 완성한다.
