steps:
- text: 돼지목살에 생강즙과 로즈마리, 소금, 후춧가루를 뿌려 숙성시킨다.
- text: 양파와 마늘, 샐러리는 입자있게 다진다.
- text: 칠리소스와 케첩, 포도주스를 섞는다.
- text: 브로컬리는 살짝 데쳐, 작게 썰고, 당근과 적채 채를 썰어 준비한다.
- text: 냄비에 버터를 넣고, 양파와 마늘을 넣어 볶는다.
- text: 볶은 냄비(⑤)에 샐러리를 넣고 포도 주스(③)와 채소(④)를 넣고 자작하게 졸인 후 팬에 버터를 살짝 바르고, 팬이 따끈해 지면 숙성한 목살을 넣어 익힌다. 목살이 익혀지면, 자작하게 졸인 소스에 넣어 다시 한 번 더 졸여 완성한다.
