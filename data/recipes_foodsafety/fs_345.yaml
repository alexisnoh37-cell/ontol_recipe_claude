steps:
- text: 브로콜리는 먹기 좋게 잘라서 데쳐준다.
- text: 건조체리는 손질해 씨를 제거하고 송송 다져서 먹기 좋게 잘라준다.
- text: 라이스페이퍼를 뜨거운 물에 데쳐내 체리를 말아 체리 만두를 만든다.
- text: 만들어진 체리 만두를 팬에 살짝 구워서 라이스페이퍼를 고소하게 만든다.
- text: 블루베리, 딸기, 바나나, 검은콩두유와 우유를 한데 섞어 믹서에 갈아준다.
- text: 갈아둔 스프를 담고 브로콜리와 체리 만두를 올리고 먹기 전에 볶은 현미를 올려준다.
