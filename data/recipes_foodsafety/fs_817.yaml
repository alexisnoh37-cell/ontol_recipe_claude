steps:
- text: 비트는 물에 삶아 80%를 익힌다.
- text: 껍질을 벗기고 모양내어 썬다.
- text: 비트는 분량에 맞게 양념한다.
- text: 양념한비트는 175℃ 오븐에서 굽는다.
- text: 호두캐러멜을 만든다. (펜에 설탕과 물을 녹이고 계피, 넉맷을 넣은 뒤 호두를 넣는다.)
- text: 그릇에 비트와 호두캐러멜을 담고 사워크림과 다진 파슬리로 장식한다.
