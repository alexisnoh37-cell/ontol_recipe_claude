steps:
- text: 새우는 껍질을 제거하고 소금과 후춧가루를 넣어 밑간을 해놓는다.
- text: 어린잎은 찬물에 담그어 놓는다.
- text: 튀김가루에 달걀을 넣어 잘 섞어 튀김반죽을 만들어 놓는다.
- text: 밑간을 해 놓은 새우를 튀김반죽에 넣어 옷을 입힌다.
- text: 누룽지는 170℃의 온도 튀김 기름에 튀겨내고, 튀김옷 입힌 새우도 튀겨낸다.
- text: 냄비에 오렌지주스와 설탕, 식초를 넣어 은근히 졸여 소스를 만들고, 어린잎은 찬물에 건져 물기를 제거하고 접시에 깔고 튀긴 누룽지와 튀긴 새우를 올려 완성한다.
