steps:
- text: 오이고추는 배를 갈라 씨를 제거하고 세척 후 절임물에 절여준다.
- text: 영양부추, 연근은 송송 다지고 무는 채 썬다.
- text: 손질한 부추와 연근, 무에 절임물을 조금 넣고 절인다.
- text: 고춧가루, 생강청, 통깨를 절임채소에 섞어 소를 만든다.
- text: 오이고추 속에 소를 채워 넣는다.
- text: 오이고추를 그릇에 담고 남은 물을 부어 마무리한다.
