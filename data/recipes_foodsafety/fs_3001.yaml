steps:
- text: 양지를 찬물에 담가 핏물을 제거한다.
- text: 양지와 무를 냄비에 끓인 뒤 양지를 건진다.
- text: 알토란은 쌀뜨물에 1시간 정도 담근 뒤 소금물에 삶아 아린 맛을 제거한다.
- text: 각종 채소를 손질하고 건져낸 양지를 찢는다.
- text: 육수에 손질한 야채와 양지를 넣고 끓인다.
- text: 고춧가루와 들깨가루를 넣고 끓인다.
