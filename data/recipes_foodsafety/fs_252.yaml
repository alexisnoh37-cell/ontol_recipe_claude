steps:
- text: 차돌박이는 고기 밑간에 재워둔다.
- text: 파프리카, 양파는 깨끗이 씻어 곱게 채 썰고, 부추도 비슷한 길이로 썬다.
- text: 해초는 깨끗이 손질하여 해초 밑간에 재운다.
- text: 3가지 소스를 만든다.
- text: 차돌박이를 팬에 볶아 준비한다.
- text: 볶은 차돌박이와 해초, 부추, 파프리카, 양파를 접시에 담고 삼색소스를 곁들여 마무리한다.
