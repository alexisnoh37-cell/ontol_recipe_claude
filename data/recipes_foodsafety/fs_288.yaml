steps:
- text: 냄비에 무, 돼지고기, 다시마를 넣고 끓이다가 끓어오르면 다시마를 건지고 청주와 보리새우를 넣어 약한 불로 끓여 고기가 익으면 체에 거른다.
- text: 숙주는 끝을 다듬고, 느타리버섯은 결대로 찢고, 양파는 채 썰고, 대파와 청양고추는 어슷 썰고, 무는 납작하게 썬다.
- text: 얼갈이배추는 밑동을 잘라 3cm 간격으로 썰어 데친 뒤 찬물로 헹궈 물기를 짠다.
- text: 양념장을 만든 뒤 찢은 고기와 얼갈이배추를 넣어 버무린다.
- text: 육수에 무, 양념에 버무린 고기와 얼갈이배추, 숙주, 느타리버섯, 대파, 청양고추 순으로 넣어가며 푹 끓여 마무리한다.
