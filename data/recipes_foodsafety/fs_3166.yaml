steps:
- text: 배추, 콜라비, 오이, 당근을 나박모양으로 썬다.
- text: 레몬은 은행잎썰기, 홍고추는 어슷썰기, 실파는 1.5cm 길이로 썬다.
- text: 식초, 설탕, 오미자청으로 단촛물을 만든다.
- text: 단촛물에 야채, 레몬, 고추, 실파를 넣고 숙성시킨다.
- text: 숙성 후 색을 보고 오미자청을 더 첨가한다.
- text: 숙성된 오미자 나박김치를 그릇에 담아준다.
