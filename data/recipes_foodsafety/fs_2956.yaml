steps:
- text: 오이와 파프리카, 적양배추는 한 입 크기로 썬다.
- text: 냄비에 물과 피클물 재료를 넣어 끓인다.
- text: 다른 냄비에 물을 끓여, 피클을 담을 용기를 넣어 소독한다.
- text: 소독한 용기를 잘 말린 뒤 손질한 채소를 담는다.
- text: 피클물이 끓으면 식힌 뒤 용기에 붓는다.
- text: 피클을 30분간 숙성해 마무리한다.
