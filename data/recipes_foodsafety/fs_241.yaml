- text: 파프리카는 채 썰고, 부추는 먹기 좋은 크기로 썰어 들기름과 고춧가루에 버무린다.
- text: 통삼겹살을 먹기 좋은 크기로 썰어 부추, 파프리카 위에 놓고 튀긴 새우젓과 마늘을 올린 뒤 소스를 곁들여 마무리한다.
