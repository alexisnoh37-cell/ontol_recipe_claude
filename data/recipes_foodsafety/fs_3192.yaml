steps:
- text: (속재료) 익힌 단호박과 생크림을 믹싱하여 단호박 크림을 만든다. ★ 단호박은 쪄서 사용하는게 좋아요.
- text: 브로콜리를 제외한 반죽 재료를 넣고 최종단계까지 믹싱한 후 삶아서 다진 브로콜리를 넣고 섞어준다. 1차 발효를 고온발효로 27℃에서 1시간 발효한다.
- text: 130g씩 분할하여 둥글리기 후 중간 발효를 20분간 한다.
- text: 반죽을 30cm ~35cm 정도 늘린 후 링 모양으로 정형하여 팬닝한 후 35℃, 85%의 습도 환경에서 60분간 2차 발효 해주고 끓는 물에 양쪽 면을 데친다.
- text: 210℃에서 15분간 구워주고 식힘망에서 식힌다.
- text: '"식은 빵을 갈라 단호박 크림을 샌드한다. ★빵이 식은 후 크림을 올려야 녹지 않아요."'
