steps:
- text: 돼지고기에 생강즙과 소금, 후춧가루를 넣어 숙성한다.
- text: 숙성된 돼지고기에 간장과 정종, 설탕, 파, 마늘, 양파, 참기름, 통깨 넣어 골고루 양념한다.
- text: 새송이, 가지, 표고, 홍피망을 편으로 썰어 준비한다.
- text: 된장에 마요네즈와 생크림, 다진 땅콩을 섞어놓는다.
- text: 새송이와 가지, 표고, 홍피망은 팬에서 굽는다.
- text: 팬이 따끈해지면 양념한 돼지고기를 구워 접시에 담고 그 위에 된장 소스를 올리고, 구워낸 채소를 다시 위에 올려 완성한다.
