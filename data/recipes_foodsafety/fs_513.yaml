steps:
- text: 통오징어는 다리를 떼어내고 내장을 제거시켜 통째로 깨끗이 씻어 준비 한다.
- text: 양파와 당근, 부추, 생강은 입자있게 썰고, 견과류는 다져 준비한다.
- text: 두부는 물기를 짠 후 수저로 으깨어 놓는다.
- text: 잘게 썰은 오징어 다리와 썰어 놓은 채소, 견과류(②), 곱게 다진 대파와 마늘, 그리고 소금과 녹말가루를 두부 (③)와 함께 골고루 섞어 순대속을 만든다.
- text: 손질된 오징어 속 안에 준비한 속을 채워 넣는다.
- text: 오징어순대에 레몬즙과 정종, 생강즙을 섞어 바른 뒤 찜통에 김이 오르면 오징어순대를 넣어 약 10분 정도 쪄서 완성한다.
