steps:
- text: 도미에 후춧가루와 밀가루를 묻혀 놓는다.
- text: 토마토는 껍질을 벗겨 썰고 올리브는 0.8cm 주사위모양으로 썬다.
- text: 팬에 식용유를 넣고 도미를 넣어 익히다가 화이트와인을 넣는다.
- text: 소스 재료들과 물을 넣어 끓이면서 반으로 졸인다.
- text: 도미는 건져내고 팬에 남은 소스에 다진 파슬리가루를 뿌린다.
- text: 접시에 도미와 소스를 함께 곁들여 낸다.
