steps:
- text: 백김치는 살짝 씻어 물기를 제거하고 잘게 썰어 준비한다.
- text: 양파와 마늘은 다지고 파는 채를 썰어 놓는다.
- text: 어린잎은 찬 물에 담그어 놓았다가, 다시 소창에 건져 물기를 빼 놓는다.
- text: 냄비에 물을 넣고, 양파와 파를 넣어 끓이다가 준비한 쭈구미를 넣고 부드럽게 데쳐 썰어 놓는다.
- text: 식초와 간장, 설탕, 꿀, 레몬, 다진양파, 다진마늘을 넣고 잘 섞어서 샐러드 드레싱을 만든다.
- text: 준비한 백김치(①)와 주꾸미(②)를 섞은 후 양상추를 접시에 깔고, 그 위에 섞어놓은 백김치와 주꾸미를 올리고, 홍고추와 어린잎을 위에 장식으로 올린 후 샐러드 소스를 뿌려 완성한다.
