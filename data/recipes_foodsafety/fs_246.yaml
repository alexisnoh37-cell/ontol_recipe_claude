steps:
- text: 닭가슴살을 다져서 두부와 섞어준다.
- text: 수삼과 파프리카를 채 썰고, 대추는 돌려서 깎아준다.
- text: 닭가슴살두부반죽을 얇게 편 후 파프리카, 수삼, 대추를 올린 뒤 풀리지 않게 종이포일로 만다.
- text: 김 오른 찜기에 20분간 쪄준다.
- text: 블루베리잼과 화이트와인을 졸인 뒤 설탕을 넣고 블루베리소스를 만든다.
- text: 쪄낸 삼계선을 2㎝두께로 잘라 담고 블루베리소스를 곁들여 마무리한다.
