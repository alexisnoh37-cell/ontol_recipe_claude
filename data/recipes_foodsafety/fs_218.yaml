steps:
- text: 쌀과 현미는 물에 깨끗이 씻어 불린 후 밥을 고슬고슬하게 짓는다.
- text: 감자, 고구마, 우엉, 양파, 당근, 애호박, 연근은 작게 깍둑 썰고, 마늘은 편 썬다.
- text: 시금치와 참나물, 깻잎은 굵게 채 썰고, 미나리는 2.5㎝ 길이로 썬다.
- text: 물(50g)에 다시마를 우려내 육수를 내고 청국장을 넣어 잘 푼 뒤 들깻가루를 넣고 잘 저어주며 졸여 청국장소스를 만든다.
- text: 팬에 올리브유와 들기름을 두르고 양파, 마늘을 약한 불에 볶다가 감자, 고구마, 우엉, 연근, 당근, 애호박을 넣고 같이 볶는다.
- text: 밥과 청국장소스를 부어 80% 정도 볶다가 시금치, 참나물, 미나리를 넣고 한 번 더 볶고 채 썬 깻잎을 올려 마무리한다.
