steps:
- text: 냄비에 육수 재료를 넣고 10분간 끓여 건더기를 건진다.
- text: 애호박은 돌려 깎아 채 썰고, 양파도 채 썰고, 청양고추와 대파는 어슷 썬다.
- text: 토마토는 200g은 잘게 다지고, 100g은 두툼하게 썬다.
- text: 육수에 라면스프와 라면을 넣고 살짝 익힌 뒤 양파, 애호박, 다진 토마토를 넣고 끓인다.
- text: 면이 다 익으면 두툼하게 썬 토마토를 넣고 10초간 더 끓인다.
- text: 대파와 청양고추를 올려 마무리한다.
