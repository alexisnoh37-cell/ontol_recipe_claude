steps:
- text: 돼지고기, 두부, 아삭이고추는 잘게 다지고, 가지는 어슷하게 4등분해 가운데 칼집을 넣는다.
- text: 다진 돼지고기는 밑간한 뒤 다진 두부, 고추를 넣어 섞는다.
- text: 칼집을 넣은 가지에 밑간한 돼지고기를 채운 뒤 튀김가루를 묻힌다.
- text: 튀김가루를 묻힌 가지는 180℃로 예열한 식용유(100㎖)에 7~8분간 두 번 튀긴다.
- text: 냄비에 가지소스 재료와 물(100㎖)을 넣어 4분간 끓인다.
- text: 그릇에 튀긴 가지를 얹고 가지소스를 뿌린다.
