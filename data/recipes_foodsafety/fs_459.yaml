steps:
- text: 닭살은 삶아 입자있게 썰고, 양송이도 껍질을 벗겨 입자있게 썰어 준비한다.
- text: 떡볶이떡과 양파도 입자있게 썰어 놓는다.
- text: 당근은 소금을 넣고 삶아 꼬마 당근을 만들어 장식을 준비한다.
- text: 냄비에 버터를 두르고 양파를 먼저 볶는다.
- text: 볶아지는 냄비에 닭살과 떡볶이떡, 양파를 넣어 다시 볶는다.
- text: ⑤번에 밥을 넣고 육수와 우유, 생크림을 넣어 볶으면서 치즈를 넣고 한 번 더 고실 하게 볶아 완성하고 삶은 당근은 꼬마 당근을 만들어 장식으로 올려 준다.
