steps:
- text: 쌀과 다시마를 넣고 쌀과 동량의 물을 부어 밥을 고슬고슬하게 짓는다.
- text: 양파는 굵게 다지고, 쪽파와 고추는 송송 썰고, 오징어와 주꾸미는 먹기 좋은 크기로 썬다.
- text: 달군 팬에 들기름을 두르고 다진 마늘을 볶아 향을 낸다.
- text: 미역을 넣고 볶다가 손질해둔 오징어, 주꾸미, 새우살, 양파를 넣어 볶는다.
- text: 밥을 넣고 소금을 넣어 볶다가 들깻가루를 넣어 볶는다.
- text: 송송 썬 쪽파와 청양고추, 붉은 고추를 넣어 조금 더 볶아 마무리한다.
