steps:
- text: 미니버섯을 깨끗이 씻어 소금을 살짝 뿌려 놓는다.
- text: 녹말가루에 물을 반쯤 넣고, 가만히 가라앉혀 윗물은 따라 버리고, 딱딱한 된녹말을 만들어 놓는다.
- text: 브로컬리는 끓는 물에 데쳐 작게 썰고, 오이는 반달로 썰고, 당근은 은행잎 모양으로 썰어 준비하고, 파프리카는 속씨를 제거하고, 삼각지게 썰어 준비 한다.
- text: 간장과 홍초, 설탕을 넣어 골고루 섞어 탕수육소스를 만들어 놓는다.
- text: 소금을 뿌려 놓은 미니 버섯에 만들어 놓은 된 녹말과 달걀흰자를 넣어 골고 루 섞는다.
- text: 튀김 기름의 온도가 170~180℃가 되면, 녹말 입힌 미니버섯을 바삭 하게 튀겨 주고, 다시 팬에 만들어 놓은 탕수육소스를 바글바글 끓이다가, 썰어 놓은 채소를 넣고 살짝 익힌 후, 물녹말을 한 숟가락 정도 넣어 끓인 후 튀겨진 미니버섯 위에 올려 완성해 준다.
