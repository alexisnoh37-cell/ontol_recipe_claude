steps:
- text: 작은 불에 물과 해선장소스, 간장, 전분, 참기름, 녹말가루를 넣고 녹말가루가 잘 풀릴 때까지 섞는다.
- text: 큰 소스팬을 중간불에 올린다. 식용유를 두르고 마늘을 15~20초간 타지않게 볶는다.
- text: 두부를 넣고 옅은 골든 브라운 색이 날 때까지 3~4분간 익힌다.
- text: 데친 그린빈, 청경채, 영콘, 밤을 넣고 섞어준다.
- text: 볶은 두부에 소스를 끼얹는다.
- text: 땅콩가루를 뿌려 완성한다.
