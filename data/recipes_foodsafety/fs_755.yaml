steps:
- text: 멸치를 마른팬에 넣고 볶는다.
- text: 살짝 볶아낸 멸치에 올리브유와 맛술을 넣고 부드러워질 때까지 볶는다.
- text: 땅콩을 찬물에 20분 담갔다 체에 건져 물기를 뺀다.
- text: 건고추는 송송 썬다.
- text: 팬에 올리브유, 참기름, 콩기름을 섞어 두르고 다진 마늘을 넣어 향을 낸 후 땅콩과 고추를 넣어 볶는다.
- text: 볶은 멸치와 굴소스, 두반장, 물엿을 넣고 고루 섞은 다음 통깨를 뿌려낸다.
