steps:
- text: 냄비에 다시마와 무를 넣고 끓이다가 가쓰오부시를 넣고 불을 꺼 진한 육수를 만든다.
- text: 육수에 식초, 설탕, 소금을 넣고 촛물을 만든다.
- text: 참치는 불에 타다끼 한 뒤 두툼하게 썬다.
- text: 파프리카는 직화로 겉만 태워 참치 크기로 썬다.
- text: 아스파라거스와 표고버섯은 살짝 데쳐 편으로 썬다.
- text: 육수에 달걀을 풀어 두툼하게 지단을 부쳐 썰고, 밥에 촛물을 넣고 골고루 섞어 초밥을 만든 뒤 와사비, 참치, 달걀, 표고버섯, 파프리카 순으로 올려 김으로 띠를 두른다.
