steps:
- text: 소고기와 돼지고기에 찹쌀가루와 밥을 넣고 골고루 섞는다.
- text: 섞여진 고기(1)에 파와 후춧가루, 간장, 맛술, 생크림을 넣고 다시 잘 섞어 30분 이상 숙성을 시킨다.
- text: 새송이버섯은 다지고, 시금치는 뜨거운 물에 데쳐 물기를 제거하고 잘게 다지고, 당근도 다져 준비한다.
- text: 양파와 마늘은 다져서 볶아 준비해 놓는다.
- text: 떡볶이 떡은 뜨거운 물에 잠시 담그어 부드러워지면 꺼내서 잘게 다진다.
- text: 숙성된 고기(②)에 다진 채소(③)와 볶은 마늘과 양파(④), 떡볶이떡(⑤)을 넣고 섞이도록 치댄 후 작은 떡갈비 모양을 만들어 팬에 기름을 두르고, 앞뒤를 돌려 가며 익힌 후, 냄비에 간장과 올리고당을 넣고 끓이다가, 익힌 떡갈비를 넣고 자작 하게 졸여 완성한다.
