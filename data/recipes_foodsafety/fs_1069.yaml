steps:
- text: 가지는 길이대로 얇게 슬라이스한 뒤 살짝 굽는다.
- text: 파프리카, 당근, 사과는 얇게 채썬다.
- text: 단호박은 속을 파내고 쪄서 으깬다.
- text: 참깨에 마요네즈, 꿀, 간 배를 넣고 섞어 참깨마요소스를 만든다.
- text: 구운 가지에 단호박을 얇게 바르고 야채들을 넣고 돌돌 만다.
- text: 참깨마요소스를 올린다.
