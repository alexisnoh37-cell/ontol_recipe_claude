steps:
- text: 파프리카는 콩 크기의 큐브모양으로 썬다.
- text: 준비된 콩들은 물에 불린 후, 각각 끓는 물에 삶은 다음 물기를 제거한다.
- text: 두부와 삶은 병아리콩을 으깨준다.
- text: ③에 밀가루, 찹쌀가루, 소금, 물을 넣어 반죽한다.
- text: 반죽에 콩과 파프리카를 섞는다.
- text: 팬에 식용유를 두르고, 반죽의 콩들이 잘 보이도록 먹기 좋은 크기로 부친다.
