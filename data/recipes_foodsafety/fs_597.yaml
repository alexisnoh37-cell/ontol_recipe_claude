steps:
- text: 쌀가루와 밀가루를 섞어 체에 내린다.
- text: 냄비에 막걸리를 붓고 끓인다
- text: 끓인 막걸리를 체 친 쌀가루와 밀가루에 섞어 반죽을 만들고 치대어 숙성시킨다.
