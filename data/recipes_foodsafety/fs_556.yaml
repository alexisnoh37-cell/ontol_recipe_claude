steps:
- text: 닭고기는 잘게 썰어 후춧가루로 밑간을 한다.
- text: 밑간한 닭고기를 달걀과 섞은 뒤 전분을 넣고 골고루 묻힌다.
- text: 감자는 껍질을 벗기고 곱게 채 썰어 찬물에 담궈 전분을 뺀다.
- text: 감자를 건져 물기를 빼고, 전분을 묻혀 둥지모양을 만들어 튀긴다.
- text: 레몬과 설탕을 넣고 끓인다.
- text: 감자를 둥지모양으로 튀기고 그 위에 튀긴 닭고기를 올리고 어린잎으로 장식한 뒤 레몬소스를 올린다.
