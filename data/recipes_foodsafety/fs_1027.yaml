steps:
- text: 닭가슴살과 소고기안심을 먹기 좋은 크기로 자른다.
- text: 간장, 카레가루, 땅콩버서, 참기름, 올리브오일, 설탕, 다진 생강을 섞어 소스를 만든다.
- text: 꼬치에 1을 번갈아 끼운다.
- text: 고기를 끼운 꼬치에 2의 소스를 바른다.
- text: 오븐을 176℃로 예열한다.
- text: 예열된 오븐에 소스를 바른 꼬치를 구워준다.
