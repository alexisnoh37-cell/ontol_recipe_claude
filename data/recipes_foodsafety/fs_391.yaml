steps:
- text: 소고기는 사방 2cm 정도의 크기로 잘라서 물에서 80% 정도까지 익혀준 후 냉수에 깨끗하게 세척해 준다.
- text: 양파는 먹기 좋게 자르고 물 400g과 함께 간장 물을 만들어준다.
- text: 간장 물에 데쳐 놓은 소고기부터 졸여주기 시작한다.
- text: 메추리알을 넣고 함께 졸여준다.
- text: 방울토마토, 양파, 마늘, 꽈리고추까지 넣고 마지막으로 졸여준다.
