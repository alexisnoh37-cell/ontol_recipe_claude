steps:
- text: 닭은 손질해 주고 흰 후추와 올리브오일로 밑간을 해준다.
- text: 시금치는 데친 후 수분을 제거해 먹기 좋게 잘라주고, 양파는 송송 다져준다. 준비된 채소를 마늘과 버터에 볶아주다 생크림을 넣어 살짝 졸여준다.
- text: 콜리플라워, 브로콜리는 뜨거운 물에 데친 후 방울토마토와 함께 팬에 구워준다.
- text: 버터에 꿀을 넣고 졸이다가 카라멜 효과를 주고 오렌지주스와 레몬즙을 넣고 갈색소스를 만든다.
- text: 닭가슴살을 포를 떠준 후 졸여준 채소를 채워준다.
- text: 닭가슴살을 팬에 구워주고 접시에 구운 채소 와 소스를 뿌려준다.
