steps:
- text: 삼치는 반으로 잘라지지 않게 편으로 떠서 소금을 살짝 뿌려 잠시 말려 놓는다.
- text: 손질을 한 삼치에 녹말가루를 입혀 팬에 기름을 두르고 구워 접시에 담아 놓는다.
- text: 생강은 잘게 썰어, 물에 섞은 후 거름종이에 걸러 생강즙을 만든다.
- text: 유자청에 만들어 놓은 생강즙을 넣고 섞는다.
- text: 냄비에 레몬을 넣고, 물을 넣고 은근히 끓인다.
- text: 레몬을 끓인 물에 ④번을 넣고 졸여 소스를 만든 후 접시에 담아 놓은 삼치 위에 소스로 올려 완성한다.
