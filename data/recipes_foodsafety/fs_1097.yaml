steps:
- text: 삶아 으깬 고구마와 으깬 바나나를 섞는다.
- text: 볼에 달걀노른자, 올리고당, 우유, 바닐라빈을 넣고 중탕시켜 걸쭉하게 만든 뒤 1번과 섞는다.
- text: 2번에 휘핑한 생크림을 넣고 섞은 뒤 젤라틴을 넣는다.
- text: 딸기잼에 우유를 넣고 끓여 젤리를 만든다.
- text: 무스 틀에 3번과 딸기잼 젤리를 차곡차곡 넣어 굳힌다.
- text: 굳힌 무스위에 크림치즈를 올린다.
