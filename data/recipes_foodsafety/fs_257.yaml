steps:
- text: 냄비에 고기 삶는 재료를 넣고 끓으면 돼지고기를 넣어 익힌다.
- text: 가지는 길이로 납작하게 썰고, 김치는 씻어 5㎝ 길이로 채 썰고, 피망, 양파도 같은 길이로 채 썰고, 생강과 마늘은 편으로 썰어 준비한다.
- text: 팬에 올리브유를 약간 두르고 가지를 살짝 굽는다.
- text: 김치, 피망을 가지에 넣고 돌돌 만다.
- text: 팬에 올리브유, 마늘, 생강, 삶은 고기를 넣고 육즙이 나오지 않도록 고기 겉면을 익힌 뒤 채 썬 양파, 마늘, 레몬, 레드와인, 올리고당을 넣고 조린다.
- text: 고기에 간이 배면 건져내 먹기 좋은 크기로 썰어 마무리한다.
