steps:
- text: 코다리는 어간장, 청주, 흰후추, 생강청에 살짝 재워준다.
- text: 함초는 손질해 잘라준다.
- text: 무는 소금에 살짝 절여서 수분과 염분을 제거해준다.
- text: 무와 함초를 고루 섞어준다.
- text: 미나리와 콩나물은 손질해준 후 찜기에 깔고 코다리를 쪄준다.
- text: 소스를 만든 뒤 채소를 깔고 코다리를 올리고 미나리, 콩나물을 올려 완성한다.
