steps:
- text: 계피가루와 대추를 삶아 건지고, 삶은 물은 따로 준비한다.
- text: 밀가루에 대추와 계피 삶은 물을 넣고 전병 반죽을 한다.
- text: 팬에 기름을 살짝 두르고 전병반죽을 작은 국자로 떠넣고 전병을 만든다.
- text: 달걀은 황백으로 나눠 지단을 부쳐 채를 썬다.
- text: 오이, 당근, 양파 및 표고버섯은 채를 썰어 소금에 살짝 절여 팬에 볶아 따로 준비한다.
- text: 소고기는 채를 썰어 저염간장으로 양념 하고 팬에 볶은 후, 만들어 놓은 전병에 볶은 야채와 소고기를 올려 돌돌 말아 접시에 담고 그 위에 잣을 올리고 녹차를 만든다.
