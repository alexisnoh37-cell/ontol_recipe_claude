steps:
- text: 낙지는 밀가루를 넣고 주물러 씻는다.
- text: 씻은 낙지를 5cm 길이로 썬다
- text: 마늘은 편으로, 양파는 사방 3cm, 브로콜리는 한입 크기로 썬다.
- text: 팬에 올리브유를 넣고 마늘을 볶아 향을 낸다.
- text: 양파와 방울토마토를 넣고 약한 불에서 토마토가 물러질 때까지 천천히 익힌다.
- text: 브로콜리와 낙지를 넣고 볶은 뒤 소금으로 간하고 접시에 담아낸다.
