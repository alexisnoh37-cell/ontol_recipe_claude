steps:
- text: 묵은지는 흐르는 물에 헹군 뒤 찬물에 30분간 담가둔다.
- text: 배추, 깻잎, 소고기, 묵은지 순으로 층층이 쌓는다.
- text: 쌓은 재료를 3~4cm 크기로 자른다.
- text: 냄비에 재료를 둘러 담고, 가운데에 콩나물과 북어채를 담는다.
- text: 물(3컵)을 넣는다.
- text: 중간 불로 10분간 끓여 마무리한다.
