steps:
- text: 포항초는 세척하고 3cm 크기로 자른다.
- text: 당근은 얇게 채 썰어주고, 사과는 껍질 채로 채 썰어 설탕물에 담가 둔다.
- text: 양파와 파프리카는 작은 큐브 모양으로 썬다.
- text: 저염간장, 레몬즙, 설탕, 양파, 파프리카를 넣어 오리엔탈 드레싱을 만든다.
- text: 포항초에 당근과 사과를 넣어 섞어준다.
- text: 샐러드에 오리엔탈 드레싱을 곁들여 제공한다.
