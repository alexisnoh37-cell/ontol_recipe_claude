steps:
- text: 닭고기를 깍둑썰기한다.
- text: 감자, 오이는 깍둑썰기 하고 목이버섯은 물에 불린다.
- text: 기름을 두른 팬에 1을 넣고 볶다가 닭 육수를 넣는다.
- text: 닭고기가 익으면 감자, 목이버섯을 넣고 끓인 뒤 건진다.
- text: 깨끗한 팬에 기름을 두르고 밥과 송송 썬 파를 넣고 볶는다.
- text: 5에 오이와 익힌 닭고기, 목이버섯, 소금을 넣어 볶는다.
