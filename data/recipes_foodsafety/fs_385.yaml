steps:
- text: 토마토홀과 토마토는 송송 다져주고, 마늘, 양파를 냄비에서 볶은 후 믹서에 갈아 토마토 스프를 만들어준다.
- text: 만들어진 스프를 볶아서 신맛을 날려준다.
- text: 먹물파스타면은 삶은 뒤 오일에 버무려주고 볶아준다.
- text: 양파, 애호박, 가지, 2가지색 파프리카를 먹기 좋게 잘라 팬에 볶아준다.
- text: 접시에 볶아진 채소와 파스타면을 서로 다시 볶아준다.
- text: 치즈를 곱게 다져주고 접시에 파스타면을 올린 뒤, 토마토스프와 치즈가루를 뿌려 완성 한다.
