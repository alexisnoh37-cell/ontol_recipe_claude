steps:
- text: 풋마늘을 깨끗이 씻어 5cm 길이로 썬다.
- text: 물에 풋마늘을 30분 정도 담가 매운맛을 뺀다.
- text: 오징어를 1cm x 5cm 크기로 썬다.
- text: 밀가루와 물을 섞어 약불에서 풀을 쑤어 차게 식힌다.
- text: 풀에 나머지 양념장 재료를 모두 넣어 섞는다.
- text: 풋마늘과 오징어에 양념장을 넣고 버무려 즉석에서 먹거나 살짝 익혀 먹는다.
