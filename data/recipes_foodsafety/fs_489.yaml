steps:
- text: 닭은 깨끗이 씻어 여러 번 토막을 낸다.
- text: 토막 낸 닭을 카레가루와 녹말가루에 버무려 놓는다.
- text: 양파와 당근, 파프리카, 오이는 크기를 작은 깍두기 모양으로 썰어 준비한다.
- text: 팬에 식용유를 두르고 다진마늘를 살짝 볶은 뒤 저염간장에 레몬즙과 설탕, 꿀, 볶은 마늘을 넣어 섞는다.
- text: 요거트에 썰어 놓은 양파와 당근, 파프리카, 오이, 케첩을 넣어 섞어준다.
- text: 튀김기름 온도가 170℃가 되면 버무려 놓은 닭(②)을 넣고 두 번 튀겨, 기름을 제거하고, ④번 소스에 살짝 버무려 접시에 담아, 준비한 요거트소스(⑤)를 올려 완성한다.
