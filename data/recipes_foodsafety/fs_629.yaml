steps:
- text: 등갈비는 찬물에 담궈 핏물을 빼고 끓는 물에 데친다.
- text: 새송이버섯은 길쭉하게 슬라이스로 썰어둔다.
- text: 당근, 양파, 대파는 큼직하게 썰어, 뜨거운 물에 담군다.
- text: 담궈 놓은 야채를 걸러 야채물을 만든다.
- text: 냄비에 야채물을 넣고 저염간장과 올리고당, 다진마늘, 후춧가루를 섞는다.
- text: 야채간장에 등갈비를 넣고 은근히 졸이다가, 썰어놓은 야채와 새송이버섯을 넣고 윤기나게 졸인다.
