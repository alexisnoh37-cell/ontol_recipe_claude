steps:
- text: 물, 식초, 설탕, 소금, 통후추를 살짝 끓인 후 식혀 준비한다.
- text: 양배추와 깻잎을 한장씩 켜켜이 쌓는다.
- text: 깻잎 크기에 맞추어 썬다.
- text: 청, 홍고추는 어슷썰어 씨를 털어낸다.
- text: 그릇에 양배추, 깻잎, 청·홍고추를 무거운 것으로 눌러놓아 뜨지 않게 한 다음 준비한 피클국물을 붓는다.
- text: 뚜껑을 닫아 밀봉하여 냉장고에 보관한다.
