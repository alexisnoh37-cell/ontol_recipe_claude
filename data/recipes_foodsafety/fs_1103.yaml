steps:
- text: 크랜베리는 작게 자르고 바나나는 구운 후 으깬다.
- text: 중력분, 옥수수, 아몬드가루, 베이킹파우더를 체 친 후 소금을 섞고 바나나와 달걀을 섞는다.
- text: 버터를 부드럽게 만들어 반죽에 넣고 섞는다.
- text: 반죽을 10g으로 분할하고 10cm정도의 막대 모양으로 만들고 일부는 크랜베리를 속에 넣어준다.
- text: 손잡이 부분을 제외한 부분을 흑임자, 잘게부순 땅콩에 굴린다.
- text: 170℃ 오븐에서 25분 간 굽는다.
