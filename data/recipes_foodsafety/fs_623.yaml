steps:
- text: 곤약은 5cm 길이로 썰어 가운데 칼집을 넣고 매작과 모양으로 만들어 뜨거운 물에 살짝 데친다.
- text: 양배추, 적양배추는 채 썰고 배, 양파, 파프리카는 굵은 채를 썬다.
- text: 두부는 얼려 수분을 뺀다
- text: 얼린 두부는 3cm 주사위 모양으로 썬다.
- text: 토마토는 슬라이스 한다.
- text: 저염 간장에 설탕과 식초를 섞어 소스를 만들고, 곤약과 두부를 볶다가 야채를 넣어 한 번 더 볶은 뒤 소스를 뿌린다.,
