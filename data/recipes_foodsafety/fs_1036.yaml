steps:
- text: 고등어는 머리를 자른 뒤 내장을 빼고 잘 씻어 물기를 제거한다.
- text: 1의 살만 포를 떠서 한입 크기로 자른 뒤 청주, 생강즙, 소금, 후춧가루를 뿌려 밑간 한다.
- text: 전분을 앞, 뒤로 묻혀 170℃ 튀김 기름에 2번 바삭하게 튀긴다.
- text: 땅콩은 껍질을 벗긴 뒤 비닐봉지에 담아 밀대로 찧어 굵게 다진다.
- text: 냄비에 간장, 고추장, 설탕, 물엿을 넣고 끓여 조림장을 만든다.
- text: 조림장이 반으로 졸아들면 튀긴 고등어와 땅콩을 넣고 살살 뒤집어가며 윤기나게 버무린다.
