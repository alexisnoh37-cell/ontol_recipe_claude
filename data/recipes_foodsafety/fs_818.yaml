steps:
- text: 상추를 깨끗하게 씻어 물기를 뺀 후 먹기 좋게 자른다.
- text: 영양부추는 3cm 길이로 썰고, 양파는 3cm 길이로 얇게 채썬다.
- text: 홍고추도 3cm 길이로 얄게 채썬다.
- text: 모든 채소들을 차가운 물에 담갔다가 물기를 빼서 준비해둔다.
- text: 간장에 물, 매실농축액, 고춧가루, 통깨, 식초를 넣어 겉절이 양념을 만든다.
- text: 상추에 양념을 넣고 젓가락으로 섞어준다.
