steps:
- text: 고구마는 껍질을 벗기고 삶아 으깬 뒤 체에 내린다.
- text: 두부, 크랜베리, 마스카포네치즈, 두유를 믹서에 넣고 갈아 두부크림을 만든다.
- text: 두부크림에 다진 호두, 아몬드를 섞는다.
- text: 실온의 말랑한 버터에 박력분과 아몬드가루를 넣고 보슬보슬하게 섞어 소보루 반죽을 만든다.
- text: 4번을 170℃ 오븐에서 15분 간 굽는다.
- text: 투명한 컵에 으깬 고구마와 두부크림을 켜켜이 쌓고 마지막에 소보루를 올린다.
