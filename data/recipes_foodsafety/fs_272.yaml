steps:
- text: 대파, 마늘, 쇠고기를 물(300g)과 함께 끓인 뒤 면포에 걸러 육수를 만든다.
- text: 콩나물, 김치를 물에 씻어 손질한다.
- text: 두부는 물기를 빼고, 붉은 고추는 다진 뒤 돼지고기와 섞어 반죽해 동그랗게 빚어 완자를 만든다.
- text: 김 오른 찜기에 완자를 넣어 찐다.
- text: 육수를 끓이고 끓어오르면 김치, 콩나물, 새우젓을 넣는다.
- text: 한소끔 더 끓이다가 완자를 넣고 조금 더 끓여 마무리한다.
