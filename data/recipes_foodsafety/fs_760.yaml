steps:
- text: 콩나물은 깨끗이 씻어 꼬리를 뗀다.
- text: 죽순은 빗살무늬를 살려 한입 크기로 얄팍하게 썬다.
- text: 양념장 재료를 모두 섞어 양념장을 만든다.
- text: 솥에 씻은 쌀을 넣고 콩나물과 죽순을 올리고 녹차 우린 물을 부어 밥을 짓는다.
- text: 밥이 다 되면 뜸을 들여준다.
- text: 밥을 푸고 양념장을 넣어 비벼 먹는다.
