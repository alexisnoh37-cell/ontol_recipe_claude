steps:
- text: 연어는 소금, 후춧가루, 레몬으로 마리네이드 한다.
- text: 양파, 마늘은 입자있게 다진다.
- text: 토마토는 씨를 제거하고 입자있게 썰고, 파프리카, 피망은 채 썬 뒤 볶는다.
- text: 화이트크림, 생크림을 골고루 섞어 크림소스를 만든다.
- text: 팬에 버터를 넣고 양파, 마늘을 볶다가 만들어 놓은 크림소스를 넣고 졸인다.
- text: 접시에 볶은 야채를 담고, 200℃ 오븐에서 10분 정도 구운 연어를 담은 뒤 크림소스를 올린다.
