steps:
- text: 멍게는 꼭지를 따고 껍질을 벗겨 한입 크기로 썬다.
- text: 부추는 2cm 길이로 썬다.
- text: 김도 부추와 같은 길이로 가늘게 채 썬다.
- text: 양념장 재료를 모두 섞어 양념장을 만든다.
- text: 손질한 멍게에 참기름을 넣어 가볍게 버무린다.
- text: 그릇에 밥을 담고 부추, 무순, 멍게, 김, 통깨를 올리고 양념장을 넣어 비벼 먹는다.
