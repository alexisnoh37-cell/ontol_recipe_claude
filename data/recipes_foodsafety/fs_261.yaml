steps:
- text: 양파와 셀러리, 당근, 사과, 버섯은 잘게 다지고, 가지, 양파는 한입 크기로 썰고, 토마토는 십자로 칼집을 내고 살짝 데쳐 껍질을 벗긴 뒤 씨를 제거해 다진다.
- text: 단호박과 브로콜리는 한입 크기로 썰어 데친다.
- text: 닭가슴살은 칼집을 내 닭밑간양념한 뒤 팬에 식용유(10g)를 둘러 80%정도 익힌다.
- text: 팬에 식용유를 두르고 다진 마늘을 먼저 볶다가 양파와 셀러리, 당근을 넣어 볶고, 양파가 투명하게 변하면 사과와 버섯을 넣어 볶는다.
- text: 토마토를 넣어 3분 정도 더 볶다가 닭육수와 월계수잎을 넣어 5분 정도 푹 끓인 뒤 한 김 식혀 오레가노와 바질을 넣고 믹서기에 곱게 갈아 타콤소스를 만든다.
- text: 단호박과 브로콜리, 양파, 가지를 센 불에서 빠르게 볶은 뒤 닭고기와 타콤소스를 넣어 조리다가 닭고기가 다 익으면 접시에 담고, 파슬리가루를 뿌려 마무리.
