steps:
- text: 닭고기살에 로즈마리를 뿌려 약 3시간 이상 숙성을 시킨다.
- text: 냄비에 물을 1/3쯤 넣고, 양파채를 썰어 넣어 끓으면, 숙성된 닭고기살을 넣고 약 20분 정도 삶아 건진다.
- text: 삶아 건진 닭고기살을 한 김 빼고, 길게 손으로 찢어 소금과 후춧가루에 살짝 무치고, 오이와 파프리카는 씨를 제거 하고 채를 썰고, 당근도 오이채의 길이에 맞게 채를 썰어 준비해 놓는다.
- text: 마늘을 다지고, 고춧가루와 설탕, 식초, 레몬즙을 넣어 소스를 만든다.
- text: 뜨거운 물에 라이스페이퍼를 살짝 넣어 바로 건진다.
- text: 건져 놓은 라이스페이퍼에 준비한 닭고기살과 파프리카, 오이, 당근 넣고 돌돌 말아, 녹말가루를 살짝 입혀, 팬에 굴리듯 익혀 완성하고, 준비해 놓은 소스와 함께 제공한다.
