steps:
- text: 비름나물을 적당한 길이로 잘라 다시마육수에 데친 뒤 찬물에 헹궈 물기를 뺀다.
- text: 양파는 2mm 두께로 채 썰고 생강과 마늘은 곱게 다진다.
- text: 된장을 곱게 다진 뒤 구멍이 큰 체에 걸러 식감을 살리고 고추장, 마요네즈, 고춧가루와 섞는다.
- text: 양념장에 다진 생강, 마늘을 섞는다.
- text: 비름나물에 양파, 양념장을 넣고 골고루 무친다.
- text: 참기름을 둘러 가볍게 섞은 뒤 깨를 뿌려 마무리한다.
