steps:
- text: 믹서에 사과와 사과주스를 넣고 곱게 간 뒤 플레인 요거트를 섞어 사과드레싱을 만든다.
- text: 연두부는 9cm 크기로 썬 뒤 중앙 부분을 파낸다.
- text: 방울토마토와 스트링치즈는 굵게 다진 뒤 사과드레싱에 버무린다.
- text: 버무려진 방울토마토와 스트링치즈로 연두부 속을 채운 뒤 사과드레싱을 올린다.
- text: 그릇에 발사믹 식초를 바른 뒤 속 채운 연두부를 올리고 어린잎채소를 곁들인다.
