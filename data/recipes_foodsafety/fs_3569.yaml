steps:
- text: 현미는 1시간, 백미는 30분 동안 불린다.
- text: 마늘의 절반은 편으로 썰고, 나머지는 통으로 준비한다.
- text: 냄비에 불린 쌀, 마늘을 넣고 물을 맞춰 센 불에서 끓어오르면 중약 불로 줄이고 15분 동안 끓인다.
- text: 약한 불로 줄이고 뜸을 들여 마늘밥을 만든다.
- text: 칼집을 낸 토마토를 뜨거운 물에 살짝 데쳐 껍질과 씨를 제거하고, 잘게 다진다.
- text: 접시에 마늘밥을 담고 손질한 토마토를 올린 후 올리브유, 후추, 파슬리가루를 뿌려 마무리한다.
