steps:
- text: 바게트는 1cm 두께로 잘라 한쪽 면에 다진 마늘과 올리브오일을 발라 팬에 굽고 식힌다.
- text: 방울토마토는 씨를 제거하고 다진 뒤 물기를 빼주고 바질은 얇게 슬라이스 한다.
- text: 생모짜렐라치즈를 잘게 찢고 방울토마토, 바질과 함께 소금, 올리브오일에 섞는다.
- text: 새송이버섯, 표고버섯, 마늘은 잘게 다진다.
- text: 팬에 올리브오일을 두르고 다진 마늘을 볶다가 표고버섯과 새송이버섯을 넣어 볶는다.
- text: 바게트에 각각 소를 얹는다.
