steps:
- text: 준비한 새우의 반은 껍질을 벗겨 내장을 제거하고 곱게 다진다.
- text: 나머지 새우는 내장을 제거하고 껍질을 벗겨, 2/3 정도 반으로 갈라 소금, 후추로 밑간을 해 놓는다.
- text: 다진 새우는 소고기와 섞어, 마늘을 넣고 양념이 충분히 스며들도록 준비해 놓는다.
- text: 브로컬리는 데쳐 식힌 후 다지고, 당근과 양파도 다져 소금에 살짝 절여 물기를 제거해 놓는다.
- text: 양념된 재료(③)에 준비해 놓은 채소 (④)를 넣고, 녹말가루와 달걀을 풀어 골고루 섞는다.
- text: 반으로 갈라 준비한 새우에 녹말가루를 살짝 뿌리고, 섞어놓은 재료(⑤)를 완자를 빚어 새우에 올려 주고, 찜기에서 약 10분 정도 쪄서 완성한다.
