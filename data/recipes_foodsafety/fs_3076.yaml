steps:
- text: 분쇄 우육과 돈육은 해동 후 핏물을 제거한다.
- text: 두부는 끓는 물에 데쳐낸 후 으깬다.
- text: 우육, 돈육, 다진양파, 다진대파, 으깬 두부(15g)에 간장과 설탕으로 간을 한 후 여러번 치댄다.
- text: 점성이 생긴 고기를 동그랗게 성형한 후 팬에 구워낸다.
- text: 쌈장에 으깬 두부(15g)와 해바라기 씨를 넣어 섞는다.
- text: 떡갈비와 양념장, 야채쌈을 함께 제공한다.
