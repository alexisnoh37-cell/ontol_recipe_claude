steps:
- text: 실곤약은 세척해 물기를 빼준 뒤 레몬즙을 살짝 뿌려준다.
- text: 당근, 양파, 홍고추, 청고추는 채 썰어 볶는다.
- text: 오이는 돌려깎기 해주고 팽이와 영양부추는 적당한 크기로 잘라 각각 살짝 볶아 건진다.
- text: 달걀은 황백지단으로 만들어 채 썰어준다.
- text: 소스를 팬에 만들어 준 뒤 곤약을 볶아준다.
- text: 볶은 곤약에 ②를 넣고 한 번 더 볶은 뒤 ③을 섞어 그릇에 담고, 지단채를 올리고 참기름, 통깨를 뿌려 마무리한다.
