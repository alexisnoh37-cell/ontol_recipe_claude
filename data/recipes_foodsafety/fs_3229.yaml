steps:
- text: 오이는 껍질을 제거한 뒤 큼직하게 썰고, 셀러리는 필러로 겉껍질을 벗겨 큼직하게 썬다.
- text: 손질한 오이와 셀러리에 양념을 넣어 믹서에 곱게 간다.
- text: 면포에 간 오이와 셀러리를 부은 뒤 즙만 짠다.
- text: 오이셀러리 즙을 밀폐 용기에 넣어 냉동실에서 3시간 이상 얼린다.
- text: 요거트에 얼린 오이소르베를 얹고 과일을 곁들인다.
