steps:
- text: 낙지는 내장을 손질하고 밀가루로 비벼 씻는다.
- text: 씻어낸 낙지는 끓는 소금물에 살짝 데쳐서 다리를 하나씩 떼어 낸다.
- text: 실파는 데치고 불린 미역과 다시마도 데쳐서 알맞게 자른다.
- text: 당근은 채썰어 준비해 둔다.
- text: 데친 낙지를 절반씩 실파와 미역, 다시마로 감는다.
- text: 저나트륨 고추장소스를 만들어 곁들인다.
