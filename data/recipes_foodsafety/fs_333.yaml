steps:
- text: 찹쌀은 불려주고 전복은 손질해 내장과 분리해 준 뒤 청주를 넣어서 전복 내장을 믹서에 갈아준다.
- text: 전복 몸에 칼집을 내준 후 참기름을 두른 팬에 구워준다.
- text: 당근과 미역은 송송 잘라준다.
- text: 전복내장을 먼저 참기름에 충분히 볶아준다.
- text: 내장을 볶아주다가 불린 찹쌀을 넣고 충분히 볶아준다.
- text: 죽이 완성될 때 당근, 미역을 넣고 죽을 끓여 주고 전복은 고명으로 올려준다.
