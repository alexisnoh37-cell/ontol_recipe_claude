steps:
- text: 시금치는 데친 뒤 믹서에 곱게 갈고 치자는 따뜻한 물에 불린다.
- text: 곱게 간 시금치에 데쳤던 물을 넣고 가열한 뒤 찹쌀가루 절반에 조금씩 부어 익반죽 한다.
- text: 남은 절반의 찹쌀가루에 가열한 치자물을 조금씩 부어 익반죽 한다.
- text: 30분 간 휴지시킨 뒤 팬에 기름을 두르고 적당한 크기로 빚은 화전을 지진다.
- text: 한쪽 면을 익힐 때 위에 꽃을 올린 뒤 뒤집어 살짝만 지진다.
- text: 꿀과 설탕, 물을 1:2:3 비율로 섞어 끓여 시럽을 만들어 화전 위에 끼얹고 타임으로 장식한다.
