steps:
- text: 소고기는 핏물을 제거한 뒤 양파, 마늘을 넣고 물(300g)을 부어 1시간 이상 끓인 뒤 면포에 걸러 육수를 만든다.
- text: 삶은 소고기는 건져내 결 반대 방향으로 썬다.
- text: 배추, 무, 느타리버섯, 표고버섯은 먹기 좋은 크기로 썬다.
- text: 전복은 깨끗이 손질한다.
- text: 육수를 끓인 뒤 끓어오르면 무를 넣어 반투명해지면 배추, 버섯, 전복을 넣는다.
- text: 전복이 익으면 소고기를 넣고 저염간장으로 간을 해 마무리한다.
