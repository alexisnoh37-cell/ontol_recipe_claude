steps:
- text: 곤약과 두부는 사방 1㎝ 크기로 깍둑 썰고, 가지와 애호박은 조금 더 작은 크기로 썰고, 꽈리고추는 얇게 송송 썬다.
- text: 곤약을 끓는 물에 식초를 한두 방울 떨어뜨린 후 삶아 냄새를 제거한 후 찬물에 식힌다.
- text: 올리브유(10g)를 두른 팬에 두부를 올려 살짝 굽는다.
- text: 팬에 조림장을 넣은 후 약한 불에서 저어가며 끓이다가 조림장이 고루 섞이면 곤약과 두부, 가지, 애호박을 모두 넣고 조린다.
- text: 조림장이 반 이상 졸아들면 꽈리고추를 넣고 조금 더 조려 마무리한다.
