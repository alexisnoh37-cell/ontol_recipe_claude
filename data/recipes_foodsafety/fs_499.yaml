steps:
- text: 두부는 김이 오르는 찜통에 소금을 넣고 약 5분 정도 쪄 놓는다.
- text: 황태는 강판에 갈아 보프리를 만들어 놓는다.
- text: 홍합은 끓는 육수에 데쳐 육수는 따로 걸러 놓고, 홍합은 살만 꺼내 따로 준비 한다.
- text: 냄비에 버터를 녹이고, 두부와 홍합을 으깨어 볶는다.
- text: 볶아지는 냄비에 만들어 놓은 육수와 생크림을 넣고, 골고루 섞어 가면서 볶는다.
- text: 두부가 육수에 볶아지면, 마지막에 황태보프라기를 넣고, 달걀과 참기름 통깨를 넣어 살짝 익혀 완성한다.
