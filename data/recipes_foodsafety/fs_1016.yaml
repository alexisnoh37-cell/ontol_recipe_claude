steps:
- text: 맛살을 잘게 다져 마요네즈와 소금을 넣고 버무린다.
- text: 오이는 다져서 소금을 뿌려 놓았다가 면보에 짜서 수분을 제거한 뒤 마요네즈에 버무린다.
- text: 밥에 소금을 넣어 버무린다.
- text: 네모난 플라스틱 통에 랩을 깐다.
- text: 4에 밥, 치즈, 밥, 오이나 맛살, 밥 순서로 얹어 꼭꼭 누른다.
- text: 랩을 통째로 꺼내 칼로 조심스럽게 썰어 검은깨로 장식한다.
