steps:
- text: 참외는 껍질과 속을 제거하고 먹기 좋은 크기로 썬다.
- text: 배와 마늘은 편 썰기, 양파와 대파는 채썰기, 홍고추와 생강은 다진다.
- text: 물에 식초, 설탕, 누룩소금을 넣어 국물을 만든다.
- text: 만들어 놓은 국물에 참외, 배, 양파를 넣어 잘 섞어 준다.
- text: 마지막으로 마늘, 홍고추, 생강을 넣어 섞어 준다.
- text: 동치미를 그릇에 담아 완성한다.
