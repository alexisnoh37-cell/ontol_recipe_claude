steps:
- text: 소스 재료를 이용해 맛 간장으로 만든 데리 야끼소스를 만들어준다.
- text: 참치는 손질해 수분을 빼준 후 흰 후추로 밑간을 해준다.
- text: 생강은 아주 곱게 채 썰어 냉수에 헹군다.
- text: 대파도 아주 가늘게 채 썰어서 냉수에 담가 매운맛을 빼준다.
- text: 버터를 올린 팬에 삼치를 약불에서 구워준다.
- text: 구워진 참치를 소스에 졸여주고 대파채를 올린다. 삼치에 소스를 뿌리고 생강채를 올려 완성한다.
