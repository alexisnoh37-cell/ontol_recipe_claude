steps:
- text: 양파와 청경채, 파프라카는 채 썰고, 쪽파는 송송 썬다.
- text: 라면은 삶아서 체에 밭쳐 물기를 제거한다.
- text: 팬에 식용유(5g)를 두르고 다진 마늘을 볶아 향을 낸 뒤 돼지고기를 볶는다.
- text: 채 썬 양파와 청경채, 파프리카를 함께 넣고 볶다가 고추기름, 설탕, 두반장, 라면스프로 간을 해 볶는다.
- text: 면을 함께 볶은 후 송송 썬 쪽파를 뿌려 마무리한다.
