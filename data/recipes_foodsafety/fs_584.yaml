steps:
- text: 소고기는 홍두깨살로 준비해서 0.3mm 두께로 썰고, 배는 껍질을 벗겨 채 썰어 설탕을 뿌린다.
- text: 끓는 물에 소금을 넣고 두릅을 데친 후 찬물에 헹구어 건진다.
- text: 소금과 설탕, 다진 마늘을 넣고 소고기 육회 양념장을 만든다.
- text: 삶은 달걀노른자와 크림치즈, 레몬을 섞어 짤주머니에 담는다.
- text: 숙성이 잘된 아보카도는 강판에 갈아 준비한다.
- text: 접시에 양념한 육회와 두릅을 담고 그 위에 배를 올리고, 달걀크림과 아보카도를 짜서 올린다
