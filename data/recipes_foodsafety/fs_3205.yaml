steps:
- text: (소스) 소스에 들어가는 재료는 전부 다진 후 기름 두른 팬에 양파를 먼저 볶다가 남은 재료를 넣고 볶아 준 뒤 물을 넣고 끓여 조린다.
- text: 반죽 재료를 넣고 27℃ 최종단계 까지 믹싱한 후 1차 발효는 고온발효로 27℃에서 1시간 발효한다.
- text: 150g씩 분할하여 모양을 성형한 후 면포 위에 팬닝한다. ★반죽이 많이 질어요. 손에 묻으면 덧밀가루를 뿌려가며 진행하세요.
- text: 2차 발효는 온도는 30℃, 수분은 75%에서 60분간 발효한 후 오븐팬에 팬닝한다.
- text: 반죽 위에 만들어 놓은 토마토 소스를 바르고 스팀 160℃/230℃에서 13분간 굽는다.
- text: 치즈를 올리고 4분간 구워낸다.
