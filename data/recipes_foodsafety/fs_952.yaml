steps:
- text: 오미자에 7배의 물에 8시간 담궈 맛과 색이 우러나도록 한다.
- text: 천도복숭아는 사방 0.5cm의 주사위모양으로 썰어 설탕을 뿌려 30분 정도 절인다.
- text: 배를 모양 틀로 찍어 0.3cm 두께로 썰어 설탕에 절인다.
- text: 오미자 국물을 면보에 거르고 시럽으로 단맛을 맞춘다.
- text: 4에 복숭아와 배를 넣는다.
- text: 5에 잣과 얼음을 띄운다.
