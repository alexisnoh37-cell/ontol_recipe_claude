steps:
- text: 피망, 파프리카는 5㎝ 길이로 채 썰고, 시금치는 갈아둔다.
- text: 베이컨 위에 동태포를 올리고 그 위에 피망과 파프리카를 올려 돌돌 만다.
- text: 저염버터에 생크림을 넣어서 농도를 맞춘 후 갈아놓은 시금치를 넣어 시금치소스를 만든다.
- text: 달군 팬에 흰살생선베이컨말이를 올려 완전히 익힌다.
- text: 접시에 담아 시금치소스를 곁들인 뒤 새싹채소로 장식하여 마무리한다.
