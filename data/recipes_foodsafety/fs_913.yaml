steps:
- text: 좁쌀을 씻어 불린다.
- text: 대추와 깐 밤을 냄비에 넣고 물 4컵을 넣고 대추가 무르도록 삶는다.
- text: 삶은 대추를 손으로 주물러 대추 속살이 나오도록 한 뒤 밤과 함께 체에 거른다.
- text: 좁쌀은 5배의 물을 부어 저어가면서 익힌다.
- text: 3을 4에 넣어 잘 섞은 뒤 찹쌀물을 넣어 농도가 나도록 끓인다.
- text: 소금으로 간을 맞추고 준비한 그릇에 담아낸다.
