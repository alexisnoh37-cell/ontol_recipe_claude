steps:
- text: 소고기는 소금과 후춧가루로 양념한다.
- text: 부추는 5cm 길이로 썰고 양배추는 채썬다.
- text: 오렌지는 껍질째 썬다.
- text: 썰어 놓은 오렌지와 레몬, 양파를 갈아 드레싱을 만든다.
- text: 견과류는 입자있게 다진다.
- text: 부추와 양배추를 준비한 드레싱에 버무려 접시에 담고, 양념된 소고기는 팬에 구워 먹기 좋게 썰어 담는다.
