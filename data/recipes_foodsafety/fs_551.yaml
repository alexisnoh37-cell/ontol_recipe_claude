steps:
- text: 돼지갈비는 물에 담그어 핏물을 충분히 제거한다.
- text: 홍고추는 어슷썰어 냄비에 볶는다.
- text: 핏물을 제거한 돼지갈비를 홍고추와 함께 넣어 볶아준다.
- text: 배는 강판에 갈고, 파, 마늘, 생강은 다진 뒤 간장과 올리고당, 설탕, 후춧가루, 소주와 함께 넣고 골고루 섞어서 양념장을 만든다.
- text: 사과, 대추, 밤, 오이, 양파, 당근, 무는 사각 깍둑 썰기로 준비한다.
- text: 볶아진 갈비(③)에 양념장(④)과 물을 넣고 은근히 갈비를 졸이다가, 국물이 자작하게 남으면, 손질한 과일과 채소 등(⑤)을 참기름과 함께 넣고, 한 번 더 졸여 완성한다.
