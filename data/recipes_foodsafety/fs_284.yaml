steps:
- text: 냄비에 육수 재료를 넣고 10분간 끓여 건진다.
- text: 마늘은 다지고, 양파는 채 썰고, 애호박은 반달모양으로 납작하게 썬다.
- text: 단배추는 5cm로 썰고, 대파는 어슷 썰고, 두부는 0.5cm 두께로 썬다.
- text: 된장에 표고버섯가루, 날콩가루, 육수(50g)를 넣어 섞는다.
- text: 육수에 된장을 풀고 다진 마늘, 호박, 양파, 단배추 순으로 넣어가며 끓인다.
- text: 끓으면 마른 새우, 대파를 넣어 살짝 더 끓여 마무리한다.
