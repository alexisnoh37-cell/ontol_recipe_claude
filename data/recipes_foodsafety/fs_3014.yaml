steps:
- text: 양상추와 그린치커리, 라디치오는 먹기 좋은 크기로 찢고, 고추는 잘게 다진다.
- text: 대파와 생강, 마늘은 곱게 다지고, 팬에 식용유를 두른 뒤 볶는다.
- text: 소스 재료를 넣어 약한 불에서 5분 정도 끓인다.
- text: 소스를 식힌 뒤 잘게 썬 고추를 섞는다.
- text: 닭다리살에 옥수수전분을 묻히고, 팬에 식용유를 두른 뒤 노릇하게 굽는다.
- text: 그릇에 손질한 채소를 깔고, 구운 닭다리살을 올린 뒤 소스와 무순을 올려 마무리한다.
