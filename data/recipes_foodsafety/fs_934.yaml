steps:
- text: 메론의 껍질을 벗기고 2cm 정도의 주사위모양으로 썬다.
- text: 사과는 껍질을 벗기고 메론과 같은 크기로 썬다.
- text: 바나나도 껍질을 벗기고 같은 크기로 썬다.
- text: 오렌지는 칼로 껍질을 도려내고 속살만 자른다.
- text: 플레인 요구르트와 레몬주스, 오렌지주스를 섞어 드레싱을 만든다.
- text: 볼에 과일을 한데 섞고 드래싱으로 버무려 완성한다.
