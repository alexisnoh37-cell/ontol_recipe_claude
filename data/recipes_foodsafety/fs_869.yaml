steps:
- text: 낙지와 쭈꾸미는 각각 소금물에 씻어 손질한다.
- text: 낙지는 5cm 길이로 자른다.
- text: 채소들은 각각 10cm 길이로 얇게 채 썬다.
- text: 소스를 만든다.
- text: 생면은 끓는 물에 데친다.
- text: 가열된 팬에 식용유를 넣고 채소를 볶다가 면과 소스를 넣고 충분히 볶는다.
