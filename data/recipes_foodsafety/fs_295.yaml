steps:
- text: 물(250g)에 멸치를 넣고 육수를 낸다.
- text: 바지락은 해감해 준비하고 주꾸미는 손질한다.
- text: 마른 미역과 마른 표고버섯은 물에 불린다.
- text: 육수에 된장을 풀고, 바지락과 주꾸미를 넣어 끓인다.
- text: 해물이 어느 정도 익으면 미역, 표고버섯을 넣고 끓인다.
- text: 끓어오르면 순두부를 넣고 콩가루를 넣어 더 끓이다가 송송 썬 대파를 올려 마무리한다.
