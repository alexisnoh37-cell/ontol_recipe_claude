steps:
- text: 소스를 만든다.
- text: 양상추와 치커리는 굵은 줄기 부분을 빼고 먹기 좋은 크기로 잘게 찢는다.
- text: 라면 끓는 물에서 4분간 삶고 체에 건져 찬물에 헹군다.
- text: 닭가슴살을 먹기 좋은 크기로 찢어 면과 함께 섞는다.
- text: 그릇에 채소와 면을 담고, 방울토마토도 먹기 좋게 잘라 담는다.
- text: 소스와 파슬리가루를 뿌려 마무리한다.
