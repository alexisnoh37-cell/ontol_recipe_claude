steps:
- text: 잡곡과 찹쌀은 물에 씻어 불린 뒤 소금을 넣고 밥을 짓는다.
- text: 호두는 껍질을 제거하고 굵게 부숴 마른 팬에 볶는다.
- text: 은행은 기름에 볶아 껍질을 제거하고 4등분 한다
- text: 생밤은 껍질을 벗기고 작은 주사위 모양으로 자른 뒤 기름에 굽는다.
- text: 물 40g에 간장, 대추고, 꿀을 넣고 끓인 뒤 2,3,4번을 넣고 잘 섞는다.
- text: 잡곡밥을 넓게 펼친 뒤 5번을 넣고 돌돌 만다.
