steps:
- text: 표고버섯은 불려서 기둥을 떼고 끓는 물에 삶은 다음 물기를 제거한다.
- text: 손질한 표고버섯은 간장, 다진마늘, 참기름으로 양념한다.
- text: 연근은 껍질을 벗기고 깍둑 썰기하여 식초 물에 담근다.
- text: 파프리카는 마름모 형태로 썰고 브로콜리는 한 입 크기의 송이로 자른다.
- text: 준비한 재료에 녹말가루를 충분히 묻혀서 170℃ 정도의 식용유에서 튀겨낸다.
- text: 레드와인, 간장, 식초, 설탕을 넣고 20분가량 끓여 졸인다음 녹말과 물을 섞은 물녹말로 농도를 맞추어 4에 끼얹어 낸다
