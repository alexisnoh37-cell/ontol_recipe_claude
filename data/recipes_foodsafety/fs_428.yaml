steps:
- text: 장어는 한입 크기로 잘라서 흰 후추와 청주를 뿌려 재워준다.
- text: 깻잎은 채를 썰어서 냉수에 담가 물기를 빼준다.
- text: 생강, 마늘은 편으로 썰어주고 양파, 청고추, 홍고추는 어슷하게 잘라준다.
- text: 참기름을 뺀 양념장 재료에 편마늘과 다진대파를 넣어서 양념장을 만들어준다.
- text: 만들어진 양념장 1/2에 장어를 넣고 졸여준다.
- text: 나머지 양념장에 준비된 채소를 넣어 볶아주다 졸인 장어를 넣어 졸여주고 깻잎을 깔고 완성한다.
