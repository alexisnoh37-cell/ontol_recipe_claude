steps:
- text: 유자는 십자로 갈집을 낸 뒤 끓는 소금물에 데쳐 껍질을 깨끗이 한다.
- text: 유자는 속을 꺼내 씨를 제거하고 유자속과 속껍질을 얇게 채 썬다.
- text: 밤, 대추, 배는 채 썰고 2번과 섞어 소를 만든다.
- text: 속을 빼낸 유자에 소를 2/3쯤 채워 입구를 실로 묶는다.
- text: 유자묶음을 용기에 채워 넣은 후 꿀물을 붓고 잘 밀봉하여 냉장고에 보관한다.
- text: 3~4주 정도 숙성한 뒤 석류를 곁들여 먹는다.
