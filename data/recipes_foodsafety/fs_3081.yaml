steps:
- text: 닭과 가지는 먹기 좋은 사이즈로 토막 낸다.
- text: 다진파, 다진 마늘, 맛술, 참기름, 올리고당에 닭을 재운다.
- text: 매실엑기스, 간장, 식초, 다진마늘, 미림, 물을 섞어 소스를 만든다.
- text: 가지와 닭은 오븐에 구워준다.
- text: 구워진 닭과 가지를 매실소스에 버무린다.
- text: 팬에 소스 묻은 닭과 가지를 볶아 낸다.
