steps:
- text: 갈비는 찬물에 담궈 핏물을 뺀다.
- text: 끓은 물에 갈비를 데친다.
- text: 찬물에 표고버섯, 파, 마늘, 양파 및 인삼을 넣고 데친 갈비를 넣고 약 2시간 정도 끓여 갈비탕을 만든다.
- text: 저염간장에 설탕을 섞어 고기소스를 만든다.
- text: 당면은 뜨거운 물에 불려 갈비탕을 먹기 직전에 넣는다.
- text: 달걀은 황백으로 나눠 지단을 부쳐 완성된 갈비탕 위에 대추와 함께 올려 완성한다.
