steps:
- text: 청경채는 반으로 자른 후 줄기 부분에 칼집을 넣는다.
- text: 청경채에 소금을 뿌려 30~40분 정도 절인다.
- text: 배는 껍질을 벗긴 후 강판에 갈아 즙을 만든다.
- text: 냄비에 물(30g)과 찹쌀가루를 넣고 끓여 찹쌀풀을 만들고, 충분히 식힌다.
- text: 볼에 식힌 찹쌀풀, 배즙, 양념장 재료를 넣고 고루 섞어 양념장을 만든다.
- text: 절인 청경채의 물기를 제거하고, 양념장을 버무려 마무리한다.
