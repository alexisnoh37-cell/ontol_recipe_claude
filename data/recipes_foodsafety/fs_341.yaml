steps:
- text: 사과와 적양배추는 먹기 좋은 크기로 잘라준다.
- text: 감자를 작은 깍두기 모양으로 자르고 영양부추는 송송 잘라주어 청국장 리조또를 만들어준다.
- text: 준비된 곁들이 채소를 올리브오일에 볶아준다.
- text: 준비된 통삼겹은 물에 한번 80% 이상 데쳐준 후 조림장 재료에 물 200g을 넣고 은근히 졸여서 익혀준다.
- text: 조림장에 졸여지는 통삼겹에 장이 한 큰술 남을 정도까지 졸여준다.
- text: 접시에 곁들이 채소와 청국장 리조또를 함께 올려 셋팅한다.
