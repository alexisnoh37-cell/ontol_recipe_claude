steps:
- text: 미역은 찬물에 충분히 불린다.
- text: 새우는 껍질을 벗겨 관자 한 개와 다져 완자를 만든다.
- text: 나머지 관자 한 개는 썰어 팬에 굽는다
- text: 버섯, 토마토, 블랙올리브는 곱게 다진다.
- text: 시금치와 미역은 끓는 물에 데쳐 잘게 썬다.
- text: 마늘을 다져 우유와 함께 끓이다가 썰어 놓은 미역과 시금치, 새우완자를 넣고 한소끔 끓인다.
