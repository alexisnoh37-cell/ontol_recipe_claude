steps:
- text: 육수를 끓인 양지는 건져 얇게 썬다.
- text: 버섯은 잘게 찢고, 애호박은 반달모양으로 납작 썰고, 고추와 대파는 어슷하게 썬다.
- text: 방울토마토에 열십자로 칼집을 넣고 끓는 물에 데쳐 껍질을 벗긴다.
- text: 냄비에 식용유(10g)를 두른 뒤 다진 마늘을 넣고 볶아 향을 낸 뒤 방울토마토를 넣고 볶는다.
- text: 육수(300g), 콩나물, 쇠고기, 느타리버섯, 애호박을 넣고 국간장과 소금으로 간해 끓인다.
- text: 어슷 썬 청양고추와 대파를 넣어 마무리한다.
