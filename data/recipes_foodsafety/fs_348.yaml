steps:
- text: 닭가슴살은 데친 후 가늘게 찢어준다.
- text: 달걀은 황백지단을 부쳐서 다이아몬드 모양 으로 잘라준다.
- text: 오이, 피망, 파프리카도 마름모로 잘라준다.
- text: 시금치는 살짝 데쳐서 수분을 짜서 한입 크기로 잘라준다.
- text: 소스 재료를 믹서에 갈아 소스를 만들어준다.
- text: 대추는 돌려깎기 해서 잘라주고 준비된 모든 재료를 섞어 샐러드를 만들고 대추채를 올려 완성한다.
