steps:
- text: 훈제연어를 살포시 포를 뜬다.
- text: 양파와 피클은 곱게 다져 준비한다.
- text: 포를 떠 놓은 훈제 연어에 살짝 후춧 가루를 뿌리고, 양파와 피클을 넣어 말아준다.
- text: 오렌지는 껍질과 과육을 분리해서 썰어 준비한다.
- text: 냄비에 오렌지주스와 설탕과 레몬, 분리시킨 오렌지를 넣고 끓여준다.
- text: 끓고 있는 오렌지소스에 물녹말과 스위 트칠리소스를 넣고 한 소큼만 끓인 후 말아 놓은 훈제 연어롤을 접시에 담고, 어린잎을 한쪽에 놓아주고, 오렌지 소스를 함께 올려 완성한다.
