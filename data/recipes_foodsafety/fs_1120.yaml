steps:
- text: 양배추, 당근, 양파는 채 썬다.
- text: 채 썬 양파(50g)를 볶다가 물(40g)을 넣은 뒤 믹서로 간다.
- text: 2번에 요거트, 마요네즈, 아몬드, 푸룬을 넣고 믹서로 간다.
- text: 채 썬 양배추, 당근에 3번을 넣고 버무린다.
- text: 어묵은 반을 자르고 밀가루, 달걀, 빵가루 순으로 묻혀 팬에 굽는다.
- text: 어묵 사이에 4번을 넣는다.
