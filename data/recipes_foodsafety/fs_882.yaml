steps:
- text: 두부는 4x1.5x1cm 크기로 썬 후 소금을 뿌려 물기를 제거한다.
- text: 소라살은 내장을 뺀 뒤 반으로 가르고 패주는 주위의 지저분한 막을 벗겨 깨끗이 손질한 뒤 2~3등분 한다.
- text: 바질 잎은 다진다.
- text: 볼에 다진 마늘을 담고 소금 간을 한 뒤 올리브유를 조금씩 넣으면서 한 방향으로 젓다가 다진 바질을 넣어 마늘 올리브유 소스를 만든다.
- text: 두부와 해산물을 차례로 꼬치에 끼워 붓으로 소스를 고루 바른다.
- text: 예열된 250℃ 오븐이나 그릴에서 노릇하게 구워낸다.
