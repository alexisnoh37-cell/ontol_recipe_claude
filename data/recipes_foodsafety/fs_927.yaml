steps:
- text: 양파와 셀러리는 다지고, 베이컨은 적당한 크기로 자른다.
- text: 팬에 베이컨을 넣고 볶다가 양파, 셀러리를 넣고 색이 나지 않게 볶는다.
- text: 야채가 볶아지면 완두콩을 넣고 충분히 볶아준다.
- text: 완두콩이 반 정도 익으면 육수를 넣고 푹 끓여준다.
- text: 완두콩이 다 익으면 믹서에 간 뒤 체에 걸러낸다.
- text: 5를 냄비에 옮기고 기호에 맞게 소금, 후춧가루, 생크림을 넣는다.
