steps:
- text: 우유에 등심을 넣어 30분간 재워 놓은 뒤, 후춧가루, 정종을 발라 1시간 이상 숙성시킨다.
- text: 방울토마토는 반으로 잘라 준비한다.
- text: 양상추는 먹기 좋은 크기로 찢어 놓는다.
- text: 피클은 입자 있게 다져 준비한다.
- text: 숙성시킨 등심(①)은 물기를 제거하고, 먹기 좋은 크기로 썰어 밀가루, 달걀물, 빵가루 순으로 입혀, 튀김 기름 170~180℃ 온도에 약 3분 정도 튀긴 후 기름을 빼 놓는다.
- text: 삶은 달걀은 다지고 피클(④)에 마요네즈를 넣어 섞어 샐러드 소스를 만들고, 접시에 양상추를 깔고 그 위에 어린잎채소, 돈가스(⑤)와 방울토마토 (②)를 올려 소스와 함께 완성한다.
