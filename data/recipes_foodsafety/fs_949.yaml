steps:
- text: 두부는 면보를 이용해 물기를 꼭 짠 후 곱게 으깬다.
- text: 밀가루와 베이킹파우더를 섞어 체에 내린다.
- text: 으깬 두부를 볼에 담고 설탕, 달걀, 검은깨를 넣고 거품기로 잘 저어준다.
- text: 3에 채 썬 깻잎을 넣은 뒤 2의 밀가루를 넣어 반죽한다.
- text: 도마에 밀가루를 살짝 뿌리고 4를 밀대로 2mm 두께로 민 뒤 너비 1cm, 길이 4cm의 직사각형으로 자른다.
- text: 자른 반죽을 오븐팬에 올려 180℃로 예열된 오븐에 10분간 굽는다.
