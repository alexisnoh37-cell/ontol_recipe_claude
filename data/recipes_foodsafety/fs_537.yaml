steps:
- text: 단호박은 1/8 등분으로 갈라 속을 파내고 찜통에서 약 15~20분 정도 충분히 쪄낸다.
- text: 소고기는 채를 썰어 마늘, 간장, 설탕에 양념을 하고 팬에 볶아서 식힌다.
- text: 파프리카와 오이, 적양배추는 채를 썰고, 무순은 물에 잠시 담그어 놓고, 사과는 채를 썰어 설탕물에 잠시 담그어 놓고, 팽이버섯은 밑둥만 잘라 한 줌 집기 좋은 크기로 준비해 놓는다.
- text: 다진마늘과 다진 양파 ,올리브오일, 설탕, 식초, 소금을 넣고, 골고루 섞어 소스를 만들어 놓는다.
- text: 쪄 낸 단호박은 껍질을 벗기고 채에 곱게 내려 밀가루와 물, 소금을 조금 섞어 단호박 반죽을 만들어 놓는다.
- text: 팬에 올리브 오일을 바르고, 만들어 놓은 단호박 반죽을 한 국자씩 떠 넣어, 밀전병을 만들고, 밀전병이 익으면, 한 김 식혀, 그 안에 소고기 볶음과 채소를 넣어 돌돌 말아 소스와 함께 완성한다.
