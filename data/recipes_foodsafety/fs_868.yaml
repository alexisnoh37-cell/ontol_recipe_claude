steps:
- text: 소고기는 굵게 채썬다.
- text: 채썬 소고기에 전분과 달걀을 넣고 밑간을 한다.
- text: 버섯과 채소는 씻은 후 0.3cm 두께로 채 썬다.
- text: 후라이팬에 소고기를 넣고 볶는다.
- text: 채소와 버섯을 넣고 한번 더 볶는다.
- text: 육수에 간장, 정종, 후춧가루를 넣고 끓이다가 마지막에 참기름을 넣어 낸다.
