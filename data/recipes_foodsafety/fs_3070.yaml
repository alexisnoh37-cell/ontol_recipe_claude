steps:
- text: 쇠고기 등심은 큐브 모양으로 썰어 소금, 후추 간을 하고 밀가루를 묻힌다.
- text: 감자, 토마토는 한 입 크기로 썰고, 마늘은 편썰기, 파프리카는 채썰기, 양파는 다진다.
- text: 팬에 버터와 올리브유를 넣고 양파, 마늘을 볶다가 쇠고기를 넣어 볶는다.
- text: 쇠고기가 익으면 감자, 토마토, 파프리카를 넣는다.
- text: 토마토 페이스트, 케찹을 넣어 볶다가 물과 월계수잎을 넣어 끓인다.
- text: 소금, 후추로 간을 하고 푹 익혀준다.
