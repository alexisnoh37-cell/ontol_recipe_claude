steps:
- text: 닭가슴살, 부침두부, 참나물, 청양고추를 잘게 다진다.
- text: 볼에 담아 소금으로 밑간하고 4등분하여 둥글게 다져 함박스테이크를 만든다.
- text: 달군 팬에 올리브유를 두르고 함박스테이크를 굽는다.
- text: 고추장, 고춧가루, 알룰로스, 후추, 다진 마늘, 물을 넣어 소스를 만든다.
- text: 달군 팬에 소스를 넣고 살짝 졸인다.
- text: 접시에 함박스테이크를 담고 소스를 올린 후 깨를 뿌려 마무리한다.
