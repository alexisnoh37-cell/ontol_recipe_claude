steps:
- text: 소스재료를 볼에 넣고 잘 섞는다.
- text: 소스를 돼지갈비에 골고루 바른 뒤 6시간 이상 재운다.
- text: 재운 돼지갈비를 호일로 감싼다.
- text: 3을 170℃의 오븐에서 30분간 굽는다.
- text: 구운 돼지갈비의 호일을 벗긴다.
