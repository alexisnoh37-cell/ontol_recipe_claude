steps:
- text: 오이를 끓는 소금물에 넣고 돌맹이로 누른다.
- text: 오이 색이 노랗게 변하면 썰어서 물기를 완전히 제거한다.
- text: 파, 마늘을 다진다.
- text: 양파, 고춧가루, 매실액을 믹서에 넣고 간다.
- text: 4번에 참깨, 다진 파, 마늘, 참기름을 섞어 양념을 만든다.
- text: 오이에 양념을 넣고 잘 버무린다.
