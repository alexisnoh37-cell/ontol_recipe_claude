steps:
- text: 오븐을 175℃로 예열한다.
- text: 닭고기 밑간 양념으로 30분정도 재운다.
- text: 재워 놓은 닭고기를 175℃의 오븐에서 15분 굽는다.
- text: 조림장을 모두 넣고 끓인다.
