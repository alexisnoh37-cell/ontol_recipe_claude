steps:
- text: 닭가슴살을 170℃의 오븐에서 20분간 구운 후 잘게 찢는다.
- text: 양상추는 한 잎 크기로 뜯어 차가운 물에 담갔다가 물기를 뺀다.
- text: 방울토마토는 꼭지를 뗀 후 반으로 가른다.
- text: 브로콜리는 송이송이 떼어 끓는 물에 데친다.
- text: 저나트륨 과일드레싱 재료를 믹서에 넣고 곱게 간다.
- text: 준비된 재료를 한데 섞고 저나트륨 과일드레싱을 곁들인다.
