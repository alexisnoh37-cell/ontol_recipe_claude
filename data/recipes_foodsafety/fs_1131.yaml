steps:
- text: 우유에 요거트를 넣어 발효시킨다.
- text: 메주콩을 3시간 정도 불린 뒤 불린 콩의 3배의 물을 넣고 삶아 믹서에 간다.
- text: 쌀가루와 2번을 섞은 뒤 냄비에 끓여 쌀콩죽을 만든다.
- text: 배는 껍질을 제거하고 밥솥에 푹 삶아 믹서에 간다.
- text: 고구마는 삶아 껍질을 제거한다.
- text: 제조한 요거트(1번)에 쌀콩죽, 배즙, 고구마를 넣고 믹서에 곱게 간다.
