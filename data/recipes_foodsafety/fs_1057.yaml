steps:
- text: 프라이팬에 밥을 얇게 펴 약한 불에서 뚜껑을 덮어 굽는다.
- text: 노릇하게 누룽지가 되면 식혀서 굵게 부순다.
- text: 오렌지는 깨끗이 씻어 껍질을 벗긴 뒤 먹기 좋은 크기로 자른다.
- text: 사과를 깨끗이 씻어 물기를 제거하고 굵게 자른다.
- text: 컵에 요거트-오렌지-요거트-누룽지-요거트-사과-요거트-누룽지 순으로 담는다.
- text: 마지막에 누룽지와 블루베리로 장식한다.
