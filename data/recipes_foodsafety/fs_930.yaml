steps:
- text: 새우는 껍질과 내장을 제거하고 바지락은 살짝 데쳐 입이 열리면 살을 발라낸다.
- text: 해산물은 0.5cm 크기로 썰고 실파는 송송 썬다.
- text: 토마토는 껍질을 벗겨 햄과 비슷한 크기로 썰고 바질은 굵게 채썬다.
- text: 팬에 올리브오일은 두르고 햄, 옥수수를 넣어 볶다가 풀어둔 달걀을 넣고 스크램블을 만든다.
- text: 4가 반 정도 익었을 때 해산물, 토마토, 바질을 넣고 홍고추로 장식하고 다 익으면 오븐용 용기에 담는다.
- text: 5에 치즈를 0.5cm 넓이로 잘라 격자로 올리고 오븐에서 굽는다.
