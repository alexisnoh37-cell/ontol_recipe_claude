steps:
- text: 냄비에 육수 재료를 넣어 끓인다.
- text: 콩을 충분히 불려 믹서기에 물을 넣고 갈아 준비한다.
- text: 느타리버섯은 찢고, 표고버섯은 먹기 좋은 크기로 자르고, 애호박과 양파는 깍둑 썰고, 대파와 고추는 송송 썬다.
- text: 바지락은 해감해 준비한다.
- text: 육수에 콩, 느타리버섯, 표고버섯, 애호박, 저염된장, 새우, 바지락을 넣고 끊인다.
- text: 순두부를 넣고 끊인 후 양파, 대파, 붉은 고추, 풋고추를 넣고 한소끔 끓여 마무리한다.
