steps:
- text: 마늘과 양파를 입자있게 다져 팬에 볶아 식혀 준비하고 파프리카는 다져 놓는다.
- text: 다진 소고기에 준비한 채소(①)와 빵가루, 후춧가루, 소금 넣고 골고루 치 대어 소고기 볼을 만든 후 후라이팬에 버터와 식용유를 두르고 소고기볼을 속까지 익혀 준비한다.
- text: 바나나는 작게 깍뚝 모양으로 썰고, 게맛살은 약 3cm 길이로 찢어 준비 한다.
- text: 고구마는 껍질을 벗겨 삶아 채에 내려 마요네즈와 매실액을 넣어 섞은 뒤 바나나, 게맛살(③)을 골고루 섞어 소스를 만든다.
- text: 브로컬리는 작게 썰어 미니버섯과 함께 팬에 살짝 구워 준비한다.
- text: 익혀 놓은 소고기볼(②)을 접시에 담고 그 위에 소스(④)를 얹은 뒤 브로컬리와 미니버섯(⑤), 어린잎을 올려 완성한다.
