steps:
- text: 닭가슴살에 소금, 후추로 간을 한다.
- text: 팬에 기름을 두르고 닭가슴살을 굽는다.
- text: 구워 낸 닭가슴살을 다져서 볼에 담는다.
- text: 올리브오일, 카레가루, 레몬주스, 건포도, 아몬드, 마요네즈를 3에 넣고 섞는다.
- text: 식빵을 팬에 바삭하게 굽는다.
- text: 식빵에 치킨 샐러드를 얹은 뒤 남은 식빵으로 덮고, 사방을 잘라낸다.
