steps:
- text: 갈치는 비늘을 벗기고 손질한 후 토막내어 3~4회 칼집을 넣는다.
- text: 파는 다진다.
- text: 고추장, 양파, 파, 다진 마늘, 간장, 매실액, 고춧가루, 다진 생강, 후춧가루를 섞어 양념장을 만든다.
- text: 팬에 현미유를 두르고 갈치를 앞뒤로 애벌구이 한다.
- text: 애벌구이된 갈치 위에 고추장양념을 발라 구운다.
- text: 통깨를 뿌려 마무리한다.
