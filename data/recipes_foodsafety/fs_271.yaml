steps:
- text: 육수 재료를 넣고 중간 불로 끓인 뒤 체에 걸러 육수를 만든다.
- text: 닭가슴살은 채 썬 뒤 물에 넣고 삶는다.
- text: 애호박은 반달 썰고, 미나리는 5㎝ 길이로 썰고, 청양고추는 잘게 썬 뒤 찬물에 담가 씨를 빼고, 두부는 한입 크기로 썰어 물에 담가둔다.
- text: 김치를 한입 크기로 썬 뒤 참기름에 볶다가 육수를 붓는다.
- text: 두부, 애호박, 느타리버섯, 미나리, 닭가슴살을 넣어 끓어오르면 달걀물과 청양고추를 넣고 조금 더 끓여 마무리한다.
