steps:
- text: 돼지고기 안심을 요리망치로 얇게 두드려 펴고 후춧가루로 밑간한다.
- text: 목이버섯은 불려 잘게 썰고 양파와 마늘은 입자있게 다진다
- text: 당면은 따뜻한 물에 충분히 불려 썰고 애호박, 당근, 표고버섯은 잘게 썬다.
- text: 팬에 기름을 두르고 다진 양파와 마늘을 볶는다.
- text: 4번에 매실액과 잘게 자른 애호박, 당근, 표고버섯, 목이버섯, 당면을 넣고 볶아 만두소를 만든다.
- text: 돼지고기는 넓게 펴서 만두소를 넣고 주머니를 만들어 실로 묶고 토마토와 함께 오븐에 굽는다.
