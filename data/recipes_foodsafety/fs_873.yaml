steps:
- text: 손질된 고등어는 5cm 길이로 토막낸 뒤 껍질에 칼집을 넣는다.
- text: 칼집 낸 고등어에 밀가루를 묻힌다.
- text: 오븐을 200℃로 예열한다.
- text: 간장, 올리브오일, 발사믹식초, 꿀을 섞어 소스를 완성한다.
- text: 고등어를 팬에 넣어 오븐에 굽는다.
- text: 저나트륨발사믹소스와 구운 고등어를 함께 제공한다.
