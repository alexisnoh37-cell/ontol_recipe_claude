steps:
- text: 고구마, 당근, 양파, 파프리카는 깍둑 썰고, 양송이버섯은 4등분해 썰고, 브로콜리는 먹기 좋게 썬다.
- text: 가자미에 밀가루, 달걀물을 묻혀 버터를 두른 팬에 바삭하게 굽는다.
- text: 식용유를 두른 팬을 약한 불로 달궈 다진 마늘을 볶다가 토마토페이스트를 넣어 볶는다.
- text: 당근, 양파, 고구마를 넣어 볶다가 브로콜리와 치킨스톡, 카레가루, 강황가루을 넣어 잘 섞어 끓인다.
- text: 코코넛 밀크와 생크림, 파프리카, 양송이버섯을 넣어 살짝 더 끓인다.
- text: 구운 가자미와 청양고추를 넣고 조려 마무리한다.
