steps:
- text: 소고기는 깍뚝썰어 준비한다.
- text: 깍뚝썰은 소고기에 소금, 후추, 올리브 오일을 넣어 숙성시킨다.
- text: 브로컬리는 살짝 데쳐 썰고 ,양파, 당근, 토마토, 파프리카도 같은 크기로 썰어 준비한다.
- text: 포도주스에 올리고당과 칠리소스 넣어 은근히 졸여 소스를 만들어 놓는다.
- text: 팬에 식용유를 두르고 채소를 먼저 볶는다.
- text: 채소를 볶은 팬에 다시 숙성된 소고기를 익히고, 볶아놓은 채소를 넣고 소스를 넣어 살짝 더 졸여 완성한다.
