steps:
- text: 양파 40g, 마늘 20g, 대추 2알, 배, 생강, 간장, 물 70g을 넣고 졸여 소스를 만든다.
- text: 소고기, 돼지고기는 다진 뒤 소금, 후추, 참기름, 깨, 간장 15g을 넣어 밑간한다.
- text: 양파, 마늘, 대추를 다진 뒤 밀가루, 식용유와 함께 2번에 넣고 치댄다.
- text: 3번의 반죽을 동그란 모양으로 빚는다.
- text: 팬에 기름을 두르고 미트볼을 굽는다.
- text: 팬에 소스를 부어가며 졸인 뒤 쪽파, 현미튀밥을 올린다.
