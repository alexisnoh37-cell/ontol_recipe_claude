steps:
- text: 쌀은 물에 불려 밥을 짓고, 가지는 길게 썰어 팬에 구워 놓는다.
- text: 양파와 마늘은 잘게 다져 준비한다.
- text: 토마토는 입자있게 다져 놓는다.
- text: 새우는 정종을 넣어 데쳐 껍질을 벗겨 준비한다.
- text: 팬에 올리브 오일을 넣고 양파와 마늘을 먼저 볶는다.
- text: 볶아지는 양파와 마늘에 토마토소스와 케첩을 넣어 볶다가 토마토와 설탕을 넣어 볶다가 졸이고, 밥을 그릇에 담고, 구운 가지와 새우를 올린 후 졸여 놓은 토마토소스를 위에 올린 후 어린잎을 살짝 올려 완성한다.
