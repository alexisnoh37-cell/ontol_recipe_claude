steps:
- text: 현미쌀은 깨끗이 씻어 약 30분 이상 충분히 불린다.
- text: 단호박은 껍질을 벗겨 먹기 좋게 썰어 불린 현미 쌀과 함께 밥을 짓는다.
- text: 양송이와 양파는 다져, 냄비에 볶다가 우유와 설탕, 호박가루를 넣는다.
- text: 끓고 있는 냄비에 단호박 현미밥(②)을 넣고 끓인다.
- text: 밥이 어느 정도 어우러지면, 생크림과 요거트를 섞어 한 번 더 젓는다.
- text: 만들어진 리조또(⑤) 위에 캐슈넛과 아몬드, 어린잎 채소를 올려 함께 완성한다.
