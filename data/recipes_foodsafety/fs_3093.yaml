steps:
- text: 통도라지는 세척 후 껍질을 제거한다.
- text: 통도라지를 소금물에 담궈 쓴맛을 우려낸 후 물기를 없앤다.
- text: 통도라지를 반으로 갈라서 방망이로 두들겨 얇고 넓적하게 만든다.
- text: 갈은 배, 다진 마늘, 고추장, 간장, 참기름을 이용하여 양념장을 만든다.
- text: 팬에 도라지를 구워 익히다가, 양념장을 발라 약한불에서 다시 굽는다.
- text: 골파와 통깨를 뿌려 완성한다.
