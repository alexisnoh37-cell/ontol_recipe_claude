steps:
- text: 쌀뜨물과 국멸치로 육수를 우리고 멸치를 건져낸다.
- text: 무는 나박썰기, 대파는 어슷썰기, 마늘은 다진다.
- text: 묵은지는 물에 헹구어 짠맛을 빼주고 기름에 살짝 볶는다.
- text: 멸치육수에 묵은지, 낙지, 고춧가루, 무, 마늘을 넣고 끓인다.
- text: 콩나물을 넣고 국간장으로 간을 하여 끓인다.
- text: 대파를 얹어 마무리한다.
