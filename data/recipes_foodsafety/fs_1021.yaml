steps:
- text: 소고기등심에 소금, 후추로 간하고 팬에서 기호에 따라 굽는다. (스테이크 굽기 정도는 기호에 따라 조절한다.)
- text: 양파는 얇게 링으로 썰고 로메인은 적당한 크기로 찢고 래디쉬도 얇게 썰어 찬 물에 담궈둔다.
- text: 발사믹 식초에 올리브오일, 소금, 후추를 넣고 소스를 만든다. (기호에 따라 양파 다진 것 등을 첨가할 수 있다.)
- text: 2를 건져내 물기를 제거하고 소금, 후추로 간을 한다.
- text: 스테이크를 슬라이스 하여 접시에 앞 쪽에 담는다.
- text: 준비된 야채에 드래싱을 넣고 섞은 뒤 스테이크 옆에 담는다.
