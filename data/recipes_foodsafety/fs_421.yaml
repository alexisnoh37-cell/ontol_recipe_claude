steps:
- text: 두부는 물기를 꼭 짠 뒤 으깨어 전분, 계란과 섞어준다.
- text: 우엉, 인삼, 감자는 아주 곱게 채 썰어서 냉수에 담가준다.
- text: 볶아진 모든 채소를 각각 볶아서 한데 섞어 준다.
- text: 땅콩잼으로 소스를 만들어준다.
- text: 김발을 깔고 비닐을 놓아 준 후 두부를 펴준다.
- text: 볶아진 채소를 두부에 넣어주고 찜기에 쪄서 식힌 뒤 한입 크기로 잘라준다.
