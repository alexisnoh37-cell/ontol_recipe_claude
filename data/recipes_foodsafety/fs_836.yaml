steps:
- text: 두부를 정육면체로 썬 후 소금을 뿌려 물기를 제거한 뒤 녹말가루를 묻힌다.
- text: 두부를 175℃ 식용유에 바삭하게 두 번 튀긴다.
- text: 피망과 파프리카는 0.5cm의 사각모양으로 썬다.
- text: 불에 간장, 물엿, 고추장, 물을 분량대로 섞어둔다.
- text: 식용유를 넣은 팬에 피망과 파프리카를 볶다가 섞어둔 조림장을 넣고 끓인다.
- text: 5의 조림장이 걸쭉해지면 튀긴 두부를 넣고 조심스레 섞은 후 참기름과 통깨로 마무리 한다.
