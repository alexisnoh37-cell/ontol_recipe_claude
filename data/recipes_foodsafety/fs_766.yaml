steps:
- text: 밀가루에 물을 넣고 수제비 반죽을 만든다.
- text: 반죽을 끓는 물에 떼어 넣어 익혀 체에 받쳐둔다.
- text: 양파는 굵게 채 썰고 마늘은 편으로 청양고추는 어슷 썰고 실파는 송송 썬다.
- text: 분량의 재료를 섞어 양념장을 만든다.
- text: 팬에 기름을 두르고 마늘을 볶다 바지락과 맛술을 넣어 볶는다.
- text: 양파, 청양고추를 넣어 볶은 뒤 양념장, 수제비, 참기름을 넣어 살짝 볶는다.
