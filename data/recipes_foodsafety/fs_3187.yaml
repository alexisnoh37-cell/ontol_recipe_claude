steps:
- text: 버터를 제외한 모든 재료를 넣어 반죽하다가 버터를 넣어 최종까지 믹스한다. 믹스된 반죽에 속재료를 넣어 골고루 섞는다.
- text: 1차 발효 30분 후 punch 후 35분 발효 시킨다. ★punch는 가스를 빼는 과정을 얘기해요.
- text: 200g 분할 후 중간발효 20분을 한다.
- text: 중간 발효된 반죽은 둥글게 성형한다.
- text: 스프레이를 뿌린 후 덧가루를 묻혀 50분 동안 2차 발효 한다.
- text: X모양 칼집을 주고 195℃ 12분 스팀 5초로 설정하여 굽는다. ★칼집은 날이 얇은 면도칼 등을 이용하면 좋아요.
