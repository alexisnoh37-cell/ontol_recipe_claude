steps:
- text: 밀가루와 베이킹파우더를 섞어 체에 내린다.
- text: 녹인 버터에 달걀, 소금, 설탕을 넣고 1을 넣어 골고루 섞는다.
- text: 당근, 양파는 0.5cm 주사위모양으로 썰어 데친다.
- text: 옥수수, 완두콩을 물에 헹군다.
- text: 2에 당근, 양파, 옥수수, 완두콩, 우유를 넣고 섞는다.
- text: 모양 틀에 넣어 김이 오른 찜통에서 10분간 찐다.
