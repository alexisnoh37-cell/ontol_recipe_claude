- text: 뜨거워진 돌 위에 3을 올린다.
- text: 뚜껑을 닫고 약한 불에서 속이 익을 때 까지 굽는다.
- text: 소금, 된장소스, 참깨소스 등 취향에 맞는 소스를 골라 찍어 먹는다.
