steps:
- text: 당근, 적채, 깻잎, 양배추는 씻어 4~5cm 가량으로 채 썬다.
- text: 수박의 과육과 흰부분의 껍질은 4~5cm 가량으로 채 썬다.
- text: 소면은 끓는 물에 넣고 끓어오르면 소량의 찬물을 붓고 다시 한 번 끓이고 속까지 익으면 재빨리 찬물에 헹구어 채반에 건진다.
- text: 달걀은 황백지단을 부쳐 채 썬다.
- text: 수박과 양파를 강판에 갈고 고추장, 고춧가루, 참기름, 다진 파, 다진 마늘, 식초, 매실액, 통깨를 넣어 수박고추장양념소스를 만든다.
- text: 소면에 수박고추장양념소스를 넣어 비비고 지단을 올린다.
