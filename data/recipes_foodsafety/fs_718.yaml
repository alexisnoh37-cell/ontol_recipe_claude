steps:
- text: 돼지고기를 0.5cm 두께로 썰어 칼집을 넣어 소금, 후추로 밑간한다.
- text: 사과와 양파는 얇게 채 썬다.
- text: 토마토는 4등분하여 물을 넣고 믹서에 간다.
- text: 팬에 버터와 올리브유를 두르고 사과와 양파를 볶다가 토마토를 넣고 약불에서 사과가 무를 때 까지 천천히 익힌 뒤 레몬즙을 넣는다.
- text: 팬에 올리브유를 두르고 고기를 앞뒤로 노릇하게 굽는다.
- text: 고기를 한입 크기로 잘라 사과소스를 얹어 낸다.
