steps:
- text: 느타리버섯은 밑동을 자르고 가닥가닥 찢어 데쳐서 찬물에 헹궈 물기를 제거한다.
- text: 파프리카와 청피망은 채 썰고, 크래미는 잘게 찢는다.
- text: 팬에 기름을 두르고 손질한 파프리카와 피망을 넣어 볶는다.
- text: 느타리버섯을 넣어 볶는다.
- text: 게살을 넣어 볶다가 간장으로 색을 낸다.
- text: 소금과 후추로 마무리한다.
