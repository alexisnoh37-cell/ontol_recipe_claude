steps:
- text: 쌀가루, 찹쌀가루에 크랜베리, 건포도, 견과류를 섞어 믹서에 간다.
- text: 가루에 물기가 스미도록 물을 넣고 골고루 섞는다.
- text: 2번을 체에 내린다.
- text: 체에 걸러진 큰 가루는 따로 담아 떡위에 올릴 소로 사용한다.
- text: 원형틀에 3번의 가루를 담고 위에 4번의 소를 올린다.
- text: 김이 오른 찜기에서 25분 간 찐다.
