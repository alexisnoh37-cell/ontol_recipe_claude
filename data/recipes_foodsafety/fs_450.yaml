steps:
- text: 스파게티는 끓는 물에 소금을 넣고 약 10분 정도 삶아 건져 올리브 오일에 살짝 발라 준비한다.
- text: 양송이는 껍질을 벗겨 편으로 썰어 놓는다.
- text: 마늘과 양파는 굵게 다져놓는다.
- text: 조개는 끓는 물에 데쳐 해감을 씻고, 삶은 물을 소창에 걸러 육수를 만들어 놓는다.
- text: 냄비에 버터를 넣고, 다진 마늘과 양파를 넣어 볶다가 밀가루를 넣고 은근히 볶는다.
- text: 볶고 있는 채소(⑤)에 육수(④)를 부어 한소끔 끓인 뒤, 우유와 생크림을 넣고 다시 끓으면 새우와 삶은 조개를 넣고 살짝 끓인 후, 삶아놓은 스파게티면 (①)을 넣고 한 번 더 끓이고 그 위에 파슬리 가루를 살짝 뿌려 완성한다.
