steps:
- text: 쌀을 깨끗하게 씻은 후에 쌀뜨물은 따로 보관하고 불려준 쌀로 밥을 해주고 접시에 펼쳐 식혀준다.
- text: 우엉과 연근, 감자는 송송 다져준 후 아린 맛을 빼기위해 물에 담가준다.
- text: 우엉과 연근, 감자는 물기를 빼고 볶아준다.
- text: 청고추, 양파, 당근은 송송 다져서 함께 볶아준 뒤, 함초 소금을 이용해 1차 간을 해준다.
- text: 그 릇 에 모 든 재 료 를 넣 고 오 니 기 리 를 만들어준다.
- text: 그릇에 담아 완성한다.
