steps:
- text: 칵테일새우는 잘게 다진다.
- text: 다진 쇠고기에 후춧가루와 참기름(3g)으로 밑간한 후 볶는다.
- text: 찹쌀현미밥에 참기름(4g)을 넣어 밑간하고 식힌 후 새우와 쇠고기를 넣어 뭉쳐준다.
- text: 마늘과 고추는 볶다가 식초와 함초가루, 설탕, 물(30g)을 넣고 졸여 소스를 만든다.
- text: 밀가루는 반죽한 뒤 얇게 밀어 삼각형으로 잘라 튀긴 후 기름을 뺀다.
- text: 위에 주먹밥을 올리고 파인애플을 올린 후 소스를 곁들여 마무리한다.
