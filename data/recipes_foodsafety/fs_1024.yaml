steps:
- text: 또띠아는 6등분 한다.
- text: 양파, 할라피뇨, 마늘을 잘게 다진다.
- text: 아보카도는 껍질을 제거하고 토마토는 씨를 제거하여 각각 1cm 주사위모양으로 자른다.
- text: 170℃로 예열한 오븐에 또띠아를 넣어 바삭하게 굽는다.
- text: 볼에 2를 넣고 잘 섞어 페이스트를 만들다가 아보카도를 함께 넣고 으깬 후 토마토를 넣고 라임주스, 소금으로 맛을 낸다.
- text: 구워 낸 또띠아 칩을 찍어 먹을 수 있도록 아보카도딥을 작은 그릇에 담아낸다.
