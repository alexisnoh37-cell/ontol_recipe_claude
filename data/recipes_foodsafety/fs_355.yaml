steps:
- text: 함초는 세척 후 송송 잘라준다. 이때 물이 안 나오게 잘라주는 것이 중요하다.
- text: 찹쌀은 미리 30분전에 불려준다.
- text: 불린 찹쌀의 물기를 빼고 물 50g을 넣고 죽을 끓이다가 함초를 넣고 더 끓인다.
- text: 여기에 우유를 넣고 약불에서 은근히 끓여준다.
- text: 죽이 어느정도 완성되면 치즈가루를 뿌려준다.
- text: 죽이 완성되면 그릇에 담아 완성한다.
