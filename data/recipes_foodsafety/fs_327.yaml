steps:
- text: 모시조개는 볶은소금을 넣어서 해감시킨다.
- text: 준비된 다시마물에 준비된 채소의 국물재료를 넣고 국물을 만들어준다.
- text: 만들어진 국물에 모시조개를 넣고 청주를 부어서 국물을 만들어준다.
- text: 쪽파는 송송 다지고 마늘은 곱게 다져주고 청홍고추는 가늘게 채 썰어준다.
- text: 면을 각각 삶아준다.
- text: 삼색 면을 그릇에 담고 만들어진 국물을 부워서 완성한다.
