steps:
- text: 물(3컵)에 육수 재료와 칵테일새우를 넣어 새우가 익을 때까지 데친 뒤 건진다.
- text: 사과와 양파는 잘게 다지고, 당근은 길게 썬다.
- text: 다진 사과와 양파, 채 썬 당근, 후춧가루, 레몬즙, 식초, 올리브유를 넣어 고루 섞는다.
- text: 바게트 위에 버무린 재료를 올린다.
- text: 데친 새우를 올리고, 다진 파슬리와 후춧가루를 뿌린 뒤 블루베리를 올린다.
- text: 애플민트를 올려 마무리한다.
