steps:
- text: 물 2컵에 건다시마를 넣어 다시마국물을 1컵 반 정도를 낸다.
- text: 우린 다시마와 전복살은 잘게 다진다.
- text: 표고버섯, 양송이버섯, 당근은 0.5~0.7cm 주사위모양으로 썬다.
- text: 쌀은 씻어 2와 3을 넣고 다시마국물 1컵 반을 부어 30분 정도 불린 후 밥을 짓는다.
- text: 부추와 실파는 다지고 참기름, 다진 마늘, 통깨, 다시마국물, 간장을 넣어 양념장을 만든다.
- text: 전복영양밥과에 부추양념장을 곁들인다.
