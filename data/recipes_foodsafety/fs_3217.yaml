steps:
- text: 방울토마토, 양파, 파프리카, 할라피뇨, 훈제 닭가슴살은 작게 깍둑썬다.
- text: 손질한 재료에 양념을 고루 섞는다.
- text: 찰깨빵의 윗부분 1cm를 도려낸다.
- text: 빵 안에 버무린 재료를 채운 뒤 모차렐라치즈를 올린다.
- text: 180℃로 예열한 오븐에 속을 채운 빵을 넣고 5분간 구워 꺼낸다.
- text: 그릇에 구운 빵을 올린 뒤 파슬리가루를 뿌린다.
