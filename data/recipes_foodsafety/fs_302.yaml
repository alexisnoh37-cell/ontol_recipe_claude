steps:
- text: 바나나를 반으로 잘라 반은 편 썰고 반은 으깨고, 아보카도는 껍질과 씨를 제거 한 후 ⅓은 편 썰고 ⅔는 으깬다.
- text: 토마토는 끓는 물에 데쳐 껍질을 제거하고 얇게 썬다.
- text: 베이컨 2장은 채 썰고, 1장은 구운 뒤 비슷한 크기로 채 썬다.
- text: 베이컨을 구운 기름에 편 썬 바나나, 아보카도, 토마토를 넣고 바질가루를 뿌려 굽는다.
- text: 팬에 채 썬 베이컨과 다진 마늘, 다진 양파를 볶은 후 휘핑크림, 저염치즈를 넣고 볶다가 으깬 아보카도, 바나나, 우유를 넣어 농도를 맞추고 소금으로 간해 바나나크림을 만든다.
- text: 접시에 구운 바나나, 아보카도, 토마토를 깔고 삶은 스파게티면을 담은 후 바나나크림을 뿌리고 베이컨을 올려 장식해 마무리한다.
