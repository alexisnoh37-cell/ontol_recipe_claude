steps:
- text: 아몬드는 기름 두르지 않은 팬에 옅은 갈색이 나도록 볶는다.
- text: 사과는 껍질을 제거하고 주사위모양으로 썬다.
- text: 바나나와 키위는 껍질을 제거하고 사과와 같은 크기로 썬다.
- text: 볼에 꿀, 플레인 요거트, 우유를 넣고 잘 섞는다.
- text: 깨끗한 볼에 오트밀을 담고 4를 넣어 잘 섞어준다.
