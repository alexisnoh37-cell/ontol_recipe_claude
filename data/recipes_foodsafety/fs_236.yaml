steps:
- text: 고구마를 삶아 껍질을 벗겨 으깬 뒤 우유와 섞어 고구마무스를 만든다.
- text: 백김치와 비트를 작게 썬 뒤 백김치에 물이 들도록 절여 놓는다.
- text: 닭가슴살을 한입 크기로 썬 후 칼등으로 두드린 뒤 후춧가루로 밑간한다.
- text: 식용유(15g)를 두른 팬에 닭가슴살을 올려 굽는다.
- text: 구운 닭가슴살 위에 고구마무스, 비트에 절인 백김치, 새싹을 얹는다.
- text: 그릇에 닭가슴살카나페를 넣은 후 바나나식초를 곁들여 마무리한다.
