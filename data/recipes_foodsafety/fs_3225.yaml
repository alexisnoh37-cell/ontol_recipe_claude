steps:
- text: 돼지고기, 어묵, 아삭이고추, 파프리카는 채 썬다.
- text: 콩나물은 찬물에 헹궈 체에 밭친다.
- text: 채 썬 돼지고기에 밑간을 한다.
- text: 중간 불로 달군 팬에 밑간한 돼지고기를 넣어 3분간 볶는다.
- text: 채 썬 재료와 어묵을 넣어 5분간 볶는다.
- text: 굴소스를 넣어 1~2분간 볶고 참기름을 두른 뒤 고루 섞는다.
