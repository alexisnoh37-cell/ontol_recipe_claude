steps:
- text: 단호박은 껍질을 벗겨 속살은 그대로 두고 씨만 털어 낸다.
- text: 속살은 숟가락으로 긁어내어 다진다.
- text: 나머지 부분은 채썰어 2~3번 다진 후 소금을 조금 넣고 살짝 절인다.
- text: 호박에 물기가 생기면 밀가루를 넣어 되직하게 반죽한다.
- text: 팬이 가열되면 식용유를 넣고 한 숟가락씩 떠넣어 얇게 펴서 부친다.
- text: 앞뒤로 노릇하게 부치고 접시에 담아 완성한다.
