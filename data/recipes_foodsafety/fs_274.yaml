steps:
- text: 육수 재료를 넣고 끓인 뒤 체로 걸러 육수를 낸다.
- text: 오징어 몸통은 큼지막하게 썰고 다리는 얇게 썬다.
- text: 두부와 버섯은 먹기 좋게 썰고, 고추는 어슷하게 썰고, 고구마는 먹기 좋은 크기로 썰고, 콩나물은 다듬는다.
- text: 김치는 먹기 좋은 크기로 썬 뒤 냄비에 참기름을 두르고 볶다가 고구마, 콩나물, 육수를 넣고 끓인다.
- text: 자작하게 끓으면 오징어를 넣고 끓이고, 오징어가 익으면 들깻가루를 넣고 끓인다.
- text: 두부, 팽이버섯, 쑥갓, 고구마, 붉은 고추를 넣고 끓여 마무리한다.
