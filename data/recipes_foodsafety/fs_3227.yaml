steps:
- text: 양파, 바질은 채 썰고, 삶은 달걀은 반으로 자른다.
- text: 채 썬 양파는 찬물에 담가 체에 밭쳐 물기를 제거한다.
- text: 믹서에 비빔소스 재료를 넣고 갈아 비빔소스를 만든다.
- text: 끓는 물(8컵)에 쌀국수를 넣어 2분 삶아 찬물에 헹궈 체에 밭친다.
- text: 그릇에 쌀국수 → 비빔소스 → 양파, 바질 → 달걀 순으로 얹고 마무리한다.
