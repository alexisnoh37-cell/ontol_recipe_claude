steps:
- text: 국멸치, 건다시마로 육수를 낸다.
- text: 꽃게는 먹기 좋은 크기로 손질하고, 바지락은 해감하여 준비한다.
- text: 무는 나박썰기, 양파는 사각썰기, 애호박은 반달썰기, 파는 어슷썰기 한다.
- text: 콩나물은 거두절미 한다.
- text: 육수에 무, 꽃게, 바지락을 넣고 한소끔 끓인다.
- text: 콩나물, 양파, 애호박 대파를 넣고 끓이다 간을 맞춰 마무리한다.
