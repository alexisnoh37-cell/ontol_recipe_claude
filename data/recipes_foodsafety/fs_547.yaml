steps:
- text: 밀가루에 녹말가루와 식용유, 소금, 달걀, 물을 넣고 반죽을 한다.
- text: 반죽된 밀가루를 비닐에 넣고 숙성을 시킨다.
- text: 냄비에 건새우와 머리 ․ 내장을 제거한 멸치, 양파, 다시마, 무, 통마늘을 넣고 끓인 육수를 소창에 걸러 놓는다.
- text: 호박은 반달로 썰고, 홍고추는 어슷 썰어 준비한다.
- text: 만들어 놓은 육수에 들깨 가루를 넣어 끓인다.
- text: 숙성된 밀가루(②)를 얇게 밀어 칼국수로 만든 뒤 준비한 육수(⑤)를 한소끔 끓인 후 칼국수와 호박을 넣어 끓이다가 다시 홍고추를 넣고 한 번 더 끓여 완성한다.
