steps:
- text: 양배추는 손질하여 찜통에 10분간 찐 후 식힌다.
- text: 참치는 체에 받쳐 기름을 빼고, 두부는 물기를 제거한 뒤 으깬다
- text: 양파와 파, 마늘은 잘게 다진다
- text: 팬에 된장, 고추장, 매실청, 다진 양파, 파, 마늘, 물을 넣고 섞어 끓이다가 참치, 두부를 넣고 볶은 뒤 참기름, 깨를 넣는다.
- text: 찐 양배추에 밥을 얹어 돌돌 만다.
- text: 양배추롤을 적당한 크기로 썰고 참치두부쌈장을 올린다.
