steps:
- text: 쌀은 세척 후 울금물에 불려준다.
- text: 두부를 으깨서 수분을 빼준다.
- text: 쌈장을 맛장으로 만들어준다.
- text: 건조 미역줄기는 세척해 불린다. 이때 불리고 나온 물을 이용해 밥을 한다.
- text: 올리브오일로 쌀을 볶아주다 미역줄기를 넣고 밥을 한다.
- text: 두부 맛장과 함께 곁들여 완성한다.
