steps:
- text: 신선초, 참나물, 취나물, 적겨자는 먹기 좋은 크기로 뜯고, 깻잎은 한입 크기로 썬다.
- text: 양파(8g)는 채 썰고, 파스타소스에 들어갈 양파(15g)는 굵게 다지고, 애호박도 양파와 비슷한 크기로 굵게 다진다.
- text: 오이는 돌려 깎은 뒤 채 썰고, 고추도 얇게 채 썬다.
- text: 끓는 물에 쌀파스타면을 넣고 5분간 삶아 익힌 뒤 찬물에 헹궈 물기를 뺀다.
- text: 팬에 물(60g)을 붓고 물이 끓으면 된장, 청국장, 다진 양파, 애호박, 으깬 두부, 다진 마늘을 넣고 1분 30초 정도 졸여 파스타소스를 만든다.
- text: 쌀파스타면 위에 소스를 얹은 뒤 채소를 올리고 들기름을 뿌려 마무리한다.
