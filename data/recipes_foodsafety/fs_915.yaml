steps:
- text: 메론은 적당한 크기로 잘라 믹서에 간다.
- text: 오렌지와 레몬은 과육만 잘라내 믹서에 각각 갈아 주스형태로 만든다.
- text: 2에 탄산수, 오렌지껍질, 레몬껍질을 넣어 향이 우러나도록 끓인다.
- text: 3에 전분을 넣어 농도를 맞춘 뒤 덩어리지지 않게 체에 걸러 차갑게 식힌다.
- text: 1에 4를 넣고 잘 섞은 뒤 설탕으로 맛을 낸다.
- text: 생크림을 휘핑해 올리고 자두, 메론, 민트로 장식한다.
