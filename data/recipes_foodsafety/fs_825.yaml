steps:
- text: 당면은 물에 불렸다가 끓는 물에 충분히 삶아 부드러워지면 차가운 물에 헹구어 물기를 뺀다.
- text: 표고버섯은 불려 꼭 짜 채썬 후 간장, 들기름에 무쳐 팬에 볶는다.
- text: 양배추, 오이, 당근, 깻잎, 상추, 피망, 파프리카는 곱게 채썬다.
- text: 배를 강판에 간다.
- text: 배와 간장, 소금, 식초, 겨자, 설탕을 넣어 잡채 양념을 만든다.
- text: 큰 접시에 준비된 채소를 예쁘게 돌려 담고 가운데 당면을 놓은 후 양념을 부어준다.
