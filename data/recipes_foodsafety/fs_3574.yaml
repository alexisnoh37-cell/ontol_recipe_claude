steps:
- text: 아보카도는 반으로 갈라 씨를 제거하고 과육을 으깬다. 레몬은 반으로 갈라 즙을 짜고, 라임은 얇게 자른다.
- text: 토마토, 양파, 마늘은 깍둑썰고, 바질은 곱게 다진다
- text: 볼에 손질한 아보카도, 토마토, 양파, 마늘, 바질을 넣고 올리브유, 레몬즙, 소금, 후추를 섞어 과카몰리를 만든다.
- text: 깨끗이 씻은 갈치는 칼집을 낸 후 달군 팬에 노릇하게 굽는다.
- text: 접시에 갈치구이를 담고 과카몰리를 곁들인다.
- text: 접시에 손질한 라임을 담고 마무리한다.
