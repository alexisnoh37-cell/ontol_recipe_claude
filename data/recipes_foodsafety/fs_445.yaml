steps:
- text: 당근은 채를 곱게 썰어 준비한다.
- text: 달걀은 노란자와 흰자로 나눠 각각 지단을 부쳐 약 5cm 길이로 채를 썰어놓는다.
- text: 시금치는 끓는 물에 소금을 넣고 파랗게 데쳐 물기를 제거하고 무쳐놓는다.
- text: 돼지고기는 마늘, 파, 설탕, 맛술, 간장, 후춧가루, 통깨, 참기름을 넣고 30분간 숙성시킨 뒤 팬에 볶아서 준비한다.
- text: 고구마는 삶아 으깨고, 두부는 소창에 물기를 짜고, 토마토와 양파, 견과류는 입자있게 다져섞는다.
- text: 라이스 페이퍼를 따뜻한 물에 담궜 다가 바로 꺼내어 으깬 고구마(⑤)를 먼저 깔고, 그 위에 준비한 재료(②, ③, ④)를 올려 돌돌 말은 뒤 먹기 좋은 크기로 썰어 완성한다.
