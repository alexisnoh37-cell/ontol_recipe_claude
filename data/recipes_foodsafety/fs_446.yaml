steps:
- text: 밀가루를 세 개로 나눠 호박가루와 백년초가루, 시금치가루를 각각 넣고 물, 식용유, 소금을 넣어 반죽 한 후 비닐봉지에 담아 1~2시간 정도 숙성 시킨다.
- text: 양파, 마늘, 버섯들은 입자있게 다져 준비한다.
- text: 두부는 소창을 이용하여 물기를 짜낸다.
- text: 새우는 껍질과 내장을 제거하고 다져, 마늘을 넣고 골고루 섞어준다.
- text: 다진 채소(②), 으깬 두부(③), 새우 (④)를 넣고 섞어서 만두소를 만들어 준다.
- text: 숙성된 만두 반죽(①)을 얇게 밀어 꽃 모양으로 찍어 만두소(⑤)를 넣은 뒤, 반죽을 맞잡아 모양을 만든다. 우유와 생크림을 끓인 뒤 만들어 놓은 만두를 넣고 은근히 찜을 하듯이 익혀 완성한다.
