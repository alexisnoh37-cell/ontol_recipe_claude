steps:
- text: 완두콩과 렌틸콩은 각각 삶은 뒤 믹서에 간다.
- text: 완두콩과 렌틸콩에 각각 생크림(20g)과 설탕(4g)을 넣고 냄비에 끓인다.
- text: 젤라틴 1g을 물에 넣어 불린다.
- text: 2번에 각각 불린 젤라틴을 혼합하여 녹인다.
- text: 용기에 4번의 렌틸콩을 붓고 얼린다.
- text: 5번이 어느정도 굳으면 4번의 완두콩을 붓고 얼린다.
