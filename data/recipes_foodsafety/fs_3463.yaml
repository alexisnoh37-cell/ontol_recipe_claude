steps:
- text: 단호박, 팽이버섯, 새송이버섯, 느타리버섯, 쌈추, 적근대, 배추, 숙주와 소고기를 3cm 크기로 자른다.
- text: 팬에 식용유(20g)를 두르고 중간 불에 손질한 채소와 소고기를 차례대로 볶는다.
- text: 볼에 달걀을 풀고 소금, 우유를 넣고 섞어 달걀물을 만든다.
- text: 타르트 틀에 식용유(6g)를 바르고 볶은 채소, 소고기를 올리고 ③을 넣는다.
- text: 140도로 예열한 오븐에 25분 정도 구워 프리타타를 만든다.
- text: 프리타타 위에 새싹채소와 리코타 치즈를 올린 후 올리브유를 두르고 마무리한다.
