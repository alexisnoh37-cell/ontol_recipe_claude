steps:
- text: 새송이버섯, 닭가슴살, 양파, 마늘, 부추는 잘게 다지고, 두부도 곱게 다진 뒤 물기를 제거한 후 간장을 넣고 함께 섞어 동그랗게 빚은 뒤 녹말가루와 밀가루를 섞어 반죽을 굴린다.
- text: 차가운 물에 넣었다 뺀 뒤 가루에 굴리기를 2~3회 반복해 겉에 만두피가 코팅되면 끓는 물에 살짝 데친다.
- text: 고추는 어슷 썰고, 팽이버섯, 애호박, 두부는 먹기 좋게 썬다.
- text: 냄비에 저염된장을 제외한 육수 재료와 물을 넣고 끓어오르면 저염된장을 체에 내려 풀고 면포에 거른다.
- text: 육수에 굴림만두와 애호박, 팽이버섯을 넣고 끓인다.
- text: 굴림만두가 적당히 익으면 두부를 넣고 끓인 뒤 고추 고명을 얹어 마무리한다.
