steps:
- text: 냄비에 기름을 두르고 중간불로 열을 가열한다.
- text: 1에 양파, 셀러리, 당근을 넣고 색이 나지 않도록 부드러워 질 때까지 볶는다.
- text: 야채가 익을 때 쯤 마늘을 넣고 볶는다.
- text: 3에 닭육수, 후추, 월계수잎을 넣고 끓인다.
- text: 중간불로 줄이고 35분 정도 은근하게 끓인다.
- text: 여기에 알파벳 파스타를 넣고 약 10분간 저어주며 끓인다.
