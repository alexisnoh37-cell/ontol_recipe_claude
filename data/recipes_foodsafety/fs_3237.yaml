steps:
- text: 냄비에 우유(370㎖)를 넣어 센 불로 올린 뒤 가장자리가 끓어오르면 레몬즙(20g)을 넣어 몽글해질 때까지 젓는다.
- text: 물에 적신 면포에 끓인 우유를 넣고 물기를 제거해 리코타치즈를 만든다.
- text: 냄비에 발사믹식초(10g), 레몬즙(1g)을 넣어 2분간 끓이다가 올리브유(10g)를 넣어 섞은 뒤 불을 꺼 발사믹 드레싱을 만든다.
- text: 방울토마토는 반으로 썰고, 굳힌 리코타치즈는 한입 크기로 만든다.
- text: 그릇에 방울토마토와 리코타치즈를 올리고 발사믹 드레싱을 뿌린다.
