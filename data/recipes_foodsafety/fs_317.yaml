steps:
- text: 통삼겹살은 어간장, 마늘기름, 로즈마리, 통후추에 재워준다.
- text: 양송이, 피망, 파프리카는 먹기 좋게 썰어서 마늘기름에 구워준다.
- text: 고구마는 먹기 좋게 잘라 기름 없이 구워준다.
- text: 재워 놓은 통삼겹은 작은 크기로 잘라서 건고추를 넣어 물에 데쳐낸다.
- text: 모든 재료를 꼬치에 끼워서 살짝 구워준다.
- text: 레몬껍질을 채 썰어서 소스를 만들어주고 꼬치와 함께 완성한다.
