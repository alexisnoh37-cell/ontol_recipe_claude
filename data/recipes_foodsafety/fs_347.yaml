steps:
- text: 닭육수에 브로콜리, 양송이를 넣고 끓인다.
- text: 생크림을 넣고 갈아준 후 함초소금으로 간을 해준다.
- text: 다진 청양고추와 버터를 섞어 청양고추버터를 만들어준다.
- text: 토마토를 믹서에 갈아 설탕과 팬에 섞어서 토마토 시럽을 만들어준다.
- text: 바게트에 토마토시럽을 발라주고 청양고추 버터를 발라 140도 오븐에서 2분간 구워준다.
- text: 그릇에 브로콜리스프를 담아주고 청양고추 버터 바게트를 곁들여 완성한다.
