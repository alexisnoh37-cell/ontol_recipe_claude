steps:
- text: 표고버섯은 머리와 밑동을 분리하고, 머리 부분은 잘게 썬다.
- text: 애호박, 감자, 양파는 한입 크기로 썰고, 미나리와 부추는 3cm 길이로 썰고, 대파와 청양고추는 송송 썬다.
- text: 물에 다시마, 표고버섯 밑동을 넣고 끓으면 건더기를 건져 육수를 만든다.
- text: 육수에 저염된장과 찹쌀가루를 풀어 한소끔 끓이고, 감자와 다진마늘을 넣어 끓인다.
- text: 애호박과 표고버섯을 넣고, 순두부, 양파, 들깻가루, 저염국간장을 넣어 한소끔 끓인다.
- text: 대파, 청양고추, 미나리, 부추를 듬뿍 올려 마무리한다.
