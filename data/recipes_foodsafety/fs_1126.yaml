steps:
- text: 사과(55g)와 비트는 깨끗하게 손질한 뒤 적당한 크기로 썬다.
- text: 나머지 사과는 0.5cm 주사위 모양으로 자르고 물에 담근다.
- text: 믹서에 1번을 넣고 간다.
- text: 냄비에 물기를 제거한 2번과 레몬즙을 넣고 졸인다.
- text: 냄비에 3번을 넣고 졸인다.
- text: 유리컵에 4,5번을 넣고 탄산수를 부어 완성한다.
