steps:
- text: 오이와 무를 필러로 길게 슬라이스 한다.
- text: 설탕물을 만들어 무가 잘 구부러질 때 까지 재운 뒤 씻어낸다.
- text: 당근과 홍고추, 파프리카는 5cm 길이로 채 썬다.
- text: 미나리를 데쳐 식힌 뒤 한 줄씩 찢는다.
- text: 오이, 무를 겹쳐 채 썬 재료를 넣고 말아준 뒤 데친 미나리로 묶는다.
- text: 배를 갈아 물, 식초, 고춧가루와 섞어 양념장을 만든 뒤 5를 넣고 재운다.
