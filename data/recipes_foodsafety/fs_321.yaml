steps:
- text: 소고기에 물을 넣어 육수를 뽑아준 후 천연 조미료로 간을 해준다.
- text: 소고기는 곱게 다져준 뒤 볶아준다.
- text: 감자를 삶아서 체에 내려준다.
- text: 계란을 풀고 소고기 다진 것과 게맛살, 물을 넣고 섞은 뒤 찜기에 쪄준다.
- text: 부추와 브로콜리는 뜨거운 물에 데쳐 먹기 좋게 잘라주고, 방울토마토와 미니파프리카도 먹기 좋게 잘라준다.
- text: 매실청과 올리브오일, 후추로 드레싱을 만들어 준비된 채소를 섞어준 뒤 그릇에 담는다.
