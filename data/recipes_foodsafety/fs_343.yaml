steps:
- text: 자숙새우와 소라살은 한번 데친 후 소라살은 먹기 좋게 잘라준다.
- text: 전복은 껍질을 벗기지 말고 세척해 준다.
- text: 양파, 홍피망, 대파는 먹기 좋게 잘라준다.
- text: 청고추, 홍고추도 먹기 좋게 잘라준다.
- text: 데친 물 200g에 양념장을 만들어 멕시코 고추를 담가 숙성시켜준 뒤 양념장에 알마늘을 넣어 끓여준다.
- text: 만들어진 양념장에 소라, 전복, 자숙새우, 준비된 채소 순으로 넣어 모듬해물찜을 완성 한다.
