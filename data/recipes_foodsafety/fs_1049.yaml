steps:
- text: 마늘은 꼭지를 떼고 찜통에 무르도록 찐다.
- text: 쪄 낸 마늘을 손절구에 곱게 으깬다
- text: 잣은 고깔을 떼고 겉면을 깨끗하게 닦은 뒤 가루를 만든다.
