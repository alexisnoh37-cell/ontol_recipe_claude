steps:
- text: 오징어, 새우, 당근, 양파를 믹서에 갈아 달걀흰자를 넣어 치댄 후 완자를 만들어 160도로 예열한 식용유에 4분 정도 튀긴다.
- text: 붉은 파프리카와 피망은 올리브유에 살짝 볶는다.
- text: 양장피 면은 끓는 물에 5분간 데치고, 같은 냄비에 건목이버섯을 데친다.
- text: 양장피 면이 서로 달라붙지 않게 참기름에 버무리고 돌돌 말아 접시 위에 올린다.
- text: 크레미, 데친 건목이버섯, 달걀지단을 면 위에 올리고, 튀겨낸 완자, 딜, 볶은 파프리카와 피망을 올린다.
- text: 콩국물을 붓고 볶음 소스를 곁들여 마무리한다.
