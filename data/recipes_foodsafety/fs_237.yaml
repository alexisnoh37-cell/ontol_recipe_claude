steps:
- text: 껍질을 벗긴 배, 사과를 믹서기에 갈아 레몬즙과 꿀을 넣고 배사과소스를 만든다.
- text: 돼지고기와 파인애플은 깍둑 썬다.
- text: 브로콜리는 약 2~3cm 크기로 자른 후 끓는 물에 살짝 데친다.
- text: 식용유(5g)를 두른 팬에 돼지고기를 한 번 먼저 굽는다.
- text: 꼬치에 방울토마토, 구운 돼지고기, 파인애플, 브로콜리 순서로 끼운 후 굽는다.
- text: 노릇하게 구운 꼬치구이에 배사과소스를 얹어 마무리한다.
