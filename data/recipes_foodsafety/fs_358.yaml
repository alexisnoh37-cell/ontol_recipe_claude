steps:
- text: 냉동고등어는 먹기 좋은 크기로 잘라 전분을 묻혀 기름에 두 번 튀겨준다.
- text: 애호박, 방울토마토, 사과는 적당한 크기로 잘라준다.
- text: 감자와 양파는 적당한 크기로 자른 뒤 물 1컵 에 감자를 먼저 넣고 끓여주다 양파를 넣고 끓여 단맛을 내준다.
- text: 우유에 카레가루를 섞어 불려준 뒤 끓고 있는 감자에 넣어준다.
- text: 튀겨진 고등어를 키친타월을 이용해 기름을 빼준다.
- text: 카레가 완성되면 사과, 방울토마토, 꿀을 넣어주고 튀겨 놓은 고등어에 뿌려 완성한다.
