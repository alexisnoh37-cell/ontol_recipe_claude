steps:
- text: 곤드레나물에 들기름, 간장으로 양념하고 쌀, 찹쌀, 흑미와 밥을 지은 뒤 참기름, 소금 간 한다.
- text: 식초와 식초2배의 물을 넣고 끓이다가 사과를 한 입 크기로 썰어 끓인다.
- text: 감자를 삶아 으깨고, 다진 양파, 호두, 밀가루를 넣고 섞은 뒤 겉에 빵가루를 묻혀 팬에 굽는다.
- text: 파프리카는 잘게 채 썬다.
- text: 마요네즈, 깻잎, 바나나, 된장을 믹서에 갈아 소스를 만들고 피클을 다져 넣는다.
- text: 종이호일을 깔고 중간중간 소스를 뿌리면서 김-양상추- 패티-파프리카-양상추-밥 순으로 얹어 버거를 만든다.
