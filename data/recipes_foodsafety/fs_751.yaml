steps:
- text: 냄비에 물을 넣고 된장을 풀어 대파, 생강을 넣고 끓인다.
- text: 물이 끓으면 돼지갈비를 넣고 5분간 삶는다.
- text: 백김치는 5cm 길이로 자른다.
- text: 적포도주를 냄비에 넣고 불에 올려 알코올을 날려준 뒤 김치, 맛술, 꿀을 넣고 맛이 배도록 졸인다.
- text: 삶아 낸 등갈비에 소금을 뿌리고 올리브유를 발라 팬에 구워낸다.
- text: 구운 갈비에 백김치 와인조림을 곁들여 낸다.
