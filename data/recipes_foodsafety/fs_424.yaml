steps:
- text: 참외는 껍질을 벗기고 반으로 잘라 속을 파 준 후 먹기 좋게 잘라준다.
- text: 청고추, 홍고추는 송송 잘라준다.
- text: 양파와 미나리는 참외크기로 자르고, 대파는 송송 자른다.
- text: 참외, 양파를 저염 간장에 살짝 절여준다.
- text: 절여진 채소에 고춧가루로 먼저 색을 입힌다.
- text: 나머지 재료를 넣고 김치를 만든다.
