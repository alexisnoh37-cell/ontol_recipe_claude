steps:
- text: 닭고기에 물을 자작하게 넣고 월계수잎과 통후추, 정종을 넣고 약 20분 정도 삶아 식혀 찢어놓는다.
- text: 브로컬리는 끓는 물에 소금을 넣고, 데쳐 작게 썰어놓고, 양상추는 물에 담그어 놓았다가 먹기 좋게 손으로 찢어 놓는다.
- text: 파프리카는 속씨를 제거하고, 작은 깍둑썰기를 하고, 당근은 5cm 길이로 납작하게 썰어놓는다.
- text: 브로컬리는 끓는 물에 소금을 넣고 데쳐 작게 썰어놓고, 양상추는 물에 담그어 놓았다가 먹기 좋게 손으로 찢어 놓는다.
- text: 발사믹 식초에 설탕과 올리브 오일을 넣고 골고루 섞어 소스를 만들어 놓는다.
- text: 찢어 놓은 닭고기살과 백김치를 넣고, 준비한 채소를 넣어 먹기 직전에 소스를 올려 완성한다.
