steps:
- text: 새싹과 무순은 씻어 물기를 제거한다.
- text: 셀러리는 껍질을 벗겨 3cm로 어슷썬다.
- text: 쑥갓은 3cm로 썰고, 래디쉬는 채썬다.
- text: 다진 소고기는 고기양념을 한다.
- text: 팬에 식용유를 소량 넣고 양념한 소고기를 볶다가 분량의 소스 재료를 넣고 볶아 저나트륨 볶음고추장을 만든다.
- text: 그릇에 밥을 담고 준비된 새싹과 채소를 돌려담고 저나트륨 볶음고추장을 곁들인다.
