steps:
- text: 쌀은 깨끗이 씻어 약 30분 이상 불려 물기를 빼고 절구에 빻아놓는다.
- text: 냄비에 물을 넣고, 다시마와 건새우 반을 넣고 끓여 간단한 육수를 만들어 놓는다.
- text: 건새우 반은 다져서 따로 준비하고, 양파와 당근은 입자있게 다지고, 버섯을 편으로 썰어 준비한다.
- text: 홍합은 끓는 물에 소금을 넣고 데쳐 껍질을 제거해 놓는다.
- text: 냄비에 참기름을 넣고 빻아 놓은 쌀을 넣어 은근히 볶는다.
- text: 볶은 쌀(⑤)에 육수(②)를 붓고 끓이다가 양파, 당근, 버섯(③)과 홍합(④)을 넣고 어우러지게 나무 주걱으로 저어가면 끓이다가 죽이 다 익을 때쯤 다져 놓은 건새우 (③)를 넣고 한 번 더 끓인 후 완성 한다.
