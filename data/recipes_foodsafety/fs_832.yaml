steps:
- text: 대두는 6시간 이상 물에 불린다.
- text: 불린통은 20~25분 정도 삶은 후 껍질을 제거한다.
- text: 껍질을 제거한 삶은 콩에 참깨와 물을 넣고 곱게 갈아 체에 받쳐 준비한다.
- text: 도토리묵은 7cm 길이로 굵게 채썬다.
- text: 오이는 어슷썬다.
- text: 그릇에 묵을 담고 준비된 콩국을 붓고 오이채를 곁들인다.
