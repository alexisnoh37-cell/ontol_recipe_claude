steps:
- text: 준비된 야채들을 깨끗이 씻는다.
- text: 연근, 고구마, 감자, 단호박, 당근은 0.2cm 두께로 썬다.
- text: 연근, 고구마, 감자는 물에 담궈 둔다.
- text: 오븐 팬에 썰어 놓은 재료를 넣고 소량의 소금을 뿌린다.
- text: 130~150℃로 예열한 오븐에 4를 굽는다.
- text: 구워진 야채칩을 식혀 담는다.
