steps:
- text: 토란은 2×2㎝로 썬다.
- text: 표고버섯은 채 썰고, 고추는 어슷하게 썬다.
- text: 냄비에 물(500ml)을 넣고 물이 끓으면 백합을 넣고 끓여 육수를 낸다.
- text: 조개가 입을 벌리면 토란과 들깻가루, 표고버섯을 넣고 끓인다.
- text: 육수가 어느 정도 걸쭉해지면 순두부를 넣고 끓인다.
- text: 붉은 고추와 청양고추를 올려 마무리한다.
