steps:
- text: 냄비에 마늘과 대파를 넣고 끓이다가 닭다리를 넣고 삶는다
- text: 닭을 삶아 놓은 육수는 걸러 기름을 제거 하고 차갑게 식힌다.
- text: 삶아 놓은 닭고기는 결대로 찢는다.
- text: 양파, 오이와 파프리카는 채썬다
- text: 적채는 채를 썰어 찬물에 담궈 건져 물기를 빼 놓는다.
- text: 차갑게 걸러 놓은 닭 육수에 발효된 겨자와 소금 .설탕, 식초를 넣어 육수 간을 하고, 그릇에 닭살과 오이 적채, 파프리카 양파를 올려 차가운 육수를 넣어 완성한다.
