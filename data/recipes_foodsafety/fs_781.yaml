id: fs_781
title: 갯벌의 여왕 모시조개의 달콤한 유혹
cuisine: 미분류
source: foodsafety
status: draft
confidence: low
note: '출처: 식품의약품안전처 식품안전나라 조리식품의 레시피 DB(COOKRCP01) 일련번호 781. 요리종류 반찬, 조리방법 끓이기. 자동 변환: role(모두 sub)·cuisine·조리시간·난이도·맛은 검수 때 정함'
ingredients:
- ingredient: manila_clam
  raw_text: 바지락(모시조개( 200g(30개), 양파 15g(2*4cm), 마늘 10g(2쪽), 마른 홍고추 1g(1/5개), 올리브유 15g(1큰술), 호이트와인 15ml(1큰술), 쳥양고추 3g(1/3개), 저염치즈 10g(2작은술), 후추 약간, 바질 약간
  role: sub
steps:
- text: 양파는 잘게 썰고 청양고추는 어슷썰기를 한다.
- text: 마늘은 편으로 썰고 마른 홍고추도 둥글게 썰어 준비한다.
- text: 조개는 흐르는 물에 여러 번 씻어 해감을 시킨 후 물기를 제거한다.
- text: 달궈진 팬에 올리브오일을 두르고 마늘, 마른홍고추, 양파를 넣어 볶아 향을 낸 후, 센불로 불을 키우고 모시조개를 넣는다.
- text: 조개가 입을 벌리면 바질과 화이트와인을 넣어 잡내를 없앤다.
- text: 한소끔 끓여낸 후 붕간 불로 줄이고 저염치즈, 청양고추, 후추를 넣어 칼칼한 맛을 낸다.
