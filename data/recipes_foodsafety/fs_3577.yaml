steps:
- text: 부추는 다듬어 5~6cm 크기로 썰고, 양파는 뿌리와 껍질을 제거해 얇게 채 썬다.
- text: 배는 껍질을 제거해 여덟 등분하고 씨를 제거하여 편 썰기를 한다.
- text: 다진 마늘, 고춧가루, 멸치액젓, 저염간장, 레몬즙, 통깨(2g)를 섞어 양념장을 만든다
- text: 부추, 양파, 배의 물기를 제거한다.
- text: 볼에 담고 양념장을 넣어 버무린다.
- text: 접시에 담고 통깨(2g)를 뿌려 마무리한다.
