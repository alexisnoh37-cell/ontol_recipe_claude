steps:
- text: 과일은 한입 크기로 썬다.
- text: 젤라틴은 찬물에 불린다.
- text: 냄비에 물(100㎖), 양념을 넣어 끓인 뒤 피클링 스파이스를 체로 거른다.
- text: ③에 불린 젤라틴과 한천가루를 넣어 녹인 뒤 한 김 식힌다.
- text: 유리 용기에 손질한 과일을 담고 식힌 ④의 젤라틴 물을 붓는다.
- text: 냉장실에서 1시간 30분간 굳혀 마무리한다.
