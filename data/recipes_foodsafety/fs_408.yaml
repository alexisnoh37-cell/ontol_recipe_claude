steps:
- text: 국물 재료로 국을 끓여준 뒤 체에 걸러주고 양지는 찢어준다.
- text: 무와 양파는 굵은 채로 썬다.
- text: 대파의 흰 부분은 어슷하게 썰고 파란 부분은 굵게 썰어준다.
- text: 고사리는 뜨거운 물에 데친 후 먹기 좋은 크기로 잘라서 고사리 양념장에 양념한다.
- text: 청양고추를 썰어서 볶은 후 국물을 미리 끓여 놓은 국물에 붓는다.
- text: 만들어진 국물에 모든 재료를 넣고 한 번 끓여 완성한다.
