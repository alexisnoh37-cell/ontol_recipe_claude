steps:
- text: 검은깨를 곱게 부숴 빵가루와 섞어 마른 팬에서 볶는다.
- text: 라면을 삶아 건져 물기를 제거 한 뒤 달걀물→녹말가루 순서대로 묻힌다.
- text: 다진 쇠고기에 다진 땅콩을 넣어 반죽해 적당한 크기로 빚는다.
- text: 반죽을 라면으로 감싸 달걀물→ 빵가루 순으로 입혀 튀긴다.
- text: 통계피와 생강을 물(200g)에 넣고 끓여 우려낸 뒤 건더기를 건지고 나머지 소스 재료를 넣고 살짝 조린다.
- text: 발사믹드레싱을 만들어 어린잎채소에 뿌리고, 방울토마토는 반으로 썰어 라면 크로켓과 함께 그릇에 담아 마무리한다.
