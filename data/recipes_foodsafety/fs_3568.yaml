steps:
- text: 가지는 0.3cm 두께로 얇게 썰고 방울토마토, 파프리카, 양파는 잘게 자른다.
- text: 손질한 가지는 오븐에 굽는다. (180℃, 10분)
- text: 달군 팬에 올리브유(6g)를 두르고 양파를 볶다가 현미밥, 방울토마토, 파프리카를 넣고 볶는다.
- text: 채소가 익으면 약한 불로 줄이고 토마토 페이스트, 쿠민가루를 넣어 볶음밥을 만든다.
- text: 믹서에 참깨, 올리브유(6g)를 넣어 갈고 요거트, 다진 마늘을 섞어 참깨 소스를 만든다.
- text: 구운 가지 위에 볶음밥을 올려 돌돌 말고, 참깨 소스를 얹어 마무리한다.
