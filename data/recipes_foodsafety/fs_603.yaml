steps:
- text: 엿기름은 물을 넣고 주물럭거린다
- text: 엿기름에 맑은 물이 생기면 채에 걸러내어 밥을 넣고 3시간 정도 발효를 시켜 밥알이 떠오르면 설탕을 넣고 끓인다.
- text: 한천은 물을 넣고 불린다
- text: 식혜에 불린 한천을 넣고 틀에 담아 굳힌다.
- text: 미숫가루에 밀가루, 버터, 설탕을 섞고 살짝 끓여 잼을 만든다.
- text: 찹쌀가루에 뜨거운 막걸리와 백년초를 넣고 익반죽 후 찜통에 쪄서 수박모양의 증편을 만들고 식혜, 양갱, 버터 잼과 함께 담는다.
