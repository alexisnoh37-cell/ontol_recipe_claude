steps:
- text: 끓는 물에 파스타를 넣고 약 10분 정도 삶아 건져 올리브오일을 살짝 바른다.
- text: 쥬키니 호박은 채썰어 소금에 절인 뒤 볶는다.
- text: 닭가슴살은 마늘을 넣고 삶은 뒤 먹기 좋게 찢는다.
- text: 사과와 비트, 레몬을 믹서에 갈아 소스를 만든다.
- text: 소스에 꿀을 넣어 맛을 내고 차갑게 보관한다.
- text: 팬에 삶아 놓은 파스타를 넣고 볶다가 닭살과 호박채, 시금치를 넣고 볶은 뒤 접시에 담고 차갑게 보관한 소스를 올린다.
