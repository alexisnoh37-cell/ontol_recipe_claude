steps:
- text: 보리는 깨끗이 씻어 물에 약 30분 이상 불려 놓고, 당근, 양파, 마늘, 대파는 입자있게 다져 준비한다.
- text: 시금치는 끓는 물에 소금을 넣고 데친 후 생크림을 넣고 함께 갈아서 준비한다.
- text: 오징어는 껍질을 벗겨 안쪽에 칼집을 내어 새우와 함께 데치고, 조개는 해감 후 다시마를 넣고 삶은 뒤 소창에 걸러 육수를 만들어 놓는다.
- text: 냄비에 버터를 넣고, 다진 마늘과 양파 당근을 볶다가 불린 보리를 넣어 다시 볶는다.
- text: 볶아지는 냄비에 조개 삶은 육수를 넣어 끓인다.
- text: 끓여지는 냄비에 데친 조개와 해물, 치즈, 우유를 넣어 어우러지게 저어 가며 졸이듯 끓이다가 마지막에 시금치와 생크림 갈은 것(②)을 넣고 살짝 끓인 후 파슬리 가루를 살짝 뿌려 완성한다.
