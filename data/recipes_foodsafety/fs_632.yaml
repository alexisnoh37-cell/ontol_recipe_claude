- text: 돼지고기 등심은 곱게 다진다.
- text: 두부는 꼭 짜서 물기를 제거하고, 시금치는 데친 후 다진다.
- text: 두부와 다진 등심에 시금치, 소금, 후춧가루, 다진마늘 및 달걀을 넣고 골고루 잘 섞는다.
- text: 양배추는 김이 오른 찜통에서 약 5분 정도 찐다.
- text: 김발에 양배추를 넓게 편다.
- text: 양배추 위에 ?을 넣고 돌돌말아 한 번 더 찐다.
