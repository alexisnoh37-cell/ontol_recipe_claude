steps:
- text: 미지근한 물에 쌀국수 면을 부드러워질 때까지 불린다.
- text: 새우는 소금, 청주, 달걀 흰자, 전분물로 반죽한 뒤 튀긴다.
- text: 팬에 메추리알을 부친다.
- text: 팬에 올리브오일과 고추기름을 두르고 마늘을 살짝 볶은 뒤 튀긴새우와 쌀국수 면을 넣는다.
- text: 굴소스와 식초로 간을 하고 재료가 다 익어갈 때 시금치를 넣고 불을 끈다.
- text: 땅콩가루와 메추리알을 올려 마무리한다.
