steps:
- text: 다시마는 깨끗이 씻어 찬물에 넣고 은근히 끓여 다시마 육수를 만들어 생강즙과 저염간장을 넣어 약한 불에서 졸여 볶음 간장을 만들어 놓는다.
- text: 황태는 강판에 갈아 곱게 가루를 만들어 놓는다.
- text: 새우는 씻어놓고, 오징어는 소금을 이용하여 껍질을 벗기고, 안쪽에 사선 으로 칼집을 넣어 모양을 만들어 살짝 데쳐 준비한다.
- text: 양파와 마늘은 입자있게 다지고, 대파는 5cm 길이로 썰어놓고, 표고버섯과 양배추도 채를 썰고, 숙주는 다듬어 놓는다.
- text: 라면은 끓는 물에 데쳐 준비한다.
- text: 팬에 올리브오일을 넣어 따근해지면, 오징어와 새우를 넣어 볶다가, 다시 숙주와 마요네즈, 설탕, ①번 소스와 채소를 넣어 센 불에서 재빠르게 볶고, 다시 면을 넣어 볶아 완성한다.
