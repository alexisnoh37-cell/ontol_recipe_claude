steps:
- text: 고구마는 삶아서 식힌 후 으깬다.
- text: 새송이버섯, 양파, 당근은 다진 후 후춧가루와 소금을 넣고 팬에 볶는다.
- text: 야채가 익으면 현미밥을 넣어 볶은 후 식힌다.
- text: 볶은 현미밥은 속에 고구마를 채우고 동그란 모양을 만든다.
- text: 밀가루, 달걀물, 빵가루 순으로 묻힌다.
- text: 170~180℃ 기름에 튀긴다.
