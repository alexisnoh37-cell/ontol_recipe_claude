steps:
- text: 고슬고슬하게 지은밥에 참기름을 섞고 다진 소고기는 후춧가루, 참기름에 무친 뒤 볶아서 밥과 섞어 주먹밥을 만든다.
- text: 근대는 데친 뒤 소금, 다진 마늘, 참기름으로 무친다.
- text: 쌈다시마는 물에 헹군 뒤 끓는 물에 파랗게 데쳐 6cm폭으로 자른다.
- text: 케일, 앤다이브는 씻어서 물기를 빼고 깻잎은 저나트륨 양념간장에 재운다.
- text: 미나리와 오징어는 손질하여 살짝 데치고 오징어는 얇게 저며 썬다.
- text: 1의 주먹밥을 준비한 각각의 재료로 말아 싼 다음 쌈장, 저나트륨 초고추장을 올려 마무리 한다.
