steps:
- text: 감자는 껍질을 벗겨 반으로 갈라편편하게 놓일 수 있도록 밑면을 다듬는다.
- text: 숟가락으로 감자 윗면을 파낸다.
- text: 다진 소고기는 분량의 재료를 넣고 양념한다.
- text: 파낸 감자 안에 녹말을 묻히고 양념한 소고기를 채운다.
- text: 감자가 잠길 정도로 육수를 붓고 끓인다.
- text: 찜이 완성되면 물녹말을 부어 걸쭉하게 만든다.
