steps:
- text: 조기의 비늘과 지느러미를 제거하고 앞뒤 3~4회 칼집을 내어 양념이 잘 배도록 손질한다
- text: 고사리는 4cm 가량으로 자른다.
- text: 자른 고사리는 국간장, 참기름, 마늘을 넣고 무친다
- text: 양파, 홍고추, 청고추는 잘게 썬다
- text: 양념된 고사리는 냄비에 넣는다
- text: 5의 냄비에 물을 붓고 조기, 양파, 홍고추, 청고추, 생강, 마늘, 국간장, 통깨, 참기름을 넣고 찐다
