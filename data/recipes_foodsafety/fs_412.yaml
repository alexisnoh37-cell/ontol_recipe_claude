steps:
- text: 두부는 먹기 좋은 크기로 잘라서 팬에 바삭 하게 구워준다.
- text: 구워진 두부는 기름을 빼고 채 썰어준다.
- text: 방울토마토는 작은 사각형으로 잘라주고, 치커리는 먹기좋게 잘라준다.
- text: 표고버섯와 홍고추, 노란파프리카는 가늘게 채 썰어 볶아준다.
- text: 소스를 만들어준다. 잘라준 토마토는 먹기 직전에 소스와 섞어준다.
- text: 접시에 치커리를 깔고 볶아진 두부와 채소를 올려 완성한다.
