steps:
- text: 삼치는 세척 후 전분가루로 옷을 입혀준다.
- text: 일본된장과 청주를 섞어 구이소스를 만들어 삼치를 재운다.
- text: 청고추와 홍고추는 곱게 다지고 치커리는 적당하게 잘라서 물에 담가준다.
- text: 유자청, 다진마늘, 다진 청고추와 홍고추를 섞어 곁들임소스를 만든다.
- text: 재워두었던 삼치를 굽는다.
- text: 접시에 구운 삼치와 치커리를 올리고 치커리를 올리고 곁들임소스를 뿌려 완성한다.
