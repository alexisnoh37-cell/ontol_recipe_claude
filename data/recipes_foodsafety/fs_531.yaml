steps:
- text: 애호박은 반달 모양으로 썰어 준다.
- text: 썰어 놓은 호박에 소금을 넣고 살짝 절여 물기를 제거하고 준비한다.
- text: 양파는 채를 썰고, 대파는 1/4로 자르고, 홍고추는 어슷썰어 자연스럽게 씨를 제거해 놓는다.
- text: 팬에 들기름을 넣고, 마늘을 먼저 볶는다.
- text: 볶아진 팬에 건새우를 넣어 볶아준다.
- text: 건새우가 볶아지면, 썰어 놓은 호박을 넣어 볶다가 양파와 대파를 넣어 볶으면서 들깨 가루와 넣어 살짝 볶으면서 마지막에 썰어 놓은 홍고추를 넣어 한 번만 더 볶아 완성한다.
