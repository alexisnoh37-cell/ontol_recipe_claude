steps:
- text: 쌀을 물에 불린 뒤 완두콩을 함께 넣고 밥을 짓는다.
- text: 달걀을 풀어 체에 내린 뒤 지단을 부치면서 반 정도 익었을 때 그 위에 얇게 썬 주키니호박, 당근, 가지를 올려 익힌다.
- text: 참치를 참치밑간에 재운 뒤 겉만 살짝 익힌다.
- text: 김에 밥을 올리고, 뒤집어 참치를 올려 만 뒤 그 위에 지단을 올려 한 번 더 만다.
- text: 사과드레싱을 만들고, 토마토소스 재료를 간 뒤 체에 거른다.
- text: 참치비빔밥롤을 담은 뒤 토마토소스를 곁들이고, 케일에 사과드레싱을 뿌려 마무리한다.
