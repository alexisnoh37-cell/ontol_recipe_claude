steps:
- text: 대구살에 소금, 흰후추를 뿌려 밑간 한 뒤 찹쌀가루를 가볍게 묻힌다. (a)
- text: 버섯과 마늘을 얇게 썬다. (b)
- text: 팬에 기름을 두르고 마늘을 볶아 향을 낸 뒤 마늘은 따로 건져두고 버섯을 굽는다. (c)
- text: 팬에 기름을 두르고 1을 앞뒤로 노릇하게 굽는다. (d)
- text: 분량의 재료를 섞어 소스를 만든다.
- text: 접시에 대구, 버섯, 마늘을 켜켜이 담아 소스를 뿌리고 베이비채소를 곁들여 낸다.
