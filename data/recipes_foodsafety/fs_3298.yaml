steps:
- text: 토마토는 윗부분을 약간 자른 뒤 속을 파낸다.
- text: 양파, 감자, 노랑 파프리카, 브로콜리, 새우는 1×1cm 크기로 썬다.
- text: 중간 불로 달군 팬에 고추기름을 두르고, 손질한 채소를 넣어 양파가 투명해질 때까지 볶는다.
- text: 새우와 후춧가루를 넣은 뒤 고루 섞으며 볶는다.
- text: 고추장 요거트 드레싱을 만든다.
- text: 토마토 속에 ④의 볶은 재료를 담고, 고추장 요거트 드레싱을 곁들여 마무리한다.
