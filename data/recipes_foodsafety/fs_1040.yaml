steps:
- text: 새우살을 다져서 양념한다.
- text: 두부는 4x3cm로 썰어 한 쪽 면은 속을 파내고 간이 된 새우살을 채운 뒤 전분을 묻혀 지진다.
- text: 당근, 양파, 돼지호박은 1.5x1.5x0.2cm 크기로 썬다.
- text: 팬에 참기름을 두르고 3을 타지 않도록 잘 볶은 뒤 생강, 다진 마늘을 넣고 볶다가 닭육수를 넣어 끓인다.
- text: 육수에 간장과 굴소스로 간을 맞춘다.
- text: 그릇에 지져낸 새우살을 채운 두부를 넣고 끓인 미네스트로네를 담는다.
