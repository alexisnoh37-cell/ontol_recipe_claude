steps:
- text: 단호박, 고구마는 껍질을 벗겨 삶는다.
- text: 고구마는 삶아 체에 내린다.
- text: 완두콩은 삶아 간다.
- text: 데친 브로컬리와 우유를 믹서에 넣어 간다.
- text: 냄비에 버터와 밀가루를 넣고 볶아 화이트 루를 만든다.
- text: 고구마와 단호박에 우유를 넣어 끓이다가 화이트 루, 완두콩, 생크림을 넣고 끓인 뒤 오렌지즙 한 방울을 떨어뜨리고 식빵을 작게 잘라 올린다.
