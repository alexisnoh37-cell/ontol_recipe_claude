steps:
- text: 기름을 두른 팬에 다진 마늘을 넣고 볶는다.
- text: 2mm 두께로 썬 양송이버섯을 넣고 볶아준 뒤 접시에 담는다.
- text: 버섯을 볶은 팬에 쌀을 넣고 볶는다.
- text: 볶은 쌀에 닭육수를 넣고 수분이 흡수 될 때까지 잘 저어가며 조리한다.
- text: 쌀이 어느 정도 익으면 볶아놓은 버섯을 넣고 쌀이 완전히 익을 때까지 조리한다.
- text: 파마산치즈, 소금, 후추, 타임 다진것, 다진 파슬리를 넣어 마무리한다.
