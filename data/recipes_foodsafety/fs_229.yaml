steps:
- text: 오징어 몸통 안쪽에 칼집을 내고 끓는 물에 데친다.
- text: 파프리카와 당근, 피망은 작게 다져 볶은 뒤 밥에 넣어 섞는다.
- text: 쇠고기는 참기름에 볶는다.
- text: 달걀을 풀어 약한 불로 달군 팬에 부은 뒤 김가루를 뿌려 지단을 부치고, 바닥이 익으면 깻잎과 밥을 올린다.
- text: 데친 오징어, 볶은 쇠고기 순으로 올려 만 뒤 랩으로 싼다.
- text: 고추장과 매실청을 섞은 뒤 팬에 넣고 약한 불에서 끓여 소스를 만들고 한입 크기로 썬 김밥에 구운 버섯을 함께 곁들여 마무리한다.
