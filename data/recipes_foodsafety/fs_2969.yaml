steps:
- text: 삼치의 살과 가시를 분리한다.
- text: 키친타올로 삼치살의 핏기와 물기를 제거한 뒤 후추와 레몬즙을 뿌려 비린내를 제거한다.
- text: 볼에 튀김가루, 계란, 물, 식용유를 섞어 튀김옷을 만든다.
- text: 삼치에 튀김옷을 입힌 뒤 170℃ 기름에서 두 번 튀긴다.
- text: 삶은 계란, 홍고추, 청양고추, 양파를 다져 볼에 섞은 뒤 마요네즈와 레몬즙을 섞어 소스를 만든다.
- text: 삼치 튀김에 타르타르소스를 곁들여 담는다.
