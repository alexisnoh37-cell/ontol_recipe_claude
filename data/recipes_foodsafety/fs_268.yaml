steps:
- text: 냄비에 육수 재료를 넣고 10분 정도 끓여 체에 걸러 육수를 만든다.
- text: 양파는 채 썰고, 고추는 어슷 썰고, 토마토는 잘게 다진다.
- text: 돼지고기는 1.5cm 크기로 깍둑썰기 하고, 핏물을 제거한다.
- text: 냄비에 육수를 붓고 다진 토마토와 다진 마늘, 바질가루를 넣고 끓인다.
- text: 걸쭉해지면 설탕과 돼지고기를 넣고, 고기가 익으면 채 썬 양파, 어슷 썬 청양고추와 꼭지를 딴 방울토마토를 넣는다.
- text: 방울토마토의 껍질이 벗겨질 때까지 끓이고 후춧가루를 넣어 마무리한다.
