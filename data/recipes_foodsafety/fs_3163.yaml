steps:
- text: 배추는 손질하여 심심하게 절인다.
- text: 국멸치, 건표고버섯으로 육수를 낸다.
- text: 파프리카는 갈아서 즙을 짜서 준비한다.
- text: 식힌 육수에 파프리카 즙과 무, 미나리, 양파를 채쳐서 넣고 저염 양념을 만든다.
- text: 배, 대추, 밤, 당근은 마지막에 채쳐 섞는다.
- text: 저염 양념에 ⑤를 섞어서 절인 배추에 켜켜로 바른다.
