steps:
- text: 새우는 껍질을 제거하고 포를 뜬 뒤 삶아 익힌다.
- text: 전복은 수저로 떼어내 소금으로 씻고 달군 팬에 굽는다.
- text: 연어는 포를 뜬다.
- text: 겨자가루에 30℃ 정도의 물을 넣고 골고루 섞어 발효시키고, 설탕, 식초를 넣고 겨자소스를 만든다.
- text: 고추장에 요구르트를 넣고 고추장소스를 만든다
- text: 접시에 익힌 새우, 전복, 연어를 담은 뒤 겨자소스와 고추장소스를 올리고 어린잎으로 장식한다.
