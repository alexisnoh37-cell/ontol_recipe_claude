steps:
- text: 콜라비, 당근, 오이는 나박 썬다.
- text: 고추는 둥글게 썰고 실파는 3cm 길이로 썬다.
- text: 콜라비를 소금에 살짝 절인다.
- text: 물에 찹쌀을 풀어 찹쌀풀을 쑤어 식힌다.
- text: 찹쌀풀에 배와 적양파를 갈아 넣어 국물을 만든다.
- text: 국물에 소금을 넣어 간을 맞추고 썰어놓은 채소에 부어 용기에 담아 익혀 먹는다.
