steps:
- text: 배추, 무는 2x2cm로 나박썬다.
- text: 썰어논 배추, 무는 소금에 살짝 절여둔다.
- text: 당근은 모양을 내어 썰고 실파, 미나리도 2cm로 썰어둔다.
- text: 마늘과 생강, 홍고추는 채썰고 수삼은 어슷하게 썬다.
- text: 물을 끓여 식힌 후 소창에 고춧가루를 싸서 김치국물을 만든다.
- text: 무와 배추가 절여지며 준비한 재료들에 김치국물을 부어 완성한다.
