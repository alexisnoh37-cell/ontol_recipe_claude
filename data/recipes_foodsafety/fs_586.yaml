steps:
- text: 새우는 내장을 제거하고 껍질을 벗겨 깨끗이 씻는다.
- text: 찜기에 새우와 생강을 넣어 약 5분 정도 찐다.
- text: 마늘은 납작 썰고, 당근과 양파, 파, 깻잎, 청고추, 대추는 굵게 다진다.
- text: 숙주는 꼬리를 떼어 다듬고, 끓는 물에 살짝 데친다.
- text: 팬에 식용유를 두른 뒤 손질한 채소를 넣어 볶는다.
- text: 밥과 새우를 넣어 볶고, 저염간장을 넣어 볶아 마무리한다.
