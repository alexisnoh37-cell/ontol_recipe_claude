steps:
- text: 마늘과 흑임자 참깨를 다져서 소스를 만든다.
- text: 영양부추는 5cm 길이로 잘라주고 알배추는 채 썰어 냉수에 담가둔다.
- text: 방울토마토는 먹기 좋게 자르고 적양배추, 양파를 채 썬다.
- text: 두부는 기름에 구워서 크루통을 만든다.
- text: 준비된 채소를 물기를 빼고 접시에 담아 두부크루통을 올린 뒤 소스와 함께 셋팅한다.
