steps:
- text: 토마토를 데쳐 껍질을 벗겨낸 뒤 잘게 썬다.
- text: 마늘과 양파를 잘게 다진 뒤 썰어둔 토마토, 고추장, 꿀, 식초와 골고루 섞는다.
- text: 도라지는 껍질을 벗긴 뒤 물에 담궈 쓴맛을 제거하고 길이 5cm, 두께 0.5cm로 찢는다.
- text: 시금치는 뿌리를 잘라내고 2~4등분으로 나눈다.
- text: 고사리는 깨끗하게 씻은 뒤 물에 불린다.
- text: 끓는 물에 소금을 넣고 도라지, 시금치, 고사리 순으로 데친 뒤 찬물에 헹궈 물기를 짜고 양념장을 곁들인다.
