steps:
- text: 장어는 손질해 우유에 담가 이물질을 빼준다.
- text: 더덕과 우엉은 가늘게 채 썰어 냉수에 담가 준다.
- text: 생강은 채 썰어 냉수에 담가준다.
- text: 조림장을 만들어 더덕, 우엉, 생강을 각각 볶아 섞어준다.
- text: 맛간장과 발사믹식초를 졸이다가 장어를 볶아준다.
- text: 곁들이 김치를 준비하고 졸여진 뿌리채소와 장어를 섞어 완성한다.
