steps:
- text: 얼갈이는 깨끗이 씻어 한입 크기로 뜯는다.
- text: 더덕은 껍질을 벗긴다.
- text: 껍질 벗긴 더덕은 굵게 채 썰어 소금물에 담가둔다.
- text: 양념장 재료를 모두 섞어 양념장을 만든다.
- text: 더덕을 건져 물기를 제거한다.
- text: 더덕과 얼갈이 배추에 양념장을 넣고 가볍게 버무린다.
