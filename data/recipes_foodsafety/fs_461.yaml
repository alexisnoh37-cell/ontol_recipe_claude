steps:
- text: 닭다리살은 뼈를 발라 일정 크기로 자른 뒤 우유에 재워둔다.
- text: 재워둔 닭다리살에 소금과 후춧가루를 뿌려놓는다.
- text: 단호박은 속을 파서 잘라 삶아 준비한다.
- text: 떡볶이떡은 뜨거운 물에 살짝 불리고, 대파는 단호박 크기로 잘라 준비한다.
- text: 고추장과 다진마늘, 다진양파, 케첩, 올리고당을 넣고, 골고루 섞어 양념장을 만들어 놓는다.
- text: 꼬치에 준비한 닭다리살과 단호박, 양파, 떡볶이떡, 대파를 꽂아 은근히 초벌로 굽고, 다시 만들어 놓은 양념장을 발라 구워 완성한다.
