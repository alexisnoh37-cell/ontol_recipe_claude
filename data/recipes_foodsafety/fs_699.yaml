steps:
- text: 닭가슴살을 삶는 뜨거운 물에 데친다.
- text: 닭가슴살 데친물에 브로콜리도 살짝 데친다.
- text: 닭가슴살은 고기결을 따라 잘게 찢는다.
- text: 양상추는 손으로 잘게 찢고 적채, 파프리카는 2cm가량으로 채 썰고 방울토마토는 반으로 자른다.
- text: 딸기를 강판에 갈아 호상요구르트와 호두, 소금을 넣어 드레싱을 만든다.
- text: 2, 3의 재료를 접시에 담아 딸기드레싱과 곁들인다.
