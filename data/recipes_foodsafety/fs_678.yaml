steps:
- text: 가지는 반 갈라 4등분하여 찜통에 5분간 찐 후 한 김 식혀준다.
- text: 식은 가지를 새끼손가락 굵기로 찢는다.
- text: 다진 고추, 실파, 마늘, 국간장을 넣어 양념장을 만든다.
- text: 찐 가지에 양념장을 넣고 조물조물 무친다.
- text: 차게 한 다시마국물 반컵에 식초, 죽염을 넣어 간한다.
- text: 유리 그릇에 무친 가지를 담고 5를 부은 뒤 얼음을 띄우고 통깨를 뿌린다.
