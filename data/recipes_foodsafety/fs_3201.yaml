steps:
- text: (속재료) 시금치, 다진 마늘, 볶은 참깨, 올리브유, 소금, 후추를 블랜더로 갈아 시금치 페스토를 만들고 크림치즈와 섞는다.
- text: 물, 계란, 소금, 올리브유, 사과종, 드라이 이스트와 체 친 가루류를 넣고 한 덩이가 되도록 반죽한 뒤 시금치를 작게 잘라 넣어 섞는다.
- text: 매끈한 반죽이 되면 8등분 하여 둥글리기를 하고 15분간 중간 발효한다.
- text: 중간 발효가 끝난 반죽을 납작하게 펴고 안에 시금치 필링을 넣어 잘 봉합한 뒤 팬에 놓고 살짝 눌러준다.
- text: '"중앙에 말린 방울토마토를 얹어 30분간 2차 발효 한다. ★방울토마토를 반으로 잘라 100℃ 오븐에 1시간 구워 사용했어요."'
- text: 180℃로 예열한 오븐에 15분간 굽는다.
