steps:
- text: 대파 1쪽 쫑쫑 썰어주고 양파 반개도 깍뚝 자른다.
  technique: null
- text: 청양고추 2개도 썰어주고, 스팸은 흐르는 물에 한번 씻어주고 반은 칼등으로 으깨주고 반은.
  technique: null
- text: 볶아주고 여기에 다진마늘 1스푼, 청양고추, 대파, 설탕 반스푼 넣고.
  technique: 볶음
- text: 잘 볶는다.
  technique: 볶음
- text: 불을 끄고 고춧가루 3스푼 넣어주고 양조간장 3스푼 넣고 와르르.
  technique: null
- text: 끓인다.
  technique: 끓이기
- text: 굴소스 2스푼넣고 재료와 잘 섞어 준 뒤 물 300ml 넣고.
  technique: 무침
- text: 애호박 양파 넣고 뚜껑닫고 5분간 끓여줄게요. 순두두, 스팸 넣어주고 위에 통후추.
  technique: 끓이기
