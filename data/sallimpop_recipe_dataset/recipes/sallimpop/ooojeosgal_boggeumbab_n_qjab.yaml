- text: 반쪽 반으로 갈라 잘게 썰어주고 마늘 프라이팬에 대파 마늘 넣고 잘 볶아.
  technique: 볶음
- text: 주세요 1분 정도 볶다가 고춧가루 한 스푼 불소스 한 스푼 넣고 재료에.
  technique: 볶음
- text: 가위로 잘게 잘라 두 스푼 넣어서 잘 섞어 줄게요이 위에 밥 한공기 가득.
  technique: 무침
- text: 올려주고 김가루 넉넉히 뿌려서 잘 섞어 줄게요 1분 정도 잘 볶다가.
  technique: 볶음
- text: 넓게 펴주고 위에 참게 넉넉히 뿌려 올려주면 완성이에요 한입 먹어보면 와.
  technique: null
