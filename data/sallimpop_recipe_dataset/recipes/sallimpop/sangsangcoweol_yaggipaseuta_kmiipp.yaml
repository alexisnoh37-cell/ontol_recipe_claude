steps:
- text: 굵은 소금 반스품 넣은 끓는물에 10분간 삶아 줄게요. 이제 예열된.
  technique: 끓이기
- text: 펜에 올리브유 세 스푼 넣고 다진마늘 한 스푼 대파 반쪽 넣고 파마늘 기름.
  technique: null
- text: 양파 반쪽 새우 여덟 마리 넣어 2분간 볶아 주다가 이렇게 만들어.
  technique: 볶음
- text: 놓은 양념장 넣는다. 아 이건 파스타면 면수네 스푼 넣고 1분만 더.
  technique: null
- text: 볶아주면 완성. 마무리 통깨 넉넉기.
  technique: 볶음
