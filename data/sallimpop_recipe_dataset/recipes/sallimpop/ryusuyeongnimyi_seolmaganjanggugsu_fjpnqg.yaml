steps:
- text: 물에 씻은 묵은지 적당량 국수 2인분 끓는 물에 2분 30초 삶아줄게요.
  technique: 끓이기
- text: 국수는 이렇게 물이 끓어오르면서 넘치는데 이때 찬물 아주 조금씩 부어주면서 끓이면.
  technique: 끓이기
- text: 넘치지 않아요. 삶은 국수는 찬물에 2-3번 물에 잘 씻어서 잘게 잘라줄게요. 양념장이.
  technique: 끓이기
- text: 다진마늘 1스푼, 설탕 2스푼 넣고 설탕이 녹을 때까지 잘 섞는다. 접시에 국수.
  technique: 무침
