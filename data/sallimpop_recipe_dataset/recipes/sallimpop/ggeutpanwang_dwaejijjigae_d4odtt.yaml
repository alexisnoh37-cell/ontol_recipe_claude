steps:
- text: 재료 다 넣고 한번에 끓여서 조리방식도 간단하고 라면사리 넣어서 먹으면 끝내주는.
  technique: 조림
- text: 냄비에 넣어주고 대파 1쪽도 듬성듬성 썰어 넣는다. 양파 반개도 깍뚝 썰어 넣어주고.
  technique: null
- text: 15쪽 잘게 썰어서 넣어줄게요. 매콤한 맛을 위해 청양고추 2개도 잘게 썰어 넣는다.
  technique: null
- text: 멸치액젓 2스푼 잘 섞어서 재료 위에 넣어주고 코인육수 2알도 넣어줄게요. 이제 물 600ml 넣고.
  technique: 무침
- text: 10분간 끓여주시면 돼요. 마무리로 두부 1모 넣고 1분간 더 끓여 주시면 됩니다.
  technique: 끓이기
