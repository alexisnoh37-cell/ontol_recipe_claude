steps:
- text: 당면을 불리는 동안 재료 손질해 볼게요. 어묵 3장 얇게 썰어주고 당근 반개 얇게.
  technique: null
- text: 채자른다. 양파 반개도 채썰어주고 올리고당 2스푼 넣고 설탕이 잘 녹을 때까지.
  technique: null
- text: 당근, 양파 넣고 중강불에 3분정도 볶는다.
  technique: 볶음
- text: 양념장 넣고 당면도 넣는다.
  technique: null
- text: 2분 정도 잘 섞으면서 볶다가 마무리로 청경채 놓고 2분만 더 볶아주면 돼요.
  technique: 볶음
- text: 뿌려주면 원팬으로 만드는 잡채 완성이에요.
  technique: null
