- text: 물기 한번 제거해주고 볼에 넣은 후 설탕 2스푼, 예열 된 프라이팬에 준비한 고기 넣고 중불에 잘.
  technique: null
- text: 볶는다. 수분을 충분히 날려줘야 보존 기간이 늘어나니 수분 날려준다 생각하면서 볶아주면.
  technique: 볶음
- text: 돼요. 볶고나면 키친타올 깔고 고기 올려서 넣고 끓이면서 1분정도 잘 저어주세요. 여기에.
  technique: 볶음
- text: 볶은 소고기 넣고 5분정도 중불에 수분 날려주세요.
  technique: null
