- text: 마늘쫑으로 태국풍 덮밥을 만들어봤는데 매우 훌륭한 덮밥 한끼 어떠세요? 🤗🤗.
  technique: null
- text: 마늘쫑 100g 잘게 썰어주시고 양파 반개도 칼집넣어 줄게 썰어줄게요. 돼지고기 다짐육 200g.
  technique: null
- text: 익혀줄게요. 고기가 익으면 양파 마늘쫑 넣어서 2분간 볶아주다가 진간장 1스푼, 멸치액젓 1스푼.
  technique: 볶음
- text: 넣고 양념 잘 섞으면서 2분만 더 볶으면 완성입니다.
