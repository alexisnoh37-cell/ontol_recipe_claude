steps:
- text: 쪽파 2뿌리도 얇게 썰어줄게요. 색이 갈색으로 변하면 쪽파 넣고 멸치액젓.
  technique: null
- text: 2스푼 넣어줄게요. 재료 잘 섞어주고 밥 한공기 넣어서 잘 볶아주면 동남아식.
  technique: 볶음
- text: 마늘볶음밥은 완성이에요. 모닝글로리도 만들어볼게요. 잘 씻은 볶을때 단단한 줄기 먼저 볶고 그 다음.
  technique: 볶음
- text: 중간줄기 그 다음 가는 잎부분 넣어서 볶아야 일정한 식감을 얻을 수 있어요.
  technique: 볶음
- text: 페페론치노 5개 부셔서 넣고 중약불로 굴소스 한스푼 물 2스푼 넣고 잘 섞는다.
  technique: 무침
- text: 공심채 굵은 줄기 먼저 볶고 1분뒤 가는 잎 부분 넣고 소스 부어줄게요.
  technique: 볶음
- text: 강불에 빠르게 30초 정도 볶으면 완성이에요.
  technique: 볶음
