steps:
- text: 거기에 특제 양념장 섞어서 먹어보면 계속 삶은 달걀 1개 파스타면 1인분 13분간 푹 익혀줄게요.
  technique: 끓이기
- text: 콩나물 200g은 끓는 물에 1분간만 데쳐 아삭한 식감 유지할게요. 삶은 콩나물은.
  technique: 끓이기
- text: 찬물에 씻어서 온기 빼주고 채반에 놓고 채썰어주고 깻잎2장도 얇게.
  technique: null
- text: 썰어줄게요. 삶은 면도 찬물에 한번 넣고 잘 섞는다. 볼에 파스타면.
  technique: 끓이기
- text: 콩나물 넣고 양념장 부은 후 잘 섞는다.
  technique: 무침
- text: 마무리로 참기름 한스푼 넣어 고소함 올려줄게요.
  technique: null
