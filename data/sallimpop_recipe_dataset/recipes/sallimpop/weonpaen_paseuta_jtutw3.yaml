- text: 또 팬에 넣을게요 청양고추도 하나 어슷 썰어서 넣어 줄게요 그대로 넣어 주고 대파도.
  technique: null
- text: 반으로 갈라서 듬성듬성 썰어 가지고 넣어 줄게요 바로 넣어 감칠맛을 올려 줘요 좀 잘게 썰어.
  technique: null
- text: 토마토 토마토 대신 케첩을 넣으면 안 개 해서 넣어 주겠습니다 다리만.
  technique: null
- text: 준비했는데 없으면 안 넣으셔도 돼요 시원해지고 이건 나중에 넣을 거예요.
  technique: null
- text: 지금 넣을게 아닙니다 파스타면 익은 거 확인한 다음에 잠깐만 넣어 주면.
  technique: null
- text: 두 스푼 넣어 줄게요 자 이제 코인 자 이제 10분간 중간불에 끓여.
  technique: 끓이기
- text: 번씩 저어 주시면 좋아요 물 끓기 여기에서 10분 더 끓여 줄게요 이제면 익힘 상태 한번 확인해.
  technique: 끓이기
