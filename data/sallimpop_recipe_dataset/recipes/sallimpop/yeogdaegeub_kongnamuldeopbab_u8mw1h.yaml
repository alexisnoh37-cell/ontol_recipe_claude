- text: 콩나물덮밥 이렇게 꼭!! 드셔보세요 :) 콩나물 100g은 잘게 가위로 썰어줄게요.
  technique: null
- text: 기름 살짝 두른 프라이팬에 삼겹살 넣고 준비한 대파 넣어줄게요. 고기 잡내 잡고.
  technique: null
- text: 파기름 내면서 볶다가 고기가 익으면.
  technique: 볶음
- text: 콩나물 넣어줄게요. 잘 섞어서 볶다가 넣도 잘 섞어줄게요. 이제 재료 잘 펴주고.
  technique: 볶음
- text: 가운데에 계란 한알 툭 깨서 넣어주고 접시에 흰쌀밥 넉넉히 올려주고 재료.
  technique: null
- text: 후추 툭툭 참깨 넉넉히 뿌려주면 완성.
  technique: null
