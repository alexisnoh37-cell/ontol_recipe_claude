steps:
- text: 씻어서 준비해 놓을게요. 양파 반개 채썰고 대파 반쪽도 어슷 썰어줄게요. 깻잎 5장은 둥글게 말아.
  technique: null
- text: 얇게 썰어주고 부침두부 1모도 크게 썰어 놓을게요. 넣고 잘 섞는다. 예열 된 팬에 앞다리살, 콩나물.
  technique: 부침
- text: 양파 넣고 준비한 양념 부어주세요.
  technique: null
- text: 물 400ml 넣고 그냥 10분 끓여주시면 돼요.
  technique: 끓이기
- text: 제육에 대파, 깻잎 넣어 잘 섞어주고 마무리로 부친 두부 사이드에 올려주면 완성이에요.
  technique: 무침
