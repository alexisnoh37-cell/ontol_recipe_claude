steps:
- text: 대파 1대 어슷 썰어주고 양파 반개는 깍뚝 모양을로 썰고 청양고추 2개도 어슷자른다.
  technique: null
- text: 스팸은 한번 잘 씻은 뒤 반은 으깨주고 냄비에 올리브유 5스푼 넣어주고 으깬.
  technique: null
- text: 스팸 넣은 후 갈색이 될때까지 잘 볶는다.
  technique: 볶음
- text: 설탕 반스푼 넣은 후 1분간 볶다가 재료 넣어 고추기름 살짝 내줄게요. 여기에.
  technique: 볶음
- text: 양조간장 3스푼 넣고 다시 불 켠 뒤 와르르 끓인 후 굴소스 2스푼 넣고.
  technique: 끓이기
- text: 넣어줄게요. 이대로 야채가 익을때까지 5분간 끓이다가 순두부 스팸 넣어준 뒤.
  technique: 끓이기
- text: 위에 후추 넉넉히 뿌려주세요. 순두부찌개는 깨서 넣고 대파 토핑올려 준 후 2분간만 더.
  technique: null
- text: 끓여주면 완성입니다.
  technique: 끓이기
