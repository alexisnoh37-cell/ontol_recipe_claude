- text: 집에서 끓인 돼지탕이 이렇게 추천드릴게요. 끓는물에 돼지고기 앞다리살 1kg 10분간 삶아주고.
  technique: 끓이기
- text: 냄비에 돼지고기 넣고 자르는 대파 표고보서 세 개 넣어 주고 양파는.
  technique: null
- text: 많이 넣으면 단맛이 나니 1/4쪽만 넣어주고 물 2.5L 부어 줄게요.
  technique: null
- text: 이대로 뚜껑 닫고 한시간 푹 끓여 넣고 10분만 더 끓여주면 육수는.
  technique: 끓이기
