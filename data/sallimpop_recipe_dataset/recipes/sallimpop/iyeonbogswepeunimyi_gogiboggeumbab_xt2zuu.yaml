- text: 꿀팁이 가득한 이연복쉐프님의 고기볶음밥❤ 집애서 볶음밥을 만들어도 중국집에서 먹는.
  technique: null
- text: 햇반 1개는 비닐 포장 다 뜯어서 전자레인지에 등심50g은 손가락 반마디 사이즈로 썰어줄게요.
  technique: null
- text: 색감은 위해 당근도 조금 잘게 썰어주고 대파는 십자모양 칼집내서 썰어줄게요. 순서가.
  technique: null
- text: 둘러주고 돼지고기등심 부터 속까지 다 익혀줄게요. 고기가 다 익으면 고기와 기름을 그릇에.
  technique: null
- text: 부어주고 계란 한알 넣어 잘 풀어주며 익혀줄게요. 계란이 익으면 밥 넣고 섞는다. 여기에 다른.
  technique: 무침
- text: 넣어주고 준비한 당근 대파도 넣는다.
  technique: null
- text: 대파 향이 올라올때까지 잘 볶다가 마무리로 익힌 고기만 넣고 잘 섞어주면 완성이에요.
  technique: 볶음
