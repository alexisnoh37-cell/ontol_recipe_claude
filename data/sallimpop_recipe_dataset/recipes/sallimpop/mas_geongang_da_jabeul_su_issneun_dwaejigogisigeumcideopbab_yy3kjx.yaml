steps:
- text: 이번 주말에 돼지고기시금치덮밥 어떠세요? :) 대파 1/3쪽 반으로 갈라 잘게 썰어줄게요.
  technique: null
- text: 넣어서 살짝 볶다가 돼지고기 다짐육 넣는다. 금방 고기가 익으면 시금치.
  technique: 볶음
- text: 적당량 넣고 잘 볶는다. 숨이 살짝 설탕 반스푼 넣고 잘 섞는다.
  technique: 볶음
- text: 툭깨서 위에 올려 준 후 약불로 4분간 계란 익혀줄게요. 완성이에요. 접시에 밥.
  technique: null
- text: 넉넉히 깔고 위에 재료 올려준 후 고소한 맛을 위해 참기름 한스푼 넣어주고 후추.
  technique: null
- text: 툭툭 깨 솔솔 뿌려주세요.
  technique: null
