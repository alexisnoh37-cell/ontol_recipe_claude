steps:
- text: 먼저 익히면서 우상겹에 있는 기름을 한 스푼, 양념 고기랑 살짝 섞어.
  technique: 무침
- text: 놓은 다음에 여기에 밥 한 공기 넣어 맛이 진해. 그냥 이렇게 섞어 줘.
  technique: 무침
- text: 끓이기만 하면 끝이야. 물 600 넣어 주고. 고추장이나 된장을.
  technique: 끓이기
- text: 넣잖아. 여기서 지금 부족한게 뭐야.
  technique: null
- text: 반스푼만 넣어 줘. 된장에는 조미를 >> 8분 정도 끓이기만 하면 살짝 이제.
  technique: 끓이기
- text: 600 넣은 거야. 일부러 꾸덕하게만 먹으려면 물 한 400만 넣어도.
  technique: null
