  technique: 무침
- text: 닭볶음탕에 들어갈 감자 두 개 먹기 매콤한 맛으로 올려줄 청양고추 두.
  technique: null
- text: 닭 감자 넣어주고 양념볼에 물ml 냄비에 넣어 줄게요. 이대로 15분간.
  technique: null
- text: 푹 끓여 주는데 중간에 불순물 잘 대파, 청양고추 넣어주고 5분간.
  technique: 끓이기
- text: 끓이다가 마무리 다진마늘 두 스푼 넣어 2분만 더 끓여주면 완성입니다.이 방식으로 끓이면 양념이.
  technique: 끓이기
