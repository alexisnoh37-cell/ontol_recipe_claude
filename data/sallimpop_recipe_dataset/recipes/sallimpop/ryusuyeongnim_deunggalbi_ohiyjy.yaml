steps:
- text: 거기에 맛난 양념 섞어서 만들어보면 진짜 씻어 주고 키친타올로 물기제서해 줄게요.
  technique: 무침
- text: 썰어줄게요. 양념은 진간장 4스푼, 참치액 3스푼, 고춧가루 2스푼 섞어서.
  technique: 무침
- text: 두르고 등갈비 넣고 소금 2꼬집으로 밑간 소스 넣고 3분간 등갈비와 함게 졸여주세요.
  technique: 조림
- text: 양념이 등갈비에 다 묻으면 설탕 4스푼 넣고 중불에서 설탕이 끓을 때까지 볶다가 손질한.
  technique: 볶음
- text: 대파 양파 넣고 양파 숨이 죽을 때까지 볶는다. 양파 숨이 죽으면 마늘 한줌 넣고.
  technique: 볶음
- text: 물 700ml, 코인육수 1알 넣어줄게요. 이대로 30분간 중약불에서 끓이고 마무리로.
  technique: 끓이기
