- text: 올리브유 1스푼 넣어주면 물도 안넘쳐 흐르고 면이 더 촉촉해져요. 2분 30초간 삶아줄게요.
  technique: 끓이기
- text: 썰어서 반컵 정도 준비하고 고추장 1스푼, 식초 1스푼, 고춧가루 1스푼, 물 2스푼 넣고.
  technique: null
- text: 잘 섞는다. 접시에 면 담고 올리브유 1스푼 넣은 후 한번 섞어주고 양념장 부은 후 마무리.
  technique: 무침
