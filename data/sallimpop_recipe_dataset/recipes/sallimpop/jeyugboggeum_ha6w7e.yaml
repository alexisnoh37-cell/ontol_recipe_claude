steps:
- text: 제육볶음 진짜 딱 이렇게만 해보세요. :) 얇게 썰은 삼겹살이나 앞다리살.
  technique: null
- text: 후추 넉넉히, 식초 한스푼 넣고 잘 섞는다. 얇게 썰은 양파 반개.
  technique: 무침
- text: 듬성듬성 썰은 대파 반단도 준비해 고기 먼저 센불에 익힌다.
  technique: null
- text: 얇아서 금방 익을거에요. 넣고 양파, 대파 넣어서 빠르게 볶아주면 고기는 이미 익혀있고.
  technique: 볶음
- text: 기사식당 스타일의 제육볶음이 돼요.
  technique: null
- text: 마지막 쯤 물엿 두 스푼 넣어서 윤기 올려줄게요.
  technique: null
