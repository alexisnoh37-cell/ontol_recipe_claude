steps:
- text: 청양고추 만으로 달달 퐁신 매톰한 덮밥 월요일 출근 시작인텐데 저녁에 양파계란덮밥.
  technique: null
- text: 청양고추 2개 잘게 썰어서 준비한다.
  technique: null
- text: 아이랑 함께 먹는거면 없어도 되지만 넣으면.
  technique: null
- text: 올리브유 2스푼 두르고 양파 2분간 잘 볶는다.
  technique: 볶음
- text: 물 100ml 넣고 진간장 반스푼, 참치액 1스푼, 알룰로스 반스푼, 치킨스톡 반스푼 넣고.
  technique: null
- text: 잘 섞은 후 위에 풀어논 계란, 청양고추 올려줄게요. 이대로 뚜껑닫고 2분간 끓어주면.
  technique: 끓이기
- text: 통깨 솔솔 마무리 참기름 한스푼 넣어서 고소한 맛.
  technique: null
