steps:
- text: 스팸은 반은 으깨주고 반은 토핑용으로 넣어주고 으깬 스팸 넣은 후 갈색이 될때까지.
  technique: null
- text: 잘 볶는다. 여기에 다진마늘 1스푼, 청양고추, 대파, 살탕 반스푼 넣은 후 1분간.
  technique: 볶음
- text: 볶다가 재료 한쪽으로 민 뒤 불끄고 고추가루 3스푼 넣어 고추기름 살짝 내줄게요.
  technique: 볶음
- text: 양조간장 3스푼 넣고 다시 불 켠 뒤 와르르 끓인 후 굴소스 2스푼 넣고 물 400ml.
  technique: 끓이기
- text: 부은 후 애호박, 양파 넣어줄게요. 이대로 야채가 익을때까지 5분간 끓이다가 순두부.
  technique: 끓이기
- text: 스팸 넣어준 뒤 위에 후추 넉넉히 뿌려주세요.
  technique: null
- text: 마무리로 계란 2알 깨서 넣고 대파 토핑올려 준 후 2분간만 더 끓여주면 완성입니다.
  technique: 끓이기
