steps:
- text: 참치김치찌개 황금레시피🥰🥰 이렇게만 끓이면.
  technique: 끓이기
- text: 썰어줄게요. 칼칼한 맛을 위해 청양고추 2개도 썰고 두부 한모도 한입크기로 잘라주세요.
  technique: null
- text: 준비한 냄비에 참치 기름 부은 후 김치 넣고 중불에 3분정도 볶아줄게요. 여기에 고춧가루.
  technique: 볶음
- text: 3스푼, 고추장 반스푼 넣고 1분 정도만 더 볶는다. 물 1L 부은 후 멸치액젓 1스푼.
  technique: 볶음
- text: 국간장 1스푼, 코인육수 2알 넣어줄게요. 물이 끓기 시작하면 참치, 감자, 애호박 넣은 후.
  technique: 끓이기
- text: 뚜껑닫고 10분간 푹 끓여줄게요. 마무리로 청양고추 2개 두부 한모 넣은 후 3분.
  technique: 끓이기
- text: 더 끓여주면 완성이에요.
  technique: 끓이기
