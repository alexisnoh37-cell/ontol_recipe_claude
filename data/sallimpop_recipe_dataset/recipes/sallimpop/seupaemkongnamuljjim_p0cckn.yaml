steps:
- text: 스팸은 세로로 길게 자르고 다시 8등분해서 잘라줄게요. 콩나물 350g 깨끗이 씻어.
  technique: null
- text: 준비한다. 양파 반 개는 얇게 채썰어주고 대파 1쪽도 반으로 갈라 듬성듬성 썰어줄게요.
  technique: null
- text: 물 2스푼 넣고 잘 섞는다. 이제 넓은 팬에 콩나물 다 넣고 물 120ml 붓고 코인육수 2알.
  technique: 무침
- text: 넣는다. 뚜껑 닫고 4분간 끓여주시면 돼요.
  technique: 끓이기
- text: 뚜껑열고 스팸 넣어주고 손질한 야채 다 넣어줄게요. 위에 양념장도 부어주세요.
  technique: null
- text: 5분간 볶아줄게요. 마무리로 참기름 2스푼 넣고 다시 한번 섞는다.
  technique: 볶음
