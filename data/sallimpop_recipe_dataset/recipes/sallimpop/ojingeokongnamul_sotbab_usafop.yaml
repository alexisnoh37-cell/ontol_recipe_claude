steps:
- text: 쌀은 5번 정도 잘 씻어서 30분간 마른 불림할게요. 물 300ml에 멸치액젓 한 스푼, 맛술 한스푼 넣고.
  technique: null
- text: 끓인다. 물이 끓으면 잘 해동한 오징어 넣고 1분간 삶아주시면 돼요. 이 육수는 밥 할 때.
  technique: 끓이기
- text: 사용할거고 한 김 식힌 오징어는 잘게 썰어줄게요. 이제 냄비에 불린 쌀 넣고 자른 오징어 넣고 육수물.
  technique: null
- text: 부어줄게요. 물이 끓으면 밑바닥부터 들어올려 잘 섞어주고 콩나물 넣는다. 이제 중약불에 12분간.
  technique: 끓이기
- text: 끓여주시면 돼요. 12분후에 뚜겅 열고 밥이 설익지 넣어서 잘 섞는다. 완성이에요.
  technique: 끓이기
