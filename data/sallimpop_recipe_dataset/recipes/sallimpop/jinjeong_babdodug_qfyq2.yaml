- text: 매콤하면서 감칠맛 넘치는 소고기고추볶음 이예요. 밥 반찬으로 먹어도 좋고 덮밥형식으로.
  technique: null
- text: 올리브유 3스푼 두르고 소고기다짐육 넣고 2분간 익혀줄게요. 여기에 준비한 청양고추, 다진마늘 2스푼.
  technique: null
- text: 넣고 진간장 2스푼, 맛술 2스푼, 참치액 2스푼, 5분간 청양고추 수분 날려주면서 볶아주면 완성입니다.
