steps:
- text: 진짜 강추하는 레시피 입니다. 이렇게 어묵볶음 채썰어줄게요. 매콤한 맛을 위해 청양고추.
  technique: null
- text: 2개 썰어주고 홍고추는 색감을 위해 넣는거니 없어도 돼요. 양념장 만들어.
  technique: null
- text: 반스푼 물엿 4스푼, 후추가루 툭툭 넣고 잘 섞는다. 프라이팬에 풍미를.
  technique: 무침
- text: 올려주는 고추기름 2스푼 넣고 강불로 올려주세요. 아 고추기름은 한번 사두번.
  technique: null
- text: 섞다가 끓어오르면 어묵과 양파를 넣어줄게요. 어묵에 양념이 다 붙으면.
  technique: 끓이기
- text: 천천히 볶는다. 불을 끄고 고소한 넣어주고 썰어놓은 고추 넣어 잔열로.
  technique: 볶음
- text: 익혀 줄게요.
  technique: null
