# 추천 점수 초기값 (docs/plan.md 4-4). 골든셋 결과를 보며 조정한다.

weights:
  ingredient_coverage: 0.30   # I
  cuisine: 0.20               # K
  taste: 0.15                 # T
  ingredient_preference: 0.15 # P
  difficulty: 0.10            # D
  time: 0.10                  # M

coverage:
  role_weight: {main: 3, sub: 2, seasoning: 1}  # garnish는 계산 제외(1-4 골든셋 반영)
  substitute_credit: 0.8      # 대체재로 충족 시 인정 비율
  exclude_pantry_staples: true  # 기본 양념(config/pantry_staples.yaml)은 role과 관계없이 계산 제외
  exclude_optional: true

cuisine:
  like: 1.0
  neutral: 0.5
  dislike: 0.1

ingredient_preference:
  neutral: 0.5
  role_weight: {main: 1.0, sub: 0.6, garnish: 0.2, optional: 0.2}

difficulty:                   # (레시피 난이도 - 사용자 실력) → 점수
  "-2": 0.8
  "-1": 0.9
  "0": 1.0
  "1": 0.4
  "2": 0.1

taste:
  dimensions: [spicy, salty, sweet, sour, umami, savory]
  dimension_weight: {spicy: 1.0, salty: 1.0, sweet: 1.0, sour: 1.0, umami: 1.0, savory: 1.0}

diversity:
  top_n: 10
  max_same_cuisine: 5          # 1-4 골든셋 반영(3 → 5)
  max_same_main_ingredient: 3
  max_score_gap: 0.1           # 1-6: 점수 차가 이 값 이하인 레시피끼리만 순서를 바꾼다
