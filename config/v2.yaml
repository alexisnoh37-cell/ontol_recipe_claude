# 추천 v2 설정 (docs/plan.md 부록 G, decisions D7·D8). v1 설정(weights.yaml·engine.yaml)은 그대로 쓰고,
# v2에만 필요한 값을 여기에 둔다. 코드에 하드코딩하지 않는다.

pantry:
  # 꼭 필요한 재료(main·sub·seasoning, 선택 아님)가 이 개수 이하로 부족하면 "조금만 사면 가능(near)"
  near_max_missing: 2

random:
  default_limit: 5

dish:
  # 유사도 S 상위 몇 개를 후보로 남길지
  pool_size: 40
  # 최종 점수 = s_weight·S + (1 − s_weight)·v1 점수(재정렬 전)
  s_weight: 0.7
  # S 항목 가중치. 질의에서 걸린 항목만 합산하고 가중치 합으로 나눈다(G-3)
  similarity:
    title: 0.4
    ingredient: 0.25
    keyword: 0.2
    anchor: 0.15
  # 부분 일치로 인정하는 최소 글자 수(정규화 후)
  min_term_len: 2
  # 질의 키워드 → 조건. match 중 하나라도 질의에 있으면 그 규칙을 쓴다.
  # taste: 차원별 min/max(0~5), cuisine: 음식 종류, title_any: 제목에 하나라도 있으면 만족
  keywords:
    - match: [얼큰, 칼칼, 매콤, 화끈, 얼얼]  # "매운"은 "안 매운"과 겹쳐 넣지 않는다
      taste: {spicy: {min: 3}}
    - match: [순한, 안매운, 안 매운, 맵지않은, 맵지 않은, 담백]
      taste: {spicy: {max: 1}}
    - match: [국물, 뜨끈, 따끈, 시원한]
      title_any: [국, 찌개, 탕, 전골, 짬뽕, 국수, 우동, 라면, 수제비, 칼국수]
    - match: [달달, 달콤, 단짠]
      taste: {sweet: {min: 3}}
    - match: [새콤, 상큼]
      taste: {sour: {min: 2}}
    - match: [짭짤, 짭조름]
      taste: {salty: {min: 3}}
    - match: [고소]
      taste: {savory: {min: 3}}
    - match: [한식, 한국]
      cuisine: 한식
    - match: [일식, 일본]
      cuisine: 일식
    - match: [중식, 중국]
      cuisine: 중식
    - match: [양식, 서양, 파스타]
      cuisine: 양식
    - match: [볶음]
      title_any: [볶음]
    - match: [반찬]
      title_any: [무침, 조림, 볶음, 나물, 장아찌, 전]

# 맛 정보가 없는 레시피의 매운맛 추정(D9). 꼭 필요한 줄뿐 아니라 모든 재료 줄이 정규 id에 매핑되어 있고,
# 아래 재료(또는 이 재료를 포함(가능)하는 재료)가 하나도 없으면 매운맛 0으로 본다. 하나라도 있으면 계속 '모름'.
# 고추류와 매운 양념·김치류, 톡 쏘는 겨자·와사비, 내용을 알 수 없는 시판 양념은 보수적으로 넣는다. 후추·파프리카는 넣지 않는다.
spicy_inference:
  enabled: true
  markers:
    # 고추류
    - red_chili            # 홍고추
    - green_chili          # 풋고추
    - cheongyang_pepper    # 청양고추
    - chili_unspecified    # 고추(종류 불명)
    - jalapeno             # 할라피뇨
    - peperoncino          # 페퍼론치노
    - gochugaru            # 고춧가루
    # 고추가 들어간 양념·소스
    - gochujang            # 고추장
    - chili_oil            # 고추기름
    - chili_sauce          # 칠리소스
    - sriracha             # 스리라차소스
    - tabasco              # 타바스코
    - doubanjiang          # 두반장
    - buldak_sauce         # 불닭소스
    - green_curry_paste    # 그린커리 페이스트
    - curry_powder         # 카레가루
    - garam_masala         # 가람마살라
    - tteokbokki_powder    # 떡볶이 양념 분말
    - pickled_chili        # 고추피클
    - ssamjang             # 쌈장
    # 김치류(백김치·동치미는 넣지 않음)
    - kimchi               # 배추김치
    - kkakdugi             # 깍두기
    - young_radish_kimchi  # 열무김치
    # 톡 쏘는 매운맛
    - wasabi               # 와사비
    - mustard_powder       # 겨자
    # 내용을 알 수 없는 시판 제품(매울 수 있음)
    - instant_noodle_product  # 시판 라면 제품
    - ramen_noodles        # 라면
    - meal_kit_sauce       # 간편식 동봉 소스
    - bottled_marinade     # 시판 고기 양념
  # 제목에 이 말이 있으면 재료 목록과 관계없이 추정하지 않는다(원본 재료 목록에서 양념이 빠진 경우 대비,
  # 예: "수박비빔국수와 수박고추장소스"는 재료에 고추장이 없다)
  title_markers: [고추, 매운, 매콤, 얼큰, 칼칼, 불닭, 마라, 칠리, 스파이시, 땡초, 청양, 핫소스, 짬뽕, 육개장, 김치찌개, 떡볶이]

rerank:
  # 요청에 rerank 값이 없을 때의 기본값. 인증키(TYPESAFE_API_KEY)가 없으면 켜도 쓰지 않는다
  enabled: true
  # Jev 모델. 최신 릴리스 jev-1.14.0(2026-10-14)을 버전으로 고정한다(jev-latest 별칭은 1.13.0을 가리킴)
  model: jev-1.14.0
  # 규칙 순위 상위 몇 개를 Jev에 보낼지(pantry는 묶음마다)
  top_n: 30
  # 최종 점수 = (1 − jev_weight)·규칙 점수 + jev_weight·J
  jev_weight: 0.5
  # Jev 확신도가 이 값보다 낮으면 J를 쓰지 않는다(규칙 점수 그대로)
  min_confidence: 0.3
  # 이 시간을 넘기면 규칙 순위로 돌아간다
  timeout_ms: 4000

# 화면 표시 문구(판정과 무관). v1 display.yaml은 바꾸지 않고 v2 문구만 여기에 둔다
display:
  breakdown_labels:
    S: 찾는 요리와 비슷함
    J: Jev 적합도
    J_conf: Jev 확신도
  group_labels:
    ready: 지금 바로 만들 수 있어요
    near: 조금만 사면 만들 수 있어요
  notes:
    rerank_unavailable: Jev 응답이 없어 규칙 점수 순서로 보여 드립니다
    rerank_off: 규칙 점수 순서입니다(Jev 재정렬 꺼짐)
    dish_no_match: 찾는 요리와 비슷한 레시피를 찾지 못했습니다. 요리 이름이나 재료, 맛(얼큰한·담백한 등)으로 다시 찾아 보세요
    dish_excluded: 찾는 요리와 가장 비슷한 레시피는 못 드시는 재료(알레르기·절대 안 먹는 재료 등)가 들어 있어 뺐습니다
    spicy_inferred: 맛 정보는 없지만 고추류 등 매운 재료가 없어 맵지 않은 요리로 보았습니다
    dislike_possible: 먹지 않는 재료가 들어 있을 수도 있는 재료(가공품 등)가 있습니다. 성분표를 확인하세요
