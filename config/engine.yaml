# 엔진 실행 옵션 (docs/plan.md 3-2)
# serve_draft_recipes: true면 검수 전(draft) 레시피도 추천한다(화면에 "검수 전" 표시). 기본은 published만.
# draft를 제공해도 알레르기·제약 필터는 똑같이 적용된다.
# ar-1(2026-10-17 사람 결정): 레시피 1,522개 전부를 추천 대상으로 한다(검수 전 레시피에는 "검수 전 레시피입니다" 메모).
serve_draft_recipes: true

# 엔진·DB가 읽는 레시피 폴더(저장소 루트 기준). ar-1: 식품안전나라(개인용 범위, D3)도 추천에 쓴다.
# 식품안전나라는 조리시간·난이도·맛·음식 종류가 원본에 없어 엔진이 '모름'으로 다룬다(config/weights.yaml unknown).
recipe_dirs:
  - data/recipes
  - data/recipes_foodsafety

# 재료로 레시피 찾기(GET /browse, ui-2): 꼭 필요한 재료가 이 개수 이하로 모자란 레시피를 "거의 가능"으로 보여 준다
browse_max_missing: 2
