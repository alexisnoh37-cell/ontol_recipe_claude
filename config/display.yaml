# 알레르기 설정이 있는 사용자에게만, 가공품(is_processed)이면서 confidence: low인 재료가 든 레시피 카드에 표시(1-6 결정)
label_check: "제품 성분표를 확인하세요"

# 화면 하단 면책 문구
disclaimer: >-
  알레르기 판정은 등록된 식재료 정보와 일반적인 제품 구성에 근거한 참고용입니다.
  실제 성분은 제조사·제품마다 다를 수 있으므로 조리 전에 반드시 제품 성분표(알레르기 표시)를 확인하세요.
  이 서비스는 의료적 판단을 대신하지 않습니다.

# 제외 사유 코드 → 화면 표기(engine.model.ExclusionReason)
exclusion_labels:
  allergen: 알레르기 성분 포함(포함 가능 포함)
  unmapped_ingredient: 확인되지 않은 재료가 있어 알레르기 안전을 보장할 수 없음
  hard_dislike_ingredient: 절대 먹지 않는 재료 포함
  hard_dislike_cuisine: 절대 먹지 않는 음식 종류
  spicy_limit: 매운맛 한도 초과
  equipment: 필요한 조리기구 없음
  time: 조리시간 초과

# 알레르기 그룹 구분 표기
allergen_group_kinds:
  official: 법정 표시 대상
  custom: 자체 그룹
  bundle: 묶음

# 맛 차원 표기
taste_labels:
  spicy: 매운맛
  salty: 짠맛
  sweet: 단맛
  sour: 신맛
  umami: 감칠맛
  savory: 고소함

# 점수 항목 표기
breakdown_labels:
  I: 재료 보유
  K: 음식 종류 선호
  T: 맛 선호
  P: 재료 선호
  D: 난이도 적합
  M: 조리시간 적합

# 레시피 상세의 재료 역할 표기(GET /recipes/{id})
role_labels:
  main: 주재료
  sub: 부재료
  seasoning: 양념
  garnish: 고명

# 재료로 레시피 찾기(GET /browse): 알레르기 설정이 있을 때 결과 위에 표시(사람 결정 2026-10-16: 조회에서는 제외하지 않고 주의 표시)
browse_allergy_notice: >-
  재료로 찾기 결과에는 알레르기 성분이 든 레시피도 표시됩니다. ⚠️ 표시가 있는 레시피는 알레르기 성분(포함 가능 포함)이나
  확인되지 않은 재료가 있으니 조리하지 마세요. 추천 탭은 이런 레시피를 처음부터 제외합니다.

# 그래프 레시피 출처 구분(표시 전용, int-2 사람 승인 2026-10-16). 위에서부터 처음 맞는 것을 쓴다.
#   source: 레시피 source 값과 정확히 같으면 / dataset: 그 원본 데이터셋 YAML의 영상 URL(video_url)과 같으면
#   display_dir: 엔진·DB에 적재하지 않고 그래프에만 보여 줄 레시피 폴더(GET /graph?display=true). 판정에는 쓰지 않는다
graph_recipe_origins:
  - {id: seed, label: 기본·확장 시드, source: agent_draft}
  - {id: simplecooking, label: 자취요리신, dataset: data/simplecooking_recipe_dataset/recipes/simplecooking}
  - {id: sallimpop, label: 살림팝, dataset: data/sallimpop_recipe_dataset/recipes/sallimpop}
  - {id: foodsafety, label: 식품안전나라, source: foodsafety}  # ar-1: 엔진에 적재(config/engine.yaml recipe_dirs), 표시 전용 아님
