# 골든셋 페르소나 (docs/plan.md 7-3, Phase 1-4)
# expected_top3: "상위 3개 안에 나와야 할 레시피" id 목록. 사람이 채운다(에이전트는 비워 둔다).
# 비어 있는 페르소나는 평가에서 "미기입"으로 따로 센다.
#
# 형식
#   skill_level: 1~3
#   allergen_groups: 기본·묶음 알레르기 그룹 id
#   preferences: {type: ingredient|cuisine, target, polarity: 1|-1, strength: 0~1, hard: false}
#   tastes: {dimension, preferred_level, max_level}
#   pantry: 보유 재료 id 5~8개(기본 양념은 적지 않아도 보유로 간주)
#   equipment: 보유 조리기구(vocab.yaml)
#   request: {max_time_min, time_is_hard}

personas:
  - id: korean_lover
    name: 한식파 직장인
    description: 한식을 좋아하고 매운 음식도 잘 먹는 중급자. 냉장고에 김치와 삼겹살이 있다.
    skill_level: 2
    preferences:
      - {type: cuisine, target: 한식, polarity: 1, strength: 1.0}
    tastes:
      - {dimension: spicy, preferred_level: 3, max_level: 5}
      - {dimension: salty, preferred_level: 3}
    pantry: [kimchi, pork_belly, tofu, onion, green_onion, egg, rice]
    equipment: [냄비, 프라이팬]
    request: {max_time_min: 40}
    expected_top3: []

  - id: beginner
    name: 요리 초보 자취생
    description: 요리를 거의 해 본 적 없는 초급자. 간단하고 빠른 요리를 원한다.
    skill_level: 1
    tastes:
      - {dimension: spicy, preferred_level: 2, max_level: 3}
    pantry: [egg, rice, onion, potato, ham, kimchi]
    equipment: [프라이팬, 전자레인지]
    request: {max_time_min: 20}
    expected_top3: []

  - id: multi_allergy
    name: 알레르기 많은 아이 부모
    description: 아이가 계란·우유·갑각류 알레르기가 있다. 고기와 채소는 넉넉하다.
    skill_level: 2
    allergen_groups: [egg, milk, crustacean_bundle]
    tastes:
      - {dimension: spicy, preferred_level: 0, max_level: 2}
    pantry: [beef_bulgogi_cut, pork, potato, onion, carrot, tofu, rice]
    equipment: [냄비, 프라이팬]
    request: {}
    expected_top3: []

  - id: low_spice
    name: 매운 것 못 먹는 사람
    description: 매운맛을 거의 못 먹는다(한도 1). 닭고기와 계란을 자주 산다.
    skill_level: 2
    tastes:
      - {dimension: spicy, preferred_level: 0, max_level: 1}
    pantry: [chicken_thigh, egg, rice, onion, potato, carrot, tofu]
    equipment: [냄비, 프라이팬]
    request: {max_time_min: 40}
    expected_top3: []

  - id: western_lover
    name: 양식 좋아하는 사람
    description: 파스타와 스테이크를 좋아하는 중급자. 오븐이 있다. 한식은 덜 좋아한다.
    skill_level: 2
    preferences:
      - {type: cuisine, target: 양식, polarity: 1, strength: 1.0}
      - {type: cuisine, target: 한식, polarity: -1, strength: 0.5}
    tastes:
      - {dimension: savory, preferred_level: 4}
      - {dimension: spicy, preferred_level: 1}
    pantry: [pasta, tomato_sauce, bacon, heavy_cream, onion, button_mushroom, beef_sirloin]
    equipment: [냄비, 프라이팬, 오븐]
    request: {max_time_min: 40}
    expected_top3: []

  - id: japanese_lover
    name: 일식 좋아하는 사람
    description: 덮밥과 우동을 좋아한다. 쯔유를 늘 갖고 있다.
    skill_level: 2
    preferences:
      - {type: cuisine, target: 일식, polarity: 1, strength: 1.0}
    tastes:
      - {dimension: umami, preferred_level: 4}
      - {dimension: spicy, preferred_level: 0}
    pantry: [rice, egg, chicken_thigh, onion, tsuyu, udon_noodles, salmon]
    equipment: [냄비, 프라이팬]
    request: {max_time_min: 30}
    expected_top3: []

  - id: few_ingredients
    name: 냉장고가 빈 사람
    description: 재료가 다섯 가지뿐이다. 있는 것으로 한 끼를 해결하고 싶다.
    skill_level: 1
    pantry: [egg, rice, green_onion, potato, onion]
    equipment: [프라이팬]
    request: {}
    expected_top3: []

  - id: seafood_expert
    name: 해산물 좋아하는 숙련자
    description: 요리 실력이 좋고 해산물을 좋아하지만 돼지고기는 덜 좋아한다. 시간 여유가 있다.
    skill_level: 3
    preferences:
      - {type: ingredient, target: seafood, polarity: 1, strength: 0.8}
      - {type: ingredient, target: pork, polarity: -1, strength: 0.6}
    tastes:
      - {dimension: spicy, preferred_level: 3, max_level: 4}
    pantry: [squid, mackerel, radish, scallion, egg, zucchini, buchimgaru]
    equipment: [냄비, 프라이팬]
    request: {max_time_min: 60}
    expected_top3: []
